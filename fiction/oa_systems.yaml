  - star: JD 870135
    label: H'tat'sa'thoss
    affiliation: caretaker-gods
    article: https://www.orionsarm.com/eg-article/5eefcc060d4c4
    note: >-
      H'tat'sa'thoss is the system, Tohul the planet, and To'ul'h the
      xenosophonts who live there. The add-on labels the star "To'ul'h", which is
      the species — the equivalent of calling Sol System "Humans". Classified
      with the Caretaker Gods because it is protected by one: the system is
      shielded so it is left alone rather than absorbed by another terragen
      empire. That is a statement about the system, not the clade — To'ul'h are
      not confined to their homeworld, and some have joined terragen
      civilisation.

