# Curation of the imported Orion's Arm stars.
#
# Hand-authored, and deliberately separate from `oa_stars.yaml`, which is
# machine-owned and rewritten wholesale by `oastarmap import-oastars`. Nothing
# here is ever overwritten by an import.
#
# `star` matches a `name` in oa_stars.yaml — the add-on's own designation, which
# is the only stable key it offers.
#
# Naming rule: if the system or its primary has a notable name of its own, use
# that (Sol, H'tat'sa'thoss, Hiederia); otherwise use the name of its most
# notable world (Wurm). The add-on's comments are not a reliable guide to this —
# they name whichever the contributor happened to think of, so JD 870135 is
# commented "To'ul'h", which is the species, not the system.

# `real` records the catalogue designation of an entry that is a real object.
# The add-on carries a handful of those because Celestia's own star catalogue
# omits them, and for those the position is a copied measurement rather than an
# assertion — so the map draws them as stars, not as fiction markers.
#
# Entries the add-on says nothing about beyond where they sit. Drawn but not
# labelled, and excluded from the OA star layer, since 52 unlabelled markers
# stacked inside one cluster obscure the cluster itself. A positional
# cross-match found the further reason to hide them: several of the `JD nnnnnn`
# designations in this group are simply the HD number of a star already in the
# real catalogue — JD 169512 lands 0.0 arcmin from HD 169512, and the same for
# 169842, 170054, 170200 and 170293. In this file family "JD" is not always OA's
# own numbering. Whether that holds for all 52 is untested; only these are shown
# by the cross-match.
hide_comment_matching:
  - Star in cluster NGC 6633

systems:
  - star: Arkab Prior B
    label: Arkab Prior B
    affiliation: mutual-progress-association
    real: Beta-1 Sagittarii B, the companion of HIP 95241
    article: https://www.orionsarm.com/eg-article/48f4bc90174b8
    note: >-
      Arkab Prior is a wide binary and its components lie some 3,290 AU apart —
      a twentieth of a light year. The add-on places this one at 378 ly and the
      catalogue places the primary at 389, so the two markers stand about eleven
      light years apart on the map: two hundred times the real separation, and
      entirely an artefact of the two sources disagreeing about the system's
      distance rather than about the pair. The worlds of both components are
      bound to the catalogue star, so the fiction sits in one place even where
      the markers do not.

  - star: Cantor
    label: Cantor
    affiliation: caretaker-gods
    uncertain: true
    article: https://www.orionsarm.com/eg-article/48fe1da7a2205

  - star: EG 471
    label: Wadai
    affiliation: sophic-league
    real: GJ 3162, the white dwarf WD 0230-144
    article: https://www.orionsarm.com/eg-article/4910e5c60edcc
    note: >-
      In both source sets: the Celestia add-on as EG 471, and the Inner Sphere
      table as WD 0230-144 at 54.4 ly. The table's row does not resolve, because
      no WD or GJ 3162 designation appears in HYG — a white dwarf of absolute
      magnitude 14.8 is below Hipparcos and outside the Bright Star Catalogue.
      So the add-on's 50.5 ly is the only position we have for it, and it is a
      measurement rather than an assertion.

  - star: Enigma
    label: Enigma
    article: https://www.orionsarm.com/eg-article/491aecf1478f9
    note: >-
      Left unassigned. The Enigma Cluster is NGC 6755, but the add-on places this
      star at l=242 b=-32, 1410 pc — in Columba, 3478 pc from NGC 6755 and
      roughly opposite it on the sky. No star in the add-on comes within 1549 pc
      of that cluster. Either this is a different object or its coordinates are
      wrong, and a Keter Dominion assignment would rest on the contradiction.

  - star: Geminga
    label: Geminga
    affiliation: metasoft
    real: Geminga, the pulsar PSR J0633+1746
    article: https://www.orionsarm.com/eg-article/464e8a1ed988a

  - star: Hiederia
    label: Hiederia
    affiliation: solar-dominion
    article: https://www.orionsarm.com/eg-article/48fb58d65ae1e
    note: >-
      The add-on comments this "star for system containing Redunin", but the
      primary has a name of its own, so the naming rule prefers Hiederia.

  - star: JD 10012
    label: Muuhome
    affiliation: xenosophont
    article: https://www.orionsarm.com/eg-article/47bb872326fa1
    note: >-
      Spelled Muuhome, against the add-on's "Muuhhome". Muuh-controlled, and
      independent rather than protected: they have their own System of Response
      and need no terragen protection, which is why this classifies as
      Xenosophont where H'tat'sa'thoss classifies with the Caretaker Gods.

