# Orion's Arm meta-empires and the real cosmic landmarks associated with them.
#
# These are rough associations, not borders. OA's polity volumes are diffuse and
# heavily interpenetrating: a landmark listed under two polities is a genuine
# shared presence, not a mistake, and the pipeline preserves multiple membership
# rather than forcing a single owner.
#
# Landmark names are resolved against the real catalogs at build time. Names that
# cannot be resolved are reported loudly and kept as pending, so they bind
# automatically once the catalog that contains them is added. See
# `fiction/aliases.yaml` for common-name to catalog-designation mappings.

# Where the associations below were read from. Every polity cites one, so a
# reader can tell what kind of statement a colour on the map actually is.
sources:
  political-maps-8000at:
    title: "Political Maps of the Middle Regions in the year 8000 A.T."
    page: "Maps of the Terragen Sphere"
    url: https://www.orionsarm.com/eg-topic/49c787abb28fd
    epoch_at: 8000
    note: >-
      Four slices of the galaxy taken parallel to its plane, with approximate
      borders drawn between the polities. Its value here is that it also shows
      real-world landmarks falling inside each polity's volume — but a landmark
      inside a border on a projected slice is not a claim of presence there, as
      the ones lying far outside the Terragen Sphere show. Depicts 8000 A.T.,
      some 2,600 years before the setting's present, so the volumes it draws are
      smaller than the current ones.

  eg-historical-polities:
    title: "Historical Polities"
    page: "Orion's Arm Encyclopaedia Galactica"
    url: https://www.orionsarm.com/eg-topic/56b553e0b8918
    note: >-
      The Encyclopaedia's own index of polities that no longer exist, most of
      them Old Earth nations. The interstellar ones are entered below so that a
      world's events can name them; a year on any of them is read off the
      history timeline, cited where it is set, and left unset where the
      timeline states none.

  eg-system-articles:
    title: "Encyclopaedia Galactica system articles"
    page: "Orion's Arm Encyclopaedia Galactica"
    url: https://www.orionsarm.com/
    note: >-
      Individual system articles, each cited per entry in `oa_systems.yaml`.
      Unlike the political map, these name an affiliation for one system
      directly, so they carry no epoch of their own and no border is implied.

# Colours are told apart by eye alone — a thin ring around a star, a few words
# of label — so what matters is perceptual distance, not that the hex codes
# differ. Two pairs here were once byte-identical, four polities rendering as
# two colours, and reading the file did not reveal it. A test now measures every
# pair in CIEDE2000 and refuses anything indistinguishable; run it after adding
# or changing one.
#
# How diffuse a polity is, and how much of it we have, are different questions.
# The Seams is a border polity by definition and so is diffuse everywhere, but
# only one of its systems is recorded. Cyberia is an encrypted overlay network,
# spread through everyone else's space while owning few worlds outright. The
# Fomalhaut Acquisition Society is largely spacefaring and settles little. So a
# proximity measured from the objects we happen to hold understates the reach of
# exactly those polities, and the colour test treats any polity with fewer than
# five recorded objects as potentially adjacent to everything — the safe
# direction, since thin data should tighten a guard rather than silence it.
#
# What "distinct enough" means depends on space, not on the palette. Two purple
# polities on opposite sides of the Terragen sphere are never seen together and
# cannot be confused; two yellows sharing the Inner Sphere are a real problem
# whatever their separation on a colour wheel. So the test measures colour
# distance only between polities whose objects actually interpenetrate, and
# several pairs that look alarmingly close in the abstract — Orion Federation
# against The Seams, the Non-Coercive Zone against the Fomalhaut Acquisition
# Society — are left alone deliberately, being thousands of light years apart.

# `kind` distinguishes what an entry actually is. Most are meta-empires, the
# default. Some are smaller polities, and one is not a political body at all.
polities:
  - id: cygexpa
    name: Cygexpa
    # Encyclopaedia timeline, 7247: "The Cygexpa Sale. With no warning Lohengrin disbands the
    # Cygexpa empire." Kept, as the comment below says; from this year its places
    # read as held by whoever the sources name since.
    dissolved_at: 7247
    color: "#4FC3F7"
    source: political-maps-8000at
    landmarks:
      [S126, S119, Trumpler 37, S155, S171, Turner 1, North America Nebula,
       S129, Roslund 5, Aquila Rift, NGC 7092, Dumbbell Nebula, Collinder 428,
       NGC 6885, NGC 6996, NGC 0225, NGC 0189, Czernik 8, Cat Eye Nebula,
       NGC 7160, NGC 7762, NGC 6882]
    # Dissolved, and kept anyway. Its volume is still a region with a history,
    # and its places are tagged for it wherever nothing has claimed them since —
    # so `affiliations` here reads "was", not "is". Where a successor does hold
    # a place, the successor is named instead: Qjellto is Utopia's and Zoeific's.

  - id: keter-dominion
    name: Keter Dominion
    # Encyclopaedia timeline, 2388: "The Congregation of Information Light emigrates from the
    # solar system to a remote system named Ain Soph Aur, setting up the structure
    # of the Keter Dominion as it is today." Keterism is older — the timeline has
    # a Keterist mind designer in 2109 — so a colony an article calls Keterist
    # before 2388 is entered as such on its own event, which this year does not
    # gate.
    founded_at: 2388
    color: "#F8E5BC"
    # Separated from the Solar Dominion, which sat 8.1 away and now sits 16.7.
    # Hue had only 2.5 degrees of room between Solar above and The Seams below,
    # so the separation is in lightness and chroma instead: a pale gold against
    # a saturated yellow. Lightened again after the first attempt still read as
    # the same colour in the rings, where low alpha compresses chroma but leaves
    # lightness intact.
    source: political-maps-8000at
    landmarks:
      [Ptolemy's Cluster, S67, M25, NGC 6589, Butterfly Cluster, Berkeley 42,
       IC 4665, G64.3+5.7, NGC 6709, Collinder 359, NGC 6755]

  - id: mutual-progress-association
    name: Mutual Progress Association
    # Encyclopaedia timeline, 1967: "Formation of Mutual Progress Association."
    founded_at: 1967
    color: "#66BB6A"
    source: political-maps-8000at
    landmarks:
      [NGC 6994, NGC 6716, Collinder 394, NGC 6802, Berkeley 82, IC 4756,
       NGC 6633, M23, NGC 6494, NGC 6281, Rho Ophiuchi Complex, S27,
       Collinder 359, Collinder 399]

  - id: sagittarius-transcultural-cooperation
    name: Sagittarius Transcultural Cooperation
    # Encyclopaedia timeline, 4805: "Sagittarius Sphere dissolved by an alliance of ComEmp
    # empires; becomes the Sagittarius Transcultural Cooperation."
    founded_at: 4805
    color: "#AB47BC"
    source: political-maps-8000at
    landmarks: [IC 4651, Bochum 14, S31, Basel 5, NGC 4625, NGC 6416]

  - id: negentropy-alliance
    name: Negentropy Alliance
    # Given by the project owner from the polity's own Encyclopaedia article,
