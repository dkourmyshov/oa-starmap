       # gives a distance for each. Most of that list was already above, which
       # is a check on the political maps rather than an addition to them; these
       # are the ones it added, and all but NGC 1662 are stars.
       YY Geminorum, Aldebaran, Zeta Tauri, LU Geminorum, Epsilon Geminorum,
       139 Tauri, 119 Tauri, Epsilon Aurigae, NGC 1662]

  - id: solar-dominion
    name: Solar Dominion
    # Given by the project owner from the polity's own Encyclopaedia article,
    # which is not among the saved pages; the history timeline has no line for
    # its forming, its first mention being Shamash joining it in 2348.
    founded_at: 2217
    color: "#FFEE58"
    source: political-maps-8000at
    landmarks:
      [NGC 246, NGC 0752, M34, California Nebula, NGC 1342, NGC 1579, IC 0361,
       Markarian 6, Geminga, Collinder 463, NGC 1027, IC 1848, IC 1805, S202,
       S205, NGC 559, Alpha Persei Cluster, Gamma Cas, M39, Stock 2, IC 417,
       NGC 1513, NGC 1528, NGC 1545, Stock 7, NGC 1444, NGC 1498, S27,
       Owl Nebula, Iskudarian 1, Stephenson 1, S138, NGC 1502, S232, NGC 1513]

  - id: ulysses-network
    name: Ulysses Network
    color: "#4DB6AC"
    source: political-maps-8000at
    landmarks: [NGC 2126]

  # Below here: affiliations reached through individual system articles rather
  # than the 8000 A.T. political map, so they carry no landmarks of their own.
  # Their members are named in `oa_systems.yaml`. Colours are provisional.
  #
  # How a system is classified, for the two entries that are not ordinary
  # polities:
  #
  #   Protected by a Caretaker God -> Caretaker Gods, whatever is actually there:
  #   pre-spaceflight xenosophonts, a wildlife preserve, or a pretty rock. The
  #   classification follows the protection, not the contents.
  #
  #   Independent and active xenosophonts -> Xenosophont. Active is the load
  #   bearing word: a species going about its own affairs, not a dead
  #   civilisation somebody found. Amida and Bentharis hold the remains of
  #   extinct xenosophont civilisations and are tagged with neither — nobody is
  #   there to hold them.
  #
  # The two rarely overlap, since a protected species is usually not an
  # independent actor. Where they do, both are recorded rather than one being
  # made to win. Doreen is the case: a hostile xenosophont-derived AI that the
  # Caretakers both shield and shield terragens from.

  - id: caretaker-gods
    name: Caretaker Gods
    color: "#B39DDB"
    kind: polity
    source: eg-system-articles
    # Where a xenosophont system is listed under this, the relationship is
    # protection rather than membership: a Caretaker God shields the system so it
    # is left alone and not absorbed by some other terragen empire. H'tat'sa'thoss
    # is such a case — the To'ul'h are not Caretaker Gods, they are protected by
    # one.

  - id: perseus-principalities
    name: Perseus Principalities
    color: "#F06292"
    landmarks: [Czernik 8]
    kind: polity
    source: eg-system-articles
    # Czernik 8 is Cygexpa's too, and at 8,589 ly it is past this map's 7,000 ly
    # frontier — bound and named, but not polity-coloured, so neither claim
    # shows. Cam OB1 belongs on this list as well and cannot go on it: an OB
    # association is not in the open cluster catalogue, which is the only
    # catalogue of groups this build loads.

  - id: zoeific-biopolity
    name: Zoeific Biopolity
    color: "#AED581"
    source: eg-system-articles

  - id: the-seams
    name: The Seams
    color: "#C0A71B"
    # A border polity is diffuse by definition, so it can meet anything and must
    # be told apart from everything. It was 4.6 from the Orion Federation.
    kind: polity
    source: eg-system-articles

  - id: stellar-umma
    name: Stellar Umma
    color: "#337B8B"
    # Only one of its systems is recorded, so its extent cannot be measured and
    # it is held to the same bar as a diffuse polity. It was 3.1 from the
    # Negentropy Alliance.
    kind: polity
    source: eg-system-articles
    # Really two, the Umma of the Core and the Umma of the Shell, recorded as one
    # until the distinction matters here.

  - id: cyberian-network
    name: Cyberian Network
    color: "#64B5F6"
    kind: polity
    source: eg-system-articles

  - id: deeper-covenant
    name: Deeper Covenant
    color: "#9575CD"
    kind: polity
    source: eg-system-articles

  - id: diamond-network
    name: Diamond Network
    color: "#2A8BE9"
    # Was byte-identical to Cygexpa.
    kind: polity
    source: eg-system-articles

  - id: fomalhaut-acquisition-society
    name: Fomalhaut Acquisition Society
    color: "#C77B10"
    # Pushed off the Non-Coercive Zone twice. Moving it out of red-orange only
    # got it to 13.3, which measures as clear and does not read as clear beside
    # a polity holding six hundred places; turning it gold and darkening it
    # gets 19.3, and picks up Orion Federation, 12.6 away and closer than
    # NoCoZo ever was. Still warm — a small polity's colour should not shout.
    kind: polity
    source: eg-system-articles

  - id: silicon-generation
    name: Silicon Generation
    color: "#90A4AE"
    kind: polity
    source: eg-system-articles

  - id: solipsist-panvirtuality
    name: Solipsist Panvirtuality
    color: "#7986CB"
    kind: polity
    source: eg-system-articles

  - id: solsys-organization
    name: Solsys Organization
    color: "#FFBD9F"
    # Was 3.0 from the Solar Dominion, which it interpenetrates: both are in
    # and around Sol, so the two were the one pair on this map that genuinely
    # could not be told apart. Now 30.3.
    kind: polity
    source: eg-system-articles

  - id: technorapture-hypernation
    landmarks: [NGC 2244]
    name: TRHN
    color: "#9E3C43"
    kind: polity
    source: eg-system-articles
    # The TechnoRapture HyperNation, written as the initialism because that is
    # what the articles do; the expansion is in questions.md, for the reader
    # who asks, rather than on the legend. Moved off purple, which sat 9.0 from
    # both the Sagittarius Transcultural Cooperation and the Deeper Covenant —
    # inside the floor but tight for a polity this diffuse. 16.5 now.

  - id: terragen-federation
    name: Terragen Federation
    # Given by the project owner from the polity's own Encyclopaedia article,
    # which gives "Founded 2900-3200 AT". The earlier bound is entered, so the
    # gate hides nothing the article allows; the range is the honest claim.
    founded_at: 2900
    color: "#5AEEDA"
    # Was byte-identical to the Stellar Umma.
    kind: polity
    source: eg-system-articles
    # A completely distinct polity from the Orion Federation above, confirmed
    # rather than assumed. The names are similar and the two arrived here by
    # different routes — Orion off the 8000 A.T. political map, Terragen from
    # the system articles — so the resemblance invites exactly the wrong merge.

  - id: utopia-sphere
    name: Utopia Sphere
    # Given by the project owner from the polity's own Encyclopaedia article, as the
    # colonisation of Beta Arae, taken as the first Utopia system proper. Hard to
    # date: Chesed was already active at Ceres Mater in the 1900s, and that
    # community reads as Keterist-proto-Utopian — the case for an event naming
    # the polity outright, which this year does not gate.
    founded_at: 2975
    color: "#F48FB1"
    source: eg-system-articles

  - id: refugium-federation
    name: Refugium Federation
    # Encyclopaedia timeline, 5884: "Establishment of the Refugium Federation."
    founded_at: 5884
    color: "#1D855F"
    kind: polity
    source: eg-system-articles

  - id: crystal-star-domain
    name: Crystal Star Domain
    # Encyclopaedia timeline, 3670: "First Crystal Star Domain founded in the Monoceros Middle
    # Regions." Re-established near the Rosette Nebula in 8400.
    founded_at: 3670
    color: "#851D62"
    landmarks: [Cone Nebula, NGC 2244]
    kind: polity
    source: eg-system-articles
    # Both landmarks are other polities' too — the Cone Nebula is the Orion
    # Federation's and the Rosette is shared by the Non-Coercive Zone and the
    # TRHN. Recorded rather than contested; the rings segment.

  - id: far-edge-civilisation
    name: Far Edge Civilisation
    color: "#855D79"
    kind: polity
    source: eg-system-articles

  - id: iota-network
    name: Iota Network
    color: "#85511D"
    kind: polity
    source: eg-system-articles
    # An academic network rather than an empire. It has been on the map without
    # an entry since Lucida arrived: that world was recorded as `special`,
    # holder unstated, because the Network had nowhere to point. It does now.

  - id: puppis-democracy
    name: Puppis Democracy
    # Encyclopaedia timeline, 7100: "The Puppis Democracy emerges near the red giant Pi Puppis."
    founded_at: 7100
    color: "#ED5FED"
    kind: polity
    source: eg-system-articles

  - id: synthetic-human-alliance
    name: Synthetic/Human Alliance
    color: "#1D4A85"
    kind: polity
    source: eg-system-articles

  - id: xeon
    name: Xeon
    color: "#556070"
    kind: polity
    source: eg-system-articles
    # Ahuman, and known by where it was noticed rather than where it is: the
    # Perseus Quadrant of the Outer Cassiopeia Sector, a direction with no
    # distance. Its one entry in worlds.yaml is a volume that draws nothing.

  - id: albireo-confluence
    name: Albireo Confluence
    color: "#B06FA0"
    kind: polity
    source: eg-system-articles
    # Capital at Albireo, 363 ly out, and that is the whole of what is known
    # about where it reaches. The Albireo Plexus around it is a sector rather
