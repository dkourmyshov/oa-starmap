  - id: vela
    name: Vela
    color: "#EF5350"
    source: political-maps-8000at
    landmarks: [Vela Supernova Remnant]
    # Also a constellation, and the first half of Neu Vela. The history scan
    # skips it rather than reporting the Vela polity in centuries that are
    # talking about the sky or about somewhere else entirely.
    ambiguous_name: true

  - id: emple-dokcetics
    name: Emple-Dokcetics
    color: "#7E57C2"
    source: political-maps-8000at
    landmarks: [NGC 2353, NGC 2374, M50, NGC 2343, NGC 2301]

  - id: sophic-league
    name: Sophic League
    # Encyclopaedia timeline, 2345: "The Sophic League emerges as an ecumenical answer to
    # the expansionist materialism of the growing early AI-religions."
    founded_at: 2345
    color: "#5C6BC0"
    source: political-maps-8000at
    landmarks:
      [Collinder 173, Collinder 132, NGC 2516, NGC 1901, NGC 2547,
       Collinder 121, M41, NGC 2422, M47, NGC 2527, NGC 2423,
       Theta Carinae Cluster, Omicron Velorum Cluster, NGC 2451, Collinder 135,
       Collinder 140, Seagull Nebula, M48, M67, NGC 2548, NGC 2395]

  - id: communion-of-worlds
    name: Communion of Worlds
