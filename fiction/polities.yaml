  - id: archosaurian-empire
    name: Archosaurian Empire
    color: "#728C23"
    landmarks: [NGC 7092]
    kind: polity
    source: eg-system-articles
    # M39 is Cygexpa's on the political maps and the Archosaurians' by article,
    # which is not a contradiction: Cygexpa dissolved and this is who is there
    # now. Both are recorded, so the cluster ring is drawn halved.
    # 17.3 from its nearest, which is the Amalgamation.

  - id: primate-provolution-institute
    name: Primate Provolution Institute
    color: "#1C1C8C"
    kind: polity
    source: eg-system-articles
    # Small and independent, and not a meta-empire — but it holds Ao Lai, which
    # is not the Mutual Progress Association's whatever this file said before.
    # 21.2 from its nearest, the widest margin of any polity here.

  - id: red-star-mpire
    name: Red Star 'M'pire
    # Encyclopaedia timeline, 9550: seedships launched "to mark the 5,000th anniversary of
    # the founding of the Red Star 'M'pire" — so 4550, by subtraction rather than
    # by a line that names the year.
    founded_at: 4550
    color: "#BF3000"
    source: eg-system-articles
    # Deep red for a red-star empire, 16.5 from its nearest, which is TRHN.
    # Not a volume like the others: its cells were grown along a tidal streamer
    # of the Sagittarius Dwarf, so it should read as a filament steeply
    # inclined to the disk rather than a sphere. Nothing is drawn for that
    # shape yet — one recorded place cannot outline it.

  - id: amalgamation
    name: Amalgamation
    color: "#947838"
    kind: polity
    source: eg-system-articles
    # Added once it held two worlds rather than one. Halsokallan fell to it in
