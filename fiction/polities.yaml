  # Below here: affiliations reached through individual system articles rather
  # than the 8000 A.T. political map, so they carry no landmarks of their own.
  # Their members are named in `oa_systems.yaml`. Colours are provisional.
  #
  # How a system is classified, for the two entries that are not ordinary
  # polities:
  #
  #   Protected by a Caretaker God -> Caretaker Gods, whatever is actually there:
  #   pre-spaceflight xenosophonts, a wildlife preserve, or a pretty rock. The
  #   classification follows the protection, not the contents.
  #
  #   Controlled by xenosophonts, with no or only nominal terragen presence ->
  #   Xenosophont.
  #
  # The two do not overlap, because a protected system takes the first rule even
  # when xenosophonts live there.

  - id: caretaker-gods
    name: Caretaker Gods
    color: "#B39DDB"
    kind: polity
    source: eg-system-articles
    # Where a xenosophont system is listed under this, the relationship is
    # protection rather than membership: a Caretaker God shields the system so it
    # is left alone and not absorbed by some other terragen empire. H'tat'sa'thoss
    # is such a case — the To'ul'h are not Caretaker Gods, they are protected by
    # one.

  - id: perseus-principalities
    name: Perseus Principalities
    color: "#F06292"
    kind: polity
    source: eg-system-articles

  - id: zoeific-biopolity
    name: Zoeific Biopolity
    color: "#AED581"
    source: eg-system-articles

  - id: the-seams
    name: The Seams
    color: "#C0A71B"
    # A border polity is diffuse by definition, so it can meet anything and must
    # be told apart from everything. It was 4.6 from the Orion Federation.
    kind: polity
    source: eg-system-articles

  - id: stellar-umma
    name: Stellar Umma
    color: "#337B8B"
    # Only one of its systems is recorded, so its extent cannot be measured and
    # it is held to the same bar as a diffuse polity. It was 3.1 from the
    # Negentropy Alliance.
    kind: polity
    source: eg-system-articles
    # Really two, the Umma of the Core and the Umma of the Shell, recorded as one
    # until the distinction matters here.

  - id: cyberian-network
    name: Cyberian Network
    color: "#64B5F6"
    kind: polity
    source: eg-system-articles

  - id: deeper-covenant
    name: Deeper Covenant
    color: "#9575CD"
    kind: polity
    source: eg-system-articles

  - id: diamond-network
    name: Diamond Network
    color: "#2A8BE9"
    # Was byte-identical to Cygexpa.
    kind: polity
    source: eg-system-articles

  - id: fomalhaut-acquisition-society
    name: Fomalhaut Acquisition Society
    color: "#C77B10"
    # Pushed off the Non-Coercive Zone twice. Moving it out of red-orange only
    # got it to 13.3, which measures as clear and does not read as clear beside
    # a polity holding six hundred places; turning it gold and darkening it
    # gets 19.3, and picks up Orion Federation, 12.6 away and closer than
    # NoCoZo ever was. Still warm — a small polity's colour should not shout.
    kind: polity
    source: eg-system-articles

  - id: silicon-generation
    name: Silicon Generation
    color: "#90A4AE"
    kind: polity
    source: eg-system-articles

  - id: solipsist-panvirtuality
    name: Solipsist Panvirtuality
    color: "#7986CB"
    kind: polity
    source: eg-system-articles

  - id: solsys-organization
    name: Solsys Organization
    color: "#FFBD9F"
    # Was 3.0 from the Solar Dominion, which it interpenetrates: both are in
    # and around Sol, so the two were the one pair on this map that genuinely
    # could not be told apart. Now 30.3.
    kind: polity
    source: eg-system-articles

  - id: technorapture-hypernation
    landmarks: [NGC 2244]
    name: Technorapture Hypernation
    color: "#BA68C8"
    kind: polity
    source: eg-system-articles

  - id: terragen-federation
    name: Terragen Federation
    color: "#5AEEDA"
    # Was byte-identical to the Stellar Umma.
    kind: polity
    source: eg-system-articles
    # A completely distinct polity from the Orion Federation above, confirmed
    # rather than assumed. The names are similar and the two arrived here by
    # different routes — Orion off the 8000 A.T. political map, Terragen from
    # the system articles — so the resemblance invites exactly the wrong merge.

  - id: utopia-sphere
    name: Utopia Sphere
    color: "#F48FB1"
    source: eg-system-articles

  - id: trhn
    name: TRHN
    color: "#9E3C43"
    source: eg-system-articles
    # The TechnoRapture HyperNation, a near-Sephirotic empire. Left as the
    # initialism because that is what the articles write; the expansion is in
    # questions.md and belongs to the reader who asks, not to the legend.
    # Diffuse, so it needs a colour of its own even while it holds one world —
    # 17.7 from its nearest, the widest margin any polity here has.

  - id: amalgamation
    name: Amalgamation
    color: "#947838"
    kind: polity
    source: eg-system-articles
    # Added once it held two worlds rather than one. Halsokallan fell to it in
    # 8760 and Adorate the year after, and until it had an entry both drew as
    # unaffiliated — indistinguishable from a system nobody holds.

  - id: xenosophont
    name: Xenosophont
    color: "#BCAAA4"
    kind: xenosophont
    source: eg-system-articles
    # Systems under xenosophont control with no or only nominal terragen
    # presence. A category rather than a polity, and deliberately undivided for
    # now; it may split by clade once there is more than one member.
    #
    # It does not collect every xenosophont system. H'tat'sa'thoss holds the
    # To'ul'h and is classified with the Caretaker Gods instead, because the
    # protection rule takes precedence over what lives there.

# Landmarks whose odd position has been checked against the source and is
# correct. The build's placement check is a proofreading aid for mis-transcribed
# names — it is not a model of polity shape and does not overrule the fiction.
# Naming a landmark here stops it being reported, permanently.
# Pairs the setting places on opposite sides of the Terragen sphere, and which
# therefore never appear together whatever our data holds. Only for cases known
# from the setting rather than measured — the measurement is exactly what this
# compensates for, since a polity with two recorded worlds looks far from
# everything.
never_adjacent:
  - [paradigm, perseus-principalities]

confirmed_placements: []

# Landmarks whose polity attribution spans a border, recorded so the ambiguity
# is not lost when the data is read back.
notes:
  S138: "On the border between Solar Dominion and Cygexpa."
  Collinder 173: "Shared between the Non-Coercive Zone and the Sophic League."
  S27: "Shared between the Mutual Progress Association and the Solar Dominion."
  S232: "Shared between Metasoft and the Solar Dominion."
  North America Nebula: "With Collinder 428, both known as Hosoko."
  Seagull Nebula: >-
    Read as "Eagle Nebula" when this list was first transcribed, which bound it
    to NGC 6611 in Serpens at l=17 deg — some 200 degrees away from every other
    Sophic landmark, all of which lie between l=216 and l=290. The Seagull
    (Sh2-296, l=224 deg, 1000 pc) sits between M48 and M47, matching the source
    map's placement.
