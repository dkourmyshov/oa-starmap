  # Below here: affiliations reached through individual system articles rather
  # than the 8000 A.T. political map, so they carry no landmarks of their own.
  # Their members are named in `oa_systems.yaml`. Colours are provisional.
  #
  # How a system is classified, for the two entries that are not ordinary
  # polities:
  #
  #   Protected by a Caretaker God -> Caretaker Gods, whatever is actually there:
  #   pre-spaceflight xenosophonts, a wildlife preserve, or a pretty rock. The
  #   classification follows the protection, not the contents.
  #
  #   Controlled by xenosophonts, with no or only nominal terragen presence ->
  #   Xenosophont.
  #
  # The two do not overlap, because a protected system takes the first rule even
  # when xenosophonts live there.

  - id: caretaker-gods
    name: Caretaker Gods
    color: "#B39DDB"
    kind: polity
    source: eg-system-articles
    # Where a xenosophont system is listed under this, the relationship is
    # protection rather than membership: a Caretaker God shields the system so it
    # is left alone and not absorbed by some other terragen empire. H'tat'sa'thoss
    # is such a case — the To'ul'h are not Caretaker Gods, they are protected by
    # one.

  - id: perseus-principalities
    name: Perseus Principalities
    color: "#F06292"
    kind: polity
    source: eg-system-articles

  - id: zoeific-biopolity
    name: Zoeific Biopolity
    color: "#AED581"
    source: eg-system-articles

  - id: the-seams
    name: The Seams
    color: "#FFB74D"
    kind: polity
    source: eg-system-articles

  - id: stellar-umma
    name: Stellar Umma
    color: "#4DD0E1"
    kind: polity
    source: eg-system-articles
    # Really two, the Umma of the Core and the Umma of the Shell, recorded as one
    # until the distinction matters here.

  - id: cyberian-network
    name: Cyberian Network
    color: "#64B5F6"
    kind: polity
    source: eg-system-articles

  - id: deeper-covenant
    name: Deeper Covenant
    color: "#9575CD"
    kind: polity
