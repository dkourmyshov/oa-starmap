    landmarks: [S245, Blanco 1]

  - id: orion-federation
    name: Orion Federation
    color: "#FFA726"
    source: political-maps-8000at
    landmarks: [S263, M78, Collinder 69, Collinder 70, Cone Nebula]

  - id: metasoft
    name: Metasoft Version Tree
    # Encyclopaedia timeline, 2344: "Metasoft vec ships spread beyond human
    # control ... The Metasoft biont management has no choice but to hand over
    # the reins of power to its AI" — the independence of the vec polity from
    # Metasoft Interstellar's management. The Version Tree itself is later:
    # timeline, 2582, "Metasoft institutes the Version Tree system of standards."
    # The corporation is older still, from the 2100s, per its article.
    founded_at: 2344
    color: "#75CC32"
    # Its nearest neighbour was not the MPA but the Zoeific Biopolity, 4.2 away
    # and within half a degree of the same hue. Now 10.3 from both.
    source: political-maps-8000at
    landmarks:
      [NGC 1746, NGC 1647, NGC 1750, NGC 1758, NGC 2169, NGC 2112,
       Collinder 96, NGC 2215, M35, Monkey Nebula, Christmas Tree Cluster,
