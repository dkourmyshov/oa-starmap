  - id: nocozo
    name: Non-Coercive Zone
    # Encyclopaedia timeline, 1498: "With the formation of the Non Coercive Zone, 61 Virginis
    # legally becomes its property."
    founded_at: 1498
    color: "#FF7043"
    source: political-maps-8000at
    landmarks:
      [NGC 6025, NGC 6087, Blanco 1, Helix Nebula, NGC 4337, NGC 3532,
       NGC 3228, Hogg 14, Pismis 5, Bochum 4, Ruprecht 98, vdB-Hagen 99,
