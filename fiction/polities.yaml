    name: Cygexpa
    color: "#4FC3F7"
    landmarks:
      [S126, S119, Trumpler 37, S155, S171, Turner 1, North America Nebula,
       S129, Roslund 5, Aquila Rift, NGC 7092, Dumbbell Nebula, Collinder 428,
       NGC 6885, NGC 6996, NGC 0225, NGC 0189, Czernik 8, Cat Eye Nebula,
       NGC 7160, NGC 7762]

