    # Precepts of Negentropy to 1965 and the Seat of Judgement to 2465.
    founded_at: 2465
    color: "#26C6DA"
    source: political-maps-8000at
    landmarks:
      [NGC 6124, NGC 5823, NGC 5662, Ruprecht 108, NGC 6178, NGC 6134, Lynga 7,
       NGC 6250, NGC 5822]

  - id: disarchy
    name: Disarchy
    color: "#8D6E63"
    source: political-maps-8000at
    landmarks: [Lynga 2, Hogg 18]
    # A loose confederation rather than an empire, so `affiliations: [disarchy]`
    # reads as membership and not as ownership — the Velarian Confederation, the
    # Mensan Way and the Locality of Wolfra are affiliates, which for this
    # polity is the ordinary case rather than a qualification. Elsewhere in this
