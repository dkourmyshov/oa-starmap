  - id: the-transcend
    name: The Transcend
    color: "#C78E6D"
    landmarks: [NGC 2451A]
    kind: polity
    source: eg-system-articles
    # Its members are numbered rather than named — Transcend 1 is NGC 2451A,
    # Transcend 7 is NGC 6802 — so the polity's landmarks are the clusters
