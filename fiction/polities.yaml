    #
    # It does not collect every system with xenosophonts in it. H'tat'sa'thoss
    # holds the To'ul'h and is classified with the Caretaker Gods alone: they are
    # protected rather than independent, which is the ordinary case.

  # ---- Dissolved before the setting's present -------------------------------
  #
  # Named only through a world's events — settled *by*, passed *to* — never as
  # a present affiliation, so they hold nothing on the map's legend and draw no
  # ring. They are here so that an event can name them and the build can check
  # the name, and they carry a colour for the day the map is drawn at a year
  # when they existed. Cygexpa above is the precedent, kept for its volume; these
  # are kept for their dates.

  - id: doran-empire
    name: Doran Empire
    color: "#A1887F"
    source: eg-system-articles
    dissolved_at: 5855
    # Cyber-tweak clade out of Solsys in 629, first colony at Gliese 877 in 929,
    # then the red and orange dwarfs of the Inner Sphere. Fragmented over the
    # Consolidation wars; its last remnants entered the Terragen Federation in
    # 5855. Read from the Sesharia and Dorangloon articles.

  - id: first-federation
    name: First Federation
    color: "#C0CA33"
    source: eg-system-articles
    # No dissolution year: the timeline's Federation periods end at 2100 AT,
    # but that is the end of a period, and no page read so far dates the end
    # of the polity. Nothing is yet recorded as held by it, so nothing is
    # drawn as still held by it either.
    # The early interstellar polity the system articles name most often after
    # the Solar Dominion: 160 mentions, on the ships that reached places and
    # the charters that founded them before any present holder existed. Read
    # from the New Callisto article's "Reached" field.

  # ---- Early interstellar polities, from the Historical Polities page -------
  #
  # Entered so that events can name them, and drawn only when one does. See the
  # eg-historical-polities source above; each entry's comment is that page's
  # description and whatever the history timeline dates.

  - id: eridanus-league
