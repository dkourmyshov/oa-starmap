    # to the southern galactic direction, "where they set up the Communion of
    # Worlds."
    founded_at: 1989
    color: "#F8BBD0"
    source: political-maps-8000at
    # Blanco 1 is also a Non-Coercive Zone landmark, and stays one. The article
    # on the Blenke Cluster puts it in the Communion; the political maps put it
    # in the NoCoZo. Both are recorded rather than one being chosen, because
    # meta-empires interpenetrate and a cluster 850 ly across can hold presences
