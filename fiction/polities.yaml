    # unaffiliated — indistinguishable from a system nobody holds.

  - id: xenosophont
    name: Xenosophont
    color: "#BCAAA4"
    kind: xenosophont
    source: eg-system-articles
    # Independent, active xenosophont systems and worlds. A category rather than
    # a polity, and deliberately undivided for now; it may split by clade once
