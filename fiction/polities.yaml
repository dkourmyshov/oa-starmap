  - id: laughter-hegemony
    name: Laughter Hegemony
    # Encyclopaedia timeline, 9487: "The Laughter Hegemony founded."
    founded_at: 9487
    color: "#C1443A"
    landmarks: [NGC 6357]
    kind: polity
    source: eg-system-articles
    # Expansionist, and known almost entirely by nebulae rather than by stars:
    # canon names no positioned system of its own. The landmark is the cluster
