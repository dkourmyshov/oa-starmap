# Landmarks whose odd position has been checked against the source and is
# correct. The build's placement check is a proofreading aid for mis-transcribed
# names — it is not a model of polity shape and does not overrule the fiction.
# Naming a landmark here stops it being reported, permanently.
# Pairs the setting places on opposite sides of the Terragen sphere, and which
# therefore never appear together whatever our data holds. Only for cases known
# from the setting rather than measured — the measurement is exactly what this
# compensates for, since a polity with two recorded worlds looks far from
# everything.
never_adjacent:
  - [paradigm, perseus-principalities]

confirmed_placements: []

# Landmarks whose polity attribution spans a border, recorded so the ambiguity
# is not lost when the data is read back.
notes:
  S138: "On the border between Solar Dominion and Cygexpa."
  Collinder 173: "Shared between the Non-Coercive Zone and the Sophic League."
  S27: "Shared between the Mutual Progress Association and the Solar Dominion."
  S232: "Shared between Metasoft and the Solar Dominion."
  North America Nebula: "With Collinder 428, both known as Hosoko."
  Seagull Nebula: >-
    Read as "Eagle Nebula" when this list was first transcribed, which bound it
    to NGC 6611 in Serpens at l=17 deg — some 200 degrees away from every other
    Sophic landmark, all of which lie between l=216 and l=290. The Seagull
    (Sh2-296, l=224 deg, 1000 pc) sits between M48 and M47, matching the source
    map's placement.
