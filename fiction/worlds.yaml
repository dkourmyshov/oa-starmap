      space and the add-on at 5,080; it is colder than the cosmic background,
      which is the article's own phrasing and the only figure it gives. Real
      astronomy is more specific and worth the aside: the Boomerang's outflow
      expands fast enough to cool below the microwave background, making it the
      coldest natural place known — about a degree above absolute zero, colder
      than empty space anywhere else.

