  # ---- Caretaker Gods ----------------------------------------------------

  - name: Beelzebub
    kind: planet
    affiliations: [caretaker-gods]
    article: https://www.orionsarm.com/eg-article/461707a3ab1e3
    location:
      constellation: Canis Major
      distance: 805 ly
    events:
      - year_at: 3709
        kind: settled

  - name: Chorus
    kind: planet
    system: Cantor
    affiliations: [caretaker-gods]
    article: https://www.orionsarm.com/eg-article/48fe1da7a2205
    location:
      oa_star: Cantor
    events:
      - year_at: 7953
        kind: visited
        note: Explorers entered the system.
    note: >-
      The add-on independently confirms the article: it places Cantor in Carina
      at 2,736 ly against the article's Carina at 2,735 ly — two sources
      agreeing to four figures.

  - name: Corambytia Protectorate
    kind: volume
    affiliations: [caretaker-gods]
    extent: 290 ly
    article: https://www.orionsarm.com/eg-article/46412ddb422d6
    location:
      constellation: Antlia
      distance: 1500 ly
    events:
      - year_at: 4678
        kind: settled
        note: First colonised by a Non-Coercive Zone house.
      - year_at: 4679
        kind: stewardship
        note: The Caretaker God revealed emself, a year after the house arrived.
    note: >-
      A volume, not a point. Antlia's enclosing radius is 13 degrees, so at this
      distance the direction is uncertain by about 350 ly — more than the
      protectorate's own 290 ly diameter. The sphere drawn for it is the right
      size in the wrong place, and the uncertainty circle is the honest part.

  - name: Stanislaw
    kind: planet
    system: Enigma
    affiliations: [caretaker-gods]
    uncertain: true
    article: https://www.orionsarm.com/eg-article/491222f681eed
    location:
      constellation: Canis Major
      distance: 4598 ly
    events:
      - year_at: 9920
        kind: reported
        note: >-
          First public reports of the discovery. The discovery itself was
          earlier — probably in the 9700s — so this is the date the setting
          records rather than the date it happened.
    note: >-
      Located by constellation despite the add-on carrying a star called Enigma,
      because the two do not agree. The add-on puts it in Columba at 4,598 ly —
      RA 81.7, Dec -37.5 — and the article says Canis Major, whose nearest edge
      is some fifteen degrees away. Columba is not a boundary case for Canis
      Major. The add-on's distance is adopted since the article gives none, but
      its direction is not, and the entry is marked uncertain. Two other
      positions for Enigma are in play: the Enigma Cluster is canonically NGC
      6755, which is 3,478 pc from the add-on's star and roughly opposite it on
      the sky. Three sources, three directions.

  - name: Darwin
    kind: planet
    system: Aristotle
    parent: Aristotle
    affiliations: [caretaker-gods]
    article: https://www.orionsarm.com/eg-article/48f4a40a5df0a
    location:
      star: Delta Pavonis
    events:
      - year_at: 691
        kind: settled
    note: >-
      Aristotle is Orion's Arm's name for the star itself, not a second world —
      it is Delta Pavonis, 19.9 ly, one of the nearest systems here. Named as
      the system by the usual rule: where the primary has a name of its own,
      that is what the system is called. The catalogue designations stay on the
      star's panel. The system's own article is at
      https://www.orionsarm.com/eg-article/4ed5b7fa7fe22.

