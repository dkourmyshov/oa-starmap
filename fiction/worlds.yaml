        The article gives no coordinates but five things that amount to them:
        galactic longitude 36 degrees, about 1,600 ly from Sol, 50 ly from the
        Sparks, 132 from the Black Acropolis and — from Miracle City's own
        article — 216 ly from there. Longitude and distance alone leave a
        circle; the three hops close it. Fitting latitude and distance to all
        three gives l 36.00, b +6.74, 1,554 ly, which returns 49.7 ly to the
        Sparks against a stated 50, 217.4 to Miracle City against 216, and 136.7
        to the Black Acropolis against 132. Three independent checks agreeing
        within a few light years is what makes this a position rather than a
        guess; the distance comes out 3% under the stated 1,600, which is inside
        what "approximately" allows.
    events:
