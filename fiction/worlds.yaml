      distance: 698 ly
      near: HIP 63911
    events:
      - year_at: 3189
        kind: settled
    note: >-
      Placed at 698 ly in the direction of HIP 63911, rather than at the 17,120
      ly the catalogue gives that star. Musca is both the constellation the
      system is said to be in and the one the star is in, which says the
      identifier is right and only its parallax is wrong — Hipparcos measures
      positions to milliarcseconds and measures parallaxes at kiloparsec ranges
      barely at all. So the direction is taken from the star and the distance
      from the source. Using the constellation alone would have thrown away a
      good direction for a cone some 86 ly wide at this range.

