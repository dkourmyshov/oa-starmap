      dec_deg: 66.6330
      distance: 3300 ly
    note: >-
      NGC 6543, in Draco. Position from the Strasbourg-ESO planetary nebula
      catalogue, distance 3,300 +/- 900 ly from published measurement — a 27%
      uncertainty, which is ordinary for a planetary nebula and worse than
      anything else drawn here.

