  # The one roster whose worlds mostly share a landmark: Beta Arae, a luminous
  # orange star in Ara, against which Cephalotopia, Eutopia, Huan Gao, Megasov,
  # Oro Mistral and Tannhauser are all quoted at 390-720 ly in the same
  # constellation. The catalogue puts Beta Arae at 715 ly while the
  # Encyclopaedia's own figures imply about 615; see questions.md, which also
  # asks about Topia.

  - name: Beta Arae
    kind: system
    system: Beta Arae
    affiliations: [utopia-sphere]
    article: https://www.orionsarm.com/eg-article/460c3bd4ad939
    location:
      star: Beta Arae
    events:
      - year_at: 2975
        kind: settled
    note: >-
      The landmark the Utopia Sphere's core is quoted against: half a dozen of
      its systems are given as so many light years from Beta Arae rather than
      from Sol. The catalogue gives it class K, B-V 1.48 and absolute magnitude
      -3.9: a luminous orange star, and luminous at this range means a parallax
      small enough to be revised more than once. The catalogue here says 715 ly,
      while the distances the Encyclopaedia gives its neighbours imply about 635.

