      modern one. Bound anyway, and the catalogue distance is the one drawn.

  - name: Tohul
    kind: planet
    system: H'tat'sa'thoss
    affiliations: [caretaker-gods]
    article: https://www.orionsarm.com/eg-article/5eefcc060d4c4
    location:
      oa_star: JD 870135
    events:
      - year_at: 3831
        kind: visited
        note: First visit by Terragens.
      - year_at: 4011
        kind: contact
        note: First contact with the To'ul'h.
      - year_at: 4645
        kind: stewardship
        note: Caretaker domain declared over the system.
    note: >-
      The planet of the H'tat'sa'thoss system, already on the map as the
      Celestia add-on's JD 870135. Recorded here for the dates: the two hundred
      years between first visit and first contact, and the six hundred more
      before the system was closed, are the whole shape of this contact and are
      not derivable from a position. Tohul is the planet, H'tat'sa'thoss the
      system, To'ul'h the species.

