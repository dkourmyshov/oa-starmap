# Canonical Orion's Arm places, and where the setting puts them.
#
# Hand-authored from the Encyclopaedia Galactica, one entry per article. This is
# the file for places the EG names and locates; `oa_stars.yaml` is a machine
# import of the Celestia add-on, and `inner_sphere.yaml` is a machine import of
# the colony tables. Where two of them describe the same place, this file is the
# one that carries the article.
#
# Locations differ in kind, and the difference is recorded rather than averaged
# away, because it is real:
#
#   star:          a catalogue star. Exact in all three dimensions.
#   oa_star:       an entry of the Celestia add-on, which asserts a position.
#   ra_deg/dec_deg a direction taken from a named object, with `distance`
#                  supplying the radius. Exact, but from two different sources.
#   constellation: a region of sky, with `distance` supplying the radius. The
#                  radius is exact and the direction is good only to the width of
#                  the constellation — for Canis Major, fourteen degrees, which
#                  at 800 ly is a couple of hundred light years across.
#   (none)         the setting describes the place without locating it.
#
# Distances carry their unit always. Orion's Arm quotes light years and astronomy
# quotes parsecs; the factor between them is 3.26, which is big enough to be
# wrong and small enough to look right.
#
# `events` records dated history. Years are After Tranquility — the setting's own
# epoch, counted from the 1969 Moon landing — and are stored as given, never
# converted. `visited` and `settled` are the two that a map of the sphere at a
# given year is drawn from; the other kinds exist because the sources draw
# distinctions that collapsing to those two would throw away. `affiliation` is
# always the *present* holder, at 10600-odd AT, whatever the events say happened
# on the way there.
#
# Where a stated distance and the catalogue disagree about the star a system
# names, prefer to borrow the star's *direction* and take the distance from the
# source, rather than binding to the star. Directions are stable — a Hipparcos
# position is good to milliarcseconds and stays good — while distances are the
# part that gets revised, so a binding turns a present disagreement into one
# that widens with every new parallax. Bind only where the two already agree.
#
# `note` is shown to whoever clicks the object, so it is for facts about the
# place and about the evidence for it: which source, why this position and not
# another, where two sources disagree. It is not the place for anything about
# how this project happens to work — what our resolver used to get wrong, what
# a file is called, which entry comes next in this file. That belongs in a code
# comment, a test, or questions.md, and in a note it merely spends the reader's
# attention on us instead of on the setting.

