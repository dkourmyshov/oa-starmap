      with Lyra coming back either way. A K5 dwarf of a third Sol's luminosity.
      No holder is recorded.

  # ---- nebulae and a remnant, placed by hand -------------------------------
  #
  # These are polity landmarks that no catalogue this build loads can bind:
  # planetary nebulae and a supernova remnant. The catalogues for them exist and
  # carry positions — the Strasbourg-ESO planetary nebula catalogue and Green's
  # remnants — but neither carries a distance, which is the one thing this map
  # cannot do without. So the positions are from those catalogues and the
  # distances are hand-sourced, one object at a time.
  #
  # They stay on their polities' landmark lists as well. When a distance
  # catalogue is loaded they will bind there properly and these entries should
  # go; until then a landmark that cannot bind draws nothing at all, and these
  # do. Each is the Cygnus Loop's arrangement, which was the first of them.

  - name: Cat's Eye Nebula
    kind: volume
    affiliations: [cygexpa]
    location:
