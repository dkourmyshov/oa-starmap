  # ---- Efficiency Maximization Paradigm ------------------------------------
  #
  # A 250 ly sphere centred on NGC 5460, which the map already carries as this
  # polity's landmark at 2,321 ly. Its three known systems are inside a degree
  # of one another in Centaurus and inside 40 ly of one another in depth, which
  # for once is not an artefact of shared coordinates: each gives its own.

  - name: Efficiency Maximization Paradigm
    kind: volume
    extent: 250 ly
    affiliations: [paradigm]
    article: https://www.orionsarm.com/eg-topic/46212d6e18aa1
    location:
      ra_deg: 211.8148
      dec_deg: -48.2988
      distance: 2321 ly
      near: NGC 5460
    events:
      - year_at: 5285
        kind: settled
        precision: not_later_than
        note: Founded.
    note: >-
      Originally a highly heterodox branch of the Negentropists. Its territory is
      given as a 250 ly sphere centred on NGC 5460, so this is the cluster's
      position and the article's extent. The three systems below sit some 500 ly
      nearer than the cluster's catalogue distance, which is within a sphere
      that size.

  - name: Budrosa Dyson
    kind: megastructure
    affiliations: [paradigm]
    article: https://www.orionsarm.com/eg-article/46119eebd7104
    location:
      ra_deg: 211.4130
      dec_deg: -47.8421
      distance: 1783 ly
      near: Burdosa
    note: >-
      Around the star Burdosa. The article's coordinates fall in Centaurus, as
      it says. The article spells the structure Budrosa and the star Burdosa;
      both are kept as given.

  - name: Nirio Dyson
    kind: megastructure
    affiliations: [paradigm]
    article: https://www.orionsarm.com/eg-article/46d62d210a07e
    location:
      ra_deg: 211.3056
      dec_deg: -47.4714
      distance: 1800 ly
      direction_error_deg: 0.1
      distance_error: 50 ly
      estimated: >-
        The direction is the article's own, to arcseconds. The distance is not:
        the article gives none. Its two neighbours do — Budrosa at 1,783 ly and
        Jekaumeatrine at 1,818 — and this lies between them on the sky, a third
        of a degree from one and half a degree from the other, so 1,800 ly is
        their midpoint and the error covers both. That is an inference, and a
        narrow one, but an inference.
    events:
      - year_at: 5184
        kind: settled

  - name: Jekaumeatrine
    kind: system
    affiliations: [deeper-covenant]
    article: https://www.orionsarm.com/eg-article/4681a9870ee60
    location:
      ra_deg: 211.8897
      dec_deg: -47.4585
      distance: 1818 ly
    note: >-
      A brown dwarf and its system, and not the Paradigm's despite sitting half
      a degree from its dysons: this is the Deeper Covenant's, and headquarters
      of the Paradigm Containment Organisation. Being inside a volume and
      belonging to it are different things, and here the map can show the first
      while the note carries the second.

