  # ---- the Laughter Hegemony -----------------------------------------------

  - name: Pismis 24-1
    kind: system
    system: Pismis 24-1
    affiliations: [laughter-hegemony]
    location:
      ra_deg: 261.1825
      dec_deg: -34.2026
      distance: 6503 ly
      near: Pismis 24
    events:
      - year_at: 9880
        kind: visited
        note: Reached.
    note: >-
      A triple star in Pismis 24, the cluster embedded in the War and Peace
      Nebula, in Scorpius. This map's cluster catalogue holds the cluster and
      the nebula as one record under the name NGC 6357, with Pismis 24 as an
      alias, and that record supplies the direction.

      The distance is the Encyclopaedia's own 6,503 ly, and it is the largest of
      four figures for this region: the cluster catalogue gives 5,454, one
      published account 5,500, and another 5,871 give or take 457. The
      Encyclopaedia's lies 176 ly beyond the top of that last range, so it does
      not quite fall inside any of them, but it is close enough to be the same
      object seen through a different measurement rather than a different
      place.

  - name: Cat's Paw Nebula
    kind: volume
    extent: 70 ly
    affiliations: [laughter-hegemony]
    location:
      ra_deg: 260.2121
      dec_deg: -36.1150
      distance: 4370 ly
    note: >-
      NGC 6334 in Scorpius, 4,370 ly out give or take 650, and some 70 ly
      across. The nebula catalogue this map loads carries Sharpless numbers
      only, so this is placed from its published coordinates rather than from a
      catalogue entry.

      It sits two degrees from the War and Peace Nebula on the sky, and the two
      are reported to be joined by a filament and possibly one complex — but
      their distances do not agree that they are near each other. Depending on
      which figure is used for the other, they fall between 1,100 and 2,100 ly
      apart, which is many times either one's size. The gap is more likely a
      disagreement between distance estimates than real space, and this file
      records both figures rather than moving one to meet the other.
