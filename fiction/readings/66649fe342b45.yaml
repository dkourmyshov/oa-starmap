    until_at: null
    where: body
    quote: "However, when a splinter group of heterodox Centauri Vehicle Buddhists under the patronage of the then-S:1 Gone/Semiote/Gone had taken the risk of attempting to settle there, they were relieved to find only a tiny contingent of sub-singularity ais, who fled in the direction of Eta Aquarii before the settlers even reached the inner system in 2031."
    note: "The settling group, heterodox Centauri Vehicle Buddhists, is not on the roster; see unplaced. Their patron, the transapient Gone/Semiote/Gone, is an individual administrator, not a polity."
