  - quote: "The triple system of Gliese 667 was observed to hold three planets orbiting the more distant component, Gliese 667 C."
    note: "Astronomical observation with no year given; precedes the 505 AT probe launch."
  - quote: "The transition between the end of the First Federation and the rise of the megacorporations was a particularly difficult one for this system... The entire system became a backwater of sorts for the next millennium."
    note: "No explicit year is given in this article for when the system left First Federation control or became isolated; the roster's First Federation dissolution year (2099) is not stated here."
  - quote: "Yall-Ull returned to the galactic stage in 3901 when it was the chosen neutral site for a conference to negotiate an end to the Conver Wars . ... Both the Ambi Limis and the Geminga Orthodoxy remembered this humanitarian effort on behalf of their citizens and retained close ties to the system."
    note: "Confirms neutral/unaffiliated status circa 3901 and later close ties with Ambi Limis and the (unrostered) Geminga Orthodoxy, but no holder change is stated."
