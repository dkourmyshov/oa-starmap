doubts:
  - "The header's 'settled 9107' repeats the Data Panel's 'Colonized 9107AT', but nothing in the body text gives that year; the body instead describes an undated Chauzor megacorp claim, an 8437 AT arrival by Prismatic Helium-3, and a 9200 AT start to Zamin's biont colonization. A reviewer should judge which (if any) of these the panel's 9107 figure is meant to reflect."
  - "IDC's founding in 10403AT ('IDC was founded in 10403AT as a joint venture... with the goal of terraforming the Cytherean world Naheed') was treated as a terraforming-project start rather than a settled event, per the brief's exclusion of terraforming milestones."
