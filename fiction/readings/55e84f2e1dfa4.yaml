    quote: "The Cyrus system was initially settled by a relativistic 'claim staking' operation from the Chauzor megacorp, an organisation which was defunct by the time the hyperturing probe Prismatic Helium-3 arrived in 8437AT."
    note: "Chauzor megacorp is not on the roster (see unplaced); its own claim-staking 'settlement' is undated. Prismatic Helium-3, also not on the roster, arrived in 8437 AT to find the claim already defunct and went on to found a vec colony -- this reads as the article's own settlement narrative, in tension with the panel's 9107 AT figure."
  - year_at: 9200
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "In 9200AT, Prismatic Helium-3's Hydrogen Republic was contacted by a biont colonial developer who expressed interest in the eoGaian world Zamin. The Hydrogen Republic accepted the request and negotiated limits on development, while positioning itself as the recognized owner of the Cyrus system. The new settlers were granted extended leases."
    note: "First biont (neb) settlement of Zamin, the system's main colony world. Hydrogen Republic is not on the roster; the biont developer is not named. Neither 9107 AT nor 8437 AT is repeated here."
