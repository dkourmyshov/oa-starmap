doubts:
  - "Header records 'settled 3800' but the text gives no AT year for the original Taurus Nexus colonization; the only period reference, 'In the 3800's', is attached instead to the later dictatorial government of the Proclag Oamnoran, not to the settlement. No settled event with a year could be written from this text."
  - "The transitions described in the text (colonized by the Taurus Nexus, then independent after the Nexus's fall, then eventually joined the Terragen Federation) are all given without AT years, so none could be recorded as dated events; only undated holder mentions are provided for the two roster polities involved. The intervening independence is not on the roster with a polity id and so is not recorded as a holder entry at all: 'After the fall of the Nexus Sinyavskaya became an independent world in the backwaters beyond the Hyades.'"
