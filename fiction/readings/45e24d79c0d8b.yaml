doubts:
  - quote: "In 2358 the Conver Ambi established an embassy on Danzig, and became increasingly important over the next millennium or so."
    note: "an embassy is a diplomatic presence, not clearly 'the system passed to a polity'; not recorded as a transferred event"
  - quote: "The Federal States opposed Conver dominance in this system but were eventually sidelined and dissolved in 2800."
    note: "describes a local non-roster polity's political dissolution (see unplaced: Federal States), not the settlement itself ending; does not map cleanly to any listed kind"
  - quote: "After the breakup of the Conver Ambi the Solar Dominion took over, while Danzig remained independent."
    note: "clear transfer language ('took over') and a claim of independence for Danzig, but no year is given in this sentence; the roster records conver-ambi as dissolved in 3943, but that is not stated in the article itself, so no year_at is asserted here"
  - quote: "A new culture known as the Rezarki emerged on this world, and remained important until the 7000s."
    note: "described as a culture, not clearly a governing polity holding the place; also a cultural period, which the brief excludes"
  - quote: "Riga joined the Solar Dominion in 5500, and Danzig formed close ties with the Terragen Federation."
    note: "recorded as a transferred event for Riga at 5500; it is unclear whether the year 5500 is also meant to date Danzig's 'close ties' with the Terragen Federation, so that clause is not separately dated"
