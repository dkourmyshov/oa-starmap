    quote: "On 10 Kepler 9871 A.T., the wandering transapient starship Eien no Gakusei (Japanese for \"Eternal Student\") broke nearly five centuries of self-imposed radio silence with the announcement e had discovered evidence of an extinct xenosophont civilization located on a moon orbiting the largest world in a very old K0IV subgiant's planetary system."
    note: "Matches the header's already-dated observed 9871. The discoverer is a single wandering transapient starship, not a polity, so polity is left blank; the description of examined cave structures could also read as a physical visit rather than a remote observation (see doubts)."
  - year_at: 33
