doubts:
  - "The 9871 entry's kind is uncertain: the header calls it observed, but the article describes examination of cave-like structures and etched rock faces in enough detail that this could instead be a visited event; recorded as observed to match the header, per the instruction to write the already-dated kind and flag any difference."
  - "The extinct xenosophont civilization HIE294PZE is not a contact (it is extinct, with 'no further evidence of tools... nor any unambiguous fossil record'), so no contact event was recorded despite the discovery of a civilization."
