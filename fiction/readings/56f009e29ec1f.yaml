doubts:
  - "The intro states \"Kulshedra is a world in the Archosaurian Empire\" but the body says of the Limburg traditionalists \"maintain a close relationship with the Archosaurian Empire , although they are not officially members\" -- worth a reviewer's eye on whether Kulshedra is actually held by the Archosaurian Empire."
  - "\"a wormhole connecting indirectly to the Archaipelago finally arrived in 8707\" -- a connectivity date, not a settlement or transfer of the system itself, so left out of events; flagged in case a reviewer reads it otherwise."
