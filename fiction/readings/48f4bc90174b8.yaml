  - "Arkab Prior A (own article; binary companion star, allocated to the Negentropy Alliance in the same 4311 colonisation)"
doubts:
  - "The 4520 occupation by Negentropist forces is a wartime military occupation, not clearly an annexation/joining/sale in the sense the brief's 'transferred' kind describes; recorded as a transferred event because it names a dated change of the controlling polity, but flagged for review."
  - "'the territory was returned to the MPA after hostilities ceased' has no explicit year in the text, so no return-to-MPA event is recorded; the system's 'Current allegiance: Mutual Progress Association' in the data panel is consistent with this undated return."
  - "'Construction of the Necklace was started in 6800 by the Mutual Progress alliance under the terms of the Prior B territory agreements' and the habitat-completion/conversion dates (7500, 8110, 8729, 9945) are construction and infrastructure milestones with no change of polity holder; not recorded as events."
