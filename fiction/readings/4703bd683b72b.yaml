doubts:
  - "The header records 'visited 679', but no sentence in the article gives that year. The closest candidate is the Jubilee arkship's arrival in 749 AT (recorded above as visited); a reviewer should check whether 679 is a typo or refers to something not found here."
  - "The circa-1000 AT 'joined the Diamond Belt' event is mapped to the roster's diamond-network, based on the article's own data panel and topic filing rather than an explicit alias -- flagged for reviewer confirmation."
  - "574 AT (news of a Solsys nano-outbreak reaching the Ako Forward Chaining) and 643 AT (the Ako Forward Chaining becoming aware of GAIA's arkships) concern information about events elsewhere reaching Procyon, not a change to Procyon's own holder, so were not recorded as events."
