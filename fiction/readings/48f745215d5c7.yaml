    quote: "a severe conflict arose in 3499 over a large chondritic world known as Ribblehead, rich in carbon and aluminium but depleted in iron. The venusian tweaks, Clade Leda and the titanian adapts, the Methanoids both claimed the planet, but the Bluesky sect muscled in and seeded it with nanobacilli and poikilotrophs"
    note: "The narrative account of the same 3499 founding as the panel entry above, naming the settling group as 'the Bluesky sect', none of Clade Leda, the Methanoids, or the Bluesky sect being on the polity roster (see unplaced). The preceding claim dispute is a conflict, not itself recorded as an event."
