doubts:
  - "When the Negentropy Alliance attempted to \"give relief\" to the system during the Version War, the inhabitants rose up with a massive level of sabotage, passive resistance and open insurrection, forcing a withdrawal. — no year given, and the attempted annexation failed, so it is not recorded as a transferred event."
  - "The same thing occurred in 9581 when he representatives of the Terragen Federation-sponsored Inner Sphere Development Alliance attempted to do something similar. — dated but again a failed intervention, not a completed transfer; \"Inner Sphere Development Alliance\" is not on the roster."
  - "in 1893AT a systemwide civil war broke out between various fractions. The war ended when a strong alliance between the Core Council and Henderson's Heroes ... succeeded in vanquishing the other fractions and impose a certain order on the system. — civil war and the CCHH's rise to local government are internal, not a change of external holder, and no exact end date is given."
