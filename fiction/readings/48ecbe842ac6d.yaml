doubts:
  - "The article states the NoCoZo 'was established' in 2215 AT (\"in 2215 a.t. the Non Coercive Zone was established\"), but the roster gives the NoCoZo's founding year as 1598 AT. This is a roster/article discrepancy rather than a same-event contradiction within the article itself, but it bears on how the 2215 AT transferred entry should be read."
  - "It is unclear who granted Eostre and the Children of Dawn 'the right to colonize' 61 Virginis in 601 AT: \"Eostre and the Children of Dawn petition for and ultimately win the right to colonize 61 Virginis.\" The article later casts doubt on whether the colonisation was even authorised: \"It is not clear whether Eostre had permission from GAIA to launch this ship.\""
  - "'Mutual Progress Alliance', as named in the article, closely resembles the roster's Mutual Progress Association (also called MPA) but is not an exact match, so it was left unplaced rather than mapped to mutual-progress-association."
