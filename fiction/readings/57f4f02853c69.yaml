other_places:
  - "Eunchong (Gliese 832) - Hamashta sent system control ships there in 1440 to help suppress a rebellion; that is an event at Eunchong, not at Hamashta."
doubts:
  - "'Refugees from the Great Expulsion from Earth departed the Solar System in 692 AT' gives a departure year from Sol, not an arrival or holder change at Hamashta, so it was not recorded as an event for this place."
  - "'On the breakup of the League, it joined the NoCoZo' gives no year for the transfer to NoCoZo, only the undated fact of it happening 'on the breakup of the League'; recorded under holder_undated rather than as a dated event."
  - "'Starting in 6509 AT, a program of building Bishop Rings was commenced' is a construction/megastructure-building programme, not a settlement or holder change, so it was excluded."
