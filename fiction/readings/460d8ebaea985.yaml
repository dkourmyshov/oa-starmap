doubts:
  - "\"When the Eridanus League was on its height, a number of NoCoZo-aligned Eridanius-native corps settled the nearby Rana system in 1699.\" -- neither \"the Eridanus League\" (context for timing) nor \"NoCoZo-aligned\" (describing the corps) is stated as the settling polity itself, so the event's polity was left empty rather than assumed."
  - "\"In 1823 ... Rana Amat collapsed, and was bought up by Dionysian interests. Ironically the Erotocracy had collapsed while the plan was being implemented, and the remnants of the corporation were split up among other powers.\" -- describes a corporate collapse and buyout (Rana Amat, Dionysian Erotocracy, both unplaced), not an explicit statement that the Rana system itself changed political hands; no event recorded."
  - "\"In 1995 the first Deep well industrial zone in the Terragen Sphere, known as Vulcan's Forge, was established in orbit around Uppsala...\" -- an infrastructure/industrial milestone inside the already-settled Rana system, not a holder change; no event recorded."
  - "\"In 6484 a new culture calling itself Vore Abergism emerged in the Rana system\" and its dissolution \"in the Completion Event 7303\" -- both describe a homegrown culture's rise and self-disbandment, not a settlement, transfer, or abandonment of Rana (which \"remains inhabited by various small cultures\" afterward); no events recorded."
  - "A related article (Rajand, 46789378a3d4e) separately describes Ran/Rana as the seat of the Eridanus League's interstellar union, but this article never states outright that Rana itself joined or was held by the Eridanus League, only that the League was contemporaneously \"on its height\" when the 1699 settlement happened."
