    where: body
    quote: "as planetary systems were mapped in the mid 1st century AT several were discovered. One of the earliest double planets discovered was Bill and Bull, named by the research team from Uppsala Astronomical Observatory that discovered them around Delta Eridani (Rana)."
    note: "Uppsala Astronomical Observatory, the discoverer, is not on the roster."
  - year_at: 1699
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "When the Eridanus League was on its height, a number of NoCoZo-aligned Eridanius-native corps settled the nearby Rana system in 1699."
    note: "The settlers are described as NoCoZo-aligned corporations native to Eridanus League territory, not as the NoCoZo or the Eridanus League itself, so polity was left empty; see doubts."
