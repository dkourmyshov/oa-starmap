    precision: exact
    until_at: null
    where: body
    quote: "In 1205 AT, with local Jovianist and Federation Genen help, the Hsien managed to organize a bloody revolt. The by now much loathed Jian Dynasty was toppled, and the Xian Dynasty instituted in its place."
    note: "Matches the header's 'transferred 1205 (penglai-empire)'. The article states the Penglai Empire itself (the merger of planetsiders, belters, and jovianists into a solar-system wide empire) formed only 'in the following centuries' after this revolt, without a specific year."
