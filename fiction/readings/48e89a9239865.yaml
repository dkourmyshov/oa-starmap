    quote: "Riding on the wave of popular support and independence following their unilateral declaration of independence, Jian Hsin (or Jian-tze as he now liked to style himself), leader of the new PCA, made the former districts of Hao Chen, Daonin, Tsi Leng and Hsu Hsi into sovereign nations, and they were formally recognized by the PCA."
