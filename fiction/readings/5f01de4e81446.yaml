doubts:
  - "Failed colonisation attempt with no usable year: \"During the early First Federation era, an attempt at colonizing Duxed was made by Intralaunch, however an unknown failure destroyed the colony ship en route.\" No numeric year_at is given, and the attempt failed (ship destroyed en route), so no event entry was written."
  - "The neumann precursor fleet's 2819 AT arrival is described as \"paving the way for\" the Duxed Union, while the main colony's own attempt is dated 1813 AT and its actual arrival year is never stated; unclear which year, if either, is the operative settlement date, and the stated travel-time arithmetic (\"five years before... arriving... after 1,006 years\") does not obviously reconcile with 1813 and 2819 together."
  - "\"The first groups to settle Duxed originated from the NoCoZo, but did not retain ties with that empire.\" The article is filed under Non-Coercive Zone (NoCoZo) in the site's own index, but this sentence explicitly disclaims an ongoing tie, so it was not recorded as holder_undated."
