doubts:
  - "'Abandoned after a devastating attack in the Version War, Goodworld has been repopulated with an entirely new culture, mostly provolved African Grey Parrots.' describes an abandonment and a resettlement, but no AT year is given for either, so no event could be recorded despite this being exactly the kind of change the brief tracks."
  - "'In 2799 Gansu Regio, an independent state of interface-free isolationists, uncovered many of the details of the mind-control system' names a dated 'independent state', but Gansu Regio reads as a sub-settlement/community within already-settled Goodworld, not a change of holder for the system itself, so it was not recorded as an event; Gansu Regio is not on the roster in any case."
  - "'The world was finally terraformed in 8991.' is a terraforming milestone, excluded per the brief."
