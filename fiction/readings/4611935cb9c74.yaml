doubts:
  - "The header's 'already dated: reported 9210' has no supporting quote anywhere in this article -- no year 9210 appears in the text. The roster independently gives Xeon's founding year as 9210, which may be the source of the map's reported date, but this article's own Xeon-related events are dated 8995 (subsumption) and by-9010 (abandonment), not 9210; flagged for a reviewer to reconcile against the Xeon article itself."
  - "Whether the 8995at subsuming of Branton's colonists 'as a biotic matrix for the Xeon blight' is properly a transferred event to the polity xeon, given the roster dates Xeon's founding five years later at itself is doubtful; recorded here as the closest fit among the tracked kinds."
