    quote: "The YTS 5072-5871740 system was an uninhabited and rather uninteresting trinary system consisting of an unimpressive red star, a white dwarf and a small brown dwarf, visited only by a few probes and interstellar tourist-explorers, before its inclusion in the Seams in 4654."
    note: "No polity is named for the probes or tourist-explorers; the visits predate the 4654 inclusion in the Seams."
