doubts:
  - quote: "When the corporations arrived, one by one, they found the system largely devoid of materials, and the stargates yet unarrived."
    note: "Describes the corporations settling Traction after its 4654 inclusion in the Seams, but no specific year is given."
  - quote: "Under the able leadership of the newly crowned Emperor of the Greyman empire."
    note: "Traction is evidently the Greyman Empire's home system (per the Imperial Line table), which would make it a capital in effect, but the article never states this explicitly."
  - quote: "REGION : The Seams, NoCoZo"
    note: "Unclear whether this means NoCoZo itself has ever held Traction, or only that the Seams (recorded separately) sits within the wider NoCoZo economic zone; recorded as holder_undated for both, undated either way."
