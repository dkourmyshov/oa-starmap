    precision: exact
    until_at: null
    where: body
    quote: "By the time the first colony ship arrived, in 7988 AT, the orbits of the planets were well known and predicted far into the future."
    note: "Matches header already-dated settled 7988. See doubts and holder_undated for the joint NoCoZo / Sophic League venture named later in the article without its own date."
  - year_at: 9526
    kind: abandoned
    polity: ""
    precision: exact
    until_at: null
