    quote: "Two small terrestrial worlds which collided in 9526 AT"
    note: "The planetary collision physically destroys both worlds, ending any habitation. See doubts for an earlier, undated evacuation (\"the two doomed planets were deserted\") that preceded a later wave of death-seeker visitors before this final impact."
holder_undated:
  - polity: nocozo
    quote: "At first Otus and Ephialtes, the S:2 level individuals in command of the joint NoCoZo / Sophic League colonisation venture, planned to simply observe this spectacular event from a distance, and exploit the vast amount of differentiated matter that would be thrown out by the collision."
  - polity: sophic-league
    quote: "At first Otus and Ephialtes, the S:2 level individuals in command of the joint NoCoZo / Sophic League colonisation venture, planned to simply observe this spectacular event from a distance, and exploit the vast amount of differentiated matter that would be thrown out by the collision."
