    kind: stewardship
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Connected first to Alpha Star in 5184 AT , the planet Blue was quickly declared a protectorate by Mallard of Blue, who announced the planet and the xenoecology thriving there was protected by the Burdikeer and not to be exploited."
    note: "Protector named is 'the Burdikeer', identified in the panel as the system's S Ethos ('Burdikeer Ethos'); not confirmed as one of the roster's Caretaker Gods, so left unplaced rather than mapped to caretaker-gods."
  - year_at: 5839
    kind: transferred
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "In 5839 AT a wormhole arrived from Traction and was opened shortly after. In the classic pattern of early Traction expansion, the system was first overrun by mercenaries."
    note: "Followed by division of the system among Traction corporations: 'a group of corps of Traction entered the system, and started to divide the territory amongst themselves, buying the newly acquired territories from the mercenaries which had secured them.' 'Traction' is not on the roster."
