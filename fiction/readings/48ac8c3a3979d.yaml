doubts:
  - quote: "Still colonists moved into the system from Alpha Star (back then called Harkington's Star), and prepared to mine the systems resources which had been ignored by the Burdikeer."
    note: "Reads as the actual settlement of Blue by colonists, but no year is given for it; it falls sometime after the 5184 AT protectorate declaration and before the 5340 AT wormhole event."
  - quote: "In 6157 AT the region had just begun to quiet down, when refugee warships from Starlift Enterprises and the Resourcelift Corporation escaped into the system from the takeover of their homes in Traction."
    note: "Refugee arrival and subsequent resistance movement against Traction rule; does not clearly state a change of holder for Blue itself, so not recorded as a transferred/independent event."
