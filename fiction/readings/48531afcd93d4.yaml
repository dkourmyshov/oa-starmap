  - "Wallace's arrival ('in 972 ... an approaching vessel', probe launched 673 AT) and departure ('in 1690, e departed the system') were not recorded as events, per the instruction that a probe or trader arriving after a place is settled (here, after 812 AT) is not itself an event."
  - "The article gives two different years for the Virginis Combine's dissolution: 'In 2512 the Virginis Combine also dissolved' and later 'when the Combine dissolved in 3932'. This concerns the Virginis Combine and other Chloris-system worlds rather than Arcadia itself, so it is not listed under contradictions, but is flagged here since it may matter to another article."
  - "\"This world had been observed remotely from Solsys, and tentatively selected as a possible target for future colonisation\" is undated and was not recorded as an observed event."
