doubts:
  - "Swift's 6935 AT arrival (see event above): the article calls it 'an older, anti-biont hyperturing with a toposophic level of S2' that 'had fled the Inner Sphere during the Conver Wars and arrived some hundreds of years earlier' than 7117 AT; whether a lone hostile AI's occupation counts as settled per the brief, and whether it should carry any roster polity, is unclear -- it is not stated to belong to Conver Ambi or any other polity."
  - "\"The first biont colonists were engenerated uploads from the NoCoZo and Cygexpa.\" This is undated (occurring 'several centuries' after 7117, once terraforming was underway) and describes the genetic/upload origin of colonists rather than a polity reaching or settling the system, so it was not recorded as an event or a holder_undated entry."
  - "10,441 AT ('personal union of major kingdoms' families') and 10,456 AT (Savannah 'legally united under the Federal Imperium of Savannah') are exact dated claims about Savannah's own government forming, but the Federal Imperium of Savannah is not on the roster, so no event was recorded for either."
