      - "868 - New World arrives at Beta Virginis"
      - "When the New World arrived at Beta Virginis in 856, they discovered that at least one, and possibly three, inner planets had been claimed by isolationist ai."
other_places:
  - "Denebola - has its own article/s (Denebola, Denebola Incident, Denebola Collapse); this article only mentions Combine amat farms seeded there in 1748."
  - "Porrima - has its own related article and a separate 'Porrima Incident' article; this article only mentions an alien artifact discovered there in 1752."
doubts:
  - note: "The map records 868 as 'visited', but the article's own data panel labels the same year 'Colonized' (a settled-type claim), a kind mismatch worth a reviewer's eye."
    quote: "Colonized 868 a.t."
  - note: "The timeline and the body text give different years for the opening of the second cycler/beamrider network; not a listed event kind, so not entered as a contradiction, but flagged here."
    quote: "7120 - second cycler network opened, connecting the system with many nearby red and brown dwarfs and several Utopia and NoCoZo worlds. / In 5120 a second cycler (beamrider) network was officially opened, connecting the system with many nearby red and brown dwarfs and several Utopia and NoCoZo worlds."
  - note: "First sightings of a resident entity (the Great Whale ISO) by locals in 2534 does not clearly fit any listed kind, since 'observed' is defined as a place being seen from afar by an outside polity, not a resident being noticed by its own inhabitants."
    quote: "2534 - first confirmed sightings of The Great Whale ISO"
  - note: "Contact between the New World colonists and the resident isolationist ai around 868 is not classified as the 'contact' kind, since the ai are not a xenosophont species."
    quote: "There was much discussion on what to do, and contact was finally established between the ship and mission ais and the locals."
  - note: "Unnamed 'outlying red dwarf systems' near Beta Virginis seceded and joined several polities during the Version War; no names are given, so they cannot be placed as separate other_places, and no year is given for the secession."
    quote: "the outlying red dwarf systems, apart from Luyten 901-10 and Ross 948, unilaterally seceded and joined the NoCoZo, Cyberia, the MPA, and Metasoft."
