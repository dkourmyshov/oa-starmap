  - year_at: 878
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "878 - first colony established on the surface, small orbitals established"
    note: "First colony (Liberty) on New America's surface, distinct from the system-arrival events above."
  - year_at: 970
    kind: reported
    polity: first-federation
    precision: exact
    until_at: null
    where: body
    quote: "In 970 the technocrats began receiving faint broadbeam radio transmissions from Sol. It seemed that life hadn't been destroyed totally, and that a new society, the \"Federation of Sophonts\" was being built."
    note: "News of the Federation's founding (933 AT per the roster) reaching Beta Virginis by radio in 970."
  - year_at: 1068
    kind: transferred
    polity: first-federation
    precision: not_later_than
    until_at: null
    where: body
    quote: "By 1068 fully four-fifths of the technorats had officially seceded. And whilst they never actually formed a single technarch-style orbital league, each habitat was a local free zone, with strong ties to other habitats and to the Federation, which they officially joined."
    note: "Only the technorat habitats (four-fifths of them) are described as seceding from the New America administration and joining the Federation; the join itself is not separately dated from the secession."
  - year_at: 1140
    kind: abandoned
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "1140 - hu-ai war; loss of New Europe"
    note: "New Europe's colony ended when the resident isolationist ai destroyed/absorbed it and the world was renamed Isoai. The isolationist ai are not a roster polity (see unplaced); never inferred as Diamond Network, which the article treats as a separate, later-visiting entity."
  - year_at: 1156
    kind: visited
    polity: first-federation
    precision: exact
    until_at: null
    where: body
    quote: "1156 - arrival of the Federation robot Survey Vessel Magellan"
    note: ""
  - year_at: 1541
    kind: independent
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "1541 - Equatorial clades capture Liberty, declare independence. NA orbital counterattack leads to the so-called Pacifica War; the NuyorkMainstream finally defeated by technorat ai intrusion programs and goo attacks. New America renamed Pacifica. Mainstream administration exiled to some small orbitals around the outer planets."
    note: "New America's prior mainstream administration was not itself a roster polity, so no 'from' polity is recorded."
  - year_at: 1590
    kind: transferred
    polity: virginis-combine
    precision: exact
    until_at: null
    where: body
    quote: "1590 - A number of Technorat habitats form the Virginan Combine"
    note: "Matches the roster's founding year (1590) for the Virginis Combine."
  - year_at: 2200
    kind: transferred
    polity: utopia-sphere
    precision: circa
    until_at: null
    where: body
    quote: "During the 2200s, as the Combine moved in the direction of the Conver Ambi, the Pacificans quietly made diplomatic connections with the NoCoZo and Utopia sphere - NoCoZo helped fund a wormhole link directly to the Arae region in exchange for some tourism, and Utopia agreed to support Pacifica."
    note: "Diplomatic support rather than full accession; the article's later, firmer 'joined the Utopia Sphere' statement carries no year at all (see holder_undated)."
  - year_at: 2500
    kind: stewardship
    polity: utopia-sphere
    precision: not_later_than
    until_at: null
    where: body
    quote: "by the 2500s if became clear that some Utopia Sphere entity had colonised the sea and taken the role of planetary protector."
    note: "Sic: the article reads 'if' for 'it'. The protector is the Great Whale ISO, attributed here only to 'a Utopia Sphere entity', not explicitly to the roster's Caretaker Gods."
  - year_at: 2512
    kind: transferred
    polity: conver-ambi
    precision: not_later_than
    until_at: null
    where: body
    quote: "by 2512 the Combine and the Conver Ambi announced a merger."
    note: "Merger of the wider Virginis Combine into Conver Ambi. The article says Pacifica itself instead joined the Utopia Sphere while 'the rest of the system' aligned with the Conver Ambi."
