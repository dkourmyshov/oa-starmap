  - polity: virginis-combine
    quote: "Beta Virginis IV, former capital of the Virginis Combine (originally New America)"
  - polity: solar-dominion
    quote: "When the dust of the Conver War had settled, the Solar Dominion found itself in control of Beta Virginis and a number of nearby systems ... Dominion regional leaders had no choice but to administer the system as a protectorate and semi-independent principality, the Betavirginia Province."
  - polity: solar-dominion
    quote: "Although the Dominion retains nominal sovereignty over the system, even the Solarian administrators acknowledge they don't really have much power over the territory, and tactfully decide to avoid humiliation by forcing a crisis."
  - polity: conver-ambi
    quote: "The rest of the system remained independent, or aligned with the Conver Ambi."
  - polity: solar-dominion
    quote: "the Beta Virginis Solarists go all the way back to the late Age of Consolidation, when the Dominion annexed the Combine, along with much of the old Conver Ambis."
