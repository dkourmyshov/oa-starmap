    quote: "It was originally suggested by the Archons of Galbydeia in 7830 to explore the possibilities of large scale spacetime engineering - instead of just opening microscopic wormholes it would rip macroscopic wormholes straight into existence, possibly revolutionizing the wormhole manufacturing business."
    note: "This sentence dates only the proposal of the Torus project by the already-resident 'Archons of Galbydeia' (not on roster; see unplaced); the article never explicitly states when Galbydeia itself was first settled. 7830 is used here to match the header's already-dated settled 7830, per rule 6, but see doubts."
