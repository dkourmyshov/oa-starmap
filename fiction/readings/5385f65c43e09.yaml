  - year_at: 3998
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "When Helen and Clytemnestra were both fully habitable in 3998 AT, Rudra withdrew to Cassandra to pursue eir own projects, leaving the nearbaselines to establish their own cultures without further interference."
    note: "Not in the header. Marks the point at which Clytemnestra itself (as opposed to Helen, settled 3189) became habitable and the Yadavist colonists established themselves there, per the following section 'The Yadavists on Clytemnestra'. No roster polity is named."
  - year_at: 4501
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "For the rest of the war the HIP 63911 system was free from conflict, but Parthene refugees from the nearby system of Atwood began to arrive in 4501 AT, and established separate colonies in orbit around the twin planets."
    note: "Not in the header. The Parthenes are a clade of refugees, not a roster polity."
  - year_at: 5400
    kind: transferred
    polity: nocozo
    precision: exact
