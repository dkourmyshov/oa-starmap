    where: body
    quote: "In 5400 AT Helen joined the NoCoZo."
    note: "Not in the header. Applies to Helen/Neli specifically; Clytemnestra/Neti separately joined the Utopia Sphere in 5541 (see next entry), so the system's two worlds carry two different polity affiliations rather than one contradicting the other."
  - year_at: 5541
