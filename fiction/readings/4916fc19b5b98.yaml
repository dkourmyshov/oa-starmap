doubts:
  - "Although Eunchong technically remained independent at first, their culture and ideology became so heavily diluted by the Eridan culture (especially the Epsilon Indi cultures) over the next few hundred years that by 1100, little traces of the original culture remained. -- no year is given for when this 'independent' status began (presumably from the 798 settlement); it is not clear this counts as its own dateable 'independent' event rather than a default starting condition."
  - "When the League eventually dissolved, a large number of the polities in this system became associate members of the Zoeific Biopolity... -- the Eridanus League's dissolution year is not stated here, and the roster also leaves eridanus-league's dissolved year blank, so none of these post-League holder changes can be dated."
