doubts:
  - "Body: 'Far from the main Conver worlds, this minor colony was overwhelmed by NoCoZo mercenary foces during the world.' (quoted verbatim, including apparent typos 'foces' and 'the world'). No year is given for this takeover; the article's own narrative places it before the Version War (which is said to begin in 4445 and reach Galrecon later), since by the time of the Version War Galrecon is already described as NoCoZo-aligned, opposite the Solar Dominion colony at Huitzilopochtli. It may refer to the separate 'Conver Wars' mentioned later in the article, but that is not stated explicitly."
