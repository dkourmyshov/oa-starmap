  - note: "The asteroid-belt colonies being 'almost deserted' as population shifted to the terraformed planet, and provolves beginning to 'trickle in' from 2940, both read as population/demographic change internal to an already-settled system rather than new dated settlement or holder events, so they were excluded per the brief. Flagging in case a reviewer weighs it differently."
