doubts:
  - "No AT year is ever given for the Negentropists' 'permanent installation' (the actual settlement of the system); only the 3702 AT detection of the radio burst carries an explicit year, so the settled-type claim was recorded only under holder_undated."
  - "The dispatch of the first microprobe swarm ('soon' after 3702) and the follow-up Negentropist probe swarm ('After The Version War') are undated beyond era references, so no separate visited entries were made for them."
  - "The claim that 'the rings were created by a migratory fleet of Solipsist panvirtuality ships which passed through the system about a thousand years before' is explicitly speculative ('far more likely') and has no anchored AT year, so it was not recorded as a dated event."
