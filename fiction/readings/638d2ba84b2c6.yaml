doubts:
  - "The header's 'already dated: visited 900' is recorded above as a settled event instead, since the c.900 AT AI colony 'made a home' on Hesperides and stayed for centuries before departing in the 1300s -- that reads closer to the brief's definition of settled than of visited."
  - "The 4176 AT Zoeific Biopolity purchase (event above) is explicitly of development rights over Canaveral and 52 of its moons, not a stated transfer of the whole Delta Leonis system; recorded as transferred but flagged for a reviewer to judge scope."
  - "\"the local civilization remained in close contact with the rest of the Federation and benefited from advances in science and technology developed elsewhere\" is undated and describes contact/benefit, not a stated holder relationship, so it was not recorded as holder_undated."
