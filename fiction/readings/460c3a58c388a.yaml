    where: body
    quote: "In 1749 AT , the Council elected to join the Eridanus League , giving them access to a wealth of information that resulted in both local renaissances and rashes of ideological conflicts, although the Council successfully prevented these conflicts from escalating and causing widespread damage."
    note: ""
  - year_at: 2657
    kind: transferred
    polity: taurus-nexus
    precision: not_earlier_than
    until_at: null
    where: body
    quote: "The system joined the Taurus Nexus at the first opportunity, taking advantage of the wormhole link between Makintairas and Rana that was first opened in 2657."
    note: "The sentence dates the wormhole's opening, not the join itself, but ties the join to it as \"the first opportunity\"."
  - year_at: 7521
    kind: visited
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "In 7521, the system was visited by the Inner Sphere Development Alliance , a Terragen Federation -backed initiative."
    note: "The visiting body is the Inner Sphere Development Alliance, described as Terragen Federation-backed rather than as the Federation itself; the system went on to decline the accompanying invitation to join the Terragen Federation, per the next sentence."
