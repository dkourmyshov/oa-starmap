doubts:
  - "\"Reached : 1699\" (panel) is not tied by the body text to any single sentence with the same year; the Lagrange Defenders' survey/sale is the likeliest match but is itself undated."
  - "\"In 6492 AT the news of the emergence of the baroque Vore Abergist culture reached Benes.\" -- this is news of a foreign culture arriving, not a ship, polity, or holder reaching Benes, so it was not recorded as an event; flagging in case a reviewer reads it otherwise."
  - "\"Much of the system, while not opposed to the ideology of the empire, nevertheless politely rejected the invitation to join the Terragen Federation in favor of remaining independent.\" -- an explicit invitation and refusal, immediately after the 7521 visit; no transferred or independent event was recorded since the system did not change hands."
  - "\"Allegiance : independent, with close ties to both Rana and the Terragen Federation.\" (panel) and the matching Current Era sentence give no year, so no event was recorded for the present-day tie to the Terragen Federation."
