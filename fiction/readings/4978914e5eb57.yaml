    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "The vessel left the Solar System in 665 AT, and arrived in 920."
    note: "Matches header already-dated settled 920. The following sentence says \"On arrival the Qin Shi Huang settled into orbit around the single terrestrial world\"; full surface habitability came only later, in 1488 (see doubts/skipped terraforming note)."
  - year_at: 986
    kind: transferred
    polity: first-federation
    precision: exact
    until_at: null
    where: body
    quote: "after exchanging messages with Penglai, Liu Huanghua joined the Federation in 986."
    note: "Matches header already-dated transferred 986 (first-federation)."
  - year_at: 1120
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "firstly from Penglai and in 1120 a small fleet of vessels from Solsys belonging to the SecureSpace megacorp arrived to assist in the development of the system."
    note: "SecureSpace is a megacorp, not on the roster (see unplaced); \"For three hundred more years SecureSpace and the Sulphur Blossom colonists worked to improve their world\" indicates they stayed rather than merely visiting."
  - year_at: 1683
    kind: transferred
    polity: penglai-empire
    precision: exact
    until_at: null
    where: body
    quote: "In 1683 the Penglai Evolution movement reached Sulphur Blossom, causing the ruling Federation faction to collapse."
    note: "Matches header already-dated transferred 1683 (penglai-empire), and \"Penglai Evolution\" is a listed alias for penglai-empire on the roster. But see contradictions/doubts: the same sentence-group says SecureSpace (a megacorp) actually took over local government and the world then looked to NoCoZo for leadership, not that it was administered by the Penglai Empire as such."
  - year_at: 2000
    kind: independent
    polity: ""
    precision: not_later_than
    until_at: null
    where: body
    quote: "and by 2000 the world broke away from both the Penglai Empire and the SecureSpace interstellar hegemony. Sulphur Blossom now became an independent world, and formally changed its name to the more clement Huanghua (Yellow Flower)."
    note: "Matches header already-dated independent 2000, but the article's own wording is \"by 2000\" (not_later_than), not an exact year. See contradictions."
