    note: "971 is the date the invitation (a message) arrived, not a physical visit or holder change on its own; 986 is recorded above as the transferred event."
  - quote: "Huanghua was occupied by the Solar Dominion during the Version War, and has retained some ties with that empire ever since"
    note: "No explicit AT year is given for the Version War occupation, so it is recorded under holder_undated rather than as a dated event."
