    quote: "the infection was eradicated when Metasoft caused the self-destruction of all infrastructure, mindstates and data in this system"
    note: "This sentence carries no year of its own; 10348 is taken from the preceding sentence ('infiltrated ... in 10348 AT'), since the destruction is described as following rapidly. Matches the header's 'abandoned 10348'."
