doubts:
  - "Whether the 6303at TRHN affiliation counts as a 'transferred' event given it is described as a 'loose affiliation' rather than annexation or membership; the intro calls Quint only 'loosely affiliated' with TRHN, never a TRHN system outright."
  - "The 5089at settlement was by an unnamed 'broad alliance of modosophont groups', not a polity, so polity is left blank rather than mapped onto Technorapture Hypernation, which did not yet have a relationship with Quint at that date."
