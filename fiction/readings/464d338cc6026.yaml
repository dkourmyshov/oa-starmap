doubts:
  - "'Contact was lost with this system in 6580 AT' is a clearly dated turning point but does not obviously fit any of the tracked kinds (it is not stated as the system seceding, joining another polity, or being abandoned -- only that contact ended); no event was recorded for it, but a reviewer may want to capture it, perhaps as independent or abandoned depending on how the map wants to treat the 3300-year isolation."
  - "The STC/Skiiws'nnii relationship (holder_undated above) describes 'the Gammergan culture ... established as a swarm reservation' and locals 'joined the STC Exploration corps' -- this is a looser cultural/administrative tie than outright sovereignty, and carries no year."
