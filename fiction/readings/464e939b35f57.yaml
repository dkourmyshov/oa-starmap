doubts:
  - "The roster gives the Disarchy's founding year as 4700, but this article states the system 'declared itself the Disarchy Alliance in 6304'. Not recorded as an in-article contradiction since the two figures come from different sources (roster vs. article), but flagged for the reviewer."
  - "The vignette (dated 6252 AT) is in-universe barroom dialogue from an unreliable, self-admittedly conspiracy-minded speaker ('Gatteo Truthsayer') claiming local factions 'have been Negentropist-aligned for centuries' and that orbitals are 'joining the NoCoZo'. Not recorded as a fact-bearing event because it is presented as speculation/rumour within the fiction, not narrated as established history."
  - "No explicit year is given for when Gillbank itself became the Disarchy's capital, as distinct from the system joining/declaring the Disarchy in 6304; the capital claims are therefore left undated."
