    precision: not_earlier_than
    until_at: null
    where: body
    quote: "A number of Backgrounder factions started arriving in the 3950s, followed by several ships sent by the Silicon Generation from the (then) fringes of the Terragen Sphere."
    note: "'Followed by' implies after the 3950s Backgrounder arrivals; no exact year is given for the Silicon Generation ships."
