    where: body
    quote: "However the news of the dissolution of the Taurus Nexus did not reach Rigel until fifty years later, transmitted by comm-laser from the outermost extent of the then-current wormhole nexus."
    note: "Year computed as fifty years after the 3808 AT arrival named in the preceding sentence."
  - year_at: 3950
