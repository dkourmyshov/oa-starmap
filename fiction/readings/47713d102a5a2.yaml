other_places:
  - "beta 555D - colonised by Panvirtual Solipsists (solipsist-panvirtuality) in 7131 AT; explicitly not gravitationally bound to the Rigel group, described as a separate star"
doubts:
  - quote: "An early mission to Rigel set off in 1709, launched by K4H on behalf of the Federation of Sophonts, but this very-long-duration mission would not arrive until 4231 AT."
    note: "The First Federation (roster alias 'Federation of Sophonts') had already dissolved (2099 AT per roster) by the 4231 AT arrival; not inferring continued First Federation authority at arrival."
  - quote: "The ex-Taurus Nexus faction remained independent, but formed increasingly close links with Metasoft and with the Terragan Federation, which had absorbed many of the old Taurus colonies by this time."
    note: "No specific year given for this 'remained independent' status; unclear whether it deserves its own dated 'independent' entry."
  - quote: "When the Orion Federation emerged in the post CompEmp era the Rigel system did not become part of it but remained loyal to Metasoft."
    note: "No explicit AT year given for the Orion Federation's emergence at Rigel (Orion Federation founded 4600 AT per roster); this only confirms Metasoft's continued hold, not logged as a new dated event."
