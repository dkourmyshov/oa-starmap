title: "Bethsyngaria, Republic of"
events:
  - year_at: 3104
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "The Republic of Bethsyngaria was founded in 3104 A.T. by a group within the Non-Coercive Zone who wished to found a society that cared more for the welfare of its citizens than was usual in the individualistic, self reliant ethos of the NoCoZo."
    note: "Matches the header's already-dated settled 3104. The Republic of Bethsyngaria is not on the roster; see unplaced. The founders originated within the NoCoZo but explicitly set out to found a separate society; nocozo was not attached as the settling polity, see doubts."
  - year_at: 6500
    kind: abandoned
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "By 6500 A.T. the innumerable habitats of the Republic had been reduced to iron-rich dust. A very few survivors were rescued, but the Republic of Bethsyngaria, now nothing but an object lesson in unrestrained growth, was gone, less than three and a half thousand years after its was founded."
    note: "The Republic destroyed itself in a civil war triggered by unchecked population growth; a very few survivors were rescued but the polity itself ended."
