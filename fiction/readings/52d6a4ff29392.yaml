doubts:
  - "The article is filed under NoCoZo, but its own prose describes the Republic of Bethsyngaria as a distinct, self-governing polity founded by emigrants from the NoCoZo, never reincorporated into it; no sentence asserts NoCoZo held or governed the Republic's system(s) at any date, so nocozo was not attached to the settled event."
  - "The founding narrative ('a group within the Non-Coercive Zone who wished to found a society') carries some overtones of a breakaway/secession, but since it is the founding of a brand-new colony in an 'otherwise unclaimed and uninhabited fringe system' rather than an existing settled system leaving a polity, it was classified as settled rather than independent."
  - "Numerous further dated population figures (3600, 4100, 4600, 5100, 5600, 6100 AT) and undated territorial expansion/contraction (colonising two systems within a century of founding; invading and later losing neighbouring systems; civil war noted by wormhole archai in 6133 AT) were excluded as population figures, terraforming/dismantlement milestones, or battles per the brief, and because no neighbouring system is named or tied to a roster polity."
