other_places:
  - "Ran, described as \"the thriving, sprawling civilization\" and seat of the Eridanus League's interstellar union and later of a League system control ship; appears to have its own article and is not described in enough depth here to extract its own events."
doubts:
  - "\"In 1531, the Eridanus League finally returned; a colony ship from Ran arriving and establishing a small League aioid outpost at Rajand-Dok Saj L2.\" -- dated, but read as a sub-settlement (a small outpost) within an already-settled system rather than a change of the system's holder, so no event was recorded; flagging since it does mark a League return."
  - "\"Shortly after the fall of the First Federation, a number of Genen groups from the outer Alsafi system began migrating to the star.\" -- no explicit year, and describes a sub-settlement (the Juhon Tan) within the already-settled system, so no event was recorded."
  - "The header files this article under Zoeific Biopolity, but the prose body never names the Zoeific Biopolity explicitly, so no quote could be found to support a holder entry for it."
  - "The 1013 date on the Federation-of-Sophonts transferred event is carried over from the control ship's arrival date in the preceding clause, not stated for the join itself; a reviewer may prefer to treat the join as undated."
