    precision: not_earlier_than
    until_at: null
    where: body
    quote: "Ultimately the survivors chose to join the Federation of Sophonts instead, and the system control ship, after assisting with minimum restoration of system infrastructure, amicably departed."
    note: "\"Federation of Sophonts\" is a roster also-name for the First Federation. No year is stated for the join itself; 1013 is carried over from the control ship's arrival in the same episode (\"a League system control ship finally arrived in 1013\")."
