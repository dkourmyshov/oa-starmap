    quote: "A scientific probe affiliated with the Gengineer Republic was launched towards Lalande 21185 (which the Genetekkers called Rajand) in 405."
    note: "405 is the launch year, not a stated arrival year; the probe (whose home, the Gengineer Republic, is not on the roster) is described as discovering conditions there, so it did reach the system, just at an unstated later date."
