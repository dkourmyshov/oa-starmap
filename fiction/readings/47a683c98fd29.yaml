other_places:
  - "Dante — a different tidally-locked world with cultural ties to Twilight, with its own related article; quotes: \"As on Dante and other such worlds the conditions at the east and west poles are most favourable for precipitation...\" and \"Twilight maintains close ties with Dante, and many of the original Eridanus League worlds.\""
  - "Keid (40 Eridani) — the star itself has a separate related article, similar to how Darwin's star Aristotle has its own article."
doubts:
  - "Another article (MyuvYin, id 4a08dca7bbc9c) states \"managed to defend the system of Twilight from subjugation in 1480 AT\" during the MyuvYin Psychophager wars, but this event is not mentioned anywhere in Twilight's own article. Flagged for reviewer as a possible cross-article gap."
  - "The header records both \"settled 789\" and \"visited 789\" for what appears to be a single sentence in the text; both are written above, but it is unclear why both kinds apply."
  - "The 810 AT joining of the Eridanus League as a \"founding partner\" sits against the roster's own founding year of 770 AT for the Eridanus League; not a same-article contradiction, but worth a reviewer's eye."
  - "The 890 AT and 1100 AT arrivals may be sub-settlements within an already-settled system (settled 789) rather than genuine new events; included per the brief's exhaustiveness instruction, flagged here for reviewer judgement."
