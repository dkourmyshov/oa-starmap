doubts:
  - "Header records already-dated settled 4556, but no settlement date or settling polity appears anywhere in this short article. The only year present, 4556, marks when Landau was ATTACKED in the Version War and STOPPED being the Metasoft's modosophont-level capital ('was a modosophont-level capital of the Metasoft until 4556 ... the role was then reassigned to NewRoot') -- the opposite sense of the 'capital' kind (becoming a capital), and not a settlement at all. Left out of events rather than forced into a kind that would misstate it; a reviewer should check whether 4556 was meant to record the loss of capital status (no matching kind exists for that) rather than settlement."
