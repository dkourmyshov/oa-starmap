doubts:
  - "The header's 'already dated: ... transferred 10600' has no supporting quote anywhere in the article -- no year 10600 appears in the text at all. The only holder change described (Biovirate to Keter Dominion, 'following the Keterist-Biovirate war') carries no year, and given the roster shows Biovirate dissolved in 6210, a transfer at 10600 (after Biovirate's dissolution, and after the 10457 biowar incident mentioned in-text) seems chronologically hard to square with the article as written. Flagged for a reviewer to check the source page directly."
  - "The Biovirate becoming capital 'in the centuries following that conflict [the Version War]' and the Keter Dominion conquest are both undated in-article; if the Version War's real-world AT dates are known independently, a reviewer could convert these to precise/circa events."
  - "Whether 'Clade Polaris-Mutango II Cygexpas' implies an actual Cygexpa polity presence (beyond the explicitly named 'local Cygexpa fleet space arm', which is recorded above) is left to the reviewer, per the rule against mapping clades onto polities by name resemblance."
