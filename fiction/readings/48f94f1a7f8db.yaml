  - year_at: 1599
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "In 1599 AT a Novamedia/Birnam Ecotech-sponsored ship arrived bringing the Bluesky sect , a life-extended group of NeoBuddhist ecotechnicians who developed Secharia with artificially-lit bluesky harddomes to recreate Earthlike conditions, then established the first successful Bluesky Worldhouses on Hiresia and Dreir."
    note: "Header already records this as \"visited 1599\", but the sentence describes the Bluesky sect arriving, developing Secharia, and establishing permanent Worldhouses on Hiresia and Dreir, which reads as a settlement rather than a visit; reclassified here as settled and flagged for reviewer. \"Novamedia/Birnam Ecotech\" is not on the roster; see unplaced."
