other_places:
  - "Dorannok / Dorangloon (Gliese 877, GL 877) — the Doran clade's first colony, with its own related article \"Dorangloon (Gliese 877)\"; quotes: \"One of these factions, the cyber-tweak Doran clade , set off from Solsys in an amat-fusion hybrid ship from Toutatis asteroid in 629 AT, and first set up a colony at Dorannok (GL 877).\" and \"The last remnants including Dorannok (GL 877) entered the Terragen Federation in 5855.\""
  - "Glim (HD 223889) — listed as a related article; not otherwise described in this text."
  - "p Eridani — a neighbouring system Secharia made contact and trade with; quote: \"Secharia made contact with nearby p Eridani in 1307 AT, and soon trading vessels were carrying genetic material, hi-tech components and computronium, and also large numbers of colonists, between the two systems.\""
doubts:
  - "\"Secharia made contact with nearby p Eridani in 1307 AT\" is not recorded as an event: p Eridani is not a xenosophont species, and no change of Sesharia's own holder is stated."
  - "\"Over the next two thousand years, the Doran empire was in conflict with the Hildago Emergent Order , Tahmehtian Crusaders and the Conver Ambi in the First and Second Consolidation wars, and fragmented, as did the Eridanus league, variously joining the NoCoZo or the Solar Dominion.\" This has no explicit year and is not specifically tied to Sesharia, so it was not recorded as a dated event here; it may be the unstated source of the panel's undated \"Currently NoCoZo\" affiliation."
