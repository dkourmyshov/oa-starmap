    quote: "Explorers from Metasoft first reached Dilmun in 5390 AT."
    note: "Matches header's 'settled 5390' and the data panel's 'Colonised: 5390 AT'. The sentence itself says 'first reached'; the world was not fully populated on its terraformed surface until the unveiling of 5740 AT (see doubts)."
