doubts:
  - "'the terraforming commission for the planet was eventually accepted by Mumlan Terrainvestment in 1457 AT' is a business/commission decision, not an arrival, settlement, or holder change, so it was not recorded as an event of any listed kind."
  - "'the ecopoesis project concluded in 2538 AT' is a terraforming milestone, explicitly excluded by the brief."
  - "'the colonists ... who had arrived at the system long before the completion of the ecopoesis project' implies an actual settlement predating 2538 AT, but no year is given for that arrival, so no settled event could be recorded."
  - "'the names of the planets in this system were chosen by a public vote ... in 376' and 'Undecember was named later, during the First Federation era' are naming events, not colonisation or holder events, and the year 376 is not clearly marked AT (it is discussed in the context of the pre-Tranquility Gregorian calendar), so neither was recorded."
