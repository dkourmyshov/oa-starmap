doubts:
  - "The Communion of Worlds' mediating arrival (written above as not_later_than 7000) is bounded in the text only by the 6800 AT Nabla Biowars arrival and the 'By 7000' syncretic-culture line; no exact year is stated, so a reviewer may prefer a different precision or year."
  - "The article gives two different dates for the creation of the Tumbling Skulls: the History section says 'In 9400, Menexene uploads... led to the creation of the Tumbling Skulls', while the Tumbling Skulls section says they are 'dating from 9600 when a group of Plasma Menexenes put forward a proposal for the first one.' Construction of a named structure is not a tracked event kind, so neither was written as an event, but the discrepancy is flagged here for a reviewer."
  - "Numerous later dates (6800, 7620, 7650-7800, 7800, 8000, 8400, 9100, 9600, 9900s, 10300) describe sub-settlements, megastructure construction, or cultural shifts within the already-settled system, and were excluded as not being tracked event kinds."
