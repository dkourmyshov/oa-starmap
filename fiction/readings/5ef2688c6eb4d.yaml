doubts:
  - "\"Explored 6511 AT by United Stars , a subsidiary of the Cygnus Expansion Association ( Cygexpa ).\" -- United Stars is named as the actor and is not on the roster; Cygexpa is only named as the parent body it is a subsidiary/client of, so the entry leaves polity empty rather than crediting Cygexpa directly, per the rule that a ship \"from\" a polity does not by itself count as that polity reaching the place."
  - "\"Tengri itself became the new regional capital of the so-called Tengri Plexus, and over time the rest of the damaged ships were repaired or reconstructed and began to trade between the new systems.\" -- no explicit year is given (only \"over the next hundred years\" relative to earlier undated action), and the Tengri Plexus is not a polity on the roster, so no capital event was recorded."
