doubts:
  - "Whether the 1307 AT discovery of the 993 AT hyperturing waystation counts as its own 'reported' entry, or is better read as mere colour on the 993 AT visited event, is not settled here; both readings are defensible under the brief."
  - "The 646 AT departure of the Guardia from Earth orbit is a dated claim but concerns Earth/Sol, not New Brooklyn, so it was not written as an event of this place."
  - "Elysimus (2507 AT secession, 3423 AT reconquest, 3533 AT independence/union with NoCoZo) and Boulder (2617 AT secession) carry their own dated history but are a different place from New Brooklyn; their dates were left out of events and only flagged under other_places."
