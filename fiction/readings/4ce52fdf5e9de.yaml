doubts:
  - "Header records already-dated 'settled 385-405', but this article's body text (data-panel plus prose) never restates a settlement year for the Proxima system itself; the dated history appears to live in the separate 'History of the Proxima System' article, out of scope here. No event could be written to confirm or contradict the header."
  - "Records found at Vinci make mentions of an Exa Energy project to Proxima Centauri, apparently to construct habitats for humans. No such probe could be found either within the Proxima system or in the interstellar space beyond, and neither the Nauri nor the Great Circle colonists report a foreign probe of the sort. -- explicitly an unconfirmed/refuted claim, not recorded as an event."
