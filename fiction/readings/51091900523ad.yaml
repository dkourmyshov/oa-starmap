doubts:
  - "\"In the second tenday of 6802 AT the HIGEX-23 (High Inclination Galactic EXplorer) probe was launched from a spacetime catapult located in the outer reaches of the Apogee Maximal system.\" This is the launch date of the parent probe from a different system (Apogee Maximal). The sub-probe (HIGEX-23b) sent to survey this binary system launched later ('a decade after the neutron star probe') and no year is given in the text for its arrival here or for contact with the Samaelians, although the header records 'contact 6802'. No usable dated claim about this place was found."
