doubts:
  - quote: "312 million standard years BT / 16 million years BT / 1.2 million years ago"
    note: "These pre-Terragen events are recorded with polity 'xenosophont', the roster's generic id, since none of the Tkzeph, the Black Acropolis Civilisation, or the Ultimates' creators are individually on the roster. Reviewer should confirm this generic use is wanted."
  - quote: "The Black Acropolis, 1530 ly from Sol in Ophiuchus, was detected in the Interplanetary Age by telescopic observation"
    note: "No explicit year is given (only the era name 'Interplanetary Age'), so no event was recorded for this observation."
  - quote: "5768 - The Gerkletoss system is connected to the Wormhole Nexus."
    note: "This later reference to 'the Gerkletoss system' suggests Gerkletoss may be a separate star system rather than simply the local Black Acropolis civilisation formed in the 4900s; if so, the 4900s 'transferred' entry may still belong here (it describes the population within Black Acropolis) but its later history from 4937 onward belongs to that other place and was not recorded."
