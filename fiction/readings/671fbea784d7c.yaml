    quote: "This mission, crewed by an ahuman group, reached the system in 465, five years before the Solipsist League ship."
    note: "Header records this as 'visited 465'; the prose goes on to describe this ahuman group taking BL Ceti and building an industrial base there, which reads closer to 'settled'. The ahuman group is never given a proper name, so no polity is recorded."
