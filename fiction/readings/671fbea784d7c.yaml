doubts:
  - "The Solipsist League ship's arrival is only given relative to the ahumans' ('five years before' the 465 AT arrival, i.e. implying circa 470 AT); no explicit AT year is stated for it in the prose, so no separate dated entry was made for that arrival."
  - "'On 7 Copernicus 517 (local time)' names a local calendar, not an AT year, and describes a battle (a flare and subsequent assault), which the brief excludes as an event kind; it was not recorded."
