doubts:
  - "Eventually the Panvirts responded, in 5441 AT; Tuerge gradually built up a dialogue with the entities inside the massive swarm, until at last ve was invited to enter the a-humans' cybercosm. -- reads like a first sustained contact between the Alfirk C human colony and the Solipsist Panvirtuality swarm, but the brief's `contact` kind is defined as first contact with a resident xenosophont species, and the Panvirts are posthuman aioids rather than a xenosophont species, so no event was recorded for it."
  - "No AT year is given anywhere for the founding of the human-derived colony at Alfirk C itself, only that Panvirt non-contact with it lasted 'more than a millennium'."
