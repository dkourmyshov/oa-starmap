doubts:
  - "'Reached: Approximately 500 AT by ahumans' is a panel field literally named 'Reached'; it was classed as settled (not visited) because the article frames the whole site as a former colony, but a reviewer may prefer 'visited' for the initial arrival distinct from the manufacturing programme that followed roughly fifty years later."
  - "'An ahuman colony ship departed from the Solar System towards this star in 327 AT' is a departure date from the Solar System, not an arrival or holder change at Ithiplumo, so it was not recorded as an event here."
  - "The 1027 AT dates for the abandoned and visited entries are computed from '327 AT' plus 'over seven hundred years later' rather than stated outright as a single number; flagging for review in case a different reading of 'over seven hundred years later' is intended."
