    quote: "Reached: Approximately 500 AT by ahumans."
    note: "The panel field is literally labelled 'Reached', but the body text describes a manufacturing programme starting around fifty years later and the article calls this an 'Abandoned Diamond Belt aioid colony', so this was classed as settled rather than visited. Ahumans are not a polity on the roster."
  - year_at: 987
    kind: observed
    polity: first-federation
    precision: exact
    until_at: null
    where: body
    quote: "Ithiplumo was named in honor of Ithiplumo Team, the early Federation researcher team who first described the ahuman structures found across the system via the Uranian System Interferometry (SYY) in 987 AT."
    note: "Description via interferometry from the Uranian system reads as remote observation, not physical arrival."
  - year_at: 1027
    kind: abandoned
    polity: ""
    precision: not_later_than
    until_at: null
    where: body
    quote: "Structures of unknown function were constructed, but these had been abandoned long before First Federation explorers reached this system over seven hundred years later."
    note: "1027 AT is derived from the colony ship's 327 AT departure plus the stated 'over seven hundred years later' when First Federation explorers reached the system; the abandonment is stated to have happened before that."
