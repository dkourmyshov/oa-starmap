doubts:
  - quote: "Colonized 370AT (arrival of first robotic probe) 597AT (arrival of first colonists)"
    note: "Header says 'already dated: settled 370', and the panel labels this whole line 'Colonized', but the clause itself attributes 370 AT to a robotic probe only; actual colonist arrival is separately dated 597 AT in the same panel line. Recorded 370 as visited and 597 as settled; a reviewer may prefer to treat 370 as the recorded settlement date to match the header."
  - quote: "it was quickly contacted by the First Federation in 945 AT"
    note: "Classified as 'visited' since the First Federation is not a xenosophont species (so 'contact' does not apply) and the Consortium declined to join (so 'transferred' does not apply)."
  - quote: "it successfully attacked it with several guided tungsten munitions in 373AT"
    note: "This date (373 AT) for the security probe's attack appears to be a typo in the source: the security probe itself was launched in 409 AT and arrived in 492 AT, so an attack 'a year' later should read 493 AT, not 373 AT. Not recorded as an event since battles are excluded regardless."
