doubts:
  - "The article gives two further dated construction milestones that were not written as events because they read as terraforming/construction milestones rather than a change of holder or population: quote \"In 6797 the original system was completely dismantled, and with the raw materials staged, construction began on the actual habitat complex.\"; quote \"These operations, including construction, ecology development and population integration were complete by 9173.\" The reviewer may want to weigh these against the header's 4772/4773 'settled' dates, since actual habitation of Evermore's cylinders seems to postdate both by a wide margin (cylinder population, per the 'Populating the Complex' section, took 'just over two millennia' to complete, with no stated start year)."
  - "The article's opening paragraph describes Evermore as blending Negentropy Alliance, NoCoZo and Caretaker characteristics, and the site files it under all three topics, but no sentence states that the Negentropy Alliance ever held or governed the system (only that it lies near the Alliance's border), so no Negentropy Alliance entry was written: quote \"Evermore is a blend of the Negentropy, NoCoZo and Caretaker characteristics found in its creator, the collective archailect known as The Twelve.\""
