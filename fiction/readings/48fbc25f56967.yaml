    quote: "In 4772 a.t, following the Version War, The Twelve acquired full development rights to the uninhabited Altus Lucror planetary system — located at the edge of NoCoZo space along the Negentropy Alliance border."
    note: "Matches header's settled 4772. Polity caretaker-gods is inferred only from the article's own 'Appears in Topics: Caretaker Gods' filing and its description of The Twelve as 'the collective archailect' who built Evermore, not from wording in this sentence itself, which names no roster polity. The wording ('acquired full development rights', a system 'sold to' a polity) may fit the 'transferred' kind at least as well as 'settled', since the system was uninhabited at the time; recorded as settled to match the header, but flagged for the reviewer."
