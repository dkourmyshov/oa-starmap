doubts:
  - "The Version War holder changes (seized by Solar Dominion, 'liberated' by a Cyberian-Metasoft fleet, granted to the Solarists) carry no explicit AT year in the text, so they are recorded under holder_undated rather than as dated events."
  - "\"The planet was declared habitable in 2706, more than eighty years before schedule\" is a terraforming milestone, not a settlement event, per the brief; the colony (Shakti, 1790) is treated as already established by that point."
  - "The separatist movement of 5880 was 'possibly backed by the Solipsist Panvirtuality' (on the roster), but this is not stated as the Panvirtuality holding the system, so no holder entry is made for it."
