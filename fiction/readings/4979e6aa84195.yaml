contradictions: []
other_places:
  - "Zamzam: a related-article footnote calls it 'Capital of the Shell, the outer part of the Stellar Umma' -- a different place with its own article."
  - "Yathrib and Jeddah are named as the other two systems settled alongside Medina in the same hejira, each presumably with its own article."
doubts:
  - "The 8890at Absurdist attack on Medina and Medina's retaliation against Khartoum are a war, not a change of holder, and were excluded per the brief; the eventual expulsion of most Merdre from the system has no explicit year attached ('eventually'), so no abandoned event was written for it."
  - "Whether the circa-1600 'seventeenth century a.t.' migration entry is redundant with the exact-1639 entries for the same colonisation, or describes a distinct earlier/later phase, is left for the reviewer."
