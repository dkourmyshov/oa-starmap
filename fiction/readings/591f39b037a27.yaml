    quote: "The next big change came in 5453, when, after a period of negotiation with the current inhabitants, a siblinghood of young Amphisapien colonists from the Zoeific Biopolity arrived in system."
    note: "Not in the header. A second wave of colonists, explicitly said to be 'from the Zoeific Biopolity', who stayed and founded a lasting new culture ('For the next centuries a new culture blossomed'); recorded as settled rather than visited on that basis. Consistent with the data panel's undated 'Allegiance Zoefic Biopolity'."
