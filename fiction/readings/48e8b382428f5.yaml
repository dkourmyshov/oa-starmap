doubts:
  - "Sonata (Corona's moon) is said to have 'gone independent shortly before the declaration of the war' (the Taurus Nexus civil war, c. 3396), but no year is given for its independence: quote \"Meanwhile, Sonata, Corona's moon, went independent shortly before the declaration of the war, and as a result it managed to completely avoid the assaults.\""
  - "New Eureka's 1646 decision to join the Corona polity was treated as a sub-settlement (New Eureka joining an already-settled Corona system), not an event of Corona's own holder, and so was not written as an event; flagged in case the reviewer disagrees: quote \"In 1646, the New Eureka polity made a decision to join the Corona polity.\""
  - "The 6035 merger that formed the 'Planetary State of Corona' (Corona's own current government) was not written as an event: no roster polity is involved and it reads as a local government reorganisation rather than a change of holder: quote \"the various polities under the United Corona Organization, after millennia of working together, voted to merge and form the current government, the Planetary State of Corona, in 6035, celebrating 2,000 local years of the founding of the Coronese civilization.\""
  - "Several dated regional/provincial capital successions within Corona (e.g. Heisenberg [1792-] for Quark, Freemanberg [1806-3396] and Celsiusen [3398-] for Baryon, Aktera [1811-7327] and Eureka [7327-] for Glara, and the Planck/Fermi/Bose province capitals) were treated as sub-planetary administrative detail and not written as events."
  - "The article's own header files Corona under the Non-Coercive Zone (NoCoZo) topic, but the body's Current Era description places it under the Iota Network's protection instead (transferred 4609); the reviewer may want to check whether the site's filing is simply legacy/historical categorisation."
