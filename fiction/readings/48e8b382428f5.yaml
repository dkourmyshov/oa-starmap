contradictions:
  - about: "Whether the Taurus Nexus period over Corona ended in 3263, or in 3396/3435 as the History section and its own table give"
    quotes:
      - "leading in turn to Corona rising to become the capital of the Taurus Nexus before its fall in 3263"
      - "2450-3435: Taurus Nexus period"
      - "Corona quietly joined the NoCoZo in 3435, bringing few other inner Taurus Nexus worlds and systems with it."
  - about: "Whether Delphi became Corona's capital in 1829 or 1843"
    quotes:
      - "Delphi (founded 1794) [1829-3396] - The third capital of Corona during the Republic period and the Taurus Nexus period located in southwestern Quark."
      - "The planet's capital was once again moved, this time from Heisenberg to Delphi in 1843."
