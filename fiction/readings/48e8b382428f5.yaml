article: 48e8b382428f5
title: "Corona (Iota Piscium d)"
events:
  - year_at: 58
    kind: observed
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Corona's discovery was announced along with the two other terrestrial planets in the system in 58 AT (2027 CE)."
    note: ""
  - year_at: 71
    kind: observed
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "However, in 71 AT (2040 AT), to people's disappointment, the planet's atmosphere was found to be dominated by nitrogen and carbon dioxide."
    note: "The text's own parenthetical year label is inconsistent (2040 AT rather than a c.e. year), quoted as written."
  - year_at: 95
    kind: observed
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "The blue auroral glow was observed in 95 AT (2064 AT), the first time an aurora is detected on a terrestrial extrasolar planet."
    note: "As above, the parenthetical is 'AT' rather than a c.e. year in the source text."
  - year_at: 1465
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "When Jupiter Transystems arrived at Iota Piscium in 1465, they claimed the entire system, but focused most of their exploration, colonisation and development efforts on the two outer planets, Hera and Hestia."
    note: "Matches the header's settled 1465. Jupiter Transystems is not on the polity roster."
  - year_at: 1471
    kind: transferred
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Corona was sold along with Eva to the newly arrived Piscium Development in 1471."
    note: "Piscium Development is not on the polity roster."
  - year_at: 1486
    kind: capital
    polity: ""
    precision: exact
    until_at: 1547
    where: body
    quote: "A rotating habitat was assembled around it as the spacecraft-turned-habitat was made capital of Corona, in 1486."
    note: "Capital of Corona's own local government (Piscium Development), not of a roster polity. Consistent with the Notable Locations entry 'Duorkin [1486-1547]'."
  - year_at: 1547
    kind: capital
    polity: ""
    precision: exact
    until_at: 1829
    where: body
    quote: "In 1547, the capital was moved from the Duorkin complex down to Heisenberg."
    note: "Local capital, not a roster polity. Matches Notable Locations 'Heisenberg [1547-1829]'."
  - year_at: 1829
    kind: capital
    polity: ""
    precision: exact
    until_at: 3396
    where: body
    quote: "Delphi (founded 1794) [1829-3396] - The third capital of Corona during the Republic period and the Taurus Nexus period located in southwestern Quark."
    note: "Local capital, not a roster polity. Conflicts with the body narrative's 1843 date for the same move; see contradictions."
  - year_at: 1843
    kind: capital
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "The planet's capital was once again moved, this time from Heisenberg to Delphi in 1843."
    note: "Conflicts with the Notable Locations bracket '[1829-3396]' for Delphi; see contradictions."
  - year_at: 3263
    kind: transferred
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Although not part of the original ahuman-built wormhole network, Iota was close enough to both the burgeoning Taurus Nexus and the First Federation to be wormhole-linked to both; leading in turn to Corona rising to become the capital of the Taurus Nexus before its fall in 3263."
    note: "The intro's own date for the Taurus Nexus's fall conflicts with the article's History table (Taurus Nexus period given as 2450-3435) and with the 3396/3435 dates given in the body; see contradictions. No successor polity is named in this clause, so polity is left blank."
  - year_at: 2450
    kind: capital
    polity: taurus-nexus
    precision: exact
    until_at: 3435
    where: body
    quote: "The government of the Taurus Nexus eventually relocated from Xi Geminorum to Corona in 2450, supplanted the Corona Republic, and established itself in a large orbital habitat at Corona-Sonata L4, dubbed New Geminorum."
    note: "Matches header's capital 2450 (taurus-nexus). Corroborated by Notable Locations 'New Geminorum [2450-3396]'."
  - year_at: 3435
    kind: transferred
    polity: nocozo
    precision: exact
    until_at: null
    where: body
    quote: "Corona quietly joined the NoCoZo in 3435, bringing few other inner Taurus Nexus worlds and systems with it."
    note: "Matches header's transferred 3435 (nocozo)."
  - year_at: 3435
    kind: transferred
    polity: nocozo
    precision: exact
    until_at: null
    where: body
    quote: "With the end of the First Consolidation War in 3435, Corona became a member of the Non-Coersive Zone."
    note: "Second, corroborating statement of the same 3435 NoCoZo transfer."
  - year_at: 3396
    kind: capital
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Albertgrad (founded 1478) [3396-] - The current capital of Corona, the result of the United Corona Organization's relocation of the capital in the aftermath of the civil war."
    note: "Local capital (United Corona Organization), not a roster polity."
  - year_at: 4492
    kind: transferred
    polity: solar-dominion
    precision: exact
    until_at: null
    where: body
    quote: "In 4492, during the Version War, a fleet from the Solar Dominion arrived at Iota. Local defense forces were completely outmatched and the system's many governments all quickly surrendered."
    note: "Matches header's transferred 4492 (solar-dominion)."
  - year_at: 4606
    kind: independent
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Glaran culture split into many subcultures which would then continue to develop separately from the world, even after the planet's independence in 4606."
    note: "Matches header's independent 4606."
  - year_at: 4606
    kind: independent
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "In 4606, most of the Iota system, spearheaded by a coalition between Hera, Hestia, and Corona, the three major polities of the system, revolted against Solarian rule, 50 Coronese years after the annexation."
    note: "Corroborating statement; the revolt led to the Solar Dominion granting independence shortly after. '50 Coronese years' is a local-year count (Corona's year is c. 2.28 Julian years), not 50 AT years, so it is not a contradiction with the 4492 annexation date."
  - year_at: 4609
    kind: transferred
    polity: iota-network
    precision: exact
    until_at: null
    where: body
    quote: "Starting from 4609, three years after independence, an S4 entity which called emself the Iota Scholar, a result of the mergers of many S2s and S3s in a group which migrated away prior to the Solar Dominion occupation, contacted the system through some of the old, pre-Version War comms wormholes."
    note: "Matches header's transferred 4609 (iota-network). E offered the Iota system status as er protectorate in exchange for protection and technology, and most Iotan polities (with a few exceptions) agreed."
  - year_at: 4830
    kind: capital
    polity: ""
    precision: exact
    until_at: 4870
    where: body
    quote: "Corona temporarily became the Commonwealth of Empires' neutral seat from 4830 to 4870."
    note: "The Commonwealth of Empires (ComEmp) is not on the polity roster."
  - year_at: 4728
    kind: capital
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "University (founded 4623) [4728-] - The academic capital of Corona, as well as of the Iota Commonwealth, the University city is a gigantic amalgamation of hundreds of major universities over 10 kilometers in radius."
    note: "A secondary 'academic capital', not the planetary or polity capital. 'Iota Commonwealth' is not on the polity roster (and may or may not be the same body as iota-network; not resolved here)."
  - year_at: 5763
    kind: capital
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Mincity (founded 5409) [5763-] - The virtual capital of Corona, and a famous Minimal Surface City, originally founded by Kalmanto Aesthetics in 5409 as a rebellion against the old-fashioned building codes, an AI entropy tax haven, and an artwork."
    note: "A virtual/informal capital, not a roster polity's capital."
holder_undated:
  - polity: iota-network
    quote: "Although technically an independent system and thus not in the Sephirotics, the entire Iota system is aligned with it, has many close ties to many of the Inner Sphere and other Sephirotic systems, and is usually treated as one."
