other_places:
  - "Nike (Nekay), GL 838.6: a Greater Sapientchimp colony 1.5 ly from Bolobo, founded when the S:2 Power Pan Demonium was deflected 'towards interstellar colonisation' after invading Bolobo 'by 9041 AT'; no exact founding year is given. The map header lists this article as also covering a 'Nike (Bolobo Colony)' entry in inner_sphere.yaml, but the text treats Nike as a physically separate system, so it is recorded here rather than as an event."
doubts:
  - "\"Bolobo the capital world of this system\" (planets list) designates Bolobo as capital among the system's own sub-worlds, not the seat of a polity, so not recorded as a capital event; it also carries no year."
  - "By 9041 AT the Greater Sapientchimp Power Pan Demonium 'invaded Bolobo with the aim of siezing the entire territory' but was deflected by Goodall; since the takeover attempt failed and Bolobo's affiliation did not change, this is treated as a battle, not an event."
  - "The probe is 'sent from Vesta in 1020' and said to have been in the Bolobo system 'collecting volatiles... for three hundred years' before contact was re-established in 1822; three hundred years before 1822 is 1522, not 1020, implying a long transit time not stated explicitly in the text."
