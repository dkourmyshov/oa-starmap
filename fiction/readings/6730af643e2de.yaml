doubts:
  - "Soon after 7558 AT, 'an S1 transapient named Luel's ... almost immediately sent out ships to claim the region around Midnight Pearl', but actual control was not awarded until 10324 AT via the game show; no exact year is given for Luel's initial claim, and Luel's is an individual transapient rather than a polity, so no event was written for that intermediate claim. A reviewer may want to record Luel's de facto stewardship of the region across that interval even though it maps to no roster polity."
  - "Who currently holds/governs Midnight Pearl after 10324 AT (beyond the Deeper Covenant's undated boostbeam-station presence) is not stated."
