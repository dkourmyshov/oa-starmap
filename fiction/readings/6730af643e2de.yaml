    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Due to its proximity to both Procyon and Luyten's star, the isolationist ahuman group Ako Forward Chaining viewed the brown dwarf UGPS 0722-05 as a favorable location for a colony, establishing a settlement there in 1032 AT."
    note: "Ako Forward Chaining is not on the roster; see unplaced."
  - year_at: 7558
    kind: abandoned
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "In 7558 AT, the light from Procyon reached UGPS 0722-05, and all of the Ako Forward Chaining inhabitants vanished."
    note: "Automated defences kept guarding the empty system after this; see doubts regarding the S1 transapient Luel's, who claimed the region soon after but did not gain actual control until 10324 AT."
  - year_at: 10324
    kind: transferred
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Finally, in 10324 AT, a team named \"Wagun\" was able to reach Midnight Pearl's upper atmosphere and was awarded control over the entire brown dwarf system by Luel's."
    note: "'Wagun' is a game-show contestant team, not a polity on the roster; see unplaced. Luel's (an S1 transapient, not a listed polity) was the one awarding control."
