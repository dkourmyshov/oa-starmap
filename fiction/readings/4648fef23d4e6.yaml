doubts:
  - "Panel field 'Allegiance Independent' names no polity and carries no date, so no independent event could be recorded from it."
  - "'Since 9050 AT Cythera has been host to the Galactic Colonisation Board' is dated but the Board is a body, not a polity, and 'host to' does not match any listed event kind (not capital, not stewardship as it is not a Caretaker God), so it was left out of events."
  - "The image caption 'during boarding in Cythera orbit, First Federation period' names a roster polity (first-federation) but gives only an era label, not a year, so it could not be recorded as a dated visit."
