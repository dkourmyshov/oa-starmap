    quote: "Stevocations was first reached by the Caretaker God Opikealeeve in 3680 AT to investigate and protect the biosphere of Rovoa."
    note: "The map header records this as 'visited 3680'; the text frames it as a Caretaker God taking the system under protection, which fits 'stewardship' per the brief's kind table. Flagged for reviewer judgement rather than resolved."
