    quote: "While it was long suspected these gases arose from biological processes, this wasn't confirmed until the mid 3nd century AT with the detection of photosynthesizing life in the planet's global ocean by its reflection spectra."
    note: "'mid 3nd century AT' appears verbatim (likely a typo for '3rd'); read as circa 250 AT. Remote detection by reflection spectra, not a visit."
