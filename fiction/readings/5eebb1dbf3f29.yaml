doubts:
  - "The map header's only already-dated fact is 'visited 3680'; the panel's 'Colonised 3780 AT' and the body's 'settled 3810 by Cygexpa' are both new against the header and conflict with each other (see contradictions)."
  - "Whether the 3680 AT arrival of Caretaker God Opikealeeve is better classified as 'visited' (per the header) or 'stewardship' (per the brief's definitions, since e came 'to investigate and protect the biosphere') is left for the reviewer."
  - "'In 4400 AT, the wormhole Shortcut was established' is an infrastructure milestone, not a holder change, so excluded as an event; likewise the Version War fleet movements are battle-related and excluded."
