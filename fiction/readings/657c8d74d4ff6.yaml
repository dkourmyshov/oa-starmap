doubts:
  - quote: "1055 First communication between the Federation of Sophonts in Solsys and the Resonance system."
    note: "A communication link, not a physical visit; unclear whether this should count as 'visited'. Not recorded as an event."
  - quote: "2139 News of the dissolution of the Federation of Sophonts reached Resonance, and the FedRep returned to Solsys."
    note: "Recorded as 'independent' (the system is left in no polity); could instead be read as 'reported' given the 'news... reached' framing."
  - quote: "Since the Iota Network uses the ComEmp ontology, Reyvik was among the last and the most reluctant in Seven Marbles to join it."
    note: "Ambiguous whether 'it' refers to the Iota Network or to the ComEmp ontology; no year given either way, so nothing recorded."
  - quote: "The Corona Fleet finally arrived in 3355, and with their assistance the system was pacified and gradually restored."
    note: "Corona is not on the roster and this reads as war pacification/aid rather than a clear holder change, so not recorded as an event."
