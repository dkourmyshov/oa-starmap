doubts:
  - "The entity that reached the system in 2990 AT is called \"Caretakerist\" rather than explicitly \"a Caretaker God\"; a reviewer may wish to decide whether this should instead be a kind: stewardship entry with polity: caretaker-gods, as in comparable articles (e.g. Jirayaka)."
  - "The Geological History section separately states \"0.007 mya: Terragens reach Zakdakha, transplanting its biota far and wide\" on a million-years-ago timescale, not AT; this appears to be the same arrival already recorded at 2990/3176 AT restated on a different timescale, so it was not logged as a further event."
  - "\"The remainder of the Tayaksekal system has remained open to settlement, although populations have remained relatively low\" implies settlement occurred at some point but gives no year or polity, so no settled event was recorded for it."
