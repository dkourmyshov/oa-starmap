doubts:
  - "The data panel states 'Affiliation: Former Conver Ambi, now Silicon Generation', but the related-article summary for Erson states the planet is 'Now a part of the Metasoft empire' and the article is filed under Metasoft Version Tree; these three sources disagree on the current holder, and no year is given for any Metasoft takeover, so no transferred-to-Metasoft event is recorded."
  - "'During the Conver Wars insurgents defeated the Orthodoxy in the orbital battle... As Metasoft expeditionary force RightNode arrived a full orbit-ground assault was initiated' describes Metasoft conquering the system from the Geminga Orthodoxy, but carries no year in the text; treated as an undated battle, not recorded as an event, though it may explain the 'now part of the Metasoft empire' claim above."
  - "Planet IV is described as 'devastated in the Second Consolidation War' in the planet list, while the body text calls the same conflict 'the Conver Wars'; it is unclear whether these are the same war under two names or two different wars, and neither is dated."
  - "'gained the territorial rights to the system after the Taurus Nexus breakup' implies the Taurus Nexus held rights to the system before the Conver Ambi, but gives no year for either the Taurus Nexus's holding or its breakup; not recorded as an event or holder_undated for lack of a clear holding statement."
