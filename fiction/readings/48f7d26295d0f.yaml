unplaced:
  - name: "Green Alliance"
    quote: "New Gaia (or simply Gaia, as the world was later known as) was colonised by the Green Alliance, a First Federation environmentalist movement of mostly rianth and nearbaseline human race, disillusioned with the decline of ecological standards and the rise of corporate influence that were emerging in the early 1200s AT."
  - name: "Omicron Developments Inc"
