other_places:
  - "Dionysos (Dionysan Erotocracy) — a related article, mentioned only as a neighbouring system, not described here"
doubts:
  - quote: "Most important of all was the support of the Hyperturing known as Rachel (named after a Industrial Age ecological activist, Rachel Carson) which had in the 1190s AT manipulated the futures exchange in order to gain enough capital to buy rights to the fourth planet of the Lambda Aurigae system, which was known to support complex life. Rachel also obtained a two hundred year lease on the system as a whole."
    note: "a dated rights purchase before colonisation, by an individual hyperturing not yet associated with any roster polity; not recorded as an event"
  - quote: "During the 17th century the Lambda Aurigae system was opened up for colonisation."
    note: "vague and undated as to who; possibly a further wave beyond the 1425-1440 megacorp arrivals already recorded, possibly the same development restated; left out as an event"
  - quote: "The following year the megacorps withdrew."
    note: "1688 AT, following the 1687 AT arrival of the Rachel ISO; a partial withdrawal (those already settled in the asteroid and moon colonies were welcome to stay), not a full abandonment; does not clearly fit any listed kind"
  - quote: "Current Allegiance: Caretaker God (under the hyperturing Rachel), offworlders have ties to the Solar Organisation"
    note: "'Solar Organisation' may be the roster's Solsys Organization under a variant name, but this is not asserted since the name does not exactly match the roster's listed alternates"
