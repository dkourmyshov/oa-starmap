    quote: "In 1758 AT a second ship, of different design, approached. This one managed to decelerate but the cryogenic systems had failed."
    note: "Matches the header's settled 1758 and the panel's Colonized 1758, but the following sentences state this ship's colonists were found dead (frozen corpses) on arrival, not living settlers. See contradictions."
  - year_at: 1788
