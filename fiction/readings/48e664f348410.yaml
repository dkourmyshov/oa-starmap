    where: body
    quote: "A third ship, the Heavenly Fellowship, employing more advanced life-support systems, arrived thirty years later with the crew alive and well."
    note: "Year derived as 1758 + the \"thirty years later\" stated in the text, relative to the second ship's 1758 AT arrival. This may be the true first living settlement; see contradictions."
  - year_at: 4234
    kind: visited
    polity: technorapture-hypernation
    precision: exact
    until_at: null
    where: body
    quote: "In 4234 AT the system received a visit by an S3 TRHN emissary, whom the Confederationists named \"Raphael\" and who provided them with a few clarketech trinkets, much to the envy of the Atlanteans. \"Raphael\" descended to the surface and made contact with the isolationist ai \"Gray\". Following this, \"Gray\" unexpectedly transformed part of emself (and several hundred square kilometers of the surface of Prometheus) into a series of unusual diamondoid-coated monoliths, while the majority of eir mass became a huge swarm of small ISOs ('the Rapture') that accompanied Raphael back to the TRHN."
    note: "\"Gray\" is a local AI (originally from the Diamond Belt), not a xenosophont species, so this is not recorded as a contact event."
