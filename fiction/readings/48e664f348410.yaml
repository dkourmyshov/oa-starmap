doubts:
  - "\"During the early Consolidation Age the Ufers joined the Communion, as they believe the empaths to be the paradigm for the original space brothers.\" No AT year is given for this join, so no dated event was created; recorded as holder_undated instead."
  - "The article gives three ship arrivals (1735 failed flyby, 1758 arrival with dead cryo-failed colonists, and a third ship \"thirty years later\" with living crew) for what the header/panel call settled 1758. It is unclear which arrival the reviewer should treat as the operative settlement; all three are recorded."
  - "\"Prometheus was named and surveyed by the original Jupiter Transystems ai and remained in JT hands until appropriated by an isolationist ai that emigrated there from the Diamond Belt, and declared the planet off-limits.\" No year is given for either the original survey or the later appropriation by \"Gray\"; not recorded as dated events."
