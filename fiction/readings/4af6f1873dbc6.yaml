doubts:
  - "Euphrosyne was detected in the early Interplanetary Age, and after the Technocalypse was the target of a slow-moving Generation Ship, the Endurance, which left Solsys in 710 AT and was due to arrive in 2795 AT. -- no polity is named for the Endurance itself, and 'early Interplanetary Age' carries no AT year, so no `observed`/`visited` event was recorded from this sentence."
  - "Following a mutiny, the colonists on board the Endurance chose not to decelerate on arrival, and the generation ship continued past Chara and into deep space. -- unclear whether the ship's passage through the system counts as a `visited` event (year_at 2795, precision exact, per the earlier 'due to arrive' clause) when nobody landed or stopped; left unrecorded as an event rather than guessed."
  - "During this period, much faster ships from the First Federation and the Eridanus League had overtaken them. Around half the colonists from the Endurance were transferred to fast-moving conversion drive vessels and taken to join the colony on the third planet, Euphrosyne. -- implies a colony already existed at Euphrosyne before Endurance passed by, possibly settled by the First Federation and/or the Eridanus League, but no date is given and no sentence states either polity actually reached or settled Euphrosyne, so no `settled` event was inferred for either roster id."
