doubts:
  - "Jupiter Transystems' 1395 AT sale of the still-unvisited planet (event above) is a borderline case: no one had reached Zeta 1 Reticuli II yet at that point, so it is arguably a paper transaction rather than a 'transferred' holder-of-a-settled-place event; a reviewer may prefer to drop it."
  - "During the Version War, Atlantis suffered 'a brief occupation by a revisionist force' after a Negentropy Alliance/Solar Dominion squadron defeated the Atlantean fleet, but no year is given and the article says Atlantis 'remained largely standardization [sic] side throughout', i.e. did not change allegiance, so this was read as a battle/occupation rather than a transferred event."
  - "The header's map filename lists this place as 'Atlantis/Prometheus/Daedalus', suggesting the map may merge these three worlds into one entry, but this article only covers Atlantis; Prometheus and Daedalus are listed above under other_places since they have their own related articles."
  - "'The Penglaist Empire was in full swing and already annexed a number of nearby star systems' appears to refer to the roster's Penglai Empire (penglai-empire), but the sentence does not claim Penglai reached or annexed Zeta 1 Reticuli itself, so no event was written for it."
