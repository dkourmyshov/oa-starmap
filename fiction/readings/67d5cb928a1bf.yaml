contradictions: []
other_places: []
doubts:
  - quote: "While Titawin is sometimes considered to be affiliated with the Caretaker Gods, its status is in fact much more ambiguous. No explicit transapient rule has been observed in the system, and while motions to declare formal Caretaker allegiance have been frequently proposed, they have always been defeated."
    note: "Reads like a possible stewardship claim, but the article explicitly says the affiliation is unconfirmed and repeatedly voted down, and gives no year."
  - quote: "New Scaramouche was reserved for the Riposte in 10270, when contact was announced on the Known Net."
    note: "Unclear whether the 10270 contact was made at Titawin or elsewhere and merely announced there; 'reserved' is also not one of the listed event kinds."
  - quote: "Ultimately, after many discussions, the Foundation ceded control of its operations to the To'ul'h inhabitants, leading to the autonomist principle of governance \"by xenosophonts for xenosophonts\" that remains to this day."
    note: "Reads like a possible independence event, but no year is given and the Xenological Garden Foundation is not clearly a territory-holding polity."
  - quote: "The majority of the inhabitants uploaded and soon after fell into the hedonic sink, enjoying a solipsistic existence of maximal bliss in a moon brain orbiting Upsilon Andromedae B, Titawin's distant red dwarf companion. They remain in such a state to this day, now known as the Titawin Sunk."
    note: "Upsilon Andromedae B is called a companion star of Titawin, so this may be the same place rather than a different one; not listed under other_places for that reason, but flagged here."
  - quote: "First contact with Cthonids and Pipers, with members of both species settling in Titawin, led to a resurgence in the Garden's fortunes."
    note: "Describes contact and settlement but carries no year of its own; it sits between the 7002 wormhole grant and the following 8000-9000 sentence."
  - quote: "the first xenoprovolves — Pspyders — were invited to join in 6500."
    note: "'Invited' in 6500 is not clearly the same as settled; New Trees is later described as inhabited by provolved Pspyders with no separate arrival date."
