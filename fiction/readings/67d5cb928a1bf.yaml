  - year_at: 7700
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "The creation of Ardun in 7700 was one of the most controversial decisions in Titawin's history."
    note: "Ardun was settled by baseline and nearbaseline humans within Titawin itself; no external polity is named."
  - year_at: 8000
    kind: settled
    polity: ""
    precision: between
    until_at: 9000
    where: body
    quote: "Between 8000 and 9000, multiple xenosophonts and xenoprovolves joined, political issues became complex, and Titawin Xenological Garden took on its current form."
    note: "General summary of continued settlement by unspecified xenosophonts and xenoprovolves; no group or polity is named."
  - year_at: 8862
    kind: contact
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "Following first contact in 8862, the metallic hydrogen layer was Menexenoformed to have the appropriate pressure, temperature, levels of helium and neon, and magnetic fields."
    note: "Contact with the Menexenes; Menexenes are a xenosophont species, not a polity."
  - year_at: 9600
    kind: settled
    polity: ""
    precision: not_earlier_than
    until_at: null
    where: body
    quote: "Since 9600, a small but steadily growing community of Jade Chime Singers, along with some Faber reprogroups, has lived on New Chorus."
    note: "No polity is named for the Jade Chime Singers or the Faber reprogroups."
  - year_at: 10010
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "It was not until 10010 that several communities of Soft Ones, for reasons of their own, perhaps linked to the Epp War, migrated to Titawin."
    note: "No polity is named for the Soft Ones."
  - year_at: 10380
    kind: settled
    polity: ""
    precision: not_earlier_than
