title: Owen (System)
events:
  - year_at: 4296
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: panel
    quote: "Colonized: 4296 AT"
    note: "Matches the header's already-recorded 'settled 4296', but see contradictions: no body sentence restates this year for the settlement itself."
  - year_at: 3937
    kind: settled
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "The Jurassica Institute's expedition ship, at a speed just under 0.7c, reached HD 160519 on 3937 AT."
    note: "The very next sentence says the arriving uploads, aioids, and hyperturings 'had no trouble setting up infrastructure' on the fourth planet, so this reads as the actual colonists staying, not a mere visit. The Jurassica Institute is not a roster polity, see unplaced."
  - year_at: 4853
    kind: abandoned
    polity: ""
    precision: exact
    until_at: null
    where: panel
    quote: "Evacuated: 4853 AT"
    note: "See doubts: the body suggests this was the departure of the neosaurian provolve population specifically, not a full depopulation of the system."
  - year_at: 4853
    kind: abandoned
    polity: ""
    precision: exact
    until_at: null
    where: body
    quote: "On 4853 AT, the fleet of neosaurians departed at relativistic velocity towards the open cluster Ruprecht 108, leaving their planet behind to recover."
    note: "Preparations ran 'Starting from 4832 ~ 4852 AT' per the preceding sentence; GEvidian and caretaker entities appear to have remained, and revival/repopulation programs resumed 'the next few centuries' afterward, see doubts."
  - year_at: 4699
    kind: transferred
    polity: utopia-sphere
    precision: not_later_than
    until_at: null
    where: body
    quote: "During the Version War , Owen officially aligned itself with the Utopia Sphere, one of the neutral Sephirotic empires which were non-combatants in that conflict."
    note: "No exact year is given for the alignment itself; it is bounded by the following sentence, 'In 4699 AT, after the war, a Utopian linelayer reached the system', so not_later_than 4699 is used. Matches the header's 'filed under: Utopia Sphere'."
  - year_at: 5687
    kind: transferred
    polity: archosaurian-empire
    precision: exact
    until_at: null
    where: body
    quote: "In 5687 AT, following some rather terse communication between ArchSaur and I Give The Horn of Plenty, the Ornith system and Owen were declared an honorary part of the Archosaurian Empire ."
    note: "The Ornith system is a different place, see other_places. 'Declared an honorary part of' is unusual wording for a transfer, see doubts."
holder_undated: []
