    quote: "In 5687 AT, following some rather terse communication between ArchSaur and I Give The Horn of Plenty, the Ornith system and Owen were declared an honorary part of the Archosaurian Empire ."
doubts:
  - "The panel's 'Colonized: 4296 AT' matches no year restated in the body's colonization narrative, which instead gives the ship's arrival as 3937 AT, an oxygen-level milestone as 4195 AT, and terraforming completion (with the planet's renaming to Owen) as 4384 AT; none of these equal 4296. Both the panel figure and the closest body figure (3937, the actual arrival/settling) are written above and flagged as a contradiction, but a reviewer may want to weigh the 4195/4384 milestones too even though they were excluded here as terraforming milestones."
  - "The panel's 'Evacuated: 4853 AT' and the body's matching 4853 AT departure both describe the neosaurian provolve fleet leaving for Ruprecht 108 'leaving their planet behind to recover' - the body implies GEvidian, the Jurassica/Lazurogenics Institutes, and I Give The Horn of Plenty remained and resumed species-revival programs within centuries, so this may not be a clean 'abandoned' (everyone left or died) in the sense the brief intends; written as abandoned here since that is the closest tracked kind to the panel's own word 'Evacuated'."
  - "'In the early Age of Re-Evaluation period, I Give The Horn of Plenty took over day-to-day administration of the system' looks like a stewardship event (Caretaker God taking the system under protection; roster id caretaker-gods) but carries no numeric AT year, only the era name, so it was left out of events rather than guessing a year."
  - "The 5687 AT Archosaurian Empire event uses the phrase 'declared an honorary part of the Archosaurian Empire', and the very next sentence says 'the rest of the system was declared off-limits' to non-pilgrims, which reads more like a titular/tourism designation than a full governance transfer; I Give The Horn of Plenty appears to remain the administering Caretaker God. The header files this place under Utopia Sphere even though the latest dated polity claim in the body is this 5687 Archosaurian Empire one; both events are written above without resolving which the map should prefer."
  - "The isolationist ai occupation of Joule and the outer dust belt, noted as having lasted 'for some centuries' before the 3937 AT arrival, has no specific name or year and so was not written as an event."
