  - name: "SecureSpace"
    quote: "A semi-sentient interstellar probe, launched in the Late Federation era by SecureSpace , had surveyed the system for potential colonization and discovered that Joule and the outer dust belt had been occupied by isolationist ai entities for some centuries."
