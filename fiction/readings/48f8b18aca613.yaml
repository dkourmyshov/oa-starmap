doubts:
  - "The header's 'visited 1980' does not match any year given in the article text. The two nearest candidate events are the Genetekker clade's arrival in 980 AT (which reads as a settlement, not a visit, since they stayed and grew in population) and the first Federation ship Morgan's arrival in 1151 AT (which does read as a 'visited', and involves the roster polity first-federation). Neither has the year 1980. Both are recorded as their own events; the header entry is not resolved to either: quote \"In 980 AT the Genetekker Dionysist clade arrived, in the He-3 powered ship Mendel.\"; quote \"In 1151 AT the first Federation ship, the Interstellar Development Group exploration and terraforming vessel Morgan arrived.\""
  - "The Sinai Valley Jesurun community's abandonment was not written as its own event: it is a sub-settlement within the already-settled Dionysos/Jerusalem system, but the wording is an exact match for the 'abandoned' kind, so it is flagged here in case the reviewer wants it recorded: quote \"The community was finally abandoned in 1780.\""
