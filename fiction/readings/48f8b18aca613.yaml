    quote: "In 1151 AT the first Federation ship, the Interstellar Development Group exploration and terraforming vessel Morgan arrived."
    note: "The text goes on to say a rocky inner planet was allocated to the corporation and more ships/colonists arrived over the following century, so this may amount to more than a simple visit; recorded as 'visited' to follow the wording. This may or may not be what the header's 'visited 1980' refers to; see doubts."
