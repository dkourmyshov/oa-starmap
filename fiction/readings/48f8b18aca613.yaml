    note: "The Genetekkers came from the Gengineer Republic's colonisation initiative, not on the roster. Their population 'began to increase rapidly upon arrival', i.e. they stayed. This may or may not be what the header's 'visited 1980' refers to (980 vs. 1980); see doubts."
