doubts:
  - "The Solarist occupation of (inner) Dante is only dated to 'the Version War', a known era but with no explicit AT year given in this article, so it is recorded as holder_undated rather than a dated transferred event; a reviewer with the Version War's dates could promote it. The outer Alighieri system is said to have 'remained a free independent zone' during the same war, but since it is the same star system as Dante and no year or clear resolution is given, no independent event was written for it either."
