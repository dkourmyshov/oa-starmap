other_places: []
doubts:
  - "Early precursor exploration has no usable year: \"it is thought that the Cislunar Alliance launched the first interstellar flyby probe during the Interplanetary Age\" and \"Nadian archeologist have discovered traces of other visitations during the Interplanetary Dark Age and Early First Federation periods, including the ruins of a vec colony on Hetman, but none seemed to have flourished.\" No entries were created for these."
  - "The 2400s AT \"transferred\" event (see above) may simply be a tightening of LinnEnt's existing administration rather than a new change of holder, since the system was already colonised by LinnEnt in 1845."
  - "\"In 7159 AT the Union of Nadian Nations and Sophonts (UNNS) was established.\" This is a local, non-roster government's formation, not clearly one of the eight event kinds, so it was not recorded as an event."
