doubts:
  - quote: "This was followed by a wormhole link to Medius - originally a nanoscale link that was rapidly inflated to macroscale (100 meters). Oikoumene had joined the Nexus."
    note: "\"Joined the Nexus\" reads as joining a wormhole/communication network, not necessarily the MPA polity, and no separate year is given for it beyond the 3194 contact date above."
  - quote: "Over the next six or seven centuries, many expeditions were launched by idealists, adventurers, cranks, and claim jumpers looking to make it rich, or establish a perfect society, or even (as was the case of the famous Unity-led expedition from Tau Ceti) open up friendly communication with the strange dyson colony."
    note: "No anchor year is given for the start of this span (it follows the undated \"even before this\" clause), and it describes recurring expeditions of colonists who mostly disappeared into the habitats rather than a single dated settlement or transfer."
