doubts:
  - "The 4600 AT Version War refugee influx ('Over 3 billion refugees settle at Ao Lai; many remain after the peace') was not recorded as an event: the system was already settled, and this reads as a population movement rather than a change of holder."
  - "The 933 AT timeline entry was classified as settled rather than the header's 'visited', since the sentence describes arrival and the start of development; flagged for reviewer judgement."
  - "The IPP is treated as unplaced throughout, being an institute rather than a polity on the roster; the 'capital' entry at 7040 AT reflects the article's own framing of Ao Lai as IPP headquarters."
