    until_at: null
    where: body
    quote: "Beta Caeli was reached in 1522 A.T. by the Undyoist colony ship Qian Kun ."
    note: "Undyoists are a religious/cultural group, not a polity on the roster"
  - year_at: 2107
    kind: transferred
    polity: ""
    precision: not_earlier_than
    until_at: null
    where: body
    quote: "In 2107 the Federation Representative left the system, leaving these worlds without transapient guidance. Finding that their interstellar credit was now effectively worthless the Tahmetians started to invade the remaining worlds. Most of the remaining asteroids, moons and planetoids fell to their invading troopships; the pacifist Undyoists gave no resistance, although there were spirited defences of several worlds by Etodist defenders."
    note: "the Tahmetians are not a polity on the roster; this covers the outlying planetoids and asteroids, not Blanchard itself, which was defended successfully (see later event)"
  - year_at: 3230
    kind: transferred
    polity: ""
    precision: not_earlier_than
    until_at: null
    where: body
    quote: "In the war that followed the pacifist Undyoists once again took no active part, but they were instrumental in deprogramming the most fanatical of the New Tahmetians once AgGardner and Tyl were finally subdued."
    note: "\"subdued\" implies AgGardna and Tyl passed from New Tahmetian control back to the Etodists/Undyoists; none of these are polities on the roster"
  - year_at: 3879
    kind: visited
    polity: nocozo
    precision: exact
    until_at: null
    where: body
    quote: "In 3879 the Blanchard Tape voted to invite the NoCoZo to send a representative transapient to give them assistance and guidance; they expected to get a single First Singularity visitor, but instead several dozen transapients arrived, including in due course a S:2 Higher transapient ."
    note: "recorded as visited rather than transferred because the article later states Blanchard never formally joined the NoCoZo"
