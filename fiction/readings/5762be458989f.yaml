  - "Alpha Caeli — \"several Tahmetian ships arrived from Alpha Caeli, a system which received a visit from one of the miraculous Five Prophets\"; origin system of the Tahmetians, briefly described."
doubts:
  - "\"Towards the end of the First Federation Era several Tahmetian ships arrived from Alpha Caeli ... began to occupy several small objects in the middle system, including the planetoids AgGardna and Tyl.\" — no explicit AT year is given for this first Tahmetian arrival/occupation, only a relative era reference."
  - "\"In 2107 the Federation Representative left the system\" — the roster gives the First Federation's dissolution as 2099 AT, two years before this date; it is unclear whether \"the Federation\" here means the First Federation or the separately named \"Inner Federation\" (also mentioned in this article and not on the roster), so no polity id was attached."
  - "\"Blanchard has never formally joined the NoCoZo\" — an explicit statement of non-membership despite receiving NoCoZo transapient assistance from 3879 onward; noted here for contrast with the visited entry above."
