  - "\"After a hundred more standard years Morrow cylinder held no human population at all, and Griqua was slowly being disassembled by vec scrap-merchants.\" This follows directly from the two plagues described (first plague circa 3541 AT, second twenty months later), and reads as the colony's end/depopulation -- matching the 'abandoned' definition -- but the brief excludes plagues and population figures as events, and this is the direct effect of a plague. Left out of events for that reason; flagged here since a reviewer may judge otherwise. No exact AT year is given for it in any case, only 'a hundred more standard years' after the epidemics."
