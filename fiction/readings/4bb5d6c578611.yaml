    where: body
    quote: "In 1848, Wasat became home of the House Conver Limis, specialists of the colonization of AquaCytherean planets (also known as PelaCytherian wprlds)."
    note: "House Conver Limis is a dynasty/faction, not a roster polity; see unplaced. A later sentence calls the Apex Carbuncle habitat 'the symbolic capital of the Conver Limis', supporting the capital classification."
