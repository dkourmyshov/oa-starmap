    quote: "Beta Cassiopeiae, known as Caph, 54.7 light-years from Sol, was colonized in 1532 AT using seed ships and parental vecs, and a successful vec-biont hybrid civilization developed there, nominally aligned with the Solar Dominion ."
    note: "The sentence gives the colonization date, but the 'nominally aligned with the Solar Dominion' clause is not clearly dated to 1532 itself; recorded separately below under holder_undated."
