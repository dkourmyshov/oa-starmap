# Questions for the Orion's Arm community.
#
# Hand-authored half of `questions.md`, which the build regenerates. The other
# half is counted straight out of the datasets — unresolved names, distance
# disagreements, landmarks past the frontier — because those change with every
# edit and a hand-maintained list of them would be stale within a week.
#
# What belongs here is what the build cannot know it does not know: a
# contradiction between two sources that both parsed fine, a reading of an
# article that could go either way, a category question about the setting.
#
# Each entry should state what we hold, what the sources say, what the map does
# in the meantime, and what would settle it. `status: open` puts it in the
# questions list; `status: settled` moves it to the record of things checked, so
# a question answered once is not asked again.

questions:
  - id: enigma-position
    topic: Enigma system
    status: open
    severity: contradiction
    summary: Three sources put the Enigma system in three different directions.
    detail: >-
      The Enigma Cluster is NGC 6755 — that part is settled, and the cluster is
      on the map under that name, colonised in 7222 and listed as Keter
      Dominion. What remains open is the Celestia add-on's star called Enigma,
      at RA 81.7, Dec -37.5, 1,410 pc: that is in Columba, 4,598 ly out, and
      3,478 pc from NGC 6755, roughly opposite it on the sky. No star in the
      add-on comes within 1,549 pc of the cluster. The EG article for Stanislaw
      adds a third direction, Canis Major, whose nearest boundary is some
      fifteen degrees from the add-on's position; Columba is not a boundary case
      for it.
    map_does: >-
      Stanislaw is placed by constellation in Canis Major at the add-on's
      distance, and marked uncertain. The add-on's direction is not used.
    would_settle: >-
      Whether the add-on's Enigma star is the Stanislaw system at all, or a
      different object sharing the name. If it is Stanislaw's, one of its two
      directions is wrong; if it is not, the add-on entry needs its own
      identity.
    links:
      - https://www.orionsarm.com/eg-article/491222f681eed
      - https://www.orionsarm.com/eg-article/491aecf1478f9

  - id: aristotle-identity
    topic: Darwin / Aristotle
    status: settled
    severity: reading
    summary: Aristotle is Orion's Arm's name for the star, not a second world.
    detail: >-
      Given to us as "Darwin (planet), Aristotle, Delta Pavonis (system)", which
      read equally well as an alternate name for the planet or as a body of its
      own. It is neither: Aristotle is what Orion's Arm calls Delta Pavonis
      itself.
    map_does: >-
      The system is labelled Aristotle, by the rule that a primary with a name
      of its own gives the system its name. Darwin is its planet, and the
      catalogue designations stay on the star's panel.
    would_settle: Settled.
    links:
      - https://www.orionsarm.com/eg-article/48f4a40a5df0a
      - https://www.orionsarm.com/eg-article/4ed5b7fa7fe22

  - id: jd-is-hd-in-ngc-6633
    topic: Celestia add-on numbering
    status: open
    severity: finding
    summary: >-
      Some of the add-on's "JD" designations in NGC 6633 are HD numbers of real
      stars, not Orion's Arm's own numbering.
    detail: >-
      A positional cross-match against the real star catalogue at one arcminute
      finds JD 169512 sitting 0.0 arcmin from HD 169512, and the same for JD
      169842, JD 170054, JD 170200 and JD 170293. Five exact digit matches at
      zero separation is not coincidence. Whether the rule holds for all 52
      entries in that cluster group is untested — most of the rest are not in our
      catalogue at all, so there is nothing to match them against.
    map_does: >-
      All 52 are hidden, so nothing is drawn twice. The `oa_designation` flag
      still treats a JD prefix as Orion's Arm numbering, which for these is
      wrong.
    would_settle: >-
      Whether the add-on's NGC 6633 file was built from HD numbers throughout,
      and whether JD elsewhere in the add-on means anything different.

  - id: stellar-umma-count
    topic: Stellar Umma
    status: open
    severity: category
    summary: The Stellar Umma is really two polities, recorded here as one.
    detail: >-
      Noted as the Umma of the Core and the Umma of the Shell. We hold one
      polity entry and one member system, a brown dwarf the add-on labels only
      "Brown Dwarf in the Stellar Umma Region".
    map_does: One polity, one colour.
    would_settle: >-
      Whether the two should be separate polities on the map, and which of them
      that brown dwarf belongs to.
    links:
      - https://www.orionsarm.com/eg-article/484494c1bddf1

  - id: muuh-polity-structure
    topic: Muuh
    status: open
    severity: category
    summary: Do the Muuh have polities in the sense terragen civilisation does?
    detail: >-
      Muuhome is classified as Xenosophont rather than under a named polity,
      because the Muuh are independent — they have their own System of Response
      and need no terragen protection — but whether they organise into anything
      answering to an empire is not something we found stated.
    map_does: >-
      Recorded with kind `xenosophont` rather than `meta-empire`, so the map does
      not assert a political structure the setting may not have.
    would_settle: >-
      Whether "Muuh" should name a polity, or stay a clade with no polity of its
      own.
    links:
      - https://www.orionsarm.com/eg-article/47bb872326fa1

  - id: corambytia-extent
    topic: Corambytia Protectorate
    status: open
    severity: precision
    summary: The direction uncertainty is larger than the protectorate itself.
    detail: >-
      Given as 290 ly across, 1,500 ly from Sol, in Antlia. Antlia's enclosing
      radius is 13 degrees, so at that distance the direction is uncertain by
      about 350 ly — more than the volume's own diameter. The sphere the map
      draws is the right size in demonstrably the wrong place.
    map_does: >-
      Drawn at the constellation centre with an uncertainty circle around it, so
      the error is visible rather than implied.
    would_settle: Coordinates, or a nearby landmark to hang the direction on.
    links:
      - https://www.orionsarm.com/eg-article/46412ddb422d6

  - id: evermore-location
    topic: Evermore
    status: open
    severity: unlocated
    summary: Evermore is described but not located.
    detail: >-
      Placed "at the edge of the Disarchy", and the Disarchy is itself given by
      landmarks rather than coordinates — a volume stretching outward from Lynga
      2 toward Feinstein 1 and the SN 1006 nebula, with incursions Solward. Lynga
      2 and Feinstein 1 are both in our open cluster catalogue, so that axis
      could be drawn; the remnant of SN 1006 is not, and "the edge" is not a
      point in any case.
    map_does: Recorded with no position, and not drawn.
    would_settle: A distance and a direction, or a system to bind it to.
    links:
      - https://www.orionsarm.com/eg-article/48fbc25f56967

  - id: wadai-catalogue-absence
    topic: Wadai
    status: open
    severity: data-gap
    summary: >-
      Wadai's star is real but in none of our catalogues, so the Inner Sphere
      table's row for it cannot be bound.
    detail: >-
      Wadai appears twice — in the Celestia add-on as EG 471 at 50.5 ly, and in
      the Inner Sphere table as WD 0230-144 at 54.4 ly. Both are the white dwarf
      GJ 3162. At absolute magnitude 14.8 it is in neither Hipparcos nor the
      Bright Star Catalogue, and the nearest star we hold to its position is 26
      arcmin away at 423 pc.
    map_does: >-
      Drawn at the add-on's position, marked as a real object rather than an
      asserted one, since the add-on is acting as a catalogue of last resort.
    would_settle: >-
      Nothing on the fiction side. This is ours to fix by adding a white dwarf
      catalogue.
    links:
      - https://www.orionsarm.com/eg-article/4910e5c60edcc

  - id: guo-shoujing-spelling
    topic: Guo Shoujing
    status: settled
    severity: reading
    summary: The colony table spells the astronomer's name "Guo-Shuo Jing".
    detail: >-
      The article uses Guo Shoujing, which is the astronomer's name; the table's
      form looks like a transcription slip.
    map_does: >-
      Article spelling is authoritative, table spelling kept as an alias so the
      row still matches.
    would_settle: Settled by the article.

  - id: cantor-position
    topic: Cantor
    status: settled
    severity: confirmation
    summary: Two independent sources agree on Cantor to four figures.
    detail: >-
      The EG article gives Carina at 2,735 ly. The Celestia add-on, which was not
      consulted when that was recorded, puts it in Carina at 2,736 ly. Worth
      recording precisely because the neighbouring entry, Enigma, is a case where
      the same two sources disagree completely.
    map_does: Bound to the add-on's star.
    would_settle: Settled.
    links:
      - https://www.orionsarm.com/eg-article/48fe1da7a2205

  - id: kalii-changed-hands
    topic: Kalii / Arctar
    status: settled
    severity: correction
    summary: Kalii is a Non-Coercive Zone system, not a Caretaker one.
    detail: >-
      Recorded here as Caretaker on the strength of the Caretaker takeover in
      3780, which is only the middle of the story: the Caretaker sold the system
      to a Non-Coercive Zone business in 4323, and it has been theirs since. The
      initial colonisation attempts are undated.
    map_does: >-
      Affiliation is the present holder — the Non-Coercive Zone — with both dates
      kept as events, so the Caretaker period is still on the record. This is the
      rule for every entry: `affiliation` is who holds it now, whatever the
      history says happened on the way there.
    would_settle: Settled.
    links:
      - https://www.orionsarm.com/eg-article/46478982497db

  - id: dates-from-article-text
    topic: Dated history
    status: open
    severity: data-gap
    summary: >-
      Dates are being read out of article prose by hand, and only the Caretaker
      Gods have been done.
    detail: >-
      Thirteen of the fifteen worlds recorded so far carry dates, spanning 621 to
      9920 A.T. Sand and Macrystis have none because their articles give none —
      checked, not assumed. Every other polity's worlds are still undated, and
      the dates that exist were transcribed by reading the articles.
    map_does: >-
      Records what has been read, and derives two summary years from it: the
      year a place first appears at all, and the year it became inhabited. A
      historical view of the sphere can be built from those, but only over the
      worlds that have them.
    would_settle: >-
      Nothing on the fiction side — this is ours. The articles are the source and
      they are prose, so this is a transcription job rather than a question.

  - id: blenke-cluster-two-empires
    topic: Blenke Cluster / Blanco 1
    status: open
    severity: contradiction
    summary: >-
      The same open cluster is Communion of Worlds in its article and
      Non-Coercive Zone on the political maps.
    detail: >-
      Blanco 1, 850 ly away in Sculptor, is named the Blenke Cluster in an
      article that places it in the Communion of Worlds. The political maps of
      the Middle Regions at 8000 A.T. put it inside the Non-Coercive Zone. The
      article is the more detailed source and would normally win, but the two
      need not be exclusive: meta-empires interpenetrate, and a cluster 850 ly
      across can hold presences from both without either source being wrong.
    map_does: >-
      Records both, and now draws both: the cluster ring is halved between the
      two colours rather than picking one. The Orion's Arm name and article are
      on it too — it labels as the Blenke Cluster, or as Blanco 1, or as both,
      depending on the name switch.
    would_settle: >-
      Whether the Communion's presence supersedes the NoCoZo's, or the two
      genuinely overlap there.
    links:
      - https://www.orionsarm.com/eg-article/460e7b5d61e04

  - id: third-def8-distance
    topic: Third Def8
    status: open
    severity: contradiction
    summary: HD 6235 is at 346 ly; the world is recorded at 35 ly.
    detail: >-
      A factor of ten. The HD number is unambiguous and the catalogue puts it in
      Sculptor at 346 ly, which is where every other Communion world in that
      direction sits — Rergenar at 367, Vistaa at 335, Canberra Orbital at 378,
      Heartland at 334. A genuine 35 ly star would be a naked-eye neighbour and
      not an HD number nobody has named.
    map_does: >-
      Bound on the HD number and drawn at 346 ly, since an identifier is a
      stronger claim than a distance and the alternative is not to draw it at
      all. The build now checks every stated distance against the star it binds
      to and fails on a mismatch; this is the one case named as a known
      conflict, so the check stays live everywhere else.
    would_settle: Whether the article says 35 ly, 350 ly, or something else again.
    links:
      - https://www.orionsarm.com/eg-article/47a28b116776e

  - id: communion-places-without-positions
    topic: Webistics and Elderman's Star
    status: open
    severity: unlocated
    summary: Two Communion places with nothing to place them by.
    detail: >-
      Webistics has an article but no position of any kind in it. Elderman's
      Star has neither a position nor an article we have found — it is on the
      list of Communion locations and nothing more.
    map_does: Recorded and not drawn.
    would_settle: A distance and a constellation would be enough for either.
    links:
      - https://www.orionsarm.com/eg-article/47000688d2cf2

  - id: oa-region-names-have-no-coordinates
    topic: The Crucis Corridor and other named volumes
    status: open
    severity: data-gap
    summary: >-
      Many places are located by an Orion's Arm region name rather than by a
      direction, and this map has no table of what those regions cover.
    detail: >-
      A "sector" is settled: it is the volume behind that constellation as seen
      from Earth, so the Centaurus sector fixes Dashwood's and Gritwald's
      direction. Neither gives a distance, so both remain a cone from Sol rather
      than a point. What is still unread are the other kinds of region name —
      the Crucis Corridor, the outer volumes near the Mutual Progress
      Association border — which are not sectors and may not decode the same
      way. Arnon Dar, Ratay's World and Verity rest entirely on those. Gillbank,
      New Poseidon and Steelcliff have the opposite half: a distance from Sol
      and no direction at all, which describes a shell rather than a place.
    map_does: >-
      Records them and does not draw them. A region name could be turned into a
      direction only by guessing which constellation it corresponds to, and a
      guess drawn as a dot is indistinguishable from a measurement.
    would_settle: >-
      Whether a "Corridor" decodes like a sector, and a distance for each of the
      worlds that now have only a direction. Either half alone leaves them
      undrawable; together they are ordinary constellation placements.
    links:
      - https://www.orionsarm.com/eg-article/5025ec682d4a4
      - https://www.orionsarm.com/eg-article/464e939b35f57

  - id: neli-neti-distance
    topic: Neli-Neti
    status: open
    severity: contradiction
    summary: >-
      HIP 63911 is catalogued at 17,120 ly while the system is given as 698 ly
      away, and it is not yet clear which number rests on what.
    detail: >-
      The article gives the identifier and a colonisation year of 3189. The
      catalogue puts that star in Musca at 17,120 light years, which is two and
      a half times the canonical frontier and not somewhere a colony was founded
      in the fourth millennium. A Hipparcos parallax at that range is barely a
      measurement, so the distance is the likelier error — but the map draws
      what the catalogue says.
    map_does: >-
      Placed at 698 ly in that star's direction, and deliberately not *bound* to
      the star. The system and the star are both in Musca, which points at the
      parallax rather than the identity — Hipparcos positions are good to
      milliarcseconds and its parallaxes at kiloparsec ranges are not
      measurements at all. Borrowing only the direction means a future revision
      of HIP 63911's distance cannot move this world without someone deciding
      that it should.
    would_settle: >-
      Where the 698 ly comes from. A real object's distance ought to rest on
      real research, and if some measurement supports 698 then that measurement
      is what the map should follow rather than either the article or HYG. If
      instead the figure is the worldbuilder's, then tying this system to HIP
      63911 at all is the thing to reconsider: a fiat distance attached to a
      real star is a disagreement that grows every time the star is measured
      again. The catalogue may be weak here, but that is a reason to check both
      sides rather than to assume the other one is right.
    links:
      - https://www.orionsarm.com/eg-article/5385f65c43e09

  - id: sesharia-two-designations
    topic: Sesharia
    status: open
    severity: contradiction
    summary: The article and the colony table name different stars.
    detail: >-
      The article gives GL 86 and HR 637 for Thraub's primary. The Inner Sphere
      colony table resolves the colony Sesharia to Gliese 54 A at 27 ly. Gliese
      54 and Gliese 86 are different stars, so one of the two is wrong.
    map_does: >-
      Bound to Gliese 54, the colony table's answer, because that one resolved
      against the catalogue and could be checked.
    would_settle: Which designation the article intends.
    links:
      - https://www.orionsarm.com/eg-article/48f94f1a7f8db

  - id: holders-outside-the-polity-list
    topic: Places held by bodies the polity list does not carry
    status: open
    severity: category
    summary: >-
      Some worlds are held by bodies that are not meta-empires, and the map has
      no way to say so except by leaving them blank.
    detail: >-
      The Amalgamation has been added to the polity list, having taken
      Halsokallan in 8760 and Adorate the year after: two worlds is enough to be
      worth a colour. The three remaining cases are each a different kind of
      thing, and none of them is a missing meta-empire.

      Lucida belongs to the academic Iota Network, which is small and holds one
      world here — too little to earn a colour yet. Big Tor is shared with the
      Free Sophic, which is not a separate power but Sophic-League-adjacent:
      polities sharing most of the League's ontology and less of its politics.
      Bullseye is simply independent, with ties to the Zoeific Biopolity that
      are ties and not membership.

      So the gap is not really a list of missing polities. It is that
      "adjacent to a meta-empire" and "independent" are both real states with no
      way to be drawn, and both currently render as the faint neutral ring that
      also means "holder unrecorded".
    map_does: >-
      Leaves the affiliation empty, which draws the faint neutral ring the map
      uses for a settled system nobody named holds. Accurate and unsatisfying,
      since it reads the same as an unclaimed world.
    would_settle: >-
      Nothing outstanding from the setting: the three have been identified. What
      is deferred is ours — a mark for meta-empire-adjacent affiliation, worth
      building once enough objects carry one to be worth distinguishing, and a
      way to say "independent" that does not look like "unknown". Neither is
      wanted yet at three objects.
    links:
      - https://www.orionsarm.com/eg-article/5c758943a42b2
      - https://www.orionsarm.com/eg-article/46674941b75a2
      - https://www.orionsarm.com/eg-article/4922e9afcd478
      - https://www.orionsarm.com/eg-article/45e4e60b2bec2

  - id: iota-network-not-a-polity-here
    topic: Lucida and the Iota Network
    status: settled
    severity: category
    summary: >-
      Lucida is the capital of the academic Iota Network, which has no entry in
      the polity list.
    detail: >-
      Corona's system passed out of the Non-Coercive Zone after a complicated
      history. Filing it under a former holder would misstate the present, and
      the current holder is not something this map knows about.
    map_does: >-
      Recorded with no affiliation at all, so it draws a neutral ring: settled,
      holder unstated. That is accurate and unsatisfying.
    would_settle: >-
      Folded into the broader question above, which covers three such cases
      rather than one.
    links:
      - https://www.orionsarm.com/eg-article/5c758943a42b2

  - id: fiat-distances-on-real-stars
    topic: Fictional distances attached to real objects
    status: open
    severity: policy
    summary: >-
      When a system's stated distance disagrees with the catalogue for the star
      it names, the useful question is where each number came from.
    detail: >-
      Three cases look alike on the map and are not alike at all. The stated
      figure may rest on research better than ours, in which case it is simply
      right and the catalogue entry here is stale. It may be a transcription
      slip — Third Def8's 35 ly against HD 6235's 346 has the shape of a lost
      digit rather than a disagreement. Or it may be the worldbuilder's own
      number, in which case attaching it to a real star creates a discrepancy
      that widens every time that star is measured again, and the setting would
      be better served by a position of its own than by a binding that ages
      badly. That last risk belongs to stars and does not carry over to clusters
      or associations: a star's distance is a property of one unambiguous
      object, so a fiat figure contradicts a fact and measurement converging
      makes the contradiction sharper, whereas a cluster's distance is a
      property of a membership set chosen by convention. Collinder 132 has been
      placed anywhere from 270 to 660 pc and carries the alias Theia 1765, a
      structure recovered by a clustering algorithm rather than a classical
      cluster. If the field settles on applying that label only beyond 600 pc, a
      setting that placed something at 460 has not been contradicted — the label
      has narrowed under it. The two failure modes are "the fiction is
      contradicted" and "the fiction's label drifts", and only the first gets
      worse with better data.
    map_does: >-
      Flags every such conflict and refuses to average them. Where the
      identifier looks sound and only the distance is doubted, the entry takes
      the star's direction and the setting's distance without binding to the
      star, so a later catalogue revision cannot silently move the world.
    would_settle: >-
      Whether Orion's Arm treats a stated distance as sourced from astronomy or
      as its own, and whether it would rather a system with a fiat distance keep
      its real-star identification or lose it.
    links:
      - https://www.orionsarm.com/eg-article/5385f65c43e09
      - https://www.orionsarm.com/eg-article/47a28b116776e

  - id: beta-arae-distance
    topic: Beta Arae and the Utopia Sphere core
    status: open
    severity: contradiction
    summary: >-
      Half the Utopia Sphere is measured from Beta Arae, and the star has since
      moved about a hundred light years further away.
    detail: >-
      Beta Arae is the origin the Encyclopaedia quotes the Utopia Sphere's core
      against: Huan Gao is 19 ly from it, the Wallace swarm 44, the Wilson swarm
      82, and Shangdu is in the system itself. Those figures are consistent with
      each other and with the stated distances from Sol only if Beta Arae is
      about 615 ly out. The catalogue used here puts it at 715. The directions
      are not in doubt — Wallace and Wilson sit 4.0 and 7.2 degrees from Beta
      Arae, against the 3.0 and 7.6 the article's numbers require, and the
      separation between the two swarms is given as 42 ly and comes out of the
      catalogue at 41.6. It is the radius that moved, in the star that everything
      else is referred to, and Beta Arae is a bright supergiant whose parallax is
      exactly the kind that gets revised. The consequence on the map is that a
      neighbourhood the setting describes as tens of light years across is drawn
      a couple of hundred across.
    map_does: >-
      Binds Beta Arae, Wallace and Wilson to their catalogue stars, since the
      identifications are confirmed independently by constellation and by the
      swarms' separation, and lets the distances be whatever the catalogue says.
      Huan Gao, which has no catalogue identifier, takes Beta Arae's direction
      and its own stated distance instead.
    would_settle: >-
      Which distance to Beta Arae the setting means, and whether the
      neighbourhood's internal distances or its distances from Sol should be
      preserved when the two cannot both hold.
    links:
      - https://www.orionsarm.com/eg-article/460c3bd4ad939
      - https://www.orionsarm.com/eg-article/4ce526a25575d
      - https://www.orionsarm.com/eg-article/46f879c9c42a8

  - id: topia-distance
    topic: Topia
    status: open
    severity: contradiction
    summary: >-
      Topia's article names a star at 2,716 ly and places the world at 609.
    detail: >-
      The article identifies Topia as HIP 85986 and gives its distance as 609
      ly. The catalogue puts that star at 2,716 — four and a half times further,
      the widest disagreement in this file by some way, and far past the point
      where two figures can be the same object measured twice. The direction is
      not in question: HIP 85986 is 1.87 degrees from Beta Arae, exactly where a
      world of the Utopia Sphere's core should be, and 609 ly is the same
      distance the article gives Eutopia. So the article is self-consistent
      about where Topia is and inconsistent about which star it orbits. Either
      the identifier was chosen for its position on the sky without its parallax
      being read, or it is a different star from the one intended.
    map_does: >-
      Takes HIP 85986's direction and the article's distance, and does not bind.
      Topia draws in the core, 108 ly from Beta Arae, which is where it is meant
      to be. Binding to the star would have put a Utopian megastructure 2,000 ly
      out in the Middle Regions on the strength of a catalogue number.
    would_settle: >-
      Only the identifier is still open — that Topia belongs in the core rather
      than the outer volumes is not in dispute. Whether HIP 85986 is the star
      meant, or a number that should be dropped in favour of the distance.
    links:
      - https://www.orionsarm.com/eg-article/47a3ec6e06652

  - id: tannhauser-minnesang
    topic: Tannhauser and Minnesang
    status: open
    severity: uncertainty
    summary: One article, two system names, one distance.
    detail: >-
      The article names both Tannhauser and Minnesang, describes them as systems,
      and gives a single distance of 685 ly in Ara. Whether that is one system
      under two names, or two systems close enough to share a figure, changes
      whether the map should draw one marker or two.
    map_does: >-
      Draws one place, Tannhauser, with Minnesang recorded as an alternative
      name. Splitting it would mean inventing a separation between the two,
      which no source gives.
    would_settle: Whether Tannhauser and Minnesang are one system or two.
    links:
      - https://www.orionsarm.com/eg-article/47a13d7c77388

  - id: trhn-expansion
    topic: TRHN
    status: settled
    severity: uncertainty
    summary: TRHN is the TechnoRapture HyperNation, and stays abbreviated.
    detail: >-
      Shangdu arrived as joint Utopia Sphere and TRHN, an initialism no article
      expands. It is the TechnoRapture HyperNation, a near-Sephirotic empire —
      diffuse, and holding the Rosette Cluster jointly with the Non-Coercive
      Zone. That the articles use the letters and not the name is the setting's
      own usage rather than an omission, so the legend follows it. The map had
      the polity already, under the full name, and briefly carried it twice.
    map_does: >-
      Lists the polity as TRHN, as the articles write it, with the expansion
      recorded here and in a comment beside its colour.
    would_settle: Settled.
    links:
      - https://www.orionsarm.com/eg-article/4d5d92f9dcd6d

  - id: far-view-position
    topic: Far View and the Red Star 'M'pire
    status: open
    severity: uncertainty
    summary: >-
      Far View's position on this map is inferred, not read, and two arcs fit
      the constraints equally well.
    detail: >-
      No article gives the Red Star 'M'pire coordinates, so the map computes
      them, which makes this the only estimated position it draws. The text
      constrains it twice over. Far View sits on a tidal streamer of the
      Sagittarius Dwarf, and that stream follows a great circle whose pole is
      at roughly l 274, b -13.5 — a nearly polar plane that crosses the
      galactic plane at l 4 and l 184 and passes within 13.5 degrees of the
      galactic poles. Separately the system is put about 1,200 ly above the
      Solar Dominion's volume, and the Maximum Air caption puts the galactic
      plane some 2,000 ly off as seen from the Dyson's outer surface — figures
      that agree if the Dominion's envelope tops out near 800 ly. Requiring
      both leaves two arcs and not one: a northern near l 210, b +60, and a
      southern near l 20, b -50, both lying within a degree of the stream
      plane. The northern is chosen on the strength of one word. "Above" in
      galactographic usage is galactic north, and the Dominion's own capital
      supports it — Fons Luminis is Xi Ursae Majoris at l 195, b +69, eleven
      degrees from the estimate. The southern arc would put Far View toward
      Capricornus instead, nearer the dwarf's own position, and nothing rules
      it out.
    map_does: >-
      Draws Far View in Leo Minor at 2,400 ly, marked as an estimate: the
      panel gives the derivation and the ring is dashed, the same as any place
      whose position the sources only bound. It is the only entry that says
      the position came from us rather than from Orion's Arm.
    would_settle: >-
      Any stated position for Far View or for the 'M'pire's volume; failing
      that, whether "above the Solar Dominion" was meant as galactic north.

  - id: red-star-streamer-plausibility
    topic: The Red Star 'M'pire's streamer
    status: open
    severity: contradiction
    summary: >-
      The neighbourhood the articles describe is a good deal richer than a
      halo streamer 2,000 ly off the plane would be.
    detail: >-
      The 'M'pire is built on tidal debris from the Sagittarius Dwarf, which is
      old, metal-poor and thin. Two details sit awkwardly against that. Far View
      is given two stellar companions within 10 ly, which is ordinary disk
      density — a real stream segment at that height would be far emptier, and
      a star with neighbours that close is not in a stream so much as in the
      disk the stream is passing through. And three planetary nebulae close
      enough to dominate the sky is generous at 2,000 ly off the plane, where
      they are short-lived and thinly spread, though metal-poor Population II
      stars do produce them. Underneath both is a question about the real
      structure: whether the Sagittarius stream has appreciable debris this
      close to the plane and this near Sol at all, or whether the streamer that
      "intersects the Terragen Sphere" is the setting's own.
    map_does: >-
      Places Far View where the setting's numbers put it and draws no streamer,
      the stream not being in any catalogue this map loads. The 'M'pire's cells
      were grown along that streamer, so it should read as a filament inclined
      steeply to the disk rather than a volume, and one recorded place cannot
      outline that either.
    would_settle: >-
      Whether the streamer is meant as the real Sagittarius stream or as a
      structure of the setting's own, and how far the 'M'pire's filament runs.
