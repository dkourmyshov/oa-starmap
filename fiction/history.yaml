        precision: 'exact'
        text: 'Rogue Genie incident, Melliflua, Negentropy Alliance.'
        links:
          - {kind: 'article', id: '464e8e45c11e1', text: 'Genie'}
          - {kind: 'topic', id: '45cd35531fb53', text: 'Negentropy Alliance'}
      - year_at: 7340
        until_at: null
        precision: 'exact'
        text: 'Schism war ends in the fracturing of the Refugium Federation . The radicals accept help from the Andian Mission and join the NoCoZo, while the orthodox worlds choose to remain isolated.'
        links:
          - {kind: 'topic', id: '476ec04039002', text: 'Refugium Federation'}
          - {kind: 'article', id: '45f4846ae8275', text: 'Andian Mission'}
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'NoCoZo'}
      - year_at: 7365
        until_at: null
        precision: 'exact'
        text: 'The Institute of Ruffa Geometry attacks the Network of Temp-logic with antimatter weaponry on Cavy Australis more.'
        links:
          - {kind: 'topic', id: '45c69a64a38b8', text: 'more'}
      - year_at: 7388
        until_at: null
        precision: 'exact'
        text: 'This year provides an early warning sign of ArchSaur''s aggressive memetic prowess and fierce protectiveness of her citizens. A dreadnought from the Vanguard Alliance had arrived in the system''s outer orbit, programmed to cause as much damage as possible and to wound the pride of the emerging local superpower. The 3 km dreadnought was annihilated within hours by a much smaller Dominator cruiser. Within the space of a single day, thousands of Archosaurian Archangel corvettes, led by a single Metathrone (minor godling), emerged through the Vanguard Domain''s wormhole. Without causing a single civilian casualty, the fleet launched a concerted viral attack on the mind of the insane Vanguard godling, converting em into a willing ally, and destroying the very foundation of the polity''s fanatical religion.'
        links:
          - {kind: 'article', id: '48f7ffc7c1000', text: 'ArchSaur'}
          - {kind: 'article', id: '474e2c94b0a12', text: 'Vanguard Alliance'}
      - year_at: 7388
        until_at: null
        precision: 'exact'
        text: 'New Beneficence tacitly supports the ArchSaur''s reaction to the attack by the Vanguard Alliance as a "measured and necessary" response to the situation.'
        links:
          - {kind: 'article', id: '48f7ffc7c1000', text: 'ArchSaur'}
      - year_at: 7388
