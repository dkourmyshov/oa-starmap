          - {kind: 'article', id: '45e64aad49366', text: 'AI viruses'}
          - {kind: 'topic', id: '492d6aa0a549a', text: 'S1'}
          - {kind: 'article', id: '463a9472ed12f', text: 'Conver Ambi'}
