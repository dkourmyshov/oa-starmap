          - {kind: 'article', id: '48000db9a9c2f', text: 'Black Acropolis swarm'}
      - year_at: 4710
        until_at: null
        precision: 'exact'
        text: 'A group of 27 first singularity cyborgs and eir followers/pets (around 500 nearbaselines) sought out a Type K star to build a place away from the post-Version War economic chaos (see Cableville).'
        links:
          - {kind: 'article', id: '48fdb8829e239', text: 'Version War'}
          - {kind: 'article', id: '48ac37b0e82ba', text: 'Cableville'}
      - year_at: 4715
        until_at: null
        precision: 'exact'
        text: 'An unusual congregation of brown dwarfs and jovian worlds discovered 750 light-years to rimward of Sol by the Deeper Covenant, later to become known as the Realm.'
        links:
          - {kind: 'topic', id: '45cfcc88d9410', text: 'Deeper Covenant'}
          - {kind: 'article', id: '4aaed32f4b1e3', text: 'the Realm'}
      - year_at: 4716
        until_at: null
        precision: 'exact'
        text: 'the SI:2 philosopher Contemplative Neverflux suddenly announces that e had elucidated a new metaphysical system, and forms the School of Continuous Death. Eir philosophy is popularized by eir seminal work, The Illusion of Survival. While most who read it are unconvinced and consider the implications absurd, Neverflux attracts a significant following.'
        links:
          - {kind: 'article', id: '47fedc0c5b93d', text: 'Contemplative Neverflux'}
          - {kind: 'article', id: '483b1eddcaeab', text: 'School of Continuous Death'}
      - year_at: 4718
        until_at: null
        precision: 'exact'
        text: 'The posthuman Qang Der Pyï¿½ï¿½ introduces a new way for bionts to themselves be preserved. Adapting the technology of nanostasis, the body of a biont can be preserved and maintained, while with the oversight of a dedicated hyperturing, the brain can be made to repeat the same thought over and over again. This emulates the state of mind of a Notee in a biont; in the following years and decades several "communities" of these biont Notees are preserved on starships launched into interstellar space. However, biont Notees never become as widespread as virch Notees.'
        links:
          - {kind: 'topic', id: '45c54923c3496', text: 'hyperturing'}
          - {kind: 'article', id: '47f4311eaef31', text: 'Notee'}
      - year_at: 4732
        until_at: null
        precision: 'exact'
        text: 'Ghedhia-9 migrates with eir entire ISO to Harbinger Dyson following reopening of the stargates after the Version War.'
        links:
          - {kind: 'article', id: '464e91c081a47', text: 'Ghedhia-9'}
          - {kind: 'article', id: '46674b9181a4f', text: 'Harbinger Dyson'}
          - {kind: 'article', id: '48545a0f6352a', text: 'stargates'}
      - year_at: 4733
