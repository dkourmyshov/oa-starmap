        text: 'Pioneer 10 Autonomous Heritage Museum established by the Solar Organisation, using Negentropic-provided datasystems and a catapult-launched conversion drive vec ship.'
        links:
          - {kind: 'article', id: '47c1b07834a5f', text: 'Pioneer 10'}
      - year_at: 4000
        until_at: null
        precision: 'exact'
        text: 'The Shipwright''s Commune now own almost 25 stations, two of them a third of moon size.'
        links:
          - {kind: 'article', id: '483b11070d0cc', text: 'Shipwright''s Commune'}
      - year_at: 4000
        until_at: null
        precision: 'exact'
        text: 'Effective management of Complex Psychological Disorders now commonplace.'
        links:
          - {kind: 'article', id: '4bcabe2585bc9', text: 'Complex Psychological Disorders'}
      - year_at: 4010
        until_at: null
        precision: 'exact'
        text: 'The Ylkalo Revival on Corona ends.'
        links:
          - {kind: 'article', id: '4770391dd5432', text: 'Ylkalo Revival'}
      - year_at: 4011
        until_at: null
        precision: 'exact'
        text: 'Terragen probes make first contact with several of the To''ul''h cultures. Any interested To''ul''h are invited to join the Terragen civilisations, and many prove highly receptive to Terragen technology and ideas. To''ul''h ideas sparks a renaissance era in many Terragen cultures.'
        links:
          - {kind: 'article', id: '48013b4a38f9c', text: 'first contact'}
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''h'}
      - year_at: 4012
        until_at: null
        precision: 'exact'
        text: 'The mysterious entity known as the Merged Humanoid entered the Keterist system Ascension.'
        links:
          - {kind: 'article', id: '4bad4b80c9d52', text: 'Merged Humanoid'}
      - year_at: 4026
        until_at: null
        precision: 'exact'
        text: 'Lucas Jordan is one of the very few ex-Niuearth baselines to became a well-adapted pre-Superior.'
        links:
          - {kind: 'article', id: '47f1a8b5bfbfa', text: 'Lucas Jordan'}
      - year_at: 4044
        until_at: null
        precision: 'exact'
        text: 'The First Vec War breaks out in the Rigel Vector between Metasoft and the Silicon Generation clade Emotive Cognation, apparently due to a territorial dispute.'
        links:
          - {kind: 'article', id: '48fdd30f36eb0', text: 'First Vec War'}
      - year_at: 4044
        until_at: null
        precision: 'exact'
        text: 'New Beneficence protests against the destruction of backups by Metasoft forces in the First Vec War.'
        links:
          - {kind: 'article', id: '48fdd30f36eb0', text: 'First Vec War'}
      - year_at: 4077
