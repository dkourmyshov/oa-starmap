        links:
          - {kind: 'article', id: '486021b8643b2', text: 'Eurekan Cybercracy'}
      - year_at: 294
        until_at: null
        precision: 'exact'
        text: 'Industrial nano-tech widely accessible. Because of the dangers involved Earth governments, corporations, and military institutions regulate self-replicating systems carefully, all assemblers are limited by artificially imposed limitations.'
        links:
          - {kind: 'topic', id: '48af69e4f2fb3', text: 'nano-tech'}
      - year_at: 295
        until_at: null
