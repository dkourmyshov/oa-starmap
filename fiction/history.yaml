      - year_at: 4666
        until_at: null
        precision: 'exact'
        text: 'The first Lesser Archive was found orbiting the brown dwarf Niflheim in the GIA 348-5443344 system by a refugee ship fleeing the 4635 AT destruction of the Sagittarius Sphere system Canakka by the Negentropy Alliance.'
        links:
          - {kind: 'article', id: '48000b3e907d6', text: 'Lesser Archive'}
          - {kind: 'article', id: '4782eae239002', text: 'Sagittarius Sphere'}
          - {kind: 'topic', id: '45cd35531fb53', text: 'Negentropy Alliance'}
      - year_at: 4673
