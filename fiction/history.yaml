      - year_at: 3931
        until_at: null
        precision: 'exact'
        text: 'The diamondoid civilizations on the inner worlds of Beta Virginis spontaneously transcend. The Great Whale ISO generates a swarm of nanobots, the Gesture of Sheltering the Ocean, to prevent a wash of nanoreplicators from affecting Pacifica and the outer colonies.'
