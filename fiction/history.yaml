        links:
          - {kind: 'article', id: '4ac20a8f616b5', text: 'Immunity Challenge'}
      - year_at: 7068
        until_at: null
        precision: 'exact'
        text: 'The Uservere Affair (Inner Sphere MPA corp transcension event) causes hypereconomic collapse and meltdown in many Inner Sphere and Middle Regions systems.'
