          - {kind: 'article', id: '50bfb35472f7b', text: 'fifth singularity transcension'}
      - year_at: 3966
        until_at: null
        precision: 'exact'
        text: 'Freedom of Computing retro fad turns out to be a memetic assault on the several polity''s software efficiencies leading up to a large scale series of corporate takeovers.'
        links:
          - {kind: 'article', id: '465105bc693a6', text: 'Freedom of Computing'}
      - year_at: 3970
        until_at: null
        precision: 'exact'
