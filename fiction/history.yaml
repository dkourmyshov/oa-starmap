      - year_at: 1915
        until_at: null
        precision: 'exact'
        text: 'The World of Meditating Idols discovered; debates centered on whether it was evidence of a pre-technological stone-carving society (as the scientists saw it) or, as many cultists believed, a center of cosmic energy and vibration. In any case, although no living aliens have yet been met, the discovery of ruins and artifacts such as this excites tremendous interest.'
