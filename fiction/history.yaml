        text: 'Eostre evolves into the Third Toposophic Level. She uploads herself into a 12.7 kilometer-wide golden sphere, which had been constructed in a geosynchronise orbit on the far side of Eostremonath''s moon. This sphere, afterwards called the Body of Eostre by the locals, is then moved into a stable 400 kilometer high orbit. [61 Virginis].'
