          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jupiter'}
      - year_at: 292
        until_at: null
        precision: 'exact'
        text: 'The Gengineer Republic is founded on Horvat Station near Himalia as a potential rival to the Jovian League.'
        links:
          - {kind: 'article', id: '464e8dd4d719c', text: 'Gengineer Republic'}
      - year_at: 293
        until_at: null
