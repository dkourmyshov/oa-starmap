      - year_at: 4594
        until_at: null
        precision: 'exact'
        text: 'Superbright engineer and project manager James Prakash Napoleon Vitalyevitsch Tscherbaschov is born on Djed as son of Vitaly Clyde Tscherbaschov, transmission protocol safety specialist, and Natalie Christine Nsengba, editor of a popular nanotech virchmagazine: more.'
