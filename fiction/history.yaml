        links:
          - {kind: 'article', id: '4eea898c42349', text: 'Solaris'}
      - year_at: 3965
        until_at: null
        precision: 'exact'
        text: 'The Lagrange Defenders, a research/exploration megacorp-institute discover a still-functioning wormhole of alien origin in the region of Neb 34786, later to become known as Tunh.'
        links:
