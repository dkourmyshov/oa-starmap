    kind: 'period'
    parent: 'inner-sphere-era'
    start_at: 4650
    end_at: 5200
    events:
      - year_at: 4653
        until_at: null
        precision: 'exact'
        text: 'The Bardwell Treaty, and the famous Tilia-Zwicky Accords the following year, including hostage exchanges (which later came to evolve into the ComEmp node systems) and the spread of autowar ceasefire codes were the first of a long series of bootstrap ceasefires designed to end the war. More.'
