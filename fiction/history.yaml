      - year_at: 5210
        until_at: null
        precision: 'exact'
        text: 'Tunh Logika formally joined the Institute of Exopaleontology as a department-nation.'
        links:
          - {kind: 'article', id: '49afd86e67383', text: 'Institute of Exopaleontology'}
      - year_at: 5212
        until_at: null
        precision: 'exact'
        text: 'A relativistic Spacefarer Union fleet along with a Solar Dominion linelayer reach the Elcondris system.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer Union'}
          - {kind: 'topic', id: '45ce432e44565', text: 'Solar Dominion'}
          - {kind: 'article', id: '4baeabe6b64b1', text: 'Elcondris system'}
      - year_at: 5212
        until_at: null
        precision: 'exact'
        text: 'The Spacefarer Union fleet arrives at the Elcondris system. The Elcondris War.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer Union'}
          - {kind: 'article', id: '4baeabe6b64b1', text: 'Elcondris War'}
      - year_at: 5221
        until_at: null
        precision: 'exact'
        text: 'First Clarketech Finity Box discovered.'
        links:
          - {kind: 'article', id: '4b0d5fc969b5f', text: 'Clarketech'}
          - {kind: 'article', id: '464d177a003f8', text: 'Finity Box'}
      - year_at: 5222
        until_at: null
        precision: 'exact'
        text: 'The Spacefarer Union hands over Elcondris to the Solar Dominion.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer Union'}
          - {kind: 'article', id: '4baeabe6b64b1', text: 'Elcondris'}
      - year_at: 5230
        until_at: null
        precision: 'exact'
        text: 'Cableville''s economy continues to grow, mainly due to tourism.'
        links:
          - {kind: 'article', id: '48ac37b0e82ba', text: 'Cableville'}
      - year_at: 5236
        until_at: null
        precision: 'exact'
        text: 'the SI:3 overseer of the system Memory of Saint Superthinker , Glorsheeng the Goodwitch of the Rimwards, proclaims that, in keeping with the teachings of Contemplative Neverflux and the School of Continuous Death, e has converted all subsingularity beings in the star system into Notees. [see Perversion of Glorsheeng].'
        links:
          - {kind: 'topic', id: '492d73280dc85', text: 'SI:3'}
          - {kind: 'article', id: '483b1eddcaeab', text: 'School of Continuous Death'}
          - {kind: 'article', id: '4bafe46d7ea4c', text: 'Perversion of Glorsheeng'}
      - year_at: 5239
        until_at: null
        precision: 'exact'
        text: 'The Memory of Saint Superthinker star system elected to join the Sophic League in gratitude for its assistance against Glorsheeng.'
        links:
          - {kind: 'topic', id: '45ce471d24974', text: 'Sophic League'}
          - {kind: 'article', id: '4bafe46d7ea4c', text: 'Glorsheeng'}
      - year_at: 5243
        until_at: null
        precision: 'exact'
        text: 'Transcension of Gyzantium Gyzaarno, the author of Baseline Bob.'
        links:
          - {kind: 'article', id: '483ae0c5c76e2', text: 'Baseline Bob'}
      - year_at: 5248
        until_at: null
        precision: 'exact'
        text: 'The first wormhole was set up at the Fordela system. This opens up a new era for the Shipwright''s Commune.'
        links:
          - {kind: 'article', id: '483b11070d0cc', text: 'Shipwright''s Commune'}
      - year_at: 5250
        until_at: null
        precision: 'exact'
        text: 'Battle of Dumbbell and defeat of Daveth Tweaks.'
        links:
          - {kind: 'article', id: '4e5aa72ed5cf0', text: 'Battle of Dumbbell'}
      - year_at: 5250
        until_at: null
        precision: 'exact'
        text: 'Darblue Robotics, would had been suffering poor sales for a century, was taken over by Nucog Androids, under the Free Hyperturing Node G+ar045. As part of the process of economic rationalism, a reflecting the vision of a brave new Post ComEmp world, assembly of the Butlermaster 4500 was discontinued, although customer support was extended for another 150 years.'
        links:
          - {kind: 'article', id: '46119ffbb7552', text: 'Butlermaster 4500'}
      - year_at: 5288
        until_at: null
        precision: 'exact'
        text: 'Preliminary studies and experiments convince the Oshi-Durtam Web Council to implement an ambitious plan to create their own "tame" AI god cluster. This leads to an "artilect race" with several of the Inner Sphere empires working to create their own cluster. More on The Surreal Rash.'
        links:
          - {kind: 'article', id: '48114afa516df', text: 'More on The Surreal Rash'}
      - year_at: 5291
        until_at: null
        precision: 'exact'
        text: 'Ghedhia-9 succeeds in creating eir first siddha clade, the Patanjali Class Neogen.'
        links:
          - {kind: 'article', id: '464e91c081a47', text: 'Ghedhia-9'}
          - {kind: 'article', id: '5219078cd7ecf', text: 'siddha clade'}
      - year_at: 5300
        until_at: null
        precision: 'circa'
        text: 'A significant fraction of the budding AI heresies evolve over time and embrace Beneficence, usually resulting in their merger with New Beneficence and a sizeable increase in the number of adherent Beneficents.'
        links:
          - {kind: 'article', id: '483f5ec5eb666', text: 'Beneficence'}
      - year_at: 5309
        until_at: null
        precision: 'exact'
        text: 'Grignard colonised.'
        links:
          - {kind: 'article', id: '4cfd1ab04285b', text: 'Grignard'}
      - year_at: 5350
        until_at: null
        precision: 'exact'
        text: 'The Oshi-Durtam Web controlled transcendence event leads to disaster, with uncontrolled transapientech and godtech blooms across the region, reshaping planetary surfaces and space habitats beyond recognition. Billions of sentients are killed or reshaped beyond recognition. The MPA and other interstellar neighbours immediately destroy the wormhole links to prevent the nanotech plague from spreading. Naturally the other powers cancel their own AI projects. More on the Surreal Rash.'
        links:
          - {kind: 'topic', id: '45cfd5f861a04', text: 'transapientech'}
          - {kind: 'topic', id: '45cd3240ea58a', text: 'MPA'}
          - {kind: 'topic', id: '48af69e4f2fb3', text: 'nanotech'}
          - {kind: 'article', id: '48114afa516df', text: 'More on the Surreal Rash'}
      - year_at: 5392
        until_at: null
        precision: 'exact'
        text: 'Pioneer 10 Autonomous Heritage Museum pillaged by cloudharvester pirates, who manage to breach the perimeter defences and make off with much of the Museum''s solidstate modules, but left the Pioneer probe and its surrounding adamantite shell mostly intact. A mission by the Fomalhaut Acquisition Society intercepted the probe and its shell, and what was left of the Autonomous Heritage Museum, at nearly one light year from Sol in 5400 AT.'
        links:
          - {kind: 'article', id: '47c1b07834a5f', text: 'Pioneer 10'}
          - {kind: 'topic', id: '45cbd30e46c61', text: 'Fomalhaut Acquisition Society'}
      - year_at: 5393
        until_at: null
        precision: 'exact'
        text: '"Papercutters" - mite-like creatures from Macrystis (Lontis II, Solar Dominion) with a foraging behavior and ecological niche very similar to terrestrial leaf cutter ants, discovered.'
        links:
          - {kind: 'article', id: '47bceeaa3c0b8', text: 'Papercutters'}
          - {kind: 'article', id: '4edf88339f50b', text: 'Macrystis'}
      - year_at: 5394
        until_at: null
        precision: 'exact'
        text: 'The Efficiency Maximization Paradigm takes a militant turn and begins to upload everyone and everything into virtual nanotech form.'
        links:
          - {kind: 'topic', id: '46212d6e18aa1', text: 'Efficiency Maximization Paradigm'}
      - year_at: 5394
        until_at: null
        precision: 'exact'
        text: 'New Beneficence comes out against the Efficiency Maximization Paradigm as "well intentioned" but "misguided" in its efforts to involuntarily upload everything into virch form.'
        links:
          - {kind: 'article', id: '483f5ec5eb666', text: 'New Beneficence'}
          - {kind: 'topic', id: '46212d6e18aa1', text: 'Efficiency Maximization Paradigm'}
