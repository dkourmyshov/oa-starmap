        links:
          - {kind: 'article', id: '483aeae53a74a', text: 'Supermundane'}
      - year_at: 6899
        until_at: null
        precision: 'exact'
        text: 'Second Vec War Battle for Dilmun.'
        links:
          - {kind: 'article', id: '50c72a4ca8ba6', text: 'Second Vec War'}
      - year_at: 6900
        until_at: null
        precision: 'exact'
        text: 'Ishtar''s Necklace colonised.'
        links:
          - {kind: 'article', id: '4decac1f6d953', text: 'Ishtar''s Necklace'}
      - year_at: 6909
        until_at: null
        precision: 'exact'
        text: 'Yellow giant star Enif erupts in a superflare, largely destroying the local civilisation.'
        links:
          - {kind: 'article', id: '48fb5d37cbdb6', text: 'Enif'}
      - year_at: 6914
        until_at: null
        precision: 'exact'
        text: 'The Hu Earth Liberation Army sends several powerful bombs towards the surface of Old Earth; none reach the surface, although some detonate prematurely in restricted space.'
        links:
          - {kind: 'article', id: '462eae95003f8', text: 'Old Earth'}
      - year_at: 6915
        until_at: null
        precision: 'exact'
        text: 'Conclusion of the Second Vec War within the Wormhole Nexus volume. The conflict continues to smoulder beyond reach of stargate communications.'
        links:
          - {kind: 'article', id: '50c72a4ca8ba6', text: 'Second Vec War'}
      - year_at: 6916
        until_at: null
        precision: 'exact'
        text: 'A contact fleet launched from Polonius (see Refugium Federation) reaches a nearby world, and diplomatic contact begins. The aliens turn out to be Kestnerists. The Kestnerists give the Semperists the news that humankind has survived. The news led to the Schism War, as radicals want to rejoin the larger human community while traditionalists want the Federation to remain isolated.'
        links:
          - {kind: 'topic', id: '476ec04039002', text: 'Refugium Federation'}
      - year_at: 6939
        until_at: null
        precision: 'exact'
        text: 'ArchSaur is still the youngest godling in the Archaipelago Cluster. She also becomes the first within the cluster to breach the fourth toposophic barrier, sixty-seven years before UrchinStar.'
        links:
          - {kind: 'article', id: '48f7ffc7c1000', text: 'ArchSaur'}
          - {kind: 'article', id: '48f8103be50fb', text: 'Archaipelago Cluster'}
          - {kind: 'topic', id: '492d78f2b8fde', text: 'fourth toposophic'}
          - {kind: 'article', id: '48f80671277a7', text: 'UrchinStar'}
      - year_at: 6956
        until_at: null
        precision: 'exact'
        text: 'Saint Warwick Rebellion begins, causes a crisis in the Sophic League.'
        links:
          - {kind: 'article', id: '46f9ce1b1945c', text: 'Saint Warwick Rebellion'}
      - year_at: 6956
        until_at: null
        precision: 'exact'
        text: 'Every larger Alchemist population centre is struck by mysterious, seemingly unrelated, accidents. While no common denominator can be found to link the various disasters, it is commonly agreed upon that the Alchemists, by their Malignancy crusade, have annoyed some higher toposophic being enough to provoke a response, and are now paying the price.'
        links:
          - {kind: 'article', id: '47e868058e7d0', text: 'Alchemist'}
      - year_at: 6956
        until_at: null
        precision: 'exact'
        text: 'Transcension of Jilunan.'
        links:
          - {kind: 'article', id: '4682f11ba8b6b', text: 'Jilunan'}
      - year_at: 6903
        until_at: null
        precision: 'exact'
        text: 'The AI godlet Chahipho declared bankrupt in most NoCoZo systems and shareholders moved in to take what little remained of the fortune. Chahipho more or less barricades emself in We Lucky Few, threatening to destroy the collection or vital installations in the system if approached.'
        links:
          - {kind: 'article', id: '4624222bd237b', text: 'Chahipho'}
      - year_at: 6954
        until_at: null
        precision: 'exact'
