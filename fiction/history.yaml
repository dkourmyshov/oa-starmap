      - year_at: 1620
        until_at: null
        precision: 'exact'
        text: 'In alliance with the Amats, the Mainstream Pacifican administration industrialises once again, established PSA or Pacific Space Agency, as a joint venture with SecureSpace, with 51% local ownership. (Pacifica - Beta Virginis).'
        links:
