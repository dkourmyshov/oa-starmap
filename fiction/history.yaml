      - year_at: 1931
        until_at: null
        precision: 'exact'
        text: 'Instruments at New Callisto, the nearest large hu-inhabited polity, cease to detect information-rich signals from the Xi Geminorum AI - 1 Civilization; the AIs are never heard from again. After hastily running through a number of simulations the Newcallistons suspect the civilization has transcended or undergone a hyperbolic collapse. However the distinctive and exotic radiation associated with this a-human civilisation can still be detected; some suspect that this radiation comes from traversable wormholes. This is confirmed when the first exploration missions reached XI Geminorum; an abandoned network of small and primitive wormholes was discovered leading to the Hyades cluster, and this network allowed the various exploration concerns to rapidly colonise the entire volume. This becomes the wealthy and successful Taurus Nexus. Meanwhile the technology of the traversable wormholes is studied eagerly by Federation transapients, with the ultimate goal of reverse engineering.'
        links:
