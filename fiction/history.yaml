      - year_at: 3344
        until_at: null
        precision: 'exact'
        text: 'The existence of an extinct terraforming species, the Halogenics, is postulated by Irene Habelsein-Io of the Boten Orbital Institute of Xenopaleology to explain the finds of two halogen-based biospheres with similar genetic codes and base biochemistry on Tytalus (DM-28 694 I) and Outland (Enterprise V).'
