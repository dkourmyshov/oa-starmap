        links:
          - {kind: 'article', id: '4eb9314768886', text: 'Locus'}
      - year_at: 6802
        until_at: null
        precision: 'exact'
        text: 'Samaelians contacted.'
        links:
          - {kind: 'topic', id: '510a95630431e', text: 'Samaelians'}
      - year_at: 6803
        until_at: null
        precision: 'exact'
        text: 'Second Vec War Proden invaded by Teleological Tendency forces.'
        links:
          - {kind: 'article', id: '50c72a4ca8ba6', text: 'Second Vec War'}
          - {kind: 'article', id: '4703bd784536b', text: 'Proden'}
      - year_at: 6810
        until_at: null
        precision: 'exact'
        text: 'Merger of a conglomerate of orbital projects, corporations and other organisations in the Skiiws''nnii system, called the Orbital Exploration Bundle (OEB), quickly reaching tremendous influence.'
        links:
          - {kind: 'article', id: '49112098c57a7', text: 'Skiiws''nnii'}
      - year_at: 6823
        until_at: null
        precision: 'exact'
        text: 'The software of Bagerit Jhe "implodes" catastrophically. Over 40,000 people are killed instantly as various metastable systems explode, dynamic structures collapse, and life support functions stop. In just 24 hours the death toll increases to six million and in the end tops out at 23 million beings. more. Some conspiracy theorists link this event with the Second Vec War.'
        links:
          - {kind: 'article', id: '480a4f64762fd', text: 'more'}
      - year_at: 6826
        until_at: null
        precision: 'exact'
        text: 'The cyborg "Xarander the Conqueror" establishes a prosperous but highly autocratic system wide hegemony of Hip 99265/Newhope.'
        links:
          - {kind: 'article', id: '490b210f5bc0b', text: 'Newhope'}
      - year_at: 6850
        until_at: null
        precision: 'exact'
        text: 'Second Vec War Seven new archai have been created in the Triplet Cluster since the start of the conflict by the Teleological Tendency.'
        links:
          - {kind: 'article', id: '50c72a4ca8ba6', text: 'Second Vec War'}
      - year_at: 6859
        until_at: null
        precision: 'exact'
        text: 'Tabridgen settled by Orion Federation trader and exploration neumanns.'
        links:
          - {kind: 'article', id: '491232472b626', text: 'Tabridgen'}
          - {kind: 'topic', id: '45cd3dcc18626', text: 'Orion Federation'}
      - year_at: 6862
        until_at: null
        precision: 'exact'
