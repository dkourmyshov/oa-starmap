        precision: 'exact'
        text: 'Adaptive Nanosystems uses their inhouse cyborg fleet in a military strike against NoCoZo competitor megacorps to gain monopolist control over organizator nanite production, in fragrant breach of the Non-Coercion Zone Treaty of 1598 AT. The response by other NoCoZo signatories was massive, and the corporation was utterly destroyed.'
