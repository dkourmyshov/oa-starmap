# The history of the Terragen Sphere, imported from the Encyclopaedia Galactica.
#
#   Source: History of the Terragen Sphere
#   Page:   https://www.orionsarm.com/eg-topic/45b170f9e0941
#   Terms:  https://www.orionsarm.com/Terms_Copyright_and_Submissions.html
#
# Seven eras, each divided into periods, plus the pre-spaceflight ages kept for
# completeness. `start_at` and `end_at` are years After Tranquility; both are
# empty where the source gives no year — the Preterragen Era opens at the Big
# Bang and the Current Era has no end.
#
# A period's `events` are the lines of its own dated timeline, in the order the
# page gives them. `links` is what each line hyperlinks: the article id, which
# is what binds a line to a place on the map. The link text is kept beside it
# because the id alone says nothing to a reader of this file, but the id is what
# the build matches on — the Encyclopaedia names several places alike, and every
# one of them has an id of its own.
#
# The pre-spaceflight pages date in b.c.e. rather than A.T. and are imported
# with no events at all, rather than with events on a second, unmarked epoch.
#
# Regenerate with `uv run oastarmap import-history`, which rewrites this file
# from the saved pages. Re-importing discards hand edits, so review the diff.

periods:
  - id: 'preterragen-era'
    topic: '4858422267d00'
    name: 'Preterragen Era'
    title: '-13.7Gy to -7000 AT: Preterragen Era'
    kind: 'era'
    parent: ""
    start_at: null
    end_at: -7000
    events: []
  - id: 'pre-spaceflight-old-earth'
    topic: '45b2a375249bb'
    name: 'Pre-Spaceflight Old Earth'
    title: '-7000 to 30 AT: Pre-Spaceflight Old Earth'
    kind: 'era'
    parent: ""
    start_at: -7000
    end_at: 30
    events: []
  - id: 'atomic-age'
    topic: '460b135b0c6d8'
    name: 'Atomic Age'
    title: 'Atomic Age'
    kind: 'period'
    parent: 'pre-spaceflight-old-earth'
    start_at: null
    end_at: null
    events: []
  - id: 'bronze-age'
    topic: '4621266ba1638'
    name: 'Bronze Age'
    title: 'Bronze Age'
    kind: 'period'
    parent: 'pre-spaceflight-old-earth'
    start_at: null
    end_at: null
    events: []
  - id: 'iron-age'
    topic: '49b474256b68e'
    name: 'Iron Age'
    title: 'Iron Age'
    kind: 'period'
    parent: 'pre-spaceflight-old-earth'
    start_at: null
    end_at: null
    events: []
  - id: 'agricultural-age'
    topic: '45b2ae037c7b4'
    name: 'The Agricultural Age'
    title: '7000 BT to 270 BT: The Agricultural Age'
    kind: 'period'
    parent: 'pre-spaceflight-old-earth'
    start_at: -7000
    end_at: -270
    events: []
  - id: 'industrial-age'
    topic: '45b2aea00c2d7'
    name: 'The Industrial Age'
    title: '270 BT to 30 AT: The Industrial Age'
    kind: 'period'
    parent: 'pre-spaceflight-old-earth'
    start_at: -270
    end_at: 30
    events: []
  - id: 'solsys-era'
    topic: '45b2a67c27083'
    name: 'Solsys Era'
    title: '0030 to 0900 AT: Solsys Era'
    kind: 'era'
    parent: ""
    start_at: 30
    end_at: 900
    events: []
  - id: 'information-age'
    topic: '45b2afc424975'
    name: 'The Information Age'
    title: '030 to 130 AT: The Information Age'
    kind: 'period'
    parent: 'solsys-era'
    start_at: 30
    end_at: 130
    events:
      - year_at: 33
        until_at: null
        precision: 'exact'
        text: 'September 11 terrorist attack on New York Twin Towers and Pentagon changes the shape of the political climate for the next several decades.'
        links: []
      - year_at: 33
        until_at: null
        precision: 'exact'
        text: 'Teleoperated robotics starts to play an increasing role in warfare, particularly anti-terrorist operations.'
        links: []
      - year_at: 34
        until_at: null
        precision: 'exact'
        text: 'Human genome sequenced.'
        links: []
      - year_at: 35
        until_at: null
        precision: 'exact'
        text: 'Chinese launch their first manned rocket, the Shenzhou V, and become the third Earth polity to put a man in space.'
        links:
          - {kind: 'article', id: '46258b8334917', text: 'Chinese'}
      - year_at: 38
        until_at: null
        precision: 'exact'
        text: 'Hand-held web-connected camera phones allow individuals quick and easy access to independent news sources, social networks, and other media. Concerns about privacy and adverse effects on society subsequently grow.'
        links: []
      - year_at: 39
        until_at: null
        precision: 'exact'
        text: 'Dawn solar-powered ion-drive space probe is launched by NASA to study Vesta and Ceres.'
        links:
          - {kind: 'article', id: '4937335577105', text: 'ion-drive'}
          - {kind: 'article', id: '48f72fe95c51f', text: 'Vesta'}
          - {kind: 'article', id: '4615b46864514', text: 'Ceres'}
      - year_at: 39
        until_at: null
        precision: 'exact'
        text: 'Genetic Information Nondiscrimination Act (GINA) enacted in the United States.'
        links:
          - {kind: 'article', id: '45f0ce22dbf24', text: 'United States'}
      - year_at: 40
        until_at: null
        precision: 'circa'
        text: 'Alongside TV and cinema, social media such as homemade Internet videos becomes a significant source of entertainment as well as a new platform of social influence.'
        links: []
      - year_at: 40
        until_at: null
        precision: 'circa'
        text: 'Thousands of exoplanets begin to be detected, including some worlds similar in size to Earth in the habitable zone of their star. Searching for biosignatures is not yet possible.'
        links: []
      - year_at: 41
        until_at: null
        precision: 'exact'
        text: 'First synthetic bacterial cell created, modeled on a naturally evolved organism.'
        links: []
      - year_at: 42
        until_at: null
        precision: 'exact'
        text: 'IBM''s Watson computer wins quiz show Jeopardy.'
        links: []
      - year_at: 43
        until_at: null
        precision: 'exact'
        text: 'Paralyzed woman completes marathon using powered bodysuit.'
        links: []
      - year_at: 46
        until_at: null
        precision: 'exact'
        text: 'New Horizons probe reaches Pluto.'
        links:
          - {kind: 'article', id: '46fc4919cdee8', text: 'Pluto'}
      - year_at: 47
        until_at: null
        precision: 'exact'
        text: 'Personal virtual reality media interfaces start to become more common and commercially successful; however, limits in the technology prevent widespread adoption at this time.'
        links:
          - {kind: 'topic', id: '637ce8a41bc7e', text: 'virtual reality'}
      - year_at: 51
        until_at: null
        precision: 'exact'
        text: 'An epidemic of SARS coronavirus starts in China and spreads around the globe. The disease and governmental stay-at-home orders to slow down its spread necessitate rapid advances in some aspects of teleconferencing and biomedicine.'
        links: []
      - year_at: 51
        until_at: null
        precision: 'exact'
        text: 'Simple 4-legged robots become available for commercial and industrial use.'
        links:
          - {kind: 'topic', id: '45b5756018624', text: 'robots'}
      - year_at: 52
        until_at: null
        precision: 'exact'
        text: 'Satellite internet constellations in low Earth orbit begin to be established by a number of corporations, providing widespread low latency, high reliability and high bandwidth internet services on the surface and in orbital stations. Over the following decades, global internet coverage is achieved and greatly expanded telepresence systems in space are developed.'
        links: []
      - year_at: 58
        until_at: null
        precision: 'exact'
        text: 'Artemis III mission lands humans on Luna, ending a decades-long gap in crewed off-Earth landings. The mission''s success spurs on efforts at further crewed exploration of Luna and later, Mars.'
        links: []
      - year_at: 59
        until_at: null
        precision: 'exact'
        text: 'Multiple teleoperated robots (telenauts) of various designs deployed off-Earth in several capacities. Use of teleoperation greatly reduces costs and increases the scale and range of missions that can be safely undertaken.'
        links: []
      - year_at: 60
        until_at: null
        precision: 'circa'
        text: 'Regenerative medicine products increasingly play a role in healthcare.'
        links: []
      - year_at: 65
        until_at: null
        precision: 'exact'
        text: 'Self-contained autonomous robot systems (homebots) with some generalist capabilities available commercially.'
        links: []
      - year_at: 65
        until_at: null
        precision: 'exact'
        text: 'Orbital Internet expanded to Luna using a series of satellites in Lunar orbit and receiver/repeaters landed around the location of the first planned installation. Teleoperated robots and fully autonomous robots (with limited functions) begin lunar development.'
        links: []
      - year_at: 66
        until_at: null
        precision: 'exact'
        text: 'Electrical and hybrid vehicles represent a large percentage of car ownership. Most nations have policies favoring them over the environmentally damaging combustion engine cars, and many countries have banned combustion engine vehicle sales entirely. There are ongoing heavy investments in the development of charging infrastructure worldwide and more efficient batteries, and in widespread transportation electrification.'
        links: []
      - year_at: 67
        until_at: null
        precision: 'exact'
        text: 'Onset of the "First AI Revolution" as the development of subsentient AI and AI-controlled robots results in a steep decline in human employment in some fields. Although these jobs are thereafter replaced in the labor market by more complex jobs that required general intelligence, the resulting socioeconomic upheaval leads to widespread political debate.'
        links: []
      - year_at: 67
        until_at: null
        precision: 'exact'
        text: 'First recorded attempts at holovision using optical phased arrays.'
        links:
          - {kind: 'article', id: '49d2d77d2227b', text: 'optical phased arrays'}
      - year_at: 68
        until_at: null
        precision: 'exact'
        text: 'Fragmentary records indicate that the inception of the Burning Library Project occurred around this date.'
        links:
          - {kind: 'article', id: '486ff7f788fbd', text: 'Burning Library Project'}
      - year_at: 68
        until_at: null
        precision: 'exact'
        text: 'The construction of the first "permanent" teleoperated Moon base begins. This base is entirely designed to be operated by telepresence and has no accommodation for biont inhabitants or visitors at this time.'
        links: []
      - year_at: 68
        until_at: null
        precision: 'exact'
        text: 'First manned Mars mission - the Discovery and Endeavor - launches for Mars, arriving in 69 AT. Teleoperated robots play a role in exploring various areas of the planet. After this initial mission, exploration beyond Luna reverts to unmanned probes for another 25 years.'
        links: []
      - year_at: 70
        until_at: null
        precision: 'exact'
        text: 'Precooled air-breathing rocket engines allow for the first trans-oceanic hypersonic airliners as well as reusable SSTO vehicles. Initial costs are high but dramatically decrease the launch costs to space.'
        links: []
      - year_at: 71
        until_at: 78
        precision: 'exact'
        text: 'Creation of first semi-sentient AI (several events). These entities are still not at a fully human-equivalent level.'
        links:
          - {kind: 'article', id: '47843961d02bf', text: 'semi-sentient'}
      - year_at: 75
        until_at: null
        precision: 'exact'
        text: 'Ken Ferjik, one of the great pioneers of virtuality mediated education, is born.'
        links:
          - {kind: 'article', id: '464b88ed2c319', text: 'Ken Ferjik'}
      - year_at: 78
        until_at: null
        precision: 'exact'
        text: 'Fully autonomous cars are legalized in a few nations and begin to take market share from human-controlled cars.'
        links: []
      - year_at: 79
        until_at: null
        precision: 'exact'
        text: 'A room temperature superconductor is discovered on an orbital research platform. The new material is comparatively simple to make but requires free-fall conditions to synthesize. Interest in space development increases markedly.'
        links:
          - {kind: 'article', id: '4a3271fc1b0e4', text: 'superconductor'}
      - year_at: 80
        until_at: null
        precision: 'circa'
        text: 'Fossil fuels are mostly phased out in favor of other, more sustainable energy sources. Nevertheless, energy remains a pressing concern for humanity as the ever increasing demand for power needs to be met without significantly compromising the environment. Disagreements on how to find balance between sustainability and progress drive some conflicts in the following decades.'
        links: []
      - year_at: 80
        until_at: null
        precision: 'exact'
        text: 'Virtual reality interfacing provided by contact-lens-based systems as well as comparable devices for auditory stimuli become common. Implantable devices to directly stimulate the retina are being tested on volunteers, but require further development before they are ready for the mass market.'
        links: []
      - year_at: 80
        until_at: null
        precision: 'exact'
        text: 'VirchMon first developed as smart pets, companions and virus guards for frequent net-users.'
        links:
          - {kind: 'article', id: '47f6f857965bc', text: 'VirchMon'}
      - year_at: 81
        until_at: null
        precision: 'exact'
        text: 'First inter-city Vac-train system developed in China with plans to extend through Asia to Europe and Africa as part of the Silk Road Development program.'
        links:
          - {kind: 'article', id: '48586a2ed9d04', text: 'Vac-train'}
      - year_at: 83
        until_at: null
        precision: 'exact'
        text: 'First magbeam projectors built in Earth orbit and on Luna. Each projector uses a large solar array and superconducting storage rings to produce the 82MW of energy needed to accelerate a 10 tonne transport craft on a tenth-gravity continuous boost trip to or from the Moon.'
        links:
          - {kind: 'article', id: '517edaa0de9c7', text: 'magbeam'}
      - year_at: 85
        until_at: null
        precision: 'exact'
        text: 'First High Energy Laser Launch systems deployed to boost cargo into LEO, Low Earth Orbit. Later designs employ a combination of magnetic acceleration and laser launch to boost crewed modules into orbit.'
        links:
          - {kind: 'article', id: '5182bccbd2a7f', text: 'High Energy Laser Launch systems'}
      - year_at: 86
        until_at: null
        precision: 'exact'
        text: 'First broadcasting of The Planet X epic-comedy-drama saga featuring the popular fictional character Morag the Moravec.'
        links:
          - {kind: 'article', id: '4a0c88d76ca81', text: 'Morag the Moravec'}
      - year_at: 87
        until_at: null
        precision: 'exact'
        text: 'First commercial fusion reactor (a D-T inertial confinement design) comes online in France, supplying 300MW of power to the European grid. In the following years, other commercial reactors are developed and built in a number of nations, marking the start of a global transition to a fusion-based economy.'
        links:
          - {kind: 'article', id: '4654e3ea9c809', text: 'fusion reactor'}
      - year_at: 87
        until_at: null
        precision: 'exact'
        text: 'Records of a brief fad for polypedal pots, robotic houseplant containers.'
        links:
          - {kind: 'article', id: '4887cffb463e2', text: 'polypedal pots'}
      - year_at: 88
        until_at: null
        precision: 'exact'
        text: 'Automated expedition sent to Mars on low energy transit to deliver a mag-beam system to planetary orbit to service the second Mars expedition.'
        links: []
      - year_at: 89
        until_at: null
        precision: 'exact'
        text: 'A coalition of several major corporations and investors launches an automated probe to intercept a small near-Earth orbiting asteroid, mine it, and return the results to Lunar orbit. Built as a proof-of-concept mission, the probe returns 100kg of asteroid material where it is picked up and delivered to labs in geosynchronous orbit.'
        links: []
      - year_at: 90
        until_at: null
        precision: 'circa'
        text: 'Origin of Cosmism, an AI-worshipping pantheistic religion.'
        links:
          - {kind: 'article', id: '4642840424e08', text: 'Cosmism'}
      - year_at: 90
        until_at: null
        precision: 'circa'
        text: 'First recorded cases of ultra-rich individuals and corporations attempting to develop space-based installations with the explicit purpose of seeking independence from Earth-based nations and their regulatory bodies. These are apparently intended to be used as tax havens or as sites of clandestine scientific and technological research.'
        links: []
      - year_at: 91
        until_at: null
        precision: 'exact'
        text: 'First Lunar settlement, a resort named Aldrin, consisting of a small cluster of habitat modules. Operations using telenauts, eventually including some operated entirely by AIs back on Earth, as well as purely robotic labor, are used to serve the guests and later, to extract resources.'
        links:
          - {kind: 'article', id: '57abad32321c0', text: 'Aldrin'}
      - year_at: 91
        until_at: null
        precision: 'exact'
        text: 'First orbital bolo satellite deployed to boost cargo and passengers from Low Earth Orbit to Geo-synchronous Orbit. Lost orbital momentum is made up using an electrodynamic tether system.'
        links: []
      - year_at: 91
        until_at: null
        precision: 'exact'
        text: 'The Very Large Interstellar Observation Array (a series of linked orbital LEO, optical telescopes) confirms the existence of a world resembling Archean Earth, Tau Ceti g.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Tau Ceti g'}
      - year_at: 92
        until_at: null
        precision: 'exact'
        text: 'Agriculture is so heavily automated that in many wealthy countries, less than 0.1% of the population are employed in the industry.'
        links: []
      - year_at: 94
        until_at: null
        precision: 'exact'
        text: 'Primitive Direct Neural Interfacing cranial nerve implants become commercially available. Costs are high for both the interface and the surgical implantation and removal. In addition, these models are later shown to have a relatively high probability of causing a number of undesirable side effects, including then untreatable neurodegenerative disease after years of use. Nevertheless, for those that can afford it, these early DNIs offer a mild boost to personal capability and open up access to new forms of entertainment from early virchworlds developed for users of the technology.'
        links:
          - {kind: 'article', id: '464cebf7c392d', text: 'Direct Neural Interfacing'}
      - year_at: 94
        until_at: null
        precision: 'exact'
        text: 'Second Mars expedition, this time using magbeam boosting systems to reduce trip time to 90 days each direction. A crew of 50 makes the journey to the red planet. The first Mars base is established, with 10 members of the expedition staying behind to begin exploration and research until the next transport vessel arrives to relieve them and rotate in the next crew of 25 explorers.'
        links: []
      - year_at: 95
        until_at: null
        precision: 'exact'
        text: 'First GEO bolo satellite deployed to both catch incoming modules from the Low Earth Orbit (LEO) bolos and to launch payloads toward the Moon and beyond.'
        links: []
      - year_at: 98
        until_at: null
        precision: 'exact'
        text: 'First mass driver built on the Moon. Used as a proof-of-concept of the technology and to launch both raw materials and eventually finished goods to several locations in the Earth-Moon volume as the drive to make space development self-sustaining continues.'
        links: []
      - year_at: 99
        until_at: null
        precision: 'exact'
        text: 'A method of cheaply mass-producing woven carbon nanotubes in free-fall conditions is invented. The resulting lines, tapes, and cables can be produced in lengths limited only by the tensile strength of the material itself.'
        links:
          - {kind: 'article', id: '46cce50416388', text: 'carbon nanotubes'}
      - year_at: 99
        until_at: 106
        precision: 'exact'
        text: 'Period of activity of the Atomic Spiders terrorist group.'
        links:
          - {kind: 'article', id: '48601f0ed7ae0', text: 'Atomic Spiders'}
      - year_at: 100
        until_at: 110
        precision: 'exact'
        text: 'Ruth Duorkin demonstrates the most sophisticated mobile life support systems yet seen; is remembered by later generations as a pioneering cyborg.'
        links:
          - {kind: 'article', id: '464f2c0c2751c', text: 'Ruth Duorkin'}
      - year_at: 102
        until_at: null
        precision: 'exact'
        text: 'After twelve years of exhaustive experimentation with AI and human intelligence augmentation the first AI with superior intelligence in all areas is created and quickly dubs itself a ''superturing''. Temporarily fears of AI are heightened, but after the nascent superturings are shown to not think in radically different ways from humans, as well as the increase in technological development from superturing holding institutes, these fears abate.'
        links:
          - {kind: 'article', id: '478c147987202', text: 'superturing'}
      - year_at: 104
        until_at: null
        precision: 'exact'
        text: 'First healthy baby born from artificial womb. Much cultural and political debate ensues as to when, if ever, this technology should be used.'
        links:
          - {kind: 'article', id: '483ad310bcfd2', text: 'artificial womb'}
      - year_at: 104
        until_at: null
        precision: 'exact'
        text: 'Smartswarm, a variant of synsects with destructive capabilities, is an early non-replicating form of military swarmtech. Most militaries of any size employ a combination of drones, robotics, and AI to augment their capabilities across a range of scales from individual soldiers to ground, sea, and aircraft.'
        links:
          - {kind: 'article', id: '48114cd37719c', text: 'synsects'}
      - year_at: 105
        until_at: null
        precision: 'exact'
        text: 'Further developments in DNI technologies improves safety and reduces the implantation and manufacturing costs. Upper middle-class individuals are beginning to be able to afford the costs of a DNI implant. The first mass-market DNI system is believed to be the "Gibson Neural Jack" (named after the cyberpunk writer), made by Biotronics Incorporated in conjunction with the VR-entertainment corporation Inscape. Over the following years, other corporations follow suit with competing models (the Hacker, the InterFase, etc.) and corporate competition pushes for further refinement and popularization of the technology.'
        links: []
      - year_at: 106
        until_at: null
        precision: 'exact'
        text: 'Project Thistledown uses the magbeam system on Luna to launch long duration probes to Venus, Mercury, Jupiter, and Saturn. Using a combination of hybrid magnetic-solar sails and onboard fuel to maneuver and decelerate, the probes deploy a variety of orbiters, landers, and balloon-based flyers on arrival. While the exact mix of secondary craft varies with the destination, a common chassis is used for all probes. The various landers and flyers have limited lifetimes generally ranging from 3-5 years. However, the main orbiting platforms have operational lifetimes of 20 years or more and provide an ongoing observational capability for much of the solar system.'
        links:
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
          - {kind: 'article', id: '48f93b9350fe7', text: 'Mercury'}
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jupiter'}
          - {kind: 'article', id: '4782f41f69d8c', text: 'Saturn'}
      - year_at: 106
        until_at: null
        precision: 'exact'
        text: 'First recorded backup of a Packrat Spore exoself.'
        links:
          - {kind: 'article', id: '4ba1012793821', text: 'Packrat Spore'}
          - {kind: 'article', id: '479bc31813cac', text: 'exoself'}
      - year_at: 108
        until_at: null
        precision: 'exact'
        text: 'Small but increasing scientific, government, and private enterprise presence on Luna and in orbit. Nevertheless anything beyond Low Earth Orbit (LEO) space travel is still too expensive for anyone except governments, a few corporations, and joyrides for wealthy private individuals. Buckyfiber-driven space rush opens up space to private investment.'
        links: []
      - year_at: 110
        until_at: null
        precision: 'exact'
        text: 'Chinese Gobi colonisation project begins with the dual aim of transforming the desert into habitable land and developing a model for self-sustaining high-tech extraterrestrial colonies. The project continues for many decades and in combination with international sister projects in the Antarctic, Atacama and Pacific spearheads CELSS technology and colonial economic management.'
        links:
          - {kind: 'topic', id: '45cfd626aae0d', text: 'high-tech'}
          - {kind: 'article', id: '487bcedfeac75', text: 'CELSS'}
      - year_at: 111
        until_at: null
        precision: 'exact'
        text: 'Automated mining of half a dozen Near-Earth asteroids begins delivering commercial quantities of material to the Earth-Luna volume. Most is used in space-based manufacture, but some particularly valuable rare-Earth elements are shipped back to Earth-surface for various applications.'
        links:
          - {kind: 'article', id: '460c39f266c1e', text: 'mining'}
      - year_at: 112
        until_at: null
        precision: 'exact'
        text: 'Recorded completion date of the Burning Library Project.'
        links:
          - {kind: 'article', id: '486ff7f788fbd', text: 'Burning Library Project'}
      - year_at: 114
        until_at: null
        precision: 'exact'
        text: 'Human intelligence augmentation shareware becomes available, principally memory and concentration boosters. Initially dangerous to mental health, the establishment of reputable regulation bodies and strict testing protocols fosters greater safety and consumer confidence. While costs of DNI installation have fallen, they remain prohibitive for many, prompting fears of a wealth-induced intelligence gap. A few governments and businesses look to subsidise installation for their citizens and consumers.'
        links:
          - {kind: 'article', id: '4664c840693a8', text: 'intelligence augmentation'}
      - year_at: 115
        until_at: null
        precision: 'exact'
        text: 'Mass cyberattack by JESTERZ, followed by a large alien invasion hoax months later.'
        links:
          - {kind: 'article', id: '4681ab9633853', text: 'JESTERZ'}
      - year_at: 117
        until_at: null
        precision: 'exact'
        text: 'Establishment of Artemis, a settlement on Luna, designed for a population of 200. Primarily consists of researchers and workers performing tasks considered too delicate or real-time dependent to use telepresence technology operating from Earth. Much of the population''s work consists of supervising robots or operating telepresence tech distributed across the Lunar surface. The remainder of the population consists of support personnel of various sorts.'
        links:
          - {kind: 'article', id: '4b6c9c57be6fa', text: 'Artemis'}
      - year_at: 118
        until_at: null
        precision: 'exact'
        text: 'As AI becomes more widespread, reactionary elements in the general public like the Kaczynskites and the Friends of Ludd become increasingly alarmed at the rise of artificial intelligence and see it as a danger to humanity.'
        links:
          - {kind: 'article', id: '468afc90274f1', text: 'Friends of Ludd'}
      - year_at: 119
        until_at: null
        precision: 'exact'
        text: 'An internet based virtual conflict centered on North America which shifts a number of assets and influence from previous geopolitical and corporate powers to new players.'
        links:
          - {kind: 'article', id: '4664d1701158b', text: 'conflict'}
      - year_at: 120
        until_at: null
        precision: 'circa'
        text: 'The increasing population of Earth (which has now reached 10 billion) and the decrease in easily exploitable resources and human-induced climate change leads to famines, epidemics and many small-scale conflicts. Numerous environmental mitigation projects are underway, many of which have conflicting objectives.'
        links: []
      - year_at: 125
        until_at: null
        precision: 'exact'
        text: 'The international Near Earth Object detection and control program is successful in collecting several small Earth-approaching objects; those which are easily diverted into Earth Orbit are used in the construction and extension of orbital habitats, manufacturing facilities, and hotels.'
        links: []
      - year_at: 126
        until_at: null
        precision: 'exact'
        text: 'The Deep Space Skymining corporation, a commercial asteroid and space junk interception concern, lobbies for a space elevator to be built.'
        links:
          - {kind: 'article', id: '4860302509e2a', text: 'space elevator'}
      - year_at: 129
        until_at: null
        precision: 'exact'
        text: 'First crewed fusion drive spacecraft using a D-T z-pinch design. Transit times to Mars are greatly reduced, and expeditions to the Outer System begin to be discussed as .01g brachistochrone (continuous boost) flight profiles become possible. However, the majority of traffic, and especially cargo, continues to use mag-beam propulsion.'
        links:
          - {kind: 'article', id: '49398ddb0191d', text: 'fusion drive'}
  - id: 'interplanetary-age'
    topic: '45b2b10d8b211'
    name: 'The Interplanetary Age'
    title: '130 to 400 AT: The Interplanetary Age'
    kind: 'period'
    parent: 'solsys-era'
    start_at: 130
    end_at: 400
    events:
      - year_at: 130
        until_at: 150
        precision: 'exact'
        text: 'Several key breakthroughs in genetic research occur. Comprehensive models of phenotype expression from genotypes are developed allowing for the physical consequences of genetic engineering to be accurately modeled. Synthetic intracellular delivery systems allow for precise and safe insertion of novel DNA into somatic cells, continual doses can alter the DNA of every cell over time. An international framework of regulation along with effective business models incentivise the development of reversible somatic tweaks, eliminating early-adopter concerns. Taken together these began to enable a vast diversity of morphological experimentation and freedom, and heteromorphic phenotyping ("exotics") becomes popular with transhumanists and biopunk groups and individuals. However social and cultural resistance remains strong, especially amongst those who have no wish to augment themselves but risk being pushed out of the dwindling job market by enhanced humans.'
        links:
          - {kind: 'article', id: '4c3d2dbd10b25', text: 'heteromorphic'}
          - {kind: 'article', id: '483b1fa12680a', text: 'transhumanists'}
      - year_at: 131
        until_at: null
        precision: 'exact'
        text: 'Formation of the Corporate Republic of Indonesia.'
        links:
          - {kind: 'article', id: '465ccf57b2789', text: 'Corporate Republic of Indonesia'}
      - year_at: 132
        until_at: null
        precision: 'exact'
        text: 'Completion of Clarke Station, a 400-meter rotating space habitat intended as a waystation for the exploration of the solar system.'
        links:
          - {kind: 'article', id: '48b5f0c332fcc', text: 'rotating space habitat'}
      - year_at: 132
        until_at: null
        precision: 'exact'
        text: 'First Manned landing on Ceres Hamada Mesa, when three NASA/Russian space programme craft arrive to establish a base and small scale mining operation. Autonomous mining operation established, controlled by a semisentient AI known as Anya.'
        links:
          - {kind: 'article', id: '4870c5e93f02a', text: 'Manned landing on Ceres'}
      - year_at: 134
        until_at: null
        precision: 'exact'
        text: 'The first documented appearance of the unidentified AI entity Hal in a virtual chat on AI rights.'
        links:
          - {kind: 'article', id: '47fed76eb915f', text: 'Hal'}
      - year_at: 136
        until_at: null
        precision: 'exact'
        text: 'According to one report, retro fad for Static Music thanks to an interview with the AI Kilburn in which e listed it as among eir favorite music forms.'
        links:
          - {kind: 'article', id: '4b5136d212684', text: 'Static Music'}
          - {kind: 'article', id: '47feda56953c6', text: 'Kilburn'}
      - year_at: 136
        until_at: null
        precision: 'exact'
        text: 'Talk of shutting down Artemis, but a consortium of private investors step in with government aid and the station survives.'
        links:
          - {kind: 'article', id: '4b6c9c57be6fa', text: 'Artemis'}
      - year_at: 138
        until_at: null
        precision: 'exact'
        text: 'Completion of Biosphere III, a 100-meter self-supporting space colony, funded by international governments and a consortium of large corporations, and employing some nano-manufactured building materials.'
        links: []
      - year_at: 142
        until_at: null
        precision: 'exact'
        text: 'The first space elevator constructed from Luna to the L1 point as a proof-of-concept and test bed for space elevator technology. In later years, it is used to transport passengers and cargo to and from the L1 point and to launch supplies in support of development and colonization missions to the rest of the Solar System.'
        links:
          - {kind: 'article', id: '4860302509e2a', text: 'space elevator'}
          - {kind: 'article', id: '467892171fffb', text: 'L1 point'}
      - year_at: 144
        until_at: null
        precision: 'exact'
        text: 'First convincing dinosaur ''reverse engineered'' by modifying chicken DNA. It is the size of a turkey and does not resemble any known species. It excites widespread interest. Jurassic Park Retro comes briefly into fashion during the northern summer.'
        links:
          - {kind: 'article', id: '464ba2a7274f4', text: 'dinosaur'}
      - year_at: 149
        until_at: null
        precision: 'exact'
        text: 'First colonies established around Jupiter.'
        links:
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jupiter'}
      - year_at: 150
        until_at: null
        precision: 'circa'
        text: 'Transcranial Magnetic Stimulation becomes popular.'
        links:
          - {kind: 'article', id: '4a2fa04c59dbf', text: 'Transcranial Magnetic Stimulation'}
      - year_at: 151
        until_at: 158
        precision: 'exact'
        text: 'A severe recession known as the Great Downturn sweeps the globe as unemployment increases dramatically with AI and robots replacing human labor across a swath of jobs once thought safe from automation. Global warming and the difficult transition to a fusion-based economy exacerbate the effects of the Great Downturn many of which would linger for decades. Early proponents of the New Economy Movement start to develop post-capitalist socioeconomic models.'
        links: []
      - year_at: 152
        until_at: null
        precision: 'exact'
        text: 'First fully robotic operation with no human or AI input (aside from oversight), an appendectomy performed in record time. Funding into further improvements later allows for automated DNI installation, significantly decreasing costs and increasing DNI adoption.'
        links: []
      - year_at: 154
        until_at: null
        precision: 'exact'
        text: 'Port Robinson Martian colony expands to a permanent population of 1000.'
        links:
          - {kind: 'article', id: '48e77e52e27f8', text: 'Martian colony'}
      - year_at: 157
        until_at: null
        precision: 'exact'
        text: 'Release of the Feynman Expert System.'
        links:
          - {kind: 'article', id: '464d0d5d1638b', text: 'Feynman Expert System'}
      - year_at: 159
        until_at: null
        precision: 'exact'
        text: 'Substantial devolution of EF powers to Regional Congresses.'
        links: []
      - year_at: 160
        until_at: null
        precision: 'exact'
        text: 'Commercially available artificial lifeforms (neogens) by the big biotech corporations, human cloning for the wealthy widely in place, bio-chips allow direct (although still primitive) neural interface with the Net (VR w/o a headset and hotsuit).'
        links:
          - {kind: 'topic', id: '45bd68cb57dec', text: 'neogens'}
          - {kind: 'article', id: '46282d18163a6', text: 'human cloning'}
          - {kind: 'article', id: '464cebf7c392d', text: 'neural interface'}
          - {kind: 'article', id: '46661e24a643d', text: 'Net'}
      - year_at: 160
        until_at: null
        precision: 'exact'
        text: 'Superbright human tweaks born in increasing numbers; these do not represent a new species, however, since they are very diverse and do not yet breed true.'
        links:
          - {kind: 'article', id: '4b3e3fa3b9a87', text: 'Superbright'}
      - year_at: 162
        until_at: null
        precision: 'exact'
        text: 'The first permanent colony on Vesta is established.'
        links:
          - {kind: 'article', id: '48f72fe95c51f', text: 'Vesta'}
      - year_at: 162
        until_at: null
        precision: 'exact'
        text: 'First crewed bubblehab built in the upper atmosphere of Venus.'
        links:
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
      - year_at: 163
        until_at: null
        precision: 'exact'
        text: 'The first design by the Cult of the Exsanguinated Giraffe is posted on the NanoDot datasphere site.'
        links:
          - {kind: 'article', id: '464d11732c315', text: 'Cult of the Exsanguinated Giraffe'}
      - year_at: 165
        until_at: null
        precision: 'exact'
        text: 'Macroscale Von Neumann self-replicating robot systems (Neumanns) developed. Initially limited, the effect on industry is still immense. Deep sea mining, large-scale construction and biosphere monitoring are the first industries to greatly benefit. Later adapted for use in mining operations and colony construction off the Earth; interplanetary trade begins to be commercially viable.'
        links:
          - {kind: 'topic', id: '6a674d925a73f', text: 'Von Neumann self-replicating robot systems'}
      - year_at: 165
        until_at: null
        precision: 'exact'
        text: 'Solar power collection farms in Earth L2 location reach 100GW of generating capacity. Primary uses are powering interplanetary mag-beam systems and beaming power to various industrial installations on the Lunar surface and in orbit, including the new Project Badra particle accelerator, under construction to experiment with antimatter creation. Several visionaries predict the eventual construction of new farms in near-solar orbit for the production of antimatter.'
        links:
          - {kind: 'article', id: '45f0c6529a0e8', text: 'antimatter'}
          - {kind: 'article', id: '45f0c79d13c29', text: 'new farms'}
      - year_at: 165
        until_at: null
        precision: 'exact'
        text: 'Discovery of the "Weeping Wall" of Satori Crater, Planitia, Mars.'
        links:
          - {kind: 'article', id: '4a6f97fc61c1d', text: 'Satori Crater'}
      - year_at: 168
        until_at: null
        precision: 'exact'
        text: 'Discovery that, as theorised, Mars possessed a crustal environment suitable for BioGeoComputing, but empty of life. The Mars Development Corporation (MDC) begins experiments towards the creation of a Martian BioGeoComputing (BGC) ecosystem of chemosynthetic bacteria.'
        links:
          - {kind: 'article', id: '480a3f71b7738', text: 'BioGeoComputing'}
      - year_at: 170
        until_at: null
        precision: 'exact'
        text: 'Surveillance becomes almost universal on Earth and in many colonies. Most people accept this, and adjust their behaviour accordingly. Some do not.'
        links: []
      - year_at: 170
        until_at: null
        precision: 'exact'
        text: 'Gaianist philosophies. Publication of the public domain cryptopagan webbook Earth Rights. A number of Gaianist philosophies become popular. These emphasize humanism and respect for the environment.'
        links:
          - {kind: 'article', id: '464d2a6d693c9', text: 'Gaianist'}
      - year_at: 175
        until_at: null
        precision: 'exact'
        text: 'First truly different human subspecies revealed (The Merpeople).'
        links:
          - {kind: 'article', id: '47f2faf7f0b2d', text: 'Merpeople'}
      - year_at: 177
        until_at: null
        precision: 'exact'
        text: 'First Martian space elevator begins construction using the lessons learned from the Lunar elevator. Built both as a test-bed/prototype for an eventual elevator on Earth and to support eventual Martian colonization.'
        links: []
      - year_at: 184
        until_at: null
        precision: 'exact'
        text: 'First permanent scientific outpost on Europa.'
        links:
          - {kind: 'article', id: '49b08fc238643', text: 'Europa'}
      - year_at: 185
        until_at: null
        precision: 'exact'
        text: 'Martian space elevator completed (behind schedule and over budget). Allowed easier access to and from the Martian surface, and acted as a test bed and demonstrator for the Earth elevator project.'
        links: []
      - year_at: 186
        until_at: null
        precision: 'exact'
        text: 'First human equivalent autonomous moravec robots (vecs); before this date independently mobile robots were limited to sub-human intelligence by law. Limits to processor capability result in these early vecs being of considerable size, comparable to terrestrial megafauna.'
        links:
          - {kind: 'topic', id: '45c5299b77999', text: 'vecs'}
      - year_at: 186
        until_at: null
        precision: 'exact'
        text: 'Construction begins on EF-1 - intended as an emergency meeting point (and safe haven) for the European Federation parliament.'
        links:
          - {kind: 'article', id: '4c1db9d238473', text: 'European Federation'}
      - year_at: 189
        until_at: null
        precision: 'exact'
        text: 'First amat mining expedition sent to Saturn system on a low energy 7 year voyage managed by AI control. Sophont project managers and researchers follow later using fusion ships. The development of amat mining from the Saturnian magnetic field and hydrocarbon extraction from Titan will drive the industrialization and colonization of the Outer System for centuries to come.'
        links:
          - {kind: 'article', id: '45f0c79d13c29', text: 'amat mining'}
          - {kind: 'topic', id: '45b1774e4ba77', text: 'Sophont'}
      - year_at: 190
        until_at: null
        precision: 'exact'
        text: 'Solipsist AIs begin to lose philosophical credit and influence.'
        links:
          - {kind: 'article', id: '4786dee22ccf3', text: 'Solipsist AIs'}
      - year_at: 190
        until_at: null
        precision: 'exact'
        text: 'Corporate owned space stations and moon bases under construction become tax havens for business. Lee Interorbital has a fleet of low earth orbit LEO shuttles.'
        links: []
      - year_at: 190
        until_at: null
        precision: 'circa'
        text: 'Dozens of independent mining companies are sending craft to the Asteroid Belt, each relying on the return fuel mining operations to get back to Earth orbit with their cargo of metals.'
        links:
          - {kind: 'article', id: '460c39713fb28', text: 'Asteroid Belt'}
      - year_at: 194
        until_at: null
        precision: 'exact'
        text: 'First crewed Amat Catalysed Fusion spacecraft.'
        links: []
      - year_at: 195
        until_at: null
        precision: 'exact'
        text: 'Neotek''s "Universal Micro" becomes the first assembler to be publicly available, although it still remains a long way from the Drexler''s vision of a universal assembler.'
        links:
          - {kind: 'article', id: '45f9b06829b97', text: 'assembler'}
      - year_at: 195
        until_at: null
        precision: 'exact'
        text: 'The Aldrin cycler Valparaiso is launched towards Mars, a journey it will continue to make for more than 250 years.'
        links:
          - {kind: 'article', id: '51802602b7abd', text: 'Aldrin cycler'}
      - year_at: 196
        until_at: null
        precision: 'exact'
        text: 'Construction begins on the first Terran space elevator, the ''Tangga Bintang'' ("Ladder to the Stars") extending down from orbit to the island of Sulawesi in the Corporate Republic of Indonesia.'
        links:
          - {kind: 'article', id: '4860302509e2a', text: 'space elevator'}
      - year_at: 196
        until_at: null
        precision: 'exact'
        text: 'Completion of O''Neill One, a Bernal Sphere housing 10,000 people. This was constructed using Lunar mining and launch infrastructure, which opened up the exploration and colonisation of solar system like never before.'
        links:
          - {kind: 'article', id: '460c3b453fb24', text: 'Bernal Sphere'}
      - year_at: 199
        until_at: null
        precision: 'exact'
        text: 'The high surveillance society results in psychological discomfort for some personality types, which cannot be cured even with advanced therapy. A safety valve is offered by the colonisation of the Solar system.'
        links: []
      - year_at: 199
        until_at: null
        precision: 'exact'
        text: 'First genetically engineered Space Adapted Humans are born.'
        links:
          - {kind: 'article', id: '47f6ce3a74e30', text: 'Space Adapted Humans'}
      - year_at: 198
        until_at: 200
        precision: 'exact'
        text: 'Due to the constant disputes over territory on Ceres and the other asteroid colonies the United Nations of Earth sends a joint mission to link up with the four small colonies on Ceres and establish an administrative centre for the entire asteroid belt. An underground town is quickly constructed in a deep Dzougatov strip mine. Many smaller habitats soon follow.'
        links:
          - {kind: 'article', id: '4870c5e93f02a', text: 'Ceres'}
      - year_at: 201
        until_at: null
        precision: 'exact'
        text: 'Ceres City is pressurised, ready to attempt regulation of the already chaotic minor planets and their inhabitants.'
        links:
          - {kind: 'article', id: '4870c5e93f02a', text: 'Ceres City'}
      - year_at: 201
        until_at: null
        precision: 'exact'
        text: 'Corporate orbital habitat Elysium (also known as Marcus World), combination of theme park, business hotel, and tax and data haven, established by Lee Interorbital.'
        links:
          - {kind: 'article', id: '58bd7e3cea381', text: 'data haven'}
          - {kind: 'article', id: '467b21f755b27', text: 'Lee Interorbital'}
      - year_at: 202
        until_at: 210
        precision: 'exact'
        text: 'Heteromorphing and extreme body modifications are the latest fad among the educated and fashion-conscious classes.'
        links: []
      - year_at: 203
        until_at: null
        precision: 'exact'
        text: 'First automated mining stations in the Belt are established.'
        links:
          - {kind: 'article', id: '4b9b83bd91ffd', text: 'the Belt'}
      - year_at: 205
        until_at: null
        precision: 'exact'
        text: 'California secedes from the United States after the passage of the 40th Amendment to the U.S. Constitution.'
        links:
          - {kind: 'article', id: '46031c28e3454', text: 'California'}
      - year_at: 206
        until_at: null
        precision: 'exact'
        text: 'Cryostasis colony ship departs Earth for Titan.'
        links:
          - {kind: 'article', id: '46462d7124dee', text: 'Cryostasis'}
          - {kind: 'article', id: '48f92f7b152b9', text: 'Titan'}
      - year_at: 207
        until_at: null
        precision: 'exact'
        text: 'Secession of Herman Oberth Orbital and the L4 Complex. Money pours from Earth to the orbital digital tax havens, resulting in a further decline of the nation state.'
        links: []
      - year_at: 210
        until_at: null
        precision: 'exact'
        text: 'Atari Mhasalkar of the Republic of India makes first manned landing on Pluto.'
        links:
          - {kind: 'article', id: '465cce0150dba', text: 'Republic of India'}
          - {kind: 'article', id: '46fc4919cdee8', text: 'Pluto'}
      - year_at: 210
        until_at: null
        precision: 'exact'
        text: 'Deep Space Development Corporation uses nuclear charges to nudge an asteroid into a very eccentric orbit that will take it back and forth from near the Earth and out to Mars. Over the next half decade the asteroid is hollowed out, converted into a habitat and named Odyssey Transfer Station.'
        links: []
      - year_at: 210
        until_at: null
        precision: 'circa'
        text: 'The Vesta-based corporation, Outsystems Launches, begins to make plans for interstellar exploration and colonisation ships, using pulsed fusion drive, RAIR ships, and eventually amat catalysed fusion, eventually becoming one of the Solar System''s largest antimatter customers.'
        links: []
      - year_at: 212
        until_at: null
        precision: 'exact'
        text: 'First partially provolved animal species revealed (sapient bonobo). Over several generations of bonobo intelligence is raised to human adult level, along with language capabilities. The project is very controversial, not least due to the many bonobos inflicted with mental disabilities in the course of developing the techniques.'
        links:
          - {kind: 'article', id: '47e9b1653554a', text: 'sapient bonobo'}
      - year_at: 212
        until_at: 215
        precision: 'exact'
        text: 'The Nanoscale Collective on Asimov Orbital constructs an advance multipurpose assembler, the Genii 2 - Matter Compiler, which is followed by even more efficient types. Along with greater levels of automation social tensions are heightened due to mass unemployment. At the same time anxiety is widespread regarding the possibility of a grey goo outbreak. The New Economy Movement makes huge gains in popularity.'
        links: []
      - year_at: 212
        until_at: 216
        precision: 'exact'
        text: 'Extreme heteromorphing becomes passé among the educated and fashion-conscious classes.'
        links: []
      - year_at: 214
        until_at: null
        precision: 'exact'
        text: 'Full scale Martian Colonisation begins with first Fast Shuttle runs bringing second group of colonists.'
        links: []
      - year_at: 215
        until_at: null
        precision: 'exact'
        text: 'Ares Heavy Lifting and Lee Interorbital commence spacecraft construction in the Ceres Shipyards, actually two widely separated swarms of manufacturing elements in orbit 2000 km from Ceres.'
        links:
          - {kind: 'article', id: '45f9753888f04', text: 'Ares Heavy Lifting'}
      - year_at: 215
        until_at: null
        precision: 'exact'
        text: 'After an abortive attempt to resurrect various species of Pleistocene fauna for a nature park in Alaska, one particular animal becomes a literal overnight hit. Miniature woolly mammoths are brought on to the scene.'
        links:
          - {kind: 'article', id: '4a763f49828d1', text: 'Miniature woolly mammoths'}
      - year_at: 215
        until_at: null
        precision: 'exact'
        text: 'The Inner Council, officially the Council for the Peaceful Coordination and Development of the Inner Solar System (CPCDISS), created to mitigate conflict among state and non-state actors between Sol and the Asteroid Belt.'
        links: []
      - year_at: 216
        until_at: null
        precision: 'exact'
        text: 'Colony ship arrives at Titan; this colony cuts itself off from the rest of the solar system as the secretive Cishp.'
        links:
          - {kind: 'article', id: '48f92f7b152b9', text: 'Titan'}
      - year_at: 218
        until_at: null
        precision: 'exact'
        text: 'Jovian Colonists and antimatter miners begin a local conflict over territory.'
        links:
          - {kind: 'article', id: '4ba0f009dffe1', text: 'antimatter miners'}
      - year_at: 219
        until_at: null
        precision: 'exact'
        text: 'Jean Benoit Sampson, a second generation member of the Homo Superior clade, organises an epic corporate coup and gains leadership of Solar System Development Corporation (SSDC), a major commercial enterprise headquartered on Atlantis Habitat.'
        links:
          - {kind: 'article', id: '47fc2ccba05bf', text: 'Homo Superior'}
          - {kind: 'article', id: '46805c9b24e09', text: 'Solar System Development Corporation'}
      - year_at: 220
        until_at: null
        precision: 'exact'
        text: 'First bubble habs at Saturn. Initially these are scientific stations, but soon they are upgraded to small settlements that supervise helium-3 extraction and export operations'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubble habs'}
          - {kind: 'article', id: '4782f41f69d8c', text: 'Saturn'}
      - year_at: 220
        until_at: null
        precision: 'exact'
        text: 'Jovian Colonists defeat Amat Miners and prevent the disassembly of Amalthea.'
        links:
          - {kind: 'article', id: '4ba0f009dffe1', text: 'Amat Miners'}
      - year_at: 220
        until_at: null
        precision: 'exact'
        text: 'First Talking Dogs (Calebs) are achieved. They are not yet fully sophont.'
        links:
          - {kind: 'article', id: '47f42bae5c6ea', text: 'Talking Dogs'}
      - year_at: 220
        until_at: null
        precision: 'circa'
        text: 'Astraea Asteroid colonised by the all-female Parthene clade of superbright genetic tweaks, led by Jenni Denley.'
        links:
          - {kind: 'article', id: '486fec2d0c177', text: 'Astraea Asteroid'}
          - {kind: 'article', id: '486fec2d0c177', text: 'Parthene clade'}
      - year_at: 220
        until_at: null
        precision: 'circa'
        text: 'The first independent communities of Space Adapted Humans appear in Cislunar space and the asteroid belt.'
        links:
          - {kind: 'article', id: '47f6ce3a74e30', text: 'Space Adapted Humans'}
      - year_at: 221
        until_at: null
        precision: 'exact'
        text: 'Launch of von Neumann probes to the Centauri system.'
        links:
          - {kind: 'topic', id: '6a674d925a73f', text: 'von Neumann'}
          - {kind: 'article', id: '487146f744c8e', text: 'Centauri system'}
      - year_at: 222
        until_at: null
        precision: 'exact'
        text: 'Exoself Osnago, an independent grouping of enhanced microgravity tolerant cybercrats arrive at the L5 Mars-Sun Lagrange point and begin gathering the Trojan point objects together using solar sails.'
        links:
          - {kind: 'article', id: '486021b8643b2', text: 'Exoself Osnago'}
      - year_at: 224
        until_at: null
        precision: 'exact'
        text: 'The Martian Union forms under the auspices of the Inner Council as a supranational entity for fostering economic and political relations among the various colonies and the small but growing number of independent Martian polities.'
        links: []
      - year_at: 226
        until_at: null
        precision: 'exact'
        text: 'Odyssey habitat is renamed Tir Sorcha.'
        links:
          - {kind: 'article', id: '486018c00d410', text: 'Tir Sorcha'}
      - year_at: 226
        until_at: null
        precision: 'exact'
        text: 'Anjou Sharavi-Kidjo develops the Halomin musical instrument.'
        links:
          - {kind: 'article', id: '480d47f79c2ec', text: 'Halomin'}
      - year_at: 226
        until_at: null
        precision: 'exact'
        text: 'Alleged start for the ahistoricalMartian War of Independence according to the Red War Myth.'
        links:
          - {kind: 'article', id: '4a4bd3029cf59', text: 'Martian War of Independence'}
      - year_at: 227
        until_at: null
        precision: 'exact'
        text: 'Work begins on Elysium, the first O''Neill Cylinder orbital.'
        links:
          - {kind: 'article', id: '475a0f16edaa8', text: 'O''Neill Cylinder'}
      - year_at: 228
        until_at: null
        precision: 'exact'
        text: 'Freeport Unilateral Declaration of Autonomy happens in Ceres.'
        links:
          - {kind: 'article', id: '4870c5e93f02a', text: 'Ceres'}
      - year_at: 229
        until_at: null
        precision: 'exact'
        text: 'Elysium opens to the public with much fanfare, even though some of the agricultural and habitation zones are not yet completed.'
        links: []
      - year_at: 230
        until_at: null
        precision: 'exact'
        text: 'Extensive human genome tweaking results in several new human species.'
        links: []
      - year_at: 230
        until_at: null
        precision: 'exact'
        text: 'Fred DiProspero, born on Titov Orbital, starts space supremacism, arguing that in the long run it is necessary to free space from Earth: it is a heavy anchor holding humanity back, and the enormous population mostly consists of useless neophobes. Although himself neither in favour of the independent settlements or the corporate orbitals, his views come to be interpreted and used by them in very different ways.'
        links: []
      - year_at: 230
        until_at: null
        precision: 'exact'
        text: 'Bubblehabs on Venus are built on a small scale.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'Bubblehabs'}
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
      - year_at: 231
        until_at: null
        precision: 'exact'
        text: 'The colony on Titan became important to the Belt as a source of nitrogen, and the first experiments using Geoflex Computing occur on Enceladus.'
        links:
          - {kind: 'article', id: '48f92f7b152b9', text: 'Titan'}
          - {kind: 'article', id: '48507505eb286', text: 'Geoflex Computing'}
      - year_at: 234
        until_at: null
        precision: 'exact'
        text: 'Several distinct breeds of mammoths ''Mut are in existence, the most common being a long-legged, short-haired variety.'
        links:
          - {kind: 'article', id: '4a763f49828d1', text: 'mammoths ''Mut'}
      - year_at: 237
        until_at: null
        precision: 'exact'
        text: 'A fourth space elevator the ''Ascension'' is extended to the West Coast of Ecuador to accommodate the ever increasing flow of trade on and population on and off the Earth.'
        links: []
      - year_at: 240
        until_at: null
        precision: 'circa'
        text: 'The Parthenes are active in mining many smaller asteroids in the Astraea band, and many are engaged in deep space astronometry using the long baselines available.'
        links:
          - {kind: 'article', id: '486fec2d0c177', text: 'Parthenes'}
      - year_at: 240
        until_at: null
        precision: 'circa'
        text: 'Longevity treatment widely available, and many regions introduce new birth rate reduction strategies. Life expectancy rises to over 200 years for those young enough to receive treatment all their adult life to slow senescence.'
        links:
          - {kind: 'article', id: '48239a4cc7640', text: 'Longevity treatment'}
      - year_at: 241
        until_at: null
        precision: 'exact'
        text: 'Under Jean Benoit Sampson, SSDC is now a premier cislunar power.'
        links: []
      - year_at: 241
        until_at: null
        precision: 'exact'
        text: 'A reliable way of storing macroscopic amounts of antimatter is demonstrated by ASEABB. Much interest in antimatter propulsion, but the demand far outstrips the supply of antimatter.'
        links:
          - {kind: 'article', id: '45f0c6a76e17b', text: 'storing macroscopic amounts of antimatter'}
      - year_at: 243
        until_at: null
        precision: 'exact'
        text: 'Exa Energy formed by the merger of Trans-Pacific Fusion Generation and Bernal Space Power Systems.'
        links:
          - {kind: 'article', id: '485da86417720', text: 'Exa Energy'}
      - year_at: 250
        until_at: null
        precision: 'exact'
        text: 'Evocation, personality simulation derived from externally obtained data become popular as a primitive form of uploading.'
        links:
          - {kind: 'article', id: '4c083de647afb', text: 'Evocation'}
      - year_at: 250
        until_at: null
        precision: 'exact'
        text: 'Beginning of dolphin provolution efforts.'
        links:
          - {kind: 'article', id: '47eaf707eac4b', text: 'dolphin'}
      - year_at: 250
        until_at: null
        precision: 'circa'
        text: 'First gradual uploading into an exoself attempted.'
        links:
          - {kind: 'article', id: '46f96b4be3e8d', text: 'gradual uploading'}
      - year_at: 252
        until_at: null
        precision: 'exact'
        text: 'UNORCA dissolved, establishment of the Antarctic Free States.'
        links:
          - {kind: 'article', id: '4c1db78cddd50', text: 'Antarctic Free States'}
      - year_at: 254
        until_at: null
        precision: 'exact'
        text: 'The academic faction of Tir Sorcha Habitat pushes for starting a mining venture on other asteroids to aid the economy of their tiny nation.'
        links:
          - {kind: 'article', id: '486018c00d410', text: 'Tir Sorcha'}
      - year_at: 254
        until_at: null
        precision: 'exact'
        text: 'The major Central African economy Republique du Tchad, with the backing of various powers finish the international tower, `Freedom'', in Gabon. This is the largest space elevator, and indeed the largest single structure built by man so far, more than a kilometre wide at the orbital end.'
        links: []
      - year_at: 260
        until_at: null
        precision: 'exact'
        text: 'Bubblehabs established at Uranus.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'Bubblehabs'}
          - {kind: 'article', id: '4f1828a411675', text: 'Uranus'}
      - year_at: 260
        until_at: null
        precision: 'exact'
        text: 'Molecular assembly, nanobiotech, and automated manufacturing used in orbiting space habitats and surface colonies for a variety of consumer requirements, and also represents the largest fraction of Earth''s industry.'
        links: []
      - year_at: 261
        until_at: null
        precision: 'exact'
        text: 'The first detection of an extraterrestrial radio civilisation by Julie Denley and a team of Space Adapted astronomers (Clade Parthene, Astraea Asteroid), using the PanTrojan Baseline between the L4 and L5 points of Jupiter. Part of a larger project in which Julie Denley, working with the superturing AI known as 110001, becomes the first Terragen to map the entire visible galaxy. More here: Search For Non-Terragen Intelligence.'
        links:
          - {kind: 'article', id: '48028a7f74e6d', text: 'More here: Search For Non-Terragen Intelligence'}
      - year_at: 260
        until_at: null
        precision: 'circa'
        text: '''Muts all but extinct.'
        links: []
      - year_at: 260
        until_at: null
        precision: 'circa'
        text: 'Novelty candy (Rinckler''s ZmartGum) the first example of Interactive Food.'
        links:
          - {kind: 'article', id: '4664cbd33ad78', text: 'Interactive Food'}
      - year_at: 265
        until_at: null
        precision: 'exact'
        text: 'The laser-propelled, unmanned robot probe, the Giordano Bruno, is launched towards Tau Ceti.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 267
        until_at: null
        precision: 'exact'
        text: 'The last known sighting of a feral ''Mut, in central California.'
        links: []
      - year_at: 270
