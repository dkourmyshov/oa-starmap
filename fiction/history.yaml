        text: 'The (Conver War) becomes a desperate five-way contest between the Conver Limis, Geminga Orthodoxy, Metasoft, Solar Dominion and local independent worlds.'
        links:
          - {kind: 'article', id: '4a0d8e3d85d93', text: 'Conver War'}
      - year_at: 3900
        until_at: null
        precision: 'circa'
        text: 'Brief retro-chic fad brought back a couple of the supposedly ''most efficient'' non-polystate processing operating systems, and revived interest in the Freedom of Computing Issue.'
