        text: 'Construction of the topopolis Spaghetti megastructure started (see Cableville).'
        links:
          - {kind: 'article', id: '48ac37b0e82ba', text: 'Cableville'}
      - year_at: 4744
        until_at: null
        precision: 'exact'
        text: 'Andian Mission is instituted.'
        links:
          - {kind: 'article', id: '45f4846ae8275', text: 'Andian Mission'}
      - year_at: 4753
        until_at: null
        precision: 'exact'
        text: 'the artwork Reseb Grupp, painted by the Solarist aioid Nomologic ga Helios-4 in 2300, rediscovered after languishing in the databanks of the Solar Dominion for over 2000 years immediately becomes a great hit and widely imitated.'
        links:
          - {kind: 'article', id: '47703767c1b82', text: 'Reseb Grupp'}
          - {kind: 'topic', id: '45ce432e44565', text: 'Solarist'}
      - year_at: 4745
        until_at: null
        precision: 'exact'
        text: 'an independent scavenging craft rendezvouses with a strange centripetal space hulk (presumed abandoned) that was in the process of entering the Thorain system (TA sector), and is quite shocked to find it inhabited by what are first thought to be a race of strange, tentacle-waving aliens, but turn out to be members of the Alchemist clade.'
        links:
          - {kind: 'article', id: '47e868058e7d0', text: 'Alchemist clade'}
      - year_at: 4785
        until_at: null
        precision: 'exact'
        text: 'Tscherbaschov founds the Heron Institute of Applied Technology.'
        links:
          - {kind: 'article', id: '499d446204d39', text: 'Heron Institute of Applied Technology'}
      - year_at: 4798
        until_at: null
        precision: 'exact'
        text: 'in a surprise raid on Padre Joachim 4 million sentients were killed by the Goto autowars (robot warships) apparently derived from the Version War Liberator D series.'
        links:
          - {kind: 'article', id: '47b8f56ee90f2', text: 'Goto autowars'}
          - {kind: 'article', id: '48fdb8829e239', text: 'Version War'}
      - year_at: 4798
        until_at: null
        precision: 'exact'
        text: 'New Beneficence mourns the deaths of 4 million sentients at Padre Joachim by Goto autowars , but calls for the autowars rehabilitation and integration into Sephirotic society, not their destruction. NewBe quoted as saying, "You created these children to fight your war, but you forgot to teach them about peace."'
        links:
          - {kind: 'article', id: '47b8f56ee90f2', text: 'Goto autowars'}
      - year_at: 4800
        until_at: null
        precision: 'circa'
        text: 'Goto autowars harass the Negentropy Alliance, causing heavy casualties and massive production loss in several important industrial systems and annihilating a number of worlds hosting large military bases. Negentropist defences prove incapable of defeating the highly evolved autowars.'
        links:
          - {kind: 'article', id: '47b8f56ee90f2', text: 'Goto autowars'}
      - year_at: 4800
        until_at: null
        precision: 'circa'
        text: 'Extremist hu-rights group Branch Hominist quite active, playing on biont fears and resentment following the Version War.'
        links:
          - {kind: 'article', id: '461192db77db4', text: 'Branch Hominist'}
      - year_at: 4805
        until_at: null
        precision: 'exact'
        text: 'Sagittarius Sphere dissolved by an alliance of ComEmp empires; becomes the Sagittarius Transcultural Cooperation.'
        links:
          - {kind: 'article', id: '4782eae239002', text: 'Sagittarius Sphere'}
          - {kind: 'topic', id: '45ce422da8701', text: 'Sagittarius Transcultural Cooperation'}
      - year_at: 4806
        until_at: null
        precision: 'exact'
        text: 'John Sarhvant elected in the Black Acropolis.'
        links:
          - {kind: 'article', id: '48000db9a9c2f', text: 'Black Acropolis'}
      - year_at: 4809
        until_at: null
        precision: 'exact'
        text: 'Solar Dominion fleet recaptures the rogue system of Falden and set up a new wormhole link.'
        links:
          - {kind: 'topic', id: '45ce432e44565', text: 'Solar Dominion'}
      - year_at: 4810
        until_at: null
        precision: 'exact'
        text: 'A Spacefarer Union fleet consisting of almost 500 ships and led by two SI:3 entities offer to recapture Elcondris for the Dominion on condition that they lead a fleet there and take whatever measures necessary to overcome the rogue AI Sunbrain. (The Elcondris Incident).'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer Union'}
          - {kind: 'article', id: '4baeabe6b64b1', text: 'Elcondris Incident'}
      - year_at: 4810
        until_at: null
        precision: 'exact'
        text: '4830 Spacefarer Union ships arrive at Falden; before departing for Elcondris. (The Elcondris Incident).'
        links:
          - {kind: 'article', id: '4baeabe6b64b1', text: 'Elcondris Incident'}
      - year_at: 4812
        until_at: null
        precision: 'exact'
        text: 'Zar Jordan becomes a full superior, leading to a split between the majority early (sub-superior) and minority later (superior) clones, which in turn in the following years become two distinct subclades, called the Actual Lucjordanians and the Authentic Lucjordanians respectively.'
        links:
          - {kind: 'article', id: '47f1a8b5bfbfa', text: 'Zar Jordan'}
      - year_at: 4812
        until_at: null
        precision: 'exact'
        text: 'The Biopolity re-opens the wormhole to a small trinary system, and find that both the original Biopolity and Metasoft colonists are almost gone. In their place is an entirely new cyborg clade that occupies all the 7 previously existing habitats and also 3 new ones that they had constructed. (see Synthetics).'
        links:
          - {kind: 'topic', id: '45cfc7e44e184', text: 'Biopolity'}
          - {kind: 'article', id: '47f6d76e727ca', text: 'Synthetics'}
      - year_at: 4815
        until_at: null
        precision: 'exact'
        text: 'Zarauztar colonised.'
        links:
          - {kind: 'article', id: '46e73d558b681', text: 'Zarauztar'}
      - year_at: 4815
        until_at: null
        precision: 'exact'
        text: 'Habitat war in the Black Acropolis.'
        links:
          - {kind: 'article', id: '48000db9a9c2f', text: 'Black Acropolis'}
      - year_at: 4821
        until_at: null
        precision: 'exact'
        text: 'Wormhole opened from Swartzchild to Traction.'
        links:
          - {kind: 'article', id: '48aca6f9717da', text: 'Traction'}
      - year_at: 4830
        until_at: null
        precision: 'exact'
        text: 'Corona serves as the neutral host for the ComEmp.'
        links:
          - {kind: 'article', id: '48e8b382428f5', text: 'Corona'}
      - year_at: 4830
        until_at: null
        precision: 'circa'
        text: 'The previously isolated ex-Biopolity cyborgs become used to the freedom of the ComEmp, and the Biopolity relinquish political control over the system but held on firmly to trading rights and the right to operate the system''s wormhole. (see Synthetics).'
        links:
          - {kind: 'article', id: '47f6d76e727ca', text: 'Synthetics'}
      - year_at: 4840
        until_at: null
        precision: 'circa'
        text: 'Bothyga M''Vau seeded by the Makrimche Polyst clade of AIs in the as an experiment in open-ended eco-art.'
        links:
          - {kind: 'article', id: '46100d8d49764', text: 'Bothyga M''Vau'}
      - year_at: 4844
        until_at: null
        precision: 'exact'
        text: 'Birth of empath philosopher and religious engineer Recor Hochent - Heartland Mumris Band.'
        links:
          - {kind: 'article', id: '4671bce89a0e4', text: 'Recor Hochent'}
          - {kind: 'article', id: '466c941c50d22', text: 'Heartland'}
      - year_at: 4845
        until_at: null
        precision: 'exact'
        text: 'A public scandal causes reorganized of the NanoAdhesives Board as an independent industry-wide agency amongst the NoCoZo.'
        links:
          - {kind: 'article', id: '46cb9758904a8', text: 'NanoAdhesives Board'}
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'NoCoZo'}
      - year_at: 4850
        until_at: null
        precision: 'exact'
        text: 'Widespread insurance system instituted on Atlantis after some risky experiments with HE viruses.'
        links:
          - {kind: 'article', id: '486ec4e68c62e', text: 'Atlantis'}
      - year_at: 4855
        until_at: null
        precision: 'exact'
        text: 'Encyclopaedia Everythingiana developed to allow lost colonies to bootstrap themselves out of technological collapse.'
        links:
          - {kind: 'article', id: '480d3b8925e59', text: 'Encyclopaedia Everythingiana'}
      - year_at: 4870
        until_at: null
        precision: 'exact'
        text: 'Headquarters of ComEmp moves from Corona.'
        links:
          - {kind: 'article', id: '48e8b382428f5', text: 'Corona'}
      - year_at: 4876
        until_at: null
        precision: 'exact'
        text: 'Violent conflict on Atlantis between the PPL Glick Law and its subscribers on Lichtenstein over a retroactive added charge.'
        links:
          - {kind: 'article', id: '486ec4e68c62e', text: 'Atlantis'}
      - year_at: 4887
        until_at: null
        precision: 'exact'
        text: 'Dronamraju Republic founded on Atlantis.'
        links:
          - {kind: 'article', id: '486ec4e68c62e', text: 'Atlantis'}
      - year_at: 4889
        until_at: null
        precision: 'exact'
        text: 'Contact is restored with Mutual Satisfaction. The polity refuses to rejoin the NoCoZo for unclear reasons and becomes an independent enclave, although for all practical purposes still NoCoZo.'
        links:
          - {kind: 'article', id: '47bb86789bd31', text: 'Mutual Satisfaction'}
      - year_at: 4890
        until_at: null
        precision: 'exact'
        text: 'Construction begins on the Second Shell of Harbinger Dyson.'
        links:
          - {kind: 'article', id: '46674b9181a4f', text: 'Harbinger Dyson'}
      - year_at: 4912
        until_at: null
        precision: 'exact'
        text: 'birth of the Dominion transapient culture hero Jilunan.'
        links:
          - {kind: 'article', id: '4682f11ba8b6b', text: 'Jilunan'}
      - year_at: 4915
        until_at: null
        precision: 'exact'
        text: 'Dronamraju Republic goes bankrupt on Atlantis.'
        links:
          - {kind: 'article', id: '486ec4e68c62e', text: 'Atlantis'}
      - year_at: 4920
        until_at: null
        precision: 'exact'
        text: 'Elements of The SynBios, a synclade of human, dolphin, and neo-reformist Ultimate that developed in the early decades of the Glorious Communion in the Black Acropolis habitats, set forth to colonise further star systems.'
        links:
          - {kind: 'article', id: '55bbab64d3695', text: 'synclade'}
          - {kind: 'article', id: '48000db9a9c2f', text: 'Black Acropolis habitats'}
      - year_at: 4937
        until_at: null
        precision: 'exact'
        text: 'Signing of the Gerkletoss Accord.'
        links:
          - {kind: 'article', id: '464e906aa1628', text: 'Gerkletoss Accord'}
      - year_at: 4950
        until_at: null
        precision: 'circa'
        text: 'economic and cultural renaissance in Mutual Satisfaction. The flocal Institute of Interstellar Economics grows to a prominent position.'
        links:
          - {kind: 'article', id: '47bb86789bd31', text: 'Mutual Satisfaction'}
      - year_at: 4950
        until_at: null
        precision: 'circa'
        text: 'Normidic Machinophyle Supercluster develops from the local ai nanecology in the volume around YTS 2190 751 6 [Norma Outer Sector] becomes Solipsist Panvirtuality member-empire.'
        links:
          - {kind: 'article', id: '46dcc986d994d', text: 'Normidic Machinophyle Supercluster'}
          - {kind: 'topic', id: '45cfd1ff68f47', text: 'Solipsist Panvirtuality'}
      - year_at: 4950
        until_at: null
        precision: 'exact'
        text: 'Heimat colonised by Metasoft.'
        links: []
      - year_at: 4982
        until_at: null
        precision: 'exact'
        text: 'birth of Teleana Vikkolich, who would later be known as Gyzantium Gyzaarno, the author of Baseline Bob.'
        links:
          - {kind: 'article', id: '483ae0c5c76e2', text: 'Baseline Bob'}
      - year_at: 4989
        until_at: null
        precision: 'exact'
        text: 'Sarah Singh Tan''s classic comic interactive virch on the theme of sarcophobes, No, Nothing At All.'
        links:
          - {kind: 'article', id: '480fde6896b50', text: 'sarcophobes'}
      - year_at: 5000
        until_at: null
        precision: 'circa'
        text: 'First Oracle Machine worlds established.'
        links:
          - {kind: 'article', id: '48fdc67c7a650', text: 'Oracle Machine'}
      - year_at: 5100
        until_at: null
        precision: 'circa'
        text: 'The Black Hole known as Threshold is enclosed in a framework of dynamic orbital rings.'
        links:
          - {kind: 'article', id: '47a3e440c01a5', text: 'Threshold'}
      - year_at: 5101
        until_at: null
        precision: 'exact'
        text: 'The Negentropy Alliance attacks Goto, apparently destroying the last autowar factories.'
        links:
          - {kind: 'article', id: '46f96b2cf28e9', text: 'Goto'}
      - year_at: 5101
        until_at: null
        precision: 'exact'
        text: 'Ascension of empath philosopher and religious engineer Recor Hochent.'
        links:
          - {kind: 'article', id: '4671bce89a0e4', text: 'Recor Hochent'}
      - year_at: 5106
        until_at: null
        precision: 'exact'
        text: 'Contemplative Neverflux ascends to SI:3 and from this point on takes a lesser role in galactic life. E still defends the School of Continuous Death, usually in lengthy philosophical treatises sent to fellow transapients, and acts as a consultant to believers in eir philosophy, but mostly becomes reclusive.'
        links:
          - {kind: 'article', id: '47fedc0c5b93d', text: 'Contemplative Neverflux'}
      - year_at: 5116
        until_at: null
        precision: 'exact'
        text: 'Branch Hominist attempted invasion of Earth is a fiasco, and little more has been heard of them.'
        links:
          - {kind: 'article', id: '461192db77db4', text: 'Branch Hominist'}
      - year_at: 5126
        until_at: null
        precision: 'exact'
        text: 'Dimimimon4 commits voluntary deactivation.'
        links:
          - {kind: 'article', id: '464b9fab3867b', text: 'Dimimimon4'}
      - year_at: 5136
        until_at: null
        precision: 'exact'
        text: 'MPA relativist ship arrives at Cableville.'
        links:
          - {kind: 'topic', id: '45cd3240ea58a', text: 'MPA'}
          - {kind: 'article', id: '48ac37b0e82ba', text: 'Cableville'}
      - year_at: 5184
        until_at: null
        precision: 'exact'
        text: 'Wormhole opened by the Burdikeer from Alpha Star to Blue.'
        links:
          - {kind: 'article', id: '59934af985ed6', text: 'the Burdikeer'}
          - {kind: 'article', id: '48acafcb42410', text: 'Alpha Star'}
          - {kind: 'article', id: '48ac8c3a3979d', text: 'Blue'}
      - year_at: 5190
        until_at: null
        precision: 'exact'
        text: 'Second upgrade of Sarah Singh Tan''s comic interactive virch on sarcophobes, No, Nothing At All.'
        links:
          - {kind: 'article', id: '480fde6896b50', text: 'sarcophobes'}
