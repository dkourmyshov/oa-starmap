        links:
          - {kind: 'article', id: '45f98d8a88efe', text: 'Aroostai'}
      - year_at: 4149
        until_at: null
        precision: 'exact'
        text: 'Schisms cause the collapse of Kringslerism.'
        links:
          - {kind: 'article', id: '467484ca16388', text: 'Kringslerism'}
      - year_at: 4182
        until_at: null
        precision: 'exact'
        text: 'A viral infection of unknown origin attacks and destroys the Rajasekarian civilisation.'
        links:
          - {kind: 'article', id: '4910f10364835', text: 'Rajasekarian'}
      - year_at: 4166
        until_at: null
