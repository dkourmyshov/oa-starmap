          - {kind: 'article', id: '466f40fc274f7', text: 'KaTaWaHa'}
      - year_at: 3694
        until_at: null
        precision: 'exact'
        text: 'The Marabi Patha-Charlwood Alliance uses transapient-level AI viruses to attack Geteche and destroy its ruling S1, thus gaining control over the system''s resources. The Solar Dominion uses this as an opportunity to classify Hyperion as a blight and re-annex the Marabi Patha Harmony, doing so in alliance with the Conver Ambi. The Conver Ambi also claims much of the region, which becomes one of the triggers for the Second Empires War.'
        links:
