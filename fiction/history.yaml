      - year_at: 6754
        until_at: null
        precision: 'exact'
        text: 'Clarketech Null Box antigravity device discovered on Zeta Corianis IV.'
        links:
          - {kind: 'article', id: '4b0d66b0bd0c0', text: 'Null Box'}
      - year_at: 6756
        until_at: null
        precision: 'exact'
        text: 'A small (10 meter) wormhole is set up in the Apogee Maximal system and visitors from the rest of the Known Worlds begin to arrive.'
        links:
          - {kind: 'article', id: '45f75376867f8', text: 'Apogee Maximal'}
      - year_at: 6758
        until_at: null
        precision: 'exact'
