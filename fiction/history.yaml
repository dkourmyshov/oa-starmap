        links:
          - {kind: 'article', id: '4703c44b2ccb2', text: 'Puppis Democracy'}
      - year_at: 7105
        until_at: null
        precision: 'exact'
        text: '"Xarander the Conqueror" rule of Newhope overthrown with help from a passing ex-Version Tree vec clade, the Fastchip Cinderbots Association, and the pre-Xarander condition of isolated and impoverished polities is restored in the system.'
        links:
          - {kind: 'article', id: '490b210f5bc0b', text: 'Newhope'}
      - year_at: 7106
        until_at: null
        precision: 'exact'
        text: 'UrchinStar ascends to fourth toposophic, becoming the second true archailect in the region after the Archosaurian Entity. E is over 300 km wide, and still growing.'
        links:
          - {kind: 'article', id: '48f80671277a7', text: 'UrchinStar'}
      - year_at: 7111
        until_at: null
        precision: 'exact'
        text: 'The Hypercorruption Expanse blight first encountered by Version Tree linelayers.'
        links:
          - {kind: 'article', id: '4bc65cc682646', text: 'Hypercorruption Expanse'}
      - year_at: 7120
        until_at: null
        precision: 'exact'
        text: 'Second cycler network connects Beta Virginis with many nearby red and brown dwarfs and several Utopia and NoCoZo worlds.'
        links:
          - {kind: 'article', id: '460c3685cd4c4', text: 'cycler network'}
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 7120
        until_at: null
        precision: 'exact'
        text: 'Evolutionary biologists and paleoxenologists associated with the HIE and the Ozymandias Institute announce the hypothesis that the Jovic life forms associated with the Jacks are distant descendants of xenosophont-designed bubblehabs.'
        links:
