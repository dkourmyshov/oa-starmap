        until_at: null
        precision: 'exact'
        text: 'The Shipwright''s Commune receives a contract to build a fleet of fifteen colony ships for a NoCoZo polity-corporation.'
        links:
          - {kind: 'article', id: '483b11070d0cc', text: 'Shipwright''s Commune'}
      - year_at: 3831
        until_at: null
        precision: 'exact'
        text: 'The first unequivocally intelligent alien race, the To''ul''hs are discovered by an exploration nanotech at in the outskirts of NGC6633. No contact is made until observations are completed.'
        links:
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''hs'}
      - year_at: 3839
