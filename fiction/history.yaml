        links: []
      - year_at: 314
        until_at: null
        precision: 'exact'
        text: 'Anti-terrestrial asteroid homesteaders inspired by the writings of Fred DiProspero (space supremacism) attempt to bring the asteroid Ptah into an Earth-colliding orbit by placing a mining mass driver on it. The attempt fails when one member loses his nerve and sends a message to Space Guard. The incident makes the Cislunar interests and public opinion even more negative against the spacers and belt settlements. It also makes Space Guard expand its jurisdiction outwards to all potentially hazardous asteroids, causing much friction with the belt and Mars.'
