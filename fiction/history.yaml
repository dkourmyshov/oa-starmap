  - id: 'integration'
    topic: '45b2c0170c310'
    name: 'The Integration'
    title: '3800 to 4450 AT: The Integration'
    kind: 'period'
    parent: 'inner-sphere-era'
    start_at: 3800
    end_at: 4450
    events:
      - year_at: 3800
        until_at: null
        precision: 'exact'
        text: 'Walking Mountain xenoprovolve developed.'
        links:
          - {kind: 'article', id: '46f8790d3902e', text: 'Walking Mountain'}
      - year_at: 3804
        until_at: null
        precision: 'exact'
        text: 'Meerlinda is attacked by "gremlins" which systematically eliminate all technology and kill the local ruling AIs.'
        links:
          - {kind: 'article', id: '47aa841e5527b', text: 'Meerlinda'}
      - year_at: 3804
        until_at: null
        precision: 'exact'
        text: 'Laucen Greatguy, author of Manaran the Pure King, dies in the Meerlinda Disaster.'
        links:
          - {kind: 'article', id: '480e9681c2f64', text: 'Manaran the Pure King'}
          - {kind: 'article', id: '47aa841e5527b', text: 'Meerlinda'}
      - year_at: 3805
        until_at: null
        precision: 'exact'
        text: 'The Concord Ontology is instituted. The Metasoft empire strongly backs the Ontology, frustrating the Solar Dominion''s desire to impose their standard on the galaxy (moreover the Metasoft-backed ontology is cheaper and less ideological). The Solar Dominion''s own ideologically-based protocol is unacceptable to all the other major powers. Although the Dominion and Metasoft remain on friendly terms for some centuries more, it is the beginning of the end of the Metasoft-Dominion alliance. more 3806 - One Copy of each of the Seven Neogenist Lifegivers merge with Harbinger dyson, transcending to become the Harbinger Archailect.'
        links:
          - {kind: 'article', id: '478434a56eb65', text: 'Concord Ontology'}
          - {kind: 'topic', id: '45cd30902bea3', text: 'Metasoft'}
          - {kind: 'article', id: '478434a56eb65', text: 'more'}
          - {kind: 'article', id: '47856727ba67c', text: 'Seven Neogenist Lifegivers'}
          - {kind: 'article', id: '46674b9181a4f', text: 'Harbinger dyson'}
          - {kind: 'article', id: '46674c384bee8', text: 'Harbinger Archailect'}
