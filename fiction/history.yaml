    start_at: 7200
    end_at: 7800
    events:
      - year_at: 7210
        until_at: null
        precision: 'exact'
        text: 'The New Beneficence joins the Central Alliance, the first time NewBe is known to have actively taken a side in a military conflict.'
        links:
          - {kind: 'article', id: '483f5ec5eb666', text: 'Beneficence'}
          - {kind: 'article', id: '4615acc7840f0', text: 'Central Alliance'}
      - year_at: 7231
        until_at: null
        precision: 'exact'
        text: 'First shell of Kepleria completed.'
        links:
          - {kind: 'article', id: '4670a60a449d5', text: 'Kepleria'}
      - year_at: 7243
        until_at: null
        precision: 'exact'
        text: 'A major NoCoZo AI entity intervenes in the Chahipho crisis and gives Chahipho an ultimatum: release the collection and the information it encompassed, or be destroyed.'
        links:
          - {kind: 'article', id: '4624222bd237b', text: 'Chahipho'}
      - year_at: 7247
        until_at: null
        precision: 'exact'
        text: 'The "Cygexpa Sale". With no warning Lohengrin disbands the Cygexpa empire. The archai appears to have decided that maintaining an empire was not cost-efficient in the current era and sells off eir political power in exchange for vast sums of capital, technology and trade treaties.'
        links:
          - {kind: 'article', id: '46845993645cc', text: 'Lohengrin'}
          - {kind: 'article', id: '48600bdd1234b', text: 'Cygexpa empire'}
      - year_at: 7254
        until_at: null
        precision: 'exact'
        text: 'In the Deneb volume the Hosoko Hegemony acquires former Cygexpa assets to become an independent empire. Within two decades it had broken down due to widespread riots and sabotage.'
        links:
          - {kind: 'article', id: '46490c433d4b1', text: 'Deneb volume'}
          - {kind: 'article', id: '4671d29a7f356', text: 'Hosoko Hegemony'}
      - year_at: 7277
        until_at: null
        precision: 'exact'
        text: 'Major wormhole links to the Hosoko Hegemony destroyed.'
        links:
          - {kind: 'article', id: '4671d29a7f356', text: 'Hosoko Hegemony'}
      - year_at: 7287
        until_at: null
        precision: 'exact'
        text: 'Guanche colony, disconnected from the Hosoko Hegemony, collapses into barbarism.'
        links:
          - {kind: 'article', id: '48f7fcd30db8c', text: 'Guanche colony'}
      - year_at: 7300
        until_at: null
        precision: 'exact'
        text: 'The alpha male cyberbaras instigate a bounty system to restrict marsupial rianth lion population on Cambyses.'
        links:
          - {kind: 'topic', id: '45beaa73c347e', text: 'rianth'}
