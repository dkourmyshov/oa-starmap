        links:
          - {kind: 'article', id: '48fdb8829e239', text: 'Version Cold War'}
      - year_at: 4452
        until_at: null
        precision: 'exact'
        text: 'In the Sagittarius Sphere the militant Hager 5 explorer cyborg clade, under clademaster Innam Ho4 Hager, gained power, much to the surprise and chagrin of the ruling Mestheus Hegemony, who were forced to form a Coalition Party to stay in power.'
        links:
          - {kind: 'article', id: '4782eae239002', text: 'Sagittarius Sphere'}
      - year_at: 4454
        until_at: null
        precision: 'exact'
        text: 'ToneWatcher, a leading member of the Argus Project in its early stages, transcends to third toposophic level relatively quickly. One of the first transapients in the region to do so. E converts eir body into a massive spiky ISO ten kilometres wide, acquiring the popular name UrchinStar.'
        links:
          - {kind: 'article', id: '45f97a51dbf24', text: 'Argus Project'}
          - {kind: 'topic', id: '492d73280dc85', text: 'third toposophic level'}
