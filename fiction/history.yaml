          - {kind: 'article', id: '49afd86e67383', text: 'Institute of Exopaleontology'}
      - year_at: 4111
        until_at: null
        precision: 'exact'
        text: 'Increasing cladisation between spacegoing and terrestrial To''ul''hs leads to the first To''ul''h World War. After several decades of interference and sporadic warfare the spacegoers establish a technocratic dictatorship.'
        links:
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''hs'}
      - year_at: 4115
        until_at: null
        precision: 'exact'
