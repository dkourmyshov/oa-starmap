        text: 'A consortium of south-east Asian corporations and interests in the Corporate Republic of Indonesia, together with the giant orbital corporation KMH Bionetics, launch colony ships to Pi3 Orionis.'
        links:
          - {kind: 'article', id: '465ccf57b2789', text: 'Corporate Republic of Indonesia'}
          - {kind: 'article', id: '48e6722138bbb', text: 'Pi3 Orionis'}
      - year_at: 378
        until_at: null
        precision: 'exact'
        text: 'Outbreak of retroviral typhoid on the Luna settlement at Flamsteed crater. Following this, GeneTEK develops a modified nematode as an antiviral/antibacterial delivery system.'
        links:
          - {kind: 'article', id: '464e8c18c8718', text: 'GeneTEK'}
          - {kind: 'article', id: '464e8b536e1c7', text: 'modified nematode'}
      - year_at: 378
        until_at: null
        precision: 'exact'
        text: 'Only a few light-months away from Sol, one of the Pi 3 Orionis colony ships suffers a micrometeorite collision and is spectacularly destroyed. The explosion is detected from Earth, and in the media the general perception assumes that the expedition is doomed. Some of these speculations are fed by Indonesian federalists and other opponents to the project, some due to the general impression many people have that the technology of the Chinese project was unreliable.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Pi 3 Orionis'}
      - year_at: 378
        until_at: null
        precision: 'exact'
        text: 'Ignatius O''Neill, claiming that the Space People would only be free once they could leave the oppressive baselines behind and have their own colonies and biospheres among the stars, leads a large exodus to the Kuiper Belt and beyond.'
        links:
          - {kind: 'article', id: '467496ca7cc39', text: 'Kuiper Belt'}
      - year_at: 380
        until_at: null
        precision: 'exact'
        text: 'The centralist AIs have a benevolent relationship with the Organics and are not yet perceived as gods, except by a few weird groups of human derived people and cyborgs. All sorts of groups, factions, colonised worlds, space stations continue to spring up. New clades of tweaks and cyborgs continue to develop in the increasing numbers of artificial biospheres of interplanetary space.'
        links:
          - {kind: 'article', id: '49a7d33abf557', text: 'centralist AIs'}
      - year_at: 380
        until_at: null
        precision: 'circa'
        text: 'Like many independent space based polities of the time, Tir Sorcha Habitat has substantial nanodefences, as well as more conventional weaponry.'
        links:
          - {kind: 'article', id: '46f96a277fcd2', text: 'nanodefences'}
      - year_at: 380
        until_at: null
        precision: 'exact'
        text: 'The many new stable designs for artificial biospheres make bubblehabs nearly independent for most materials and energy, but there is a brisk trade between bubblehab communities and the sources of the few critical heavy elements. Earth, Luna, Mars, and the various Belt polities trade these for the abundant supplies of helium-3 that the bubblehab settlements ship offplanet.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'article', id: '462eae95003f8', text: 'Earth'}
          - {kind: 'article', id: '48f92290112c1', text: 'Luna'}
          - {kind: 'article', id: '48e77e52e27f8', text: 'Mars'}
          - {kind: 'article', id: '4b9b83bd91ffd', text: 'Belt'}
      - year_at: 389
        until_at: null
        precision: 'exact'
        text: 'A Baseline Supremacist hate group known as the Homo Sapiens Front releases a gengineered virus especially designed to target merpeople. Thousands die before an antidote is found.'
        links:
          - {kind: 'article', id: '4675e945a643f', text: 'Baseline Supremacist'}
      - year_at: 390
        until_at: null
        precision: 'exact'
        text: 'Fogfo, an aerosol interactive food, developed at Regina by Belter cooks at Hamblin Comemptives habitat.'
        links:
          - {kind: 'article', id: '464f4374ed123', text: 'Fogfo'}
      - year_at: 390
        until_at: null
        precision: 'exact'
        text: 'Many habitats and colonies throughout the Solar System adopt the Lunar calendar, starting in 1969 with the landing at Tranquility base.'
        links:
          - {kind: 'article', id: '48c6d4c3d54cf', text: 'Lunar calendar'}
      - year_at: 390
        until_at: null
        precision: 'circa'
        text: 'Bourgatow, an asteroid colony, settled in the by a Russian-Taiwanese space mining consortium.'
        links:
          - {kind: 'article', id: '48ab6400f1efa', text: 'Bourgatow'}
      - year_at: 396
        until_at: null
        precision: 'exact'
        text: 'Last remnants of the Jovian League are absorbed by the Gengineer Republic.'
        links: []
      - year_at: 397
        until_at: null
        precision: 'exact'
        text: 'First viable vacuum-tolerant humans revealed.'
        links:
          - {kind: 'article', id: '47f6f4568b9da', text: 'vacuum-tolerant'}
      - year_at: 399
        until_at: null
        precision: 'exact'
        text: 'Weeping Wall site declared a protected "national park", but by this time foliage has covered the soil and the site is not much different from other regions on the planet.'
        links:
          - {kind: 'article', id: '4a6f97fc61c1d', text: 'Weeping Wall'}
      - year_at: 399
        until_at: null
        precision: 'exact'
        text: 'The Penglai mission is launched.'
        links:
          - {kind: 'article', id: '48e89a9239865', text: 'Penglai'}
  - id: 'solsys-golden-age'
    topic: '45b2b1a3d9417'
    name: 'The Solsys Golden Age'
    title: '400 to 530 AT: The Solsys Golden Age'
    kind: 'period'
    parent: 'solsys-era'
    start_at: 400
    end_at: 530
    events:
      - year_at: 400
        until_at: null
        precision: 'exact'
        text: 'Fully provolved Siberoo individuals occupy executive positions in certain polar research facilities.'
        links:
          - {kind: 'topic', id: '45bbfdbc381f4', text: 'provolved'}
          - {kind: 'article', id: '47f6c8411e3c4', text: 'Siberoo'}
      - year_at: 401
        until_at: null
        precision: 'exact'
        text: 'Stasist AIs gradually reach a consensus, after marginalizing the ahumans and their incompatible plans. More: Political Science.'
        links:
          - {kind: 'article', id: '49a7d33abf557', text: 'More: Political Science'}
      - year_at: 401
        until_at: null
        precision: 'exact'
        text: 'The first paired rotating O''Neill cylinder colony is constructed at the Earth/Moon L4 point.'
        links:
          - {kind: 'article', id: '475a0f16edaa8', text: 'O''Neill cylinder'}
          - {kind: 'article', id: '467892171fffb', text: 'L4 point'}
      - year_at: 407
        until_at: null
        precision: 'exact'
        text: 'Development of synthetic symbiotic organisms becomes first a growing area of research and then a growth industry for the next twenty years. Synthetic and gengineered organisms released into the wild begin to have unforeseen and undesirable consequences.'
        links:
          - {kind: 'article', id: '464e8e23a8b54', text: 'gengineered'}
      - year_at: 410
        until_at: null
        precision: 'exact'
        text: 'Industrial nano-tech widely accessible. Because of the dangers involved both normal and tweak governments, corporations, and military institutions all keep the lid on nanotech, use special assemblers that only replicated a number of times before self-destructing, have draconian legislation and radical surveillance, and other such devices. The erosion of civil liberties leads to police states, only compounding the tension between the cyborgs and the shapers.'
        links:
          - {kind: 'topic', id: '45beb1fcc5ba6', text: 'tweak'}
          - {kind: 'article', id: '45f9b06829b97', text: 'assemblers'}
          - {kind: 'topic', id: '628a389bddec6', text: 'cyborgs'}
      - year_at: 410
        until_at: null
        precision: 'exact'
        text: 'Autonomous bubblehabs, not specifically aligned with an external founding nation, religious organization, or transnational, begin to predominate, particularly in the atmospheres of Saturn, Uranus, and Neptune; a division between ''Inworlders'' and ''Outworlders'' begins to develop. At the same time, with the rise of the Backyarders and especially the Neotribalist Backyarders, many new immigrant/refugee groups arrive from the high-surveillance polities of Old Earth and other insystem regions of Solsys. The first primitive self-replicating bubblehabs are developed, though most new habs are still simply constructed by their future inhabitants.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'article', id: '48f915a959b12', text: 'Solsys'}
      - year_at: 410
        until_at: null
        precision: 'exact'
        text: 'Rat provolves developed at the Rat Barrel.'
        links:
          - {kind: 'article', id: '4b18e48c0788c', text: 'Rat provolves'}
          - {kind: 'article', id: '4761f43f73982', text: 'Rat Barrel'}
      - year_at: 420
        until_at: null
        precision: 'exact'
        text: 'Pearl Fortress announces a plan to leave the solar system.'
        links:
          - {kind: 'article', id: '4c3b97f33810a', text: 'Pearl Fortress'}
      - year_at: 420
        until_at: null
        precision: 'circa'
        text: 'First creation of the human derived species known as Goliaths (Homo gigantopithecus).'
        links:
          - {kind: 'article', id: '47ec44d00db9b', text: 'Goliaths'}
      - year_at: 430
        until_at: null
        precision: 'circa'
        text: 'Enhanced internal feedback, called "ultraconsciousness", is added by the Zerodyn R&D Collective. It results in a Hyperautism, a problem with too clear an internal perception.'
        links:
          - {kind: 'article', id: '480d5070d7135', text: 'Hyperautism'}
      - year_at: 430
        until_at: null
        precision: 'circa'
        text: 'Interactive food becomes more common.'
        links:
          - {kind: 'article', id: '4664cbd33ad78', text: 'Interactive food'}
      - year_at: 431
        until_at: null
        precision: 'exact'
        text: 'First Fullair and its autofab template created.'
        links:
          - {kind: 'article', id: '4847313077644', text: 'Fullair'}
          - {kind: 'article', id: '45eafe5718a34', text: 'autofab'}
      - year_at: 432
        until_at: null
        precision: 'exact'
        text: 'Vollmark, an interstellar era home microtronics corporation, established.'
        links: []
      - year_at: 432
        until_at: null
        precision: 'exact'
        text: 'Mabugana habitat opened for colonisation.'
        links:
          - {kind: 'article', id: '4b744b04388e0', text: 'Mabugana habitat'}
      - year_at: 432
        until_at: null
        precision: 'exact'
        text: 'Fullairs, bubblehabs built for Old Earth conditions, are available as a nanofab template within the Backyarder culture.'
        links:
          - {kind: 'article', id: '4847313077644', text: 'Fullairs'}
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
      - year_at: 435
        until_at: 465
        precision: 'exact'
        text: 'Several localised outbreaks of offensive replicator swarms signal the wider availability of self-replicating weapons technology.'
        links: []
      - year_at: 435
        until_at: null
        precision: 'exact'
        text: 'Destructive uploading of the human mentality is declared illegal by the Earth Council (formerly the United Nations). Non-destructive uploading is not yet technically possible. However comprehensive Virtual emulations of human individuals are granted full sapient rights (in New Zealand only), and destructive uploading becomes widespread off the Earth.'
        links:
          - {kind: 'article', id: '48bda472970cb', text: 'Destructive uploading'}
          - {kind: 'article', id: '594a857ab9b5a', text: 'United Nations'}
          - {kind: 'article', id: '4cb1c598d5ef5', text: 'Non-destructive uploading'}
      - year_at: 447
        until_at: null
        precision: 'exact'
        text: 'Last documented appearance of the unidentified AI entity Hal.'
        links:
          - {kind: 'article', id: '47fed76eb915f', text: 'Hal'}
      - year_at: 450
        until_at: null
        precision: 'exact'
        text: 'Massive growth in the number of bubblehabs in Solsys around gas giants in the outer system, especially Saturn, an event known in local parlance as ''The Blooming''. Many begin to refer to the bubblehabs as the ''Floater'' or ''Inworlder'' polities to distinguish them from other "Outworlder" societies.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'article', id: '464dd76c7cc27', text: 'gas giants'}
          - {kind: 'article', id: '4782f41f69d8c', text: 'Saturn'}
      - year_at: 451
        until_at: null
        precision: 'exact'
        text: 'The Valparaiso cycler becomes a hotel in Mars orbit.'
        links:
          - {kind: 'article', id: '51802602b7abd', text: 'becomes a hotel'}
      - year_at: 457
        until_at: null
        precision: 'exact'
        text: 'A summit at Port Robinson highlights the rising tensions between the Martian Union and the rest of the Inner Council over a variety of issues including immigration, terraforming, and political representation. The Martian Union increasingly acts as a sovereign state.'
        links: []
      - year_at: 460
        until_at: null
        precision: 'circa'
        text: 'The Farm Analogy, infamous forgery widely circulated on the net, purporting to be an authentic post from one AI to another, showing how they undertake "people farming".'
        links:
          - {kind: 'article', id: '49a7d33abf557', text: 'The Farm Analogy'}
      - year_at: 460
        until_at: 510
        precision: 'exact'
        text: 'Phobos'' technical school undertakes ''class projects'' to build interstellar lightsail probes every four years. A local AI calling itself "_____" volunteers to be the payload for these probes,'
        links:
          - {kind: 'article', id: '4c99cf94829c4', text: 'Phobos'}
      - year_at: 462
        until_at: null
        precision: 'exact'
        text: 'Valhalla habitat founded.'
        links:
          - {kind: 'article', id: '49fea757dae0f', text: 'Valhalla habitat'}
      - year_at: 465
        until_at: null
        precision: 'exact'
        text: 'First successful manned interstellar mission launched, the Tsiolkovsky, to Tau Ceti.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 466
        until_at: null
        precision: 'exact'
        text: 'Mabugana habitat completed.'
        links:
          - {kind: 'article', id: '4b744b04388e0', text: 'Mabugana'}
      - year_at: 470
        until_at: null
        precision: 'exact'
        text: 'Ram Augmented Interplanetary RAIR ships introduced in the outer Solar system.'
        links:
          - {kind: 'article', id: '493d916fe8faf', text: 'RAIR'}
      - year_at: 474
        until_at: null
        precision: 'exact'
        text: 'The Caracas Treaty attempts to regulate the spread of replicating and autonomous swarm technology and institute a global monitoring authority. However the treaty is not fully implemented by all parties.'
        links: []
      - year_at: 478
        until_at: null
        precision: 'exact'
        text: 'Intercession launched towards 82 Eridani.'
        links:
          - {kind: 'article', id: '49126e35d4891', text: '82 Eridani'}
      - year_at: 484
        until_at: null
        precision: 'exact'
        text: 'The first Tau Ceti Shuttle ''Red'' launched.'
        links:
          - {kind: 'article', id: '486d3f446d128', text: 'Tau Ceti Shuttle'}
      - year_at: 486
        until_at: null
        precision: 'exact'
        text: '"Uruk Assassin" synthetic viral replicator infects SkyPolis Orbital and kills eighty thousand people. The system wide crackdown that follows fails to cure the problem of bio-terrorism.'
        links: []
      - year_at: 487
        until_at: null
        precision: 'exact'
        text: 'Several bases in the Juno Confederation, accused of being behind much nanoterrorism, are attacked by a joint Cislunar and Earth strike force. The supposed terrorist bases are later shown to be innocent mining homesteaders.'
        links: []
      - year_at: 488
        until_at: null
        precision: 'exact'
        text: 'Godfrey-9, "renaissance being", philosopher, artist, and ai-at-leisure, ascends to S1: first toposophic.'
        links:
          - {kind: 'topic', id: '492d6aa0a549a', text: 'S1: first toposophic'}
      - year_at: 490
        until_at: null
        precision: 'exact'
        text: 'The trial of the Minsk 7, independent researchers accused of having spread nanodesigns on the Net and supported nanoterrorism. After a show trial they are executed, and the case helps usher in the new "Molecular Law Directorate" in the EU.'
        links:
          - {kind: 'article', id: '46661e24a643d', text: 'the Net'}
      - year_at: 490
        until_at: null
        precision: 'exact'
        text: 'Gengineer Republic ship launched toward Epsilon Eridani.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
      - year_at: 498
        until_at: null
        precision: 'exact'
        text: '"Ground Zero" nanite infects Kleopatra, killing 1373 people. The asteroid is quarantined for nearly 400 years.'
        links:
          - {kind: 'article', id: '46747d0513c7b', text: 'Kleopatra'}
      - year_at: 499
        until_at: null
        precision: 'exact'
        text: 'Shortly before completing the journey to Procyon, a stowaway solipsist AI activates and goes on to overwhelm the corporate slaved AI onboard Zhang Qian.'
        links:
          - {kind: 'article', id: '4703bd683b72b', text: 'Procyon'}
          - {kind: 'article', id: '4786dee22ccf3', text: 'solipsist AI'}
      - year_at: 500
        until_at: null
        precision: 'circa'
        text: 'Transfinity products become very widespread especially on Earth, where their matter compilers, microrepair systems and genius cleaning fluids become market leaders.'
        links:
          - {kind: 'article', id: '45eafe5718a34', text: 'matter compilers'}
      - year_at: 501
        until_at: null
        precision: 'exact'
        text: 'Colony mission launched by the ethnic Chinese conglomerate Heavenly Palaces with the help of several Genetekker clades and some corporations with longstanding Genetekker sympathies, towards Sigma Draconis.'
        links:
          - {kind: 'article', id: '464e8caca8b42', text: 'Genetekker'}
          - {kind: 'article', id: '48e89a9239865', text: 'Sigma Draconis'}
      - year_at: 502
        until_at: null
        precision: 'exact'
        text: 'The Atlanta Incident: a nanoterrorist threat makes the Atlanta police release the John Wayne Public Protection synsect swarm (later dubbed Dirty Harry). In the ensuing mega-surveillance/swift justice environment over 19,000 people are killed, behaviorally modified or ''body imprisoned'' using lock-in paralysis.'
        links:
          - {kind: 'article', id: '48114cd37719c', text: 'synsect'}
      - year_at: 505
        until_at: null
        precision: 'exact'
        text: 'Probe launched to GL667 system.'
        links:
          - {kind: 'article', id: '4fbac899f11d0', text: 'GL667 system'}
      - year_at: 506
        until_at: null
        precision: 'exact'
        text: 'The first large outbreak of rogue replicators in space occurs on the Moon. Tycho is partially damaged, and 483 people killed. The plague continues to harass the moon inhabitants for more than 4 years.'
        links:
          - {kind: 'article', id: '48f92290112c1', text: 'Moon'}
      - year_at: 509
        until_at: null
        precision: 'exact'
        text: 'By this date the Cishp own 2/3 of the Titanian surface.'
        links:
          - {kind: 'article', id: '48f92f7b152b9', text: 'Titanian'}
      - year_at: 513
        until_at: null
        precision: 'exact'
        text: 'Paedro Andros Gan, famous cyberian activist, is killed in custody by Javanese authorities. This energizes a wave of nanoterrorism and subversion, as well as speeds up the escape of the Earth intelligentsia into the outer system.'
        links:
          - {kind: 'topic', id: '45cbce679007a', text: 'cyberian'}
      - year_at: 520
        until_at: null
        precision: 'exact'
        text: 'International Nanotech Defense Net developed by an alliance of nanodefense corporations and leased to many regions. The European Federation develops a competing nanodefense standard.'
        links:
          - {kind: 'article', id: '46f96a277fcd2', text: 'nanodefense'}
      - year_at: 523
        until_at: null
        precision: 'exact'
        text: 'In a landmark case the Earth Trade Association and Nanodefence Council order the closing of the otherwise successful Transfinity corporation.'
        links:
          - {kind: 'article', id: '47a53bbcb8c07', text: 'Transfinity'}
      - year_at: 526
        until_at: null
        precision: 'exact'
        text: 'First provolved ferrets, the Putorians.'
        links:
          - {kind: 'article', id: '47f591591626f', text: 'Putorians'}
      - year_at: 526
        until_at: null
        precision: 'exact'
        text: 'The energetic but non-lethal "Bermuda Shoestring Assembler" coats much of the North Atlantic with "gruel" forming a hazard to shipping and mass die-offs of some species of marine life.'
        links: []
      - year_at: 528
        until_at: null
        precision: 'exact'
        text: 'The GAIA Conglomerate (Global Artificial Intelligence Array) is founded by many national governments, local Free Zones, and a number of different corporations in order to establish an efficient global nanoimmune system.'
        links:
          - {kind: 'article', id: '464d2a24c11ef', text: 'GAIA'}
      - year_at: 529
        until_at: null
        precision: 'exact'
        text: 'New World launched for Beta Virginis.'
        links:
          - {kind: 'article', id: '48735da987f1b', text: 'Beta Virginis'}
      - year_at: 533
        until_at: null
        precision: 'exact'
        text: 'Mabugana Habitat departs Solar System for Epsilon Eridani, following conversion to an antimatter catalysed fusion colony ship.'
        links:
          - {kind: 'article', id: '4b744b04388e0', text: 'Mabugana Habitat'}
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
          - {kind: 'article', id: '493d339fee0c1', text: 'antimatter catalysed fusion'}
          - {kind: 'article', id: '488ee89fd34a0', text: 'colony ship'}
  - id: 'sundering'
    topic: '45b2b27e35ae4'
    name: 'The Sundering'
    title: '530 to 900 AT: The Sundering'
    kind: 'period'
    parent: 'solsys-era'
    start_at: 530
    end_at: 900
    events:
      - year_at: 550
        until_at: null
        precision: 'exact'
        text: 'Mure Gurupu launch a neumann probe to Van Biesbroeck''s star (more here: Perpetua Project).'
        links:
          - {kind: 'article', id: '4b0ff6031a292', text: 'more here: Perpetua Project'}
      - year_at: 565
        until_at: null
        precision: 'exact'
        text: 'The destruction of the L5 upload rescue center and the theft of large quantities of data including uploaded individuals. This is believed to be the first appearance of the entity that later became known as The Scavenger.'
        links:
          - {kind: 'article', id: '467892171fffb', text: 'L5'}
          - {kind: 'article', id: '480fdf11c4389', text: 'The Scavenger'}
      - year_at: 565
        until_at: null
        precision: 'exact'
        text: 'The Martian Union officially severs relations with the rest of the Inner Council over security concerns during the early days of the Technocalypse and establishes a provisional planetary government. The move greatly damages inner system coordination during the ongoing crisis.'
        links: []
      - year_at: 565
        until_at: 566
        precision: 'exact'
        text: 'The Technocalypse opens with incidents affecting millions in the Inner System: a widespread flaw in common rejuvenation treatments results in 8 million deaths. Riots at the facilities of the corporation thought responsible result in the release of the Black Rot into Earth''s atmosphere. The Rot infests and destroys both farms and natural ecosystems and ultimately spreads beyond Earth''s biosphere to infect vats and farms across the Solar System. On Earth, struggles to contain the Black Rot lead to a cascading loss of control in the heavily managed ecosystems of the day. Later that same year, adaptive neumann-capable mining units on Mercury break out of their programming and re-task to the sole objective of aggressively producing more of their own kind. After destroying facilities on Mercury they begin launches towards other targets in Solsys, beginning with the critical amat production facilities, proceeding to Venus, and spreading ultimately to a variety of sites in the Solar System. Under these accumulated stressors, the Cislunar Alliance begins to break up, a process that will take decades.'
        links:
          - {kind: 'article', id: '48f93b9350fe7', text: 'Mercury'}
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
      - year_at: 566
        until_at: null
        precision: 'exact'
        text: 'The chaos of the Technocalypse reaches the bubblehabs everywhere in the system, as various and sometimes unidentified factions target helium-3 production facilities. Massive loss of life, in some cases in excess of 50% of the native populations. Subsequent wars between surviving Inworlder groups, and wars of retribution against Outworlder aggressors (real and imagined) cripple trade and communication. A disproportionate number of the survivors are in pre-existing Hider bubble-habs, or in communities that adopted that strategy early in the conflict. They employ stealth technologies and move to below the traditional one-bar pressure level. These ''Dropouts'' will be a powerful influence on future developments.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
      - year_at: 567
        until_at: null
        precision: 'exact'
        text: 'Violence erupts on and around Mars as the bots of the Nanoswarms wreck the terraforming and kill over 50% of the population. De-orbited satellites and redirected terraforming comets cause serious geological damage.'
        links:
          - {kind: 'article', id: '48e77e52e27f8', text: 'Mars'}
          - {kind: 'article', id: '4851e16f514d0', text: 'terraforming'}
      - year_at: 567
        until_at: null
        precision: 'not_earlier_than'
        text: 'The 4.6 version of GAIA is fully activated on Earth as a counter to the ongoing threats of the Technocalypse. To ordinary sophonts, this entity appears to be another distributed superturing AI, though a very effective one. Transapients in communication with GAIA recognize the traits of a being who has recently achieved the first toposophic level, though none of this is communicated to lesser beings. Not long after achieving S1, (according to later consensus of historical toposophologists) GAIA comes to believe that a second singularity is achievable. Possibly motivated by the thought that this will lead to better ways to combat the dislocations of the Technocalypse, GAIA begins a search for a safe ascent to S2.'
        links:
          - {kind: 'article', id: '464d2a24c11ef', text: 'GAIA'}
          - {kind: 'article', id: '559d3b5ae17aa', text: 'Technocalypse'}
          - {kind: 'article', id: '4786e406d540e', text: 'sophonts'}
          - {kind: 'article', id: '478c147987202', text: 'superturing'}
          - {kind: 'topic', id: '492d6aa0a549a', text: 'first toposophic level'}
          - {kind: 'topic', id: '45b3daabb2329', text: 'toposophologists'}
      - year_at: 568
        until_at: null
        precision: 'exact'
        text: 'The Caracas Treaty Organisation is formed by a powerful alliance of Cislunar, European Federation and Net-corporate interests to enforce the Caracas Treaty. Over the next 50 years the Treaty Org persuades, coerces or invades regions in order to bring dangerous technologies under control.'
        links: []
      - year_at: 570
        until_at: null
        precision: 'exact'
        text: 'Best Friend of Man League established for the protection of baseline and provolved canines in the current crisis (more here).'
        links:
          - {kind: 'article', id: '4a3bf70ba20ba', text: 'more here'}
      - year_at: 572
        until_at: null
        precision: 'exact'
        text: 'Pluto comes under the control of the Emergency Board of Directors for Public Safety, often known simply as the Directory.'
        links:
          - {kind: 'article', id: '46fc4919cdee8', text: 'Pluto'}
      - year_at: 573
        until_at: null
        precision: 'exact'
        text: 'International Defense Net is included in GAIA. A number of vocal critics of this move are silenced.'
        links: []
      - year_at: 573
        until_at: null
        precision: 'exact'
        text: 'The Treaty Org forces the California Republic into its umbrella agreement using direct military threats. It is the first in a long list of "suspected regions" to be put under near-total surveillance.'
        links:
          - {kind: 'article', id: '46031c28e3454', text: 'California Republic'}
      - year_at: 587
        until_at: null
        precision: 'exact'
        text: 'The Ran Outpost treaty is agreed upon between the three colony missions towards Ran.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Ran'}
      - year_at: 588
        until_at: null
        precision: 'exact'
        text: 'The Tsiolkovsky arrives at Tau Ceti.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 589
        until_at: null
        precision: 'exact'
        text: 'The Treaty Org adopts GAIA as the official technodefense standard against all malware and biotech threats, outlawing alternative or incompatible standards. This leads to the "antibody war", as many regions and groups refuse to trust it (often with support from what remains of the Cislunar Alliance). The war lasts for nearly 20 years as the Treaty Org gradually replaces/destroys competing systems.'
        links: []
      - year_at: 590
        until_at: null
        precision: 'exact'
        text: 'GAIA''s own nanofacturing systems are installed across the Earth, producing defense and other products. The Treaty Org is increasingly relying on GAIA not just for technological or military defenses but for production, planning and economy.'
        links: []
      - year_at: 595
        until_at: null
        precision: 'exact'
        text: 'The first of the Shuttles, simply called "Red", arrives at Tau Ceti/ Nova Terra.'
        links:
          - {kind: 'article', id: '486d3f446d128', text: 'Red'}
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 595
        until_at: null
        precision: 'exact'
        text: 'The Gengineer Republic colony ship Kelkemesh arrives at Ran.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Ran'}
      - year_at: 597
        until_at: null
        precision: 'exact'
        text: 'The 61 Virginis probes of the Virginis Effort arrive within their target system. Separating from the mother hull, the Virgo probe is placed within an orbit that takes it within 0.32 AU of the star, and out to 0.75 AU. The Spica probe ranges from 0.8 to 3.7 AU, and the Porrima probe ranges from 5 to 12 AU. Each probe is equipped with a flotilla of microprobes, including various forms of landers, atmospheric balloons, and deep surface penetrators. The mother probes themselves are capable of being diverted into planetary orbit if required, but once this is done they will be locked within that orbit.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 597
        until_at: null
        precision: 'exact'
        text: 'Data begin to return to Earth from the Virginis Effort. The most important information concerns the second planet, confirmed to indeed be lifebearing, but at an Archaean level of biological development. This information makes little impact on the still-chaotic Solar System civilization in general. However great interest is taken by a neo-pagan group, the Children of the Dawn, and their patron AI Eostre, a First Toposophic intelligence.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: 'Virginis Effort'}
      - year_at: 600
        until_at: null
        precision: 'exact'
        text: 'Because of the Technocalypse no Putorians are left in Solsys.'
        links:
          - {kind: 'article', id: '47f591591626f', text: 'Putorians'}
      - year_at: 601
        until_at: null
        precision: 'exact'
        text: 'Eostre and the Children of Dawn petition for and ultimately win the right to colonize 61 Virginis. Their goal is to create a paradise in which Humans may live in the manner in which the Children believe as they were meant to: at a low technological level, off of the land, with guidance from a "god", in this case the AI Eostre and her small cadre of priests. After being granted this right, they complete a half-constructed starship in a Neptunian shipyard, and depart solsys.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 602
        until_at: null
        precision: 'exact'
        text: 'The AI cluster Jancitra-123 builds a massive space-based laser transmitter to beam itself and what it can save of solar civilisation into space, hoping to be received at Tau Ceti. For the 13 months the transmitter works several hundred AIs and partial uploads attempt the escape. Tau Ceti never manages to receive the beam, but it is later partially received and reconstructed by Keterist historians in 4893 AT, based on a backup signal that was sent to the Black Acropolis.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
          - {kind: 'topic', id: '45cbd68bc347f', text: 'Keterist'}
          - {kind: 'article', id: '48000db9a9c2f', text: 'Black Acropolis'}
      - year_at: 603
        until_at: null
        precision: 'exact'
        text: 'The Cislunar Alliance colony ship Mayari. arrives at Ran.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Ran'}
      - year_at: 607
        until_at: null
        precision: 'exact'
        text: 'The Eostre Complex leaves the Sol System, bound for 61 Virginis. There are several ships involved, including the far ranging Whiskers, which search for obstacles along the way, Flickers, which remove those obstacles (usually through laser immolation, though nuclear weapons might be used in the unlikely case of larger objects), and Whisperers, which maintain a communications net among all of the various craft. Larger vessels include three unnamed cargo vessels, two biological carriers, and two colonial carriers. Eostre herself is maintained within a separate vessel. This vessel, along with the cargo vessels and biological carrier, will precede the colonial vessel by several months. In theory, by the time the colonists arrive, a local thriving ecosystem will have been established in an appropriate area on the target planet, now named Eostremonath.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 607
        until_at: null
        precision: 'exact'
        text: 'The Cislunar Swarm: a massive Moon-based outbreak of replicators attacks space holdings, crushing the last Cislunar Alliance networks. A counter-swarm launched by GAIA defeats the swarm after a short battle. Some historians consider this battle to be suspiciously short.'
        links:
          - {kind: 'article', id: '464d2a24c11ef', text: 'GAIA'}
      - year_at: 607
        until_at: null
        precision: 'exact'
        text: 'The Martian Union colony ship Cinnabar arrives at Ran.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Ran'}
      - year_at: 609
        until_at: null
        precision: 'exact'
        text: 'The lead Heavenly Palaces colony ship arrive at Sigma Draconis, the others at ten year intervals.'
        links:
          - {kind: 'article', id: '48e89a9239865', text: 'Sigma Draconis'}
      - year_at: 610
        until_at: null
        precision: 'exact'
        text: 'The remaining Martian ecosystem crashes. Great loss of life, although some refugees escape to surviving orbitals, others to the Belt or the outer solar system. The swarm-ravaged Mars is occupied by invaders for the next four decades.'
        links:
          - {kind: 'article', id: '48e77e52e27f8', text: 'Martian'}
      - year_at: 616
        until_at: null
        precision: 'exact'
        text: 'Thanks to a massive restoration effort, Europe is partially habitable. The Treaty Org moves its physical headquarters to Nova Roma.'
        links:
          - {kind: 'article', id: '4c1db9d238473', text: 'Europe'}
      - year_at: 620
        until_at: null
        precision: 'exact'
        text: 'The Earth-Moon-Lagrange region is declared free of hostile malware and plagues. GAIA controls all local defences and automated military hardware on Earth and in Earth orbit, and supervises civilian infrastructure and industry at all levels. The great ravages of the Technocalypse have been defeated, but at a terrible cost. Earth is still a shambles, with large areas devastated down to the bedrock. Billions are dead, and the remaining enclaves often have to be forcefully coerced into cooperating with the Treaty Org and GAIA. Despite this, hope is spreading. GAIA''s devices and agents are beginning to restore the environment, recreating lost species, turning ash into passable topsoil and cleaning the oceans. The Treaty Org begins to see itself as savior of mankind, not just on Earth but with a mission to "save" the rest of Terragen mindkind. To this end they have believe they have GAIA, a tame god. In fact GAIA is already well beyond the Treaty Org''s control, and at this point She is constrained only by the presence and influence of the other First Singularity beings of Solsys. However, at some time during this year GAIA transcends, apparently in a single rapid toposophic leap and becomes the only Second Singularity transapient of her day, with no peers or equals of any kind.'
        links:
          - {kind: 'article', id: '464d2a24c11ef', text: 'GAIA'}
      - year_at: 621
        until_at: null
        precision: 'exact'
        text: '"The Great Expulsion". GAIA gives the inhabitants of Earth an ultimatum: a tiny minority may remain under strict ecological rules, but the vast majority must leave or be destroyed. GAIA forces the expulsion of the vast majority of humans, along with the tweaks, splices, provolves, uploads and cyborgs as well as any independent ais and hyperturings still remaining on Earth. Many hundreds of millions die in hopeless resistance against the evacuation, or in struggles with each other. Getting the surviving five and a half billion people into space proves a heavy undertaking even for a planetary god, but GAIA manages one of the largest spacelifts in recorded history using such methods as laser-launched shuttles and Lofstrom Loops. Some of the refugees receive aid in the form of interplanetary transport, or seedtech that speeds the creation of habs, or even of interstellar craft. Others receive little more than a boost into space. Other than a slight bias in favour of the most cooperative groups, there is no apparent pattern to the level of assistance provided. In little over 20 years the Earth is mostly empty. Only a few tens of millions of GAIA-loyalists, known as the "Children of Earth", are allowed to remain.'
        links:
          - {kind: 'article', id: '49b46fd2198ed', text: 'The Great Expulsion'}
          - {kind: 'article', id: '4684534627504', text: 'Lofstrom Loops'}
          - {kind: 'article', id: '4a25da3d49175', text: 'seedtech'}
          - {kind: 'article', id: '46258a4b0a054', text: 'Children of Earth'}
      - year_at: 621
        until_at: null
        precision: 'exact'
        text: 'Start of the so-called Last War.'
        links:
          - {kind: 'article', id: '4d5da1d55d1e5', text: 'Last War'}
      - year_at: 621
        until_at: null
        precision: 'exact'
        text: 'The Sure arrives at Epsilon Indi; because of a cryonics failure only six colonists are successfully revived. These become House Stevens.'
        links:
          - {kind: 'article', id: '479546d8e9f5e', text: 'Epsilon Indi'}
          - {kind: 'article', id: '47f6d3e88dbcb', text: 'House Stevens'}
      - year_at: 621
        until_at: 660
        precision: 'exact'
        text: 'The Great Expulsion leads to massive emigration of Earth refugees into newly constructed bubblehabs in the atmospheres of Saturn, Uranus, and Neptune. Venus is bypassed as too dangerous due to its remaining mechosystem, and Jupiter as too hostile to humans and other Earth-adapted clades not only because of its high gravity but because of aggressive native clades, survivors of the original Genetekker colonies. Saturn absorbs the majority of refugees, just as before the Technocalypse it was the target of choice for less desperate immigrants. Some refugees to these regions are gifted by GAIA with self-maintaining and self-replicating seedtech bubblehabs. After a period of cautious observation the designs for these are bought or stolen and are widely copied and adapted by the existing populations as well.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'article', id: '4782f41f69d8c', text: 'Saturn'}
          - {kind: 'article', id: '4f1828a411675', text: 'Uranus'}
          - {kind: 'article', id: '46cf9d774980c', text: 'Neptune'}
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
          - {kind: 'article', id: '47aa8232b1c70', text: 'mechosystem'}
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jupiter'}
      - year_at: 622
        until_at: null
        precision: 'exact'
        text: 'Refugees in orbit dissolve the Martian Union and establish the Martian Republic.'
        links: []
      - year_at: 623
        until_at: null
        precision: 'exact'
        text: 'Some of the habitats in Earth orbit have been expanded and upgraded by GAIA and act as waystations for the expelled population of Earth. Over the next years more and more of these habitats as well as newly built emergency habitats in cislunar space are filled up by refugees.'
        links: []
      - year_at: 628
        until_at: null
        precision: 'exact'
        text: 'The Treaty Org provisional government is set up in Zeno Base on the Moon. Over the next 40 years a large population of Earth refugees aligned with the Treaty Org settle on the Moon, competing violently with the native selenians and anti-Org groups over scarce resources ("the moon wars"). Vast numbers settle in hastily constructed warrens on Luna. Other refugees flee to the Mars Orbitals, the Belt, the moons and atmospheres of Saturn and the outer planets, and the recovering colonies around Jupiter. The decimated and embattled colonies of Venus and Mercury and on the surface of Mars are sources of additional refugees. By this time human destiny, and all life in the solar system, is in the hands of the transapients, though this is not widely recognized. There are factions even among the AIs, but these are even less well understood.'
        links:
          - {kind: 'article', id: '48f92290112c1', text: 'Moon'}
      - year_at: 629
        until_at: null
        precision: 'exact'
        text: 'Experimental dwarf cyber-tweak Doran clade set off in an amat-fusion hybrid ship from Toutatis asteroid towards Gliese 877.'
        links:
          - {kind: 'article', id: '464d0cf4b278f', text: 'Doran'}
      - year_at: 640
        until_at: null
        precision: 'exact'
        text: 'The expulsion ends, and GAIA dismantles her technological infrastructure and sets to truly restore the planet. The civilizations in space beyond near earth orbit are apparently ignored.'
        links:
          - {kind: 'article', id: '49b46fd2198ed', text: 'expulsion'}
      - year_at: 640
        until_at: null
        precision: 'exact'
        text: 'The group of Beneficence members expelled from Earth name themselves the Exodus Beneficents.'
        links:
          - {kind: 'article', id: '483f5ec5eb666', text: 'Beneficence'}
      - year_at: 641
        until_at: null
        precision: 'exact'
        text: 'The Tau Ceti TCPT administration faces its first major challenge when some baseline colonists decide to settle an area of Themis, one of the mercury-sized moons of Zeus.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 641
        until_at: null
        precision: 'exact'
        text: 'Beamrider station established at Praxis, Epsilon Indi Ba.'
        links:
          - {kind: 'article', id: '4703bc2ea1fdc', text: 'Praxis'}
      - year_at: 644
        until_at: null
        precision: 'exact'
        text: 'The first of many massive interstellar "arks" is sent towards Tau Ceti and other colonised systems with refugees in cryonic suspension. The most successful of these efforts are supported by GAIA, or by other AIs. Not all arrive at their destinations.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
          - {kind: 'article', id: '46462d7124dee', text: 'cryonic suspension'}
      - year_at: 645
        until_at: null
        precision: 'exact'
        text: 'Following several years of careful thinktanking, interparty politicking, and sociological simulations, a new Tau Ceti constitution is announced and the Tau Ceti Democratic Republic (TCDR) is formed.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 645
        until_at: null
        precision: 'exact'
        text: 'The arkship Starlark departs Solsys with 18,000 colonists in hibernation.'
        links:
          - {kind: 'article', id: '486d3b1911f17', text: 'Starlark'}
      - year_at: 647
        until_at: null
        precision: 'exact'
        text: 'Several independent Nova Terra settlements and orbitals announce that they were formally breaking away from the colony, forming their own nation, the Free Ceti Alliance (FCA).'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 648
        until_at: null
        precision: 'exact'
        text: 'Mars'' orbital habitats hold millions of refugees from the planetary surface, and from Earth; shortages of food and overcrowding cause severe social problems for more than two centuries. The Titanite occupation of Mars ends. For more than a hundred years the Red Planet is almost completely empty of inhabitants.'
        links:
          - {kind: 'article', id: '48e77e52e27f8', text: 'Mars'}
          - {kind: 'article', id: '48f92f7b152b9', text: 'Titanite'}
      - year_at: 654
        until_at: null
        precision: 'exact'
        text: 'The interstellar craft Bismillah allows several thousand vitrified colonists to escape to Epsilon Eridani, where they will eventually establish the Eridanus League. Like other favourable locations, this nearby system is soon ''crowded'' with refugees from Earth due to the often oversized territorial claims of the earliest arrivals.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 664
        until_at: null
        precision: 'exact'
        text: 'With the assistance of GAIA the Esperanza departs for the 107 Piscium system.'
        links:
          - {kind: 'article', id: '4c3b97f33810a', text: '107 Piscium system'}
      - year_at: 673
        until_at: null
        precision: 'exact'
        text: 'The "long orbit" of 47 cislunar refugee habitats into the belt causes a complex political and military situation as various settlements try to keep them away. In the end they arrive in the Hilda group, forming the short-lived Hilda Humanity before becoming independent polities.'
        links: []
      - year_at: 675
        until_at: null
        precision: 'exact'
        text: 'Mabugana arrives at Epsilon Eridani.'
        links:
          - {kind: 'article', id: '4b744b04388e0', text: 'Mabugana'}
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
      - year_at: 676
        until_at: null
        precision: 'exact'
        text: 'The last of the Shuttles to arrive at Tau Ceti found to be infected with malware from the Technocalypse, but the outbreak is contained.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
      - year_at: 679
        until_at: null
        precision: 'exact'
        text: 'The arkship Jubilee arrives at Procyon.'
        links:
          - {kind: 'article', id: '4703bd683b72b', text: 'Procyon'}
      - year_at: 685
        until_at: null
        precision: 'exact'
        text: '"The Great Shedding": neumann-capable devices in the Jupiter atmosphere launch massive quantities of warbot ''seeds'', destroying many surviving communities in the Jovian system and causing brief swarms on the outer planets and in the Belt.'
        links:
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jovian system'}
      - year_at: 685
        until_at: null
        precision: 'exact'
        text: 'The Great Shedding destroys most of the bubblehabs in Jupiter''s atmosphere. The very few and very paranoid survivors, mostly vecs and Genetekker-derived tweaks descend into technosavagery. Hostile sporetech devices, some specifically designed to destroy bubble habs (deathbirds, bubblemites), reach the atmospheres of the other gas giants, causing great loss of life. Isolationism is the primary survival strategy.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'topic', id: '45c5299b77999', text: 'vecs'}
          - {kind: 'topic', id: '45beb1fcc5ba6', text: 'tweaks'}
          - {kind: 'topic', id: '45b6c88e90048', text: 'sporetech'}
      - year_at: 690
        until_at: null
        precision: 'exact'
        text: 'The terraformation of planet Two in the Epsilon Eridani system commences.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
      - year_at: 700
        until_at: null
        precision: 'circa'
        text: 'Over the next 200 years the Lunar colonies develop into closed, resource-conscious and paranoid communities with little contact.'
        links: []
      - year_at: 700
        until_at: null
        precision: 'circa'
        text: 'Bubblehabs at Venus are destroyed or depopulated as the last few survivors fall to the atmosphere''s hostile neumanns. In the Outer system, growth of further bubblehabs is limited by the need for heavier elements. These may be obtained through time-consuming sifting of the atmosphere, through the tiny trickle of interplanetary trade, or by taking them from other bubblehabs. In the atmospheres of Solsys'' gas giants this is the era of the infamous Sky Pirates and Cannibal Cities.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'Bubblehabs'}
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
          - {kind: 'topic', id: '6a674d925a73f', text: 'neumanns'}
      - year_at: 705
        until_at: null
        precision: 'exact'
        text: 'Four space arks leave Solsys for 18 Scorpii.'
        links:
          - {kind: 'article', id: '49024b4de8dac', text: '18 Scorpii'}
      - year_at: 710
        until_at: 750
        precision: 'exact'
        text: 'The Tau Ceti polity of Unity is formed; an advanced society of hu and ai group minds.'
        links:
          - {kind: 'article', id: '471eae8eb7f67', text: 'Unity'}
      - year_at: 710
        until_at: null
        precision: 'exact'
        text: 'The Generation Ship Endurance departs Solsys for Beta Canum Venaticorum.'
        links:
          - {kind: 'article', id: '4b6837d40ac2d', text: 'Generation Ship'}
          - {kind: 'article', id: '4af6f1873dbc6', text: 'Beta Canum Venaticorum'}
      - year_at: 710
        until_at: null
        precision: 'circa'
        text: 'The trust networks around the Jovian habs enter an uneasy stable period. These fractured unions of habs shared resources internally, but practiced limited (if any) trade and communication with the outside world. Those habitats that could be "trusted" to be free from plague, and practice stringent cyberhygiene, benefited from a flow of material and intellect. As the Jovians learned these benefits came with risks. Should one trusted habitat become comprised the entire network could be infected. In addition, to maintain trust invasive audits and strict rules were often the norm. In several notable cases these led to conflict.'
        links:
          - {kind: 'article', id: '629b747d1aaf0', text: 'trust networks'}
      - year_at: 739
        until_at: null
        precision: 'exact'
        text: 'The Indonesian expedition arrives at Daedalus (Pi3 Orionis.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Daedalus (Pi3 Orionis'}
      - year_at: 740
        until_at: null
        precision: 'exact'
        text: 'GAIA Space Arks arrive at Epsilon Eridani from SolSys; Skyclad Jains, Christian sects, Chinese and Japanese refugees, others. Antimatter farms established to power terraformation process.'
        links:
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
          - {kind: 'article', id: '45f0c79d13c29', text: 'Antimatter farms'}
      - year_at: 754
        until_at: null
        precision: 'exact'
        text: 'On Daedalus (Pi3 Orionis, the heterosemioticist Dahlberg is assassinated and a faction calling itself the Minskians comes to power.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Daedalus (Pi3 Orionis'}
      - year_at: 764
        until_at: null
        precision: 'exact'
        text: 'The Starlark arrives at Epsilon Indi.'
        links:
          - {kind: 'article', id: '486d3b1911f17', text: 'Starlark'}
          - {kind: 'article', id: '479546d8e9f5e', text: 'Epsilon Indi'}
      - year_at: 764
        until_at: null
        precision: 'exact'
        text: 'Erik Atell starts the Atellian movement on Nova Terra (more here).'
        links:
          - {kind: 'article', id: '471eae8eb7f67', text: 'more here'}
      - year_at: 761
        until_at: null
        precision: 'exact'
        text: 'On Daedalus, the Indonesians counterstrike using a powerful computer virus that wipes out the planetary net.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Daedalus'}
      - year_at: 770
        until_at: null
        precision: 'exact'
        text: 'River of Stars Charter proclaimed at Epsilon Eridani IID; leads to the foundation of the Eridanus League.'
        links:
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 772
        until_at: null
        precision: 'exact'
        text: 'Unity colony founded by the Atellians in a disused space station orbiting Nova Terra.'
        links:
          - {kind: 'article', id: '471eae8eb7f67', text: 'Unity'}
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 773
        until_at: null
        precision: 'exact'
        text: 'The Starlark departs Epsilon Indi following a coup, taking several former leaders of the Family Council into exile.'
        links: []
      - year_at: 744
        until_at: null
        precision: 'exact'
        text: 'The Bismillah arrives at Epsilon Eridani.'
        links:
          - {kind: 'article', id: '4910e5c60edcc', text: 'Bismillah'}
          - {kind: 'article', id: '4795465645a82', text: 'Epsilon Eridani'}
      - year_at: 784
        until_at: null
        precision: 'exact'
        text: 'The Gengineer Republic is dissolved after centuries of decline.'
        links: []
      - year_at: 789
        until_at: null
        precision: 'exact'
        text: 'GAIA''s refugee arks arrive at Twilight.'
        links:
          - {kind: 'article', id: '47a683c98fd29', text: 'Twilight'}
      - year_at: 790
        until_at: null
        precision: 'exact'
        text: 'The Joh-Lau culture in the Mercury underground bases reaches its zenith. They are totally isolated from the rest of Solsys, and will only be discovered during the late 900''s, by which time they will have declined to near savagery. However the art of the Joh-Lau from this period will later be regarded as one of the brightest points of the era.'
        links:
          - {kind: 'article', id: '48f93b9350fe7', text: 'Mercury'}
      - year_at: 790
        until_at: null
        precision: 'exact'
        text: 'Nova Terra declines to join Eridanus League.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 800
        until_at: null
        precision: 'exact'
        text: 'Twilight joins Eridanus League.'
        links:
          - {kind: 'article', id: '47a683c98fd29', text: 'Twilight'}
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 800
        until_at: null
        precision: 'circa'
        text: 'The bubblehabs of Uranus and Neptune begin to emerge from the Dark Age, with the growth of beneficial trade and communication within and beyond the atmosphere, as the bubblehabs develop new connections with each other and with the local orbital and lunar settlements. Around Saturn the situation is more complex; the Han Hegemony and the Warriors of the Western Stream bring a degree of peace and harmony to the habs that fall under their sway, but the ''objective/utilitarian'' Children of Kronos (known to their detractors as ''The Eaters'') bring about their own brutal definition of order to the habs they subjugate. EOCC emissaries and missionaries from the orbital habs attempt memetic manipulations that sometimes ameliorate the repression and warfare of the era, though at times the transition to gentler societies itself causes great loss of life. In the background, the famous Hidden Cities of Dropouts such as Laputa and Valinor attempt to preserve their security and influence. Jupiter''s few bubble habs are in a state of anarchy and war, struggling against each other and against ongoing predatory activity by hostile self-replicating devices.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'article', id: '4f1828a411675', text: 'Uranus'}
          - {kind: 'article', id: '46cf9d774980c', text: 'Neptune'}
          - {kind: 'article', id: '4782f41f69d8c', text: 'Saturn'}
          - {kind: 'article', id: '4ad470a85b05e', text: 'EOCC'}
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jupiter''s'}
      - year_at: 801
        until_at: null
        precision: 'exact'
        text: 'Nova Terra: Erik Atell is killed in crossfire between between the Space Guard and the militant Tau Ceti Liberation Army.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 801
        until_at: null
        precision: 'exact'
        text: 'Nova Terra: Erik Atell''s successor Yotik Henrigues begins a new plan; instead of trying to found another settlement or merge with the Republic they intend to form a separate orbital colony, independent from both factions.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 804
        until_at: null
        precision: 'exact'
        text: 'Nova Terra: Atellians move in large numbers to Henrigues'' orbital, joining the ai colony/nation Unity.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 805
        until_at: null
        precision: 'exact'
        text: 'Nova Terra: To allay Tau Ceti Democratic Republic fears Unity signs a non-intervention treaty.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 815
        until_at: null
        precision: 'exact'
        text: 'Epsilon Indi joins the Eridanus League.'
        links:
          - {kind: 'article', id: '479546d8e9f5e', text: 'Epsilon Indi'}
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 820
        until_at: null
        precision: 'exact'
        text: 'Complete social breakdown on Daedalus.'
        links: []
      - year_at: 820
        until_at: null
        precision: 'exact'
        text: 'Technological levels in the Old Solar System are generally similar to those found a century before the Technocalypse. Many AI entities hoard technology and information, and dispense it only to favoured groups. The Goddess of Earth does not communicate with any being outside her protectorate, but is the most toposophically advanced entity known at this time.'
        links:
          - {kind: 'article', id: '48f915a959b12', text: 'Old Solar System'}
          - {kind: 'article', id: '559d3b5ae17aa', text: 'Technocalypse'}
          - {kind: 'article', id: '464d2a24c11ef', text: 'Goddess of Earth'}
      - year_at: 821
        until_at: null
        precision: 'exact'
        text: 'The AI Rastaban 1 (formerly of Interworld) breaks out of its hiding-place in Mimas and escapes the solar system using a massive antimatter blast that creates the now familiar Mimas frown. The descendant of the AI was later re-discovered by First Federation explorers in orbit around Fomalhaut.'
        links:
          - {kind: 'topic', id: '45cbd30e46c61', text: 'Fomalhaut'}
      - year_at: 850
        until_at: null
        precision: 'exact'
        text: '''.....'' sporeship arrives at Alpha Centauri but is destroyed by the Nauri.'
        links:
          - {kind: 'article', id: '4ba1012793821', text: '''.....'' sporeship'}
          - {kind: 'article', id: '487146f744c8e', text: 'Alpha Centauri'}
          - {kind: 'article', id: '47f42ab73ce60', text: 'Nauri'}
      - year_at: 850
        until_at: null
        precision: 'exact'
        text: 'P Eridani joins Eridanus League.'
        links:
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 853
        until_at: null
        precision: 'exact'
        text: 'The (Second) Trojan War between the different habitats in the trojan asteroids.'
        links:
          - {kind: 'article', id: '47a67e5a7414b', text: 'trojan'}
      - year_at: 854
        until_at: null
        precision: 'exact'
        text: 'The Turing arrives at Pi3 Orionis. The Heterosemiotics name the fourth planet Daedalus.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Pi3 Orionis'}
      - year_at: 856
        until_at: null
        precision: 'exact'
        text: 'New World arrives at Beta Virginis.'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 858
        until_at: null
        precision: 'exact'
        text: 'First colony established on New America (Beta Virginis IV), small orbitals established.'
        links: []
      - year_at: 863
        until_at: null
        precision: 'exact'
        text: 'Original provisional administration at Beta Virginis replaced by system along Old Earth American lines, with two parties: Unionists and Federalists.'
        links: []
      - year_at: 870
        until_at: null
        precision: 'exact'
        text: 'The Ceres habitats unite into a provisional federation.'
        links:
          - {kind: 'article', id: '4870c5e93f02a', text: 'Ceres'}
      - year_at: 876
        until_at: null
        precision: 'exact'
        text: 'Esperanza enters the 107 Piscium system.'
        links:
          - {kind: 'article', id: '4c3b97f33810a', text: '107 Piscium system'}
      - year_at: 880
        until_at: null
        precision: 'exact'
        text: 'Hindi Expansion vessel arrives at Epsilon Indi.'
        links:
          - {kind: 'article', id: '479546d8e9f5e', text: 'Epsilon Indi'}
      - year_at: 890
        until_at: null
        precision: 'exact'
        text: 'The asteroid habitat Mondo is destroyed by a nanoswarm, the last major nanoswarm in the solar system.'
        links: []
      - year_at: 890
        until_at: null
        precision: 'exact'
        text: 'Valhalla Habitat now ruled by the Digital Advancement Society (DAS).'
        links:
          - {kind: 'article', id: '49fea757dae0f', text: 'Valhalla Habitat'}
      - year_at: 890
        until_at: null
        precision: 'exact'
        text: 'The first elements of the Eostre Complex arrive within the 61 Virginis system. Over the next several months and years, Eostre will work to create a garden of life for her coming children, on Eostremonath. The colonial vessel arrives within seven months; however, Eostre keeps the entire population in deep sleep pending the preparation of their environment.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis system'}
      - year_at: 892
        until_at: null
        precision: 'exact'
        text: 'MyuvYin settled by tweak bioborg clade.'
        links:
          - {kind: 'article', id: '4a08dca7bbc9c', text: 'MyuvYin'}
  - id: 'interstellar-era'
    topic: '45b2a735dbb26'
    name: 'Interstellar Era'
    title: '0900 to 3200 AT: Interstellar Era'
    kind: 'era'
    parent: ""
    start_at: 900
    end_at: 3200
    events: []
  - id: 'early-federation-age'
    topic: '45b2b4bbafc01'
    name: 'The Early Federation Age'
    title: '0900 to 1200 AT: The Early Federation Age'
    kind: 'period'
    parent: 'interstellar-era'
    start_at: 900
    end_at: 1200
    events:
      - year_at: 903
        until_at: null
        precision: 'exact'
        text: 'The Alpes Water Alliance between the Tycho Republic, Artemis, Cognitum and Zeno marks the beginning of a new cooperation between the Lunar states. The Alpes pact slowly grows, but has more success in contacting Belt groups than inner system groups.'
        links:
          - {kind: 'article', id: '48f92290112c1', text: 'Lunar'}
      - year_at: 910
        until_at: null
        precision: 'exact'
        text: 'The Dyaushpitr, a combination of several different technologies, is the first colony ship launched toward Eta Cassiopeiae.'
        links:
          - {kind: 'article', id: '486ea080f0f84', text: 'Dyaushpitr'}
          - {kind: 'article', id: '48ff5ef2ed040', text: 'Eta Cassiopeiae'}
      - year_at: 910
        until_at: null
        precision: 'circa'
        text: 'Lalande 21185 culture begins to deteriorate.'
        links:
          - {kind: 'article', id: '46789378a3d4e', text: 'Lalande 21185'}
      - year_at: 910
        until_at: null
        precision: 'exact'
        text: 'G-Interface Mark 5 Transcranial Magnetic Stimulator developed by Deimos Cybersystems.'
        links:
          - {kind: 'article', id: '4a2fa04c59dbf', text: 'Transcranial Magnetic Stimulator'}
      - year_at: 920
        until_at: null
        precision: 'exact'
        text: 'Qin Shi Huang arrives at Huanghua.'
        links:
          - {kind: 'article', id: '4978914e5eb57', text: 'Huanghua'}
      - year_at: 923
        until_at: null
        precision: 'exact'
        text: 'The first non-biont, an AI shipmind named Emergence became a member of the Spaceman''s League.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spaceman''s League'}
      - year_at: 928
        until_at: null
        precision: 'exact'
        text: 'At 61 Virginis, Eostre awakens the first wave of colonists. Some 300 people are brought down to the planet''s surface, where an idyllic community set in the heart of a mountain range awaits. While the environment is under constant nano-tweaking and maintenance by Eostre and her servant programs, to the Humans it appears as a mountain valley paradise of green pine forests and verdant meadows, surrounded by a world of brown desolation. However, even now the terraforming continues, and the planet is slowly being carpeted by the green veneer of Earth-based life. In the end, the entire planet will become habitable, stable for a life span of hundreds of millions of years, and will possess hundreds of different biomes, all pristine.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 933
        until_at: null
        precision: 'exact'
        text: 'Federation of Sophonts formally declared on Piazzi Orbital, Vesta. Beneficent nanoborg and Child of GRACE Ravi Wu is one of the authors of the preamble for the Universal Declaration of Sophont Rights of the Vesta Convention.'
        links:
          - {kind: 'article', id: '48f733bcb2e00', text: 'Federation of Sophonts'}
          - {kind: 'article', id: '48f72fe95c51f', text: 'Vesta'}
          - {kind: 'article', id: '483f5ec5eb666', text: 'Beneficent'}
          - {kind: 'topic', id: '46cba1093d4a5', text: 'nanoborg'}
          - {kind: 'article', id: '485acb81cdb0b', text: 'Universal Declaration of Sophont Rights'}
      - year_at: 933
        until_at: null
        precision: 'exact'
        text: 'Exodus Beneficents arrive at Gamma Leporis and begin extensive development in both systems.'
        links:
          - {kind: 'article', id: '4871520aab6c2', text: 'Gamma Leporis'}
      - year_at: 933
        until_at: null
        precision: 'exact'
        text: 'At 61 Virginis the Community Council of Ewden is established. Comprised of the three villages of Midland, Norland, and Easland, it is a simplistic government with few concerns beyond farming and ranching matters. The priests of Eostre were also awakened, but their order has been dissolved by Eostre herself. Little ill-will remains because of this, and soon the rigors of daily life eliminate any possible harboring of resentment. Within a single generation, memories of Earth and high level technology have been all but forgotten. Eostre herself is soon truly regarded as a goddess.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 940
        until_at: null
        precision: 'exact'
        text: 'Two cyborg clades and one vec clade have become part of the Spaceman''s League.'
        links:
          - {kind: 'topic', id: '628a389bddec6', text: 'cyborg'}
          - {kind: 'topic', id: '45c5299b77999', text: 'vec'}
          - {kind: 'article', id: '483b13ae030ce', text: 'Spaceman''s League'}
      - year_at: 944
        until_at: null
        precision: 'exact'
        text: 'The Directory on Pluto is overthrown after a three year long uprising. Physical contact is established with the First Federation with the arrival of the ship Pride of Vesta.'
        links:
          - {kind: 'article', id: '46fc4919cdee8', text: 'Pluto'}
      - year_at: 950
        until_at: null
        precision: 'exact'
        text: 'Interstellar launches from Solsys approach one per year; many new colonies established and old ones recontacted. Moving faster than the wave of human colonisation, Ahuman AI entities have become established around many stars, and act unpredictably when contacted, sometimes dangerously so.'
        links:
          - {kind: 'article', id: '48cdc41e2a932', text: 'Ahuman AI'}
      - year_at: 950
        until_at: null
        precision: 'exact'
        text: 'The bubblehab dwellers in Solsys are gradually integrated into the Federation. There are some early enthusiastic joiners on Saturn, but many holdouts. Polities based on Uranus and Neptune are late to join, having already established a high degree of peace and prosperity on their own. Jupiter''s technosavages are only gradually coaxed into membership after centuries of persistent missionary activity, long after the atmosphere of Jupiter itself is cleansed of its free-breeding population of hostile nanotech devices by Federation ''blue-goo'' sporetech.'
        links:
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehab dwellers'}
          - {kind: 'article', id: '4782f41f69d8c', text: 'Saturn'}
          - {kind: 'article', id: '4f1828a411675', text: 'Uranus'}
          - {kind: 'article', id: '46cf9d774980c', text: 'Neptune'}
          - {kind: 'article', id: '4682fe63d4a68', text: 'Jupiter'}
      - year_at: 950
        until_at: null
        precision: 'exact'
        text: 'No less than 50 of the almost 300 ships of the Spaceman''s League are working with the AI Emergence.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spaceman''s League'}
      - year_at: 950
        until_at: null
        precision: 'exact'
        text: 'Completion of first large orbital around New America, NuYork Orbital (Beta Virginis).'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 952
        until_at: null
        precision: 'exact'
        text: 'Emergence launches a group of fifteen Spaceman''s League ships, fitted with amat-fusion drives to several nearby starsystems (prior to this date the farthest any League ship has been from the Sun was the Oort Cloud. ). This act ensures that the League does not just stay confined to SolSys and the Federation.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spaceman''s League'}
          - {kind: 'article', id: '48f915a959b12', text: 'SolSys'}
      - year_at: 958
        until_at: null
        precision: 'exact'
        text: 'The Babel plague first became epidemic with an outbreak on Penglai.'
        links:
          - {kind: 'article', id: '45fda5e94e584', text: 'Babel plague'}
          - {kind: 'article', id: '48e89a9239865', text: 'Penglai'}
      - year_at: 960
        until_at: null
        precision: 'exact'
        text: 'Efficient Pion-catalysed Fusion drive allows faster colony ships and interplanetary transport.'
        links:
          - {kind: 'article', id: '493d339fee0c1', text: 'Pion-catalysed Fusion'}
      - year_at: 961
        until_at: null
        precision: 'exact'
        text: '!Kung colony ship Backbone of Night sets off from Deimos shipyards to investigate the red dwarf GL876.'
        links:
          - {kind: 'article', id: '486fe40528701', text: 'red dwarf GL876'}
      - year_at: 970
        until_at: null
        precision: 'exact'
        text: 'Beta Virginis technocrats began receiving faint broadbeam radio transmissions from Sol.'
        links:
          - {kind: 'article', id: '48735da987f1b', text: 'Beta Virginis'}
      - year_at: 976
        until_at: null
        precision: 'exact'
        text: 'Cache of primate data discovered (probably a remnant of the Burning Library Project).'
        links:
          - {kind: 'article', id: '486ff7f788fbd', text: 'Burning Library Project'}
      - year_at: 983
        until_at: null
        precision: 'exact'
        text: 'Birth of Lucidia Mirnas Miranda, the founder of the Major Religion Sophism.'
        links:
          - {kind: 'article', id: '4840c090d367a', text: 'Sophism'}
      - year_at: 983
        until_at: null
        precision: 'exact'
        text: 'The Beamrider Network reconnected with the Solar system; it has grown to connect thirty nearby red and brown dwarf systems.'
        links:
          - {kind: 'article', id: '460c3685cd4c4', text: 'Beamrider Network'}
      - year_at: 986
        until_at: null
        precision: 'exact'
        text: 'Huanghua joins the First Federation.'
        links:
          - {kind: 'article', id: '4978914e5eb57', text: 'Huanghua'}
          - {kind: 'article', id: '48f733bcb2e00', text: 'First Federation'}
      - year_at: 1000
        until_at: null
        precision: 'exact'
        text: 'The Eridanus League becomes formally aligned with, but not part of, the First Federation. Between 1000 AT and 1900 AT a second wave of colonists is sent out by the Eridanus League to colonise worlds which will later become the Yoson Confederacy and the FSA.'
        links:
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
          - {kind: 'article', id: '48f733bcb2e00', text: 'First Federation'}
          - {kind: 'article', id: '46e9deab470c9', text: 'Yoson Confederacy'}
      - year_at: 1000
        until_at: null
        precision: 'exact'
        text: '''.....'' sporeship arrives at Barnard''s Star.'
        links:
          - {kind: 'article', id: '4ba1012793821', text: '''.....'' sporeship'}
          - {kind: 'article', id: '4609c8d6cadb4', text: 'Barnard''s Star'}
      - year_at: 1001
        until_at: null
        precision: 'exact'
        text: 'Cache''s discovery announced; Institute for Primate Preservation founded.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Preservation'}
      - year_at: 1002
        until_at: null
        precision: 'exact'
        text: 'The Silver Collective succeed in creating their goal, Simico, one of the earliest of the hive-mind clades, made up of self-modified cyborgs.'
        links:
          - {kind: 'article', id: '47f6c9d80dc7a', text: 'Simico'}
      - year_at: 1003
        until_at: null
        precision: 'exact'
        text: 'GAIA and Federation confer protected status on the Institute for Primate Preservation.'
        links:
          - {kind: 'article', id: '464d2a24c11ef', text: 'GAIA'}
      - year_at: 1004
        until_at: null
        precision: 'exact'
        text: 'Prithi Mata leaves Solsys for Pandya.'
        links:
          - {kind: 'article', id: '4b45da29a57d9', text: 'Pandya'}
      - year_at: 1006
        until_at: null
        precision: 'exact'
        text: 'The Dyaush arrives at Eta Cassiopeiae.'
        links:
          - {kind: 'article', id: '48ff5ef2ed040', text: 'Eta Cassiopeiae'}
      - year_at: 1010
        until_at: null
        precision: 'exact'
        text: 'Lucidia was already considered the Avatar of the Universe by her enthusiastic followers, who had already made her non-profit Sophist Institute into a religion.'
        links: []
      - year_at: 1010
        until_at: null
        precision: 'exact'
        text: 'Fully functional Utility fog commercially available for the first time.'
        links:
          - {kind: 'article', id: '472136a42f3e9', text: 'Utility fog'}
      - year_at: 1012
        until_at: null
        precision: 'exact'
        text: 'Emergence (by laserlink) instructs all the Spaceman''s League ships E sent out of Sol, not to return to Sol, but to trade in their new systems and to find new units for the League.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spaceman''s League'}
      - year_at: 1020
        until_at: null
        precision: 'exact'
        text: 'First manned Plasma Core Antimatter drive spacecraft.'
        links:
          - {kind: 'article', id: '493d299bc818c', text: 'Plasma Core Antimatter drive'}
      - year_at: 1023
        until_at: null
        precision: 'exact'
        text: 'Adriana Yue Oncehuman born.'
        links:
          - {kind: 'article', id: '4bc320e29bd2c', text: 'Adriana Yue Oncehuman'}
      - year_at: 1025
        until_at: null
        precision: 'exact'
        text: 'First Institute for Primate Preservation member achieves S1 (Jane, the cache''s AI guardian); shortly afterwards she is selected Primus.'
        links:
          - {kind: 'topic', id: '492d6aa0a549a', text: 'S1'}
      - year_at: 1028
        until_at: null
        precision: 'exact'
        text: 'An exploration probe sent by the Hyperion corporation scouts the Pi 3 Orionis system before heading back to SolSys.'
        links:
          - {kind: 'article', id: '46805c9b24e09', text: 'Hyperion corporation'}
          - {kind: 'article', id: '48e6722138bbb', text: 'Pi 3 Orionis'}
      - year_at: 1043
        until_at: null
        precision: 'exact'
        text: 'The hyperturing Ruby Marine created in the Jupiter/Sol L5 Trojan Asteroid Swarm.'
        links:
          - {kind: 'topic', id: '45c54923c3496', text: 'hyperturing'}
          - {kind: 'article', id: '4800029bc6a07', text: 'Ruby Marine'}
      - year_at: 1045
        until_at: null
        precision: 'exact'
        text: 'Eostre sends out a subservient AI, combined with several uploaded intellects, to scout out a possible new world. However, at a fuelling operation in orbit of a nearby red dwarf, the ship suffers a cataclysmic failure, and the AI and its intellects are marooned. (61 Virginis).'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 1050
        until_at: null
        precision: 'exact'
        text: 'Schnizlers, an animated/RL children''s show, begins recording.'
        links: []
      - year_at: 1053
        until_at: null
        precision: 'exact'
        text: 'Habitat Prime ("the monkey house") completed near Saturn (Institute for Primate Preservation).'
        links: []
      - year_at: 1056
        until_at: null
        precision: 'exact'
        text: 'Several technarch cells infiltrated and take over Elk River Orbital (Beta Virginis).'
        links: []
      - year_at: 1063
        until_at: null
        precision: 'exact'
        text: 'Emergence (or the Spaceman''s League) confirms longstanding rumors that he has breached the first toposophic barrier.'
        links: []
      - year_at: 1065
        until_at: null
        precision: 'exact'
        text: 'Terranova colonised in 1065 AT by the Terranova Foundation in alliance with the Grue Brothers.'
        links:
          - {kind: 'article', id: '49126e35d4891', text: 'Terranova'}
      - year_at: 1066
        until_at: null
        precision: 'exact'
        text: 'A group of slaved Synthetic Humans manage to find a loophole in their programming and escape to form the Synthetic Human Alliance.'
        links:
          - {kind: 'article', id: '4887ee7944aff', text: 'Synthetic Human Alliance'}
      - year_at: 1068
        until_at: null
        precision: 'exact'
        text: 'Following the Elk River fiasco, fully four-fifths of technorats habitats officially seceded (Beta Virginis).'
        links:
          - {kind: 'article', id: '48735da987f1b', text: 'Beta Virginis'}
      - year_at: 1076
        until_at: null
        precision: 'exact'
        text: 'An exploration craft from Omicron Developments Inc explores the Pi 3 Orionis system.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Pi 3 Orionis'}
      - year_at: 1080
        until_at: null
        precision: 'exact'
        text: 'Terranova joins Eridanus League.'
        links:
          - {kind: 'article', id: '49126e35d4891', text: 'Terranova'}
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 1080
        until_at: null
        precision: 'exact'
        text: 'Negsoa colonised.'
        links:
          - {kind: 'article', id: '4bb9e51204f88', text: 'Negsoa'}
      - year_at: 1100
        until_at: null
        precision: 'circa'
        text: 'The Exodus Beneficents detect activity suggestive of wormholes around Xi Geminorum.'
        links:
          - {kind: 'article', id: '48545a0f6352a', text: 'wormholes'}
          - {kind: 'article', id: '48e8a9ebbbdb7', text: 'Xi Geminorum'}
      - year_at: 1103
        until_at: null
        precision: 'exact'
        text: 'The Institute for Primate Preservation announces 174 primate species re-created.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Preservation'}
      - year_at: 1108
        until_at: null
        precision: 'exact'
        text: 'Valhalla habitat, now converted to a generation ship, leaves Solsys.'
        links:
          - {kind: 'article', id: '49fea757dae0f', text: 'Valhalla habitat'}
      - year_at: 1110
        until_at: null
        precision: 'exact'
        text: 'House Neill and House Devaneaux, two of the old Reydovan Republic''s most influential families, attempt an overthrow of the newly established Reydovan Chancellery. They and House t''Resan, the technical minds that assisted the two houses, are exiled into the Fringes.'
        links: []
      - year_at: 1118
        until_at: null
        precision: 'exact'
        text: 'Prithi Mata arrives at Pandya.'
        links:
          - {kind: 'article', id: '4b45da29a57d9', text: 'Pandya'}
      - year_at: 1120
        until_at: null
        precision: 'exact'
        text: 'First manned beamed core Amat Propulsion drive spacecraft with gamma reflection system.'
        links:
          - {kind: 'article', id: '493d299bc818c', text: 'beamed core Amat Propulsion drive'}
      - year_at: 1125
        until_at: null
        precision: 'exact'
        text: 'The NEHDP Radicals attack and destroy isolationist mining drone (Beta Virginis).'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1130
        until_at: null
        precision: 'exact'
        text: 'Virtual sophonts can be transmitted from one planet to another within a single planetary system (more).'
        links:
          - {kind: 'topic', id: '45c53e7cc82a7', text: 'Virtual sophonts'}
          - {kind: 'article', id: '4a3d78dc77e6f', text: 'more'}
      - year_at: 1133
        until_at: null
        precision: 'exact'
        text: 'Doran Empire colonists arrive at Secharia.'
        links:
          - {kind: 'article', id: '48f94f1a7f8db', text: 'Secharia'}
      - year_at: 1134
        until_at: null
        precision: 'exact'
        text: 'Cishp-dominated Titan finally joins the First Federation.'
        links:
          - {kind: 'article', id: '48f92f7b152b9', text: 'Titan'}
          - {kind: 'article', id: '48f733bcb2e00', text: 'First Federation'}
      - year_at: 1140
        until_at: null
        precision: 'exact'
        text: 'Hu-ai war in Beta Virginis, loss of New Europe.'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1143
        until_at: null
        precision: 'exact'
        text: 'The Institute for Primate Preservation announces first species studies complete; probable re-introduction of species on Old Earth.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Preservation'}
      - year_at: 1145
        until_at: null
        precision: 'exact'
        text: 'Reliable non-destructive uploading developed and approved for public use in Federation polities. Virtual copying becomes widespread.'
        links:
          - {kind: 'article', id: '48bda472970cb', text: 'non-destructive uploading'}
      - year_at: 1150
        until_at: null
        precision: 'exact'
        text: '''.....'' sporeship arrives at Wolf 359 and spreads from there.'
        links:
          - {kind: 'article', id: '4ba1012793821', text: '''.....'' sporeship'}
          - {kind: 'article', id: '470033894c883', text: 'Wolf 359'}
      - year_at: 1150
        until_at: null
        precision: 'circa'
        text: 'Acme of the Federation Museum Ships. In the period from 1150 to 1200 AT alone, no less than 200 will be built.'
        links:
          - {kind: 'article', id: '480ea0a51dd0b', text: 'Museum Ships'}
      - year_at: 1152
        until_at: null
        precision: 'exact'
        text: 'The Wide Array Exotic Radiation Telescope in the SolSys Oort Cloud detects unusual readings from Xi Geminorum. Energy and gravitational wave signature match the theoretical expectation for an active wormhole. The relativistic superturing science probe Carl Sagan was launched from Schroeder Beamrider Station.'
        links:
          - {kind: 'article', id: '48e8a9ebbbdb7', text: 'Xi Geminorum'}
      - year_at: 1156
        until_at: null
        precision: 'exact'
        text: 'Arrival of the Federation robot Survey Vessel Magellan at Beta Virginis.'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1158
        until_at: null
        precision: 'exact'
        text: 'The Omicron Developments ship returned to the solar system, and the corporation announces that the Pi 3 Orionis / Daedalus colony has suffered a serious internal war.'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Pi 3 Orionis'}
      - year_at: 1166
        until_at: null
        precision: 'exact'
        text: 'First Federation ship arrives at Gamma Leporis.'
        links:
          - {kind: 'article', id: '4871520aab6c2', text: 'Gamma Leporis'}
      - year_at: 1170
        until_at: null
        precision: 'exact'
        text: 'Beta Virginis Technorat technology, science, and toposophics, begin developing dramatically through exchange with Federation databases.'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1175
        until_at: null
        precision: 'exact'
        text: 'Lalande 21185 colony rediscovered by Federation megacorps.'
        links:
          - {kind: 'article', id: '46789378a3d4e', text: 'Lalande 21185'}
  - id: 'middle-federation-megacorps'
    topic: '45b2b7211fb55'
    name: 'Middle Federation / Megacorps'
    title: '1200 to 1500 AT: Middle Federation / Megacorps'
    kind: 'period'
    parent: 'interstellar-era'
    start_at: 1200
    end_at: 1500
    events:
      - year_at: 1200
        until_at: null
        precision: 'exact'
        text: 'As a result of terraforming of Beta Virginis IV, the temperature rises and ice begins melting into a vast planet-girdling ocean.'
        links:
          - {kind: 'article', id: '4851e16f514d0', text: 'terraforming'}
          - {kind: 'article', id: '48735da987f1b', text: 'Beta Virginis IV'}
      - year_at: 1200
        until_at: null
        precision: 'circa'
        text: 'With the closing of Kleopatra Base the whole asteroid is opened to developers, and several consortia of theme park developers each tried to outdo themselves, giving the asteroid the nick-name "Little Disneyplanet".'
        links:
          - {kind: 'article', id: '46747d0513c7b', text: 'Kleopatra'}
      - year_at: 1201
        until_at: null
        precision: 'exact'
        text: 'MyuvYin overrun by psychophager ahuman replicator swarm of unknown origin.'
        links:
          - {kind: 'article', id: '4a08dca7bbc9c', text: 'MyuvYin'}
          - {kind: 'article', id: '48cdc41e2a932', text: 'ahuman'}
      - year_at: 1205
        until_at: null
        precision: 'exact'
        text: 'First Great Divide for the IPP changes its name from the Institute for Primate Preservation to the Institute for Primate Provolution; more preservationist minority moves with a copy of the cache to Old Earth.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Provolution'}
      - year_at: 1210
        until_at: null
        precision: 'exact'
        text: 'The first effects of a mysterious disease are felt on Eostremonath. Somehow, Eostre is completely confounded by the disease, and cannot offer any solace from it.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: 'Eostremonath'}
      - year_at: 1215
        until_at: null
        precision: 'exact'
        text: 'The now elderly and increasingly reclusive Daeved Chandlers, affectionately known as the Visionary Cyborg Philosopher, uploaded into the AI Core of the University of Ganymede.'
        links:
          - {kind: 'article', id: '462821425d053', text: 'Visionary Cyborg Philosopher'}
      - year_at: 1225
        until_at: null
        precision: 'exact'
        text: 'Transcendence of Lucidia Mirnas Miranda, founder of Sophism.'
        links:
          - {kind: 'article', id: '4786e2b8b7f75', text: 'Sophism'}
      - year_at: 1248
        until_at: null
        precision: 'exact'
        text: 'The IFPC (Interactive Food Programming Catalogue) is regarded as the defining document of classical interactive food across civilized space.'
        links:
          - {kind: 'article', id: '4664cbd33ad78', text: 'interactive food'}
      - year_at: 1250
        until_at: null
        precision: 'exact'
        text: 'Settlement of New America well under way (Beta Virginis).'
        links:
          - {kind: 'article', id: '48735da987f1b', text: 'New America'}
      - year_at: 1260
        until_at: null
        precision: 'exact'
        text: 'Mahara Benisol posts the first section of her classic virch The Bridged Abyss, dealing with the Omega Point and the manifest destiny of intelligence in growing into omniscience, omnipotence and closure. It has a wide influence on Federation philosophy and spiritual thought.'
        links:
          - {kind: 'article', id: '483b1d57a9f34', text: 'Omega Point'}
      - year_at: 1263
        until_at: null
        precision: 'exact'
        text: 'The entire Human population of Eostremonath dies off. Eostre herself, unwilling to revive Humans from stored genetic material, secludes herself into mourning. [61 Virginis]'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: 'Eostremonath'}
      - year_at: 1267
        until_at: null
        precision: 'exact'
        text: 'Technorats Elias E. Jordan and Irene Abott develop space-time structure theoretics that mimic the Abdela theory developed by the Federation AI research team on Galileo Orbital, New America. [Beta Virginis]'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1290
        until_at: null
        precision: 'exact'
        text: 'First Federation Probe to Van Biesbroeck''s star finds that the Perpetua Project has failed.'
        links:
          - {kind: 'article', id: '4b0ff6031a292', text: 'Perpetua Project'}
      - year_at: 1299
        until_at: null
        precision: 'exact'
        text: 'First Motherwood Tree grown at Iota Horologi.'
        links:
          - {kind: 'article', id: '4866c7189f7dd', text: 'Motherwood Tree'}
          - {kind: 'article', id: '46510b2b2c317', text: 'Iota Horologi'}
      - year_at: 1300
        until_at: null
        precision: 'circa'
        text: 'House Genen start to send out emissaries and colonists from Frog''s Head to the interstellar colonies, usually attempting to recruit the local tweak species.'
        links:
          - {kind: 'article', id: '47ec41b64e8b6', text: 'House Genen'}
          - {kind: 'article', id: '46510b2b2c317', text: 'Frog''s Head'}
      - year_at: 1309
        until_at: null
        precision: 'exact'
        text: 'First complete Human Upgrade Package released from Kasekala by the Institute for Primate Provolution.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Provolution'}
      - year_at: 1310
        until_at: null
        precision: 'exact'
        text: 'First space fountain, a dynamically supported megatower, built on Terranova (82 Eridani).'
        links:
          - {kind: 'article', id: '47e1bb1fc898c', text: 'space fountain'}
          - {kind: 'article', id: '49126e35d4891', text: 'Terranova'}
      - year_at: 1310
        until_at: null
        precision: 'exact'
        text: 'Ross 128 joins Eridanus League.'
        links:
          - {kind: 'article', id: '5d4c19c9442f1', text: 'Ross 128'}
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 1312
        until_at: null
        precision: 'exact'
        text: 'An exploration group from Jupiter Transsystems re-discovers Zarathustra colony.'
        links:
          - {kind: 'article', id: '46e73c1b0794b', text: 'Zarathustra'}
      - year_at: 1316
        until_at: null
        precision: 'exact'
        text: 'Bew clades, floaters and mariners, begin to emerge on New America [Beta Virginis].'
        links:
          - {kind: 'article', id: '48735da987f1b', text: 'New America'}
      - year_at: 1322
        until_at: null
        precision: 'exact'
        text: 'War breaks out between the colonists of Jupiter Transsystems and Omicron Developments Inc on Tau Ceti II. This was to be the first of a number of internecine megacorp confrontations in the colonised star systems. Owing to the vast distance and slowness of interstellar travel, the Federation is powerless to intervene.'
        links:
          - {kind: 'article', id: '48e6233abde08', text: 'Tau Ceti'}
          - {kind: 'article', id: '48f733bcb2e00', text: 'Federation'}
      - year_at: 1324
        until_at: null
        precision: 'exact'
        text: 'The megacorporation Heliopause Transcendancy, specializing in interstellar colonization, has a ship that arrives in the 61 Virginis system. They discover the remains of the plague-ravaged Ewden colony. Eostre, however, remains intact, and allows the colony to remain on the condition that they live as she had intended her first children to live. After some debate, it is agreed, and a new colonial site, located west of Ewden on the coast, is established. Named Tysoe by Eostre, it will become the seat of a new center of Baseline Humanity. In time, they will be called the Eostrii.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis system'}
      - year_at: 1325
        until_at: null
        precision: 'exact'
        text: 'The Tlaltecuhtli Triumvirate ascend individually to the S1 toposophic level.'
        links:
          - {kind: 'article', id: '4c3b97f33810a', text: 'Tlaltecuhtli Triumvirate'}
          - {kind: 'topic', id: '492d6aa0a549a', text: 'S1 toposophic level'}
      - year_at: 1349
        until_at: null
        precision: 'exact'
        text: 'Shamash (Xi Bootis A III)colonised by Hearp Rangers.'
        links:
          - {kind: 'article', id: '49121fa0347e1', text: 'Shamash'}
      - year_at: 1350
        until_at: null
        precision: 'exact'
        text: 'Penglai ship arrives at Pandya and infects local population with pathogens to which they have no immunity.'
        links:
          - {kind: 'article', id: '48e89a9239865', text: 'Penglai'}
          - {kind: 'article', id: '4b45da29a57d9', text: 'Pandya'}
      - year_at: 1350
        until_at: null
        precision: 'exact'
        text: 'Bonobo and Chimp Upgrade Packages released from Goodall Habitat by the Institute for Primate Provolution.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Provolution'}
      - year_at: 1358
        until_at: null
        precision: 'exact'
        text: 'President Gertrud Jess of New America attempts unsuccessfully to bring floaters and mariners into line. [Beta Virginis]'
        links:
          - {kind: 'article', id: '48735da987f1b', text: 'New America'}
      - year_at: 1361
        until_at: null
        precision: 'exact'
        text: 'The true situation on Daedalus becomes known, due to the investigative journalist HeHaRo and insider leaks in Omicron Developments. [Pi 3 Orionis]'
        links:
          - {kind: 'article', id: '48e6722138bbb', text: 'Daedalus'}
      - year_at: 1380
        until_at: null
        precision: 'exact'
        text: 'The Jupiter Transsystems colony ship Phillip Henry Gosse sets out for HR 8501 near Gamma Pavonis, twenty years after the autonomous probe Karel Tchapek.'
        links:
          - {kind: 'article', id: '45eac09bed094', text: 'HR 8501'}
      - year_at: 1380
        until_at: null
        precision: 'exact'
        text: 'The world of Dante is colonised by the Company of Venturers from Nova Terra in the relativistic ship Lumiere, one of the first colonisation efforts by the Novans. [HIP 85647]'
        links:
          - {kind: 'article', id: '48fa66f687117', text: 'Dante'}
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 1392
        until_at: null
        precision: 'exact'
        text: 'The autonomous probeship Karel Tchapek arrives at HR 8501 (Audubon System).'
        links:
          - {kind: 'article', id: '45eac09bed094', text: 'HR 8501 (Audubon System)'}
      - year_at: 1395
        until_at: null
        precision: 'exact'
        text: 'First manned mission arrives at Merrion.'
        links:
          - {kind: 'article', id: '48f9f31c92a0a', text: 'Merrion'}
      - year_at: 1398
        until_at: null
        precision: 'exact'
        text: 'The first biosphere somewhat similar to the Earth was discovered at Ridgewell (Chi Herculis VI) by a House Mao-UbiCol exploration probe. The local biosphere was nearly as rich and complex as the Earth''s, based on carbon and water chemistry, although the details were so different that both forms of life turned out to be highly allergenic to each other.'
        links:
          - {kind: 'article', id: '48f7a625349a5', text: 'Ridgewell'}
      - year_at: 1400
        until_at: null
        precision: 'exact'
        text: 'Mainstream Nuyork and Liberty administration increasingly irrelevant and powerless in the face of New American "equatorial" new clades. [Beta Virginis].'
        links:
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1405
        until_at: null
        precision: 'exact'
        text: 'The Silicon Generation use their AI and Cyberian connections to hack cargo transports and forge cargo manifests, setting up their colony (named Cog) in an unremarkable asteroid belt around AC+25 7918.'
        links:
          - {kind: 'topic', id: '45cbce679007a', text: 'Cyberian'}
          - {kind: 'article', id: '462a6ca1b0077', text: 'Cog'}
      - year_at: 1415
        until_at: null
        precision: 'exact'
        text: 'Monroe Cylinder, a huge mediacorp habitat, completed in polar orbit around the jovian planet Green. Beta Virginis system.'
        links:
          - {kind: 'article', id: '464dd76c7cc27', text: 'jovian planet'}
          - {kind: 'article', id: '4871893629b5e', text: 'Beta Virginis'}
      - year_at: 1428
        until_at: null
        precision: 'exact'
        text: 'In an effort to counter the equatorials, New America mainstream gives NADs extraordinary powers, New America enters oppressive phase, but this only isolates the mainstream and their orbitals further, while failing to stem the "equatorials" advance [Beta Virginis].'
        links: []
      - year_at: 1432
        until_at: null
        precision: 'exact'
        text: 'Hwiii, the first pure dolphin colony world was founded on Zeta Tucanae II. The original settlers had destroyed themselves when the cometary bombardment they used to add water to the planet went wrong. The planet was later recolonised.'
        links:
          - {kind: 'article', id: '4675ea6d92bd9', text: 'Hwiii'}
      - year_at: 1443
        until_at: null
        precision: 'exact'
        text: 'Contact restablished with Negsoa.'
        links:
          - {kind: 'article', id: '4bb9e51204f88', text: 'Negsoa'}
      - year_at: 1450
        until_at: null
        precision: 'exact'
        text: 'The "Big Five" - Truth-Santaya Networks, Takicorb, SecureSpace, K4H and the Terranova Foundation - the five major colonialist megacorps, sign a mutual non-aggression treaty where they promise to protect each other''s installations.'
        links:
          - {kind: 'article', id: '47a285595535a', text: 'Terranova Foundation'}
      - year_at: 1460
        until_at: null
        precision: 'exact'
        text: 'The first evidence of alien intelligence, although long extinct, was a fragmentary hull of a robotic satellite found orbiting the star Epsilon Sculptoris A. This find was confirmed and made public in a joint announcement by several institutes including the University of Epsilon Eridani, and the Lagrange Defenders. Named HIE-636-MZE by the Hamilton Institute, and the makers by popular media.'
        links:
          - {kind: 'article', id: '4f8e348520fa7', text: 'Epsilon Sculptoris A'}
      - year_at: 1463
        until_at: null
        precision: 'exact'
        text: 'Heliopause Transcendancy is incorporated into Jupiter Transystems. All of their records of colonization fall under the auspices of this megacorp, and plans are made to reacquire these distant colonies. As it is, such colonies are already considered to be the property of Jupiter Transystems (JT). This includes 61 Virginis.'
        links:
          - {kind: 'article', id: '4682fee7952c3', text: 'Jupiter Transystems'}
      - year_at: 1465
        until_at: null
        precision: 'exact'
        text: 'Lucida (Iota Piscium) reached by Jupiter Transystems.'
        links:
          - {kind: 'article', id: '5c758943a42b2', text: 'Lucida'}
      - year_at: 1481
        until_at: null
        precision: 'exact'
        text: '"Jang-Jo Class", a type of warship after the famous suborg Fleet Commander, are designed in to meet the MyuvYin Pyschophager Threat.'
        links:
          - {kind: 'article', id: '4a08dca7bbc9c', text: 'MyuvYin'}
      - year_at: 1490
        until_at: null
        precision: 'exact'
        text: 'Vo Lettir of Lattir, Eden develops a method of imprinting a human personality into a biological body. more on Engenerator Technology.'
        links:
          - {kind: 'article', id: '48ff744e2daf7', text: 'Eden'}
          - {kind: 'article', id: '4a3d78dc77e6f', text: 'more on Engenerator Technology'}
      - year_at: 1490
        until_at: null
        precision: 'exact'
        text: 'Nathan (HD 55575 I) system colonised by First Federation venturers of the Kontore League.'
        links:
          - {kind: 'article', id: '4ed124d17ba7a', text: 'Nathan (HD 55575 I)'}
      - year_at: 1498
        until_at: null
        precision: 'exact'
        text: 'The "Big Five" treaty is extended to allow other corporations to settle within the space protected by the alliance if they sign a treaty of not initiating force against any other treaty signatory. This becomes the seed of the loose trading confederation known as the Non Coercive Zone.'
        links:
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'Non Coercive Zone'}
      - year_at: 1498
        until_at: null
        precision: 'exact'
        text: 'With the formation of the Non Coercive Zone, 61 Virginis legally becomes its property. However, little thought is paid to this possibility by the NoCoZo. At least, initially.'
        links:
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'Non Coercive Zone'}
