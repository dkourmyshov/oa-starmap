      - year_at: 1593
        until_at: null
        precision: 'exact'
        text: 'First partially successful induced ascension to the second Toposophic level at the Yo Virtual Institute of Aiology (with no assistance from the Protector of Earth, GAIA, who independently reached this stage several centuries before). More details here. 1598 - Non-Coercion Zone Treaty formalises business and legal protocols to minimize internal and internecine quarrels among NoCoZo members.'
        links:
          - {kind: 'article', id: '45f993669526b', text: 'ascension'}
          - {kind: 'article', id: '491c07059ad58', text: 'More details here.'}
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'Non-Coercion Zone'}
      - year_at: 1600
        until_at: null
        precision: 'exact'
        text: 'The Jupiter Transsystems colony ship Phillip Henry Gosse arrives at HR 8501 (also called HD 211415), double main-sequence star in the constellation of Grus.'
