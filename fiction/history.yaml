        links:
          - {kind: 'article', id: '4978914e5eb57', text: 'Huanghua'}
      - year_at: 4094
        until_at: null
        precision: 'exact'
        text: 'The Tunnler wormhole is discovered to house a powerful xenotech AI, which was still active, though largely dormant.'
        links:
          - {kind: 'article', id: '491418776bb70', text: 'Tunnler wormhole'}
      - year_at: 4100
        until_at: null
        precision: 'circa'
        text: 'Ambi Limis cultural flowering at its height.'
        links:
          - {kind: 'article', id: '4bd88fa39dd92', text: 'Ambi Limis'}
      - year_at: 4110
        until_at: null
        precision: 'exact'
        text: 'Tunh Logika formally joined the Institute of Exopaleontology as a department-nation.'
