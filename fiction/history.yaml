        precision: 'exact'
        text: 'SI:2 hyperturing Seroz 12 ( Radwin-Ho Orbital Band, Dorminy Iv, NoCoZo) first creates the characters bAdmod, Khan, Janeis and BapIYapDapBhapZap "to amuse my humans" The original bAdmod series was to run to 24,319 episode modules.'
        links: []
      - year_at: 5964
        until_at: null
        precision: 'exact'
        text: 'Jilunan ascends to second toposophic. Jilunan is to remain an important cyborg Administrator, Encyclopaedist, Perfect Artist, Statesbeing, and Mystic, until eir transcension a thousand years later.'
