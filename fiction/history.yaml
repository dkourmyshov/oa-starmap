      - year_at: 5553
        until_at: null
        precision: 'exact'
        text: 'The last of the Efficiency Maximization Paradigm defenses at Drummon Duran were defeated, but the half-built Paradigm-controlled dyson sphere refused to surrender. Over Negentropist and New Beneficence objections, the structure was destroyed, along with the unknown millions or billions of virtual sentients it contained.'
