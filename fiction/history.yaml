        until_at: null
        precision: 'exact'
        text: 'The Refugium Federation has expanded to a 100 lightyear sphere, including 20 colonised systems. Contacts are by tightbeam laser, and most inhabitants believed that by now the rest of mankind would have destroyed itself or transformed into some failed posthumanity. Each system developed their own unique culture, many so different that they had nothing in common. The old technology restrictions are gradually eroding.'
        links:
          - {kind: 'topic', id: '476ec04039002', text: 'Refugium Federation'}
      - year_at: 6009
        until_at: null
        precision: 'exact'
