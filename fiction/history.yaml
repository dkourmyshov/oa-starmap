        links:
          - {kind: 'article', id: '4609cc2f29bbe', text: 'Battle of Erson'}
          - {kind: 'article', id: '4a0d8e3d85d93', text: 'Conver Wars'}
      - year_at: 3842
        until_at: null
        precision: 'exact'
