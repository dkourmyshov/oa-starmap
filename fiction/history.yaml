        text: 'Within the Conver Ambi, the internal tensions grew too strong, and the moderate regions of the Conver Limis refused to accept the new political ecology laws. This ignites the Conver War (or Second Empires War), one of the worst wars in the history of the Terragen Sphere.'
        links:
          - {kind: 'article', id: '463a9472ed12f', text: 'Conver Ambi'}
          - {kind: 'article', id: '4a0d8e3d85d93', text: 'Conver War'}
