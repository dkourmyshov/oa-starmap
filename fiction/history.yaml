          - {kind: 'article', id: '4615b2fc1d868', text: 'cerebral siren'}
          - {kind: 'article', id: '48ab38d970fc9', text: 'Ain Soph Aur'}
      - year_at: 2563
        until_at: null
        precision: 'exact'
        text: 'A research probe first entered the system previously noted. It discovers that what was thought to be a planet was actually a huge toroidal artifact, which and was called Conway''s World.'
        links:
          - {kind: 'article', id: '46412766e34ef', text: 'Conway''s World'}
      - year_at: 2576
        until_at: null
        precision: 'exact'
        text: '"The thirty-one" disappear simultaneously. No clues are found as to what actually happened. more.'
        links:
          - {kind: 'article', id: '4615b2fc1d868', text: 'more'}
      - year_at: 2571
        until_at: null
        precision: 'exact'
        text: 'A number of Spacefarer League asteroids in the Oort Cloud and Kuiper Belt, along with a number of ships in SolSys , withdrew their membership from the League, and form the Starfarer Union, with the main objective of becoming an independent trade superpower.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer League'}
      - year_at: 2581
        until_at: null
        precision: 'exact'
        text: 'The Ken Ferjik Museum Ship reaches Irrmorella, a small system about 15 LY Solward of Greylag.'
        links:
          - {kind: 'article', id: '480ea0a51dd0b', text: 'Museum Ship'}
      - year_at: 2582
        until_at: null
        precision: 'exact'
        text: 'First "fourth toposophic" entities emerge; these entities are so far beyond baseline understanding that the general epithet ''AI Gods'' seems entirely justified.'
        links:
          - {kind: 'topic', id: '492d78f2b8fde', text: 'fourth toposophic'}
      - year_at: 2582
        until_at: null
        precision: 'exact'
        text: 'Metasoft institutes the Version Tree system of standards.'
        links:
          - {kind: 'topic', id: '45cd30902bea3', text: 'Metasoft'}
      - year_at: 2587
        until_at: null
        precision: 'exact'
        text: 'The Power Manteos creates the HaRoNa, a neogenic centauroid species.'
        links:
          - {kind: 'article', id: '47ec4727f2b8c', text: 'HaRoNa'}
  - id: 'age-of-establishment'
    topic: '45b2bdda4ba81'
    name: 'Age of Establishment'
    title: '2600 to 3200 AT: Age of Establishment'
    kind: 'period'
    parent: 'interstellar-era'
    start_at: 2600
    end_at: 3200
    events:
      - year_at: 2603
        until_at: null
        precision: 'exact'
        text: 'Automated probe reaches Deucalion and colonisation by the engenerator system begins.'
        links:
          - {kind: 'article', id: '48f4fe1ed9f27', text: 'Deucalion'}
          - {kind: 'article', id: '4a3d78dc77e6f', text: 'engenerator'}
      - year_at: 2622
        until_at: null
        precision: 'exact'
        text: 'Vega S4 archai produce the first macroscale, high efficiency, traversable wormhole.'
        links:
          - {kind: 'topic', id: '492d78f2b8fde', text: 'S4'}
      - year_at: 2625
        until_at: null
        precision: 'exact'
        text: 'Hayward class wormholes created and stabilised at Vega for use in communication and data processing.'
        links:
          - {kind: 'article', id: '48545a0f6352a', text: 'Hayward class wormholes'}
      - year_at: 2630
        until_at: null
        precision: 'exact'
        text: 'The Vega-based physics business being Geodesic Contelligence discovers that Visser decay can be ameliorated using certain balancing strategies, thus making wormhole towing and production more economical.'
        links: []
      - year_at: 2640
        until_at: null
        precision: 'exact'
        text: 'Discovery of the first extensive botworld descended from bubblehabs; the founding population was a sentient-grade neumann-capable model that had been sent to what was then the Periphery by early Federation Age colonists who chose another target and did not arrive. Many other botworlds have arisen since as a result of unsupervised bubblehab reproduction. Some can be ''tamed'' and others cannot. This has led to some strict laws regarding bubblehab design and supervision in most parts of the Civilized Galaxy.'
        links:
          - {kind: 'article', id: '480a4cff25c2e', text: 'botworld'}
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
          - {kind: 'topic', id: '45b2b4bbafc01', text: 'early Federation Age'}
      - year_at: 2642
        until_at: null
        precision: 'exact'
        text: 'A large number of human-habitable worlds are discovered in the vicinity of Ararat (today called the "Garden of Paradise Cluster").'
        links:
          - {kind: 'article', id: '4b8feb3387407', text: 'Garden of Paradise Cluster'}
      - year_at: 2680
        until_at: null
        precision: 'exact'
        text: 'The Church of The Truly Re-Engineered Light disbands.'
        links:
          - {kind: 'article', id: '45eb00a2819cf', text: 'Church of The Truly Re-Engineered Light'}
      - year_at: 2680
        until_at: null
        precision: 'exact'
        text: 'The Einstein Gate between Aksijaha and Sol connects the Old Solar system to the Wormhole Nexus.'
        links:
          - {kind: 'article', id: '4b6ec434691e3', text: 'Aksijaha'}
          - {kind: 'article', id: '48fba16bdae54', text: 'Wormhole Nexus'}
      - year_at: 2690
        until_at: null
        precision: 'exact'
        text: 'Remnants of the Eridanus League join the'
        links:
          - {kind: 'article', id: '487bb1fc69461', text: 'Eridanus League'}
      - year_at: 2694
        until_at: null
        precision: 'exact'
        text: 'Weylforge system of wormhole construction developed in the Vega dust ring.'
        links:
          - {kind: 'article', id: '4a5dd245a6820', text: 'Weylforge'}
      - year_at: 2700
        until_at: null
        precision: 'circa'
        text: 'The AI Gods Heavenly Reach and Lord of Rays oversee the expansion of the Nexus and the communication networks that use it, the Godweb and the Known Net; at this stage wormhole tugs are limited to 0.3c due to the mass involved.'
        links:
          - {kind: 'article', id: '52f7b34cc7c73', text: 'Heavenly Reach'}
          - {kind: 'article', id: '468af64a72fe7', text: 'Lord of Rays'}
          - {kind: 'article', id: '49c3de46a2d1d', text: 'Godweb'}
          - {kind: 'article', id: '4847348d6e46c', text: 'Known Net'}
      - year_at: 2706
        until_at: null
        precision: 'exact'
        text: 'Bullseye declared habitable.'
        links:
          - {kind: 'article', id: '4922e9afcd478', text: 'Bullseye'}
      - year_at: 2708
        until_at: null
        precision: 'exact'
        text: 'First reactionless Displacement Drive ships developed at Fons Luminis, Xi Ursa Majoris.'
        links:
          - {kind: 'article', id: '493f29cc472f0', text: 'Displacement Drive'}
          - {kind: 'article', id: '4900d8c15efa3', text: 'Fons Luminis'}
      - year_at: 2730
        until_at: null
        precision: 'exact'
        text: 'Capuchin and Gelada Projects by the Institute for Primate Provolution.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Provolution'}
      - year_at: 2751
        until_at: null
        precision: 'exact'
        text: 'Henson waterworld colonised.'
        links:
          - {kind: 'article', id: '5089d546a4b45', text: 'Henson'}
      - year_at: 2752
        until_at: null
        precision: 'exact'
        text: 'The religious AI community on Kelarc synthesised a meta-philosophical tract - the Reformulation - that became the core of a major religious-philosophical revival throughout the Sophic League.'
        links:
          - {kind: 'article', id: '466f45b088faf', text: 'Kelarc'}
          - {kind: 'topic', id: '45ce471d24974', text: 'Sophic League'}
      - year_at: 2758
        until_at: null
        precision: 'exact'
        text: 'Mukerilis Bis joins the Sophic League.'
        links:
          - {kind: 'article', id: '47b8f90255323', text: 'Mukerilis Bis'}
      - year_at: 2764
        until_at: null
        precision: 'exact'
        text: 'Ruby Marine opens Stadener Habitat.'
        links:
          - {kind: 'article', id: '4800029bc6a07', text: 'Ruby Marine'}
      - year_at: 2778
        until_at: null
        precision: 'exact'
        text: 'Kathelian Confederacy, MPA polity, founded by a group of wormhole engineering AIs.'
        links:
          - {kind: 'article', id: '466f429c449d9', text: 'Kathelian Confederacy'}
          - {kind: 'topic', id: '45cd3240ea58a', text: 'MPA'}
      - year_at: 2781
        until_at: null
        precision: 'exact'
        text: 'The red dwarf YTS 0190 563 01 or Hokon''s Third Purchase (property of Hokon 21453), approximately 90 LY from Sol, has a number of planets, which have been converted into a number of bishop ring clusters and associated orbitals, and a single 150 meter wormhole gate.'
        links:
          - {kind: 'article', id: '47fed8a2a14cc', text: 'Hokon 21453'}
          - {kind: 'article', id: '460db7f55a8d3', text: 'bishop ring'}
      - year_at: 2790
        until_at: null
        precision: 'exact'
        text: 'Gordelpus (MPA) colonized by the Kathelian Confederacy.'
        links:
          - {kind: 'article', id: '46f96acd05bb3', text: 'Gordelpus'}
      - year_at: 2792
        until_at: null
        precision: 'exact'
        text: 'The Spacefarer Union declares that it has authorized all its members to take whatever action necessary to convert League members to the Union.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer Union'}
      - year_at: 2795
        until_at: null
        precision: 'exact'
        text: 'The generation ship Endurance fails to decelerate at Chiri, and sails on into interstellar space.'
        links:
          - {kind: 'article', id: '4af6f1873dbc6', text: 'Chiri'}
      - year_at: 2798
        until_at: null
        precision: 'exact'
        text: 'Wormhole links to Novoterra cut off.'
        links: []
      - year_at: 2800
        until_at: 2840
        precision: 'exact'
        text: 'Steelerism developed by the Fellowship of Sures.'
        links: []
      - year_at: 2805
        until_at: null
        precision: 'exact'
        text: 'Harmonic-Resonance double planet (Sophic League Middle Regions) terraformed by Edenese superiors.'
        links:
          - {kind: 'article', id: '466c8fefdbfc5', text: 'Harmonic-Resonance'}
      - year_at: 2805
        until_at: null
        precision: 'exact'
        text: 'The Solarian scout probe Opening the Endless Light 5 arrives in the Ghane III system, ending the locals'' long isolation and allowing Solarist missionaries and relief organisations to help the Hyl Op.'
        links:
          - {kind: 'article', id: '4840bd7ef0607', text: 'Solarist'}
          - {kind: 'article', id: '4675eeec3fbbe', text: 'Hyl Op'}
      - year_at: 2815
        until_at: null
        precision: 'exact'
        text: 'The Diogenes, the first MPA Museum Ship, is observed in Nuihab orbit, Phoebus Sector, MPA space.'
        links:
          - {kind: 'article', id: '480ea0a51dd0b', text: 'Museum Ship'}
      - year_at: 2818
        until_at: null
        precision: 'exact'
        text: 'After two and a half decades of war, the main governing bodies of the Spacefarer League and the Union - the War Council and the Union Secretariat respectively - as well as representatives from NoCoZo and the Alliance and of course, Valderon''s neogen avatar meet for the Unification Summit on a luxury cruiser, the Unity, custom built for the purpose.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer League'}
      - year_at: 2820
        until_at: null
        precision: 'exact'
        text: 'Valderon gave up his command of all but ten ships, and from then on never again plays a major part in Spacefarer Union history.'
        links:
          - {kind: 'article', id: '483b13ae030ce', text: 'Spacefarer Union'}
      - year_at: 2834
        until_at: null
        precision: 'exact'
        text: 'The AI cluster Increment Known of Arbiter B-IIX of the Keter dominion forms the Alignment Movement.'
        links:
          - {kind: 'topic', id: '45cbd68bc347f', text: 'Keter dominion'}
          - {kind: 'article', id: '45ece780eb89c', text: 'Alignment Movement'}
      - year_at: 2853
        until_at: null
        precision: 'exact'
        text: 'Neo-Myuvyinian civilization subverted by the mobile Panvirt ISO 101100abaaababa.'
        links:
          - {kind: 'article', id: '4a08dca7bbc9c', text: 'Neo-Myuvyinian'}
          - {kind: 'topic', id: '45cfd1ff68f47', text: 'Panvirt'}
      - year_at: 2801
        until_at: null
        precision: 'exact'
        text: 'Zyneduhuk-22 proposes the (fallacious) Ynity Gate theory of wormhole projection'
        links:
          - {kind: 'article', id: '4e2ab2dec9d3b', text: 'Ynity Gate'}
      - year_at: 2870
        until_at: null
        precision: 'exact'
        text: 'Institute for Primate Provolution terraforms Fortitude.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Provolution'}
      - year_at: 2889
        until_at: null
        precision: 'exact'
        text: 'The original Starlark decommissioned at Argelander.'
        links:
          - {kind: 'article', id: '486d3b1911f17', text: 'Starlark'}
          - {kind: 'article', id: '45f9757b533b6', text: 'Argelander'}
      - year_at: 2896
        until_at: null
        precision: 'exact'
        text: 'Qjellto aphasics on the Hrek peninsula become an Utopia Sphere enclave run by the ai god Nameless One.'
        links:
          - {kind: 'article', id: '46de1625d2357', text: 'Qjellto'}
          - {kind: 'topic', id: '45ce5133c0d94', text: 'Utopia Sphere'}
      - year_at: 2956
        until_at: null
        precision: 'exact'
        text: 'Conclave of Taz gives rise to an NoCoZo-Sophic League Intellectual Alliance.'
        links:
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'NoCoZo'}
          - {kind: 'topic', id: '45ce471d24974', text: 'Sophic League'}
      - year_at: 2958
        until_at: null
        precision: 'exact'
        text: 'The Specialist, quasi-mythical individual (or group of individuals?), wandering the Wormhole Nexus and nearby worlds largely incognito getting involved in local issues of great potential relevance, first sighted.'
        links:
          - {kind: 'article', id: '4b45cd2e19c67', text: 'Specialist'}
      - year_at: 2969
        until_at: null
        precision: 'exact'
        text: 'The story of Bealmoch created by Julienne Minds in as edutainment for young vec-biont collectives.'
        links:
          - {kind: 'article', id: '460c36267f2e1', text: 'Bealmoch'}
      - year_at: 3007
        until_at: null
        precision: 'exact'
        text: 'Ira Jahn-Michael''s famed Djangalla speech becomes the basis of the Djangalla Reformism.'
        links:
          - {kind: 'article', id: '464cea429a0e7', text: 'Djangalla Reformism'}
      - year_at: 3010
        until_at: null
        precision: 'exact'
        text: 'Perdix founded by House Genen mission.'
        links:
          - {kind: 'article', id: '4ac0ad22a9c89', text: 'Perdix'}
          - {kind: 'article', id: '47ec41b64e8b6', text: 'House Genen'}
      - year_at: 3012
        until_at: null
        precision: 'exact'
        text: 'With the assistance of various others who e involved in the project, Coulomb Luthra, succeeds in restoring a new race of Putorians on Tibrogargen.'
        links:
          - {kind: 'article', id: '47f591591626f', text: 'Putorians'}
      - year_at: 3039
        until_at: null
        precision: 'exact'
        text: 'The Compact of Eden is announced by the representatives of the Sephirotic AI gods, where the Caretaker Gods allows ships to pass through its domain and even land on planets as long as they followed a number of non-interference rules.'
        links:
          - {kind: 'article', id: '49addd86dfb82', text: 'Compact of Eden'}
          - {kind: 'topic', id: '45cbca2e75287', text: 'Caretaker Gods'}
      - year_at: 3039
        until_at: null
        precision: 'exact'
        text: 'Eostre joins into the Compact of Eden. Being a Caretaker God, she has come to understand the fragility of her world''s existence in a Galaxy of expanding Humanity and derivatives, and alone she could not long hope to withstand against the forces of migration. But with the Compact behind her, she suddenly finds herself with the support of other Caretakers, as well as the respect and caution of other polities. However, the Compact does little in terms of curiosity, and only a few social and evolutionary scientists pay her world a visit over the next few centuries. The single most impacting result of this Compact, however, is the acknowledgement by the NoCoZo that 61 Virginis is not their property. Nevertheless, she continues to allow NoCoZo activity in the outer system, even to the point of letting them mine the outer Jovian worlds'' moons. [61 Virginis]'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: 'Eostre'}
          - {kind: 'topic', id: '45cbca2e75287', text: 'Caretaker God'}
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'NoCoZo'}
      - year_at: 3039
        until_at: null
        precision: 'exact'
        text: 'The New Beneficence participates in the negotiations of the Compact of Eden.'
        links:
          - {kind: 'article', id: '483f5ec5eb666', text: 'New Beneficence'}
          - {kind: 'article', id: '49addd86dfb82', text: 'Compact of Eden'}
      - year_at: 3052
        until_at: null
        precision: 'exact'
        text: 'Under the Primus Hanuman a master plan is created, to create a sentient clade for each baseline Old Earth species in the Institute for Primate Provolution''s ancient cache.'
        links:
          - {kind: 'article', id: '47fc3712a2368', text: 'Institute for Primate Provolution'}
      - year_at: 3084
        until_at: null
        precision: 'exact'
        text: 'The infamous Dergderph Incident, the Keterist Upload Board reverses its prior decision to allow personnel to assist madverts to transcend.'
        links:
          - {kind: 'article', id: '4b754cb80da42', text: 'Dergderph Incident'}
          - {kind: 'article', id: '46ae830e7571b', text: 'madverts'}
      - year_at: 3155
        until_at: null
        precision: 'exact'
        text: 'Labeyrie colonised.'
        links:
          - {kind: 'article', id: '46788c08a643b', text: 'Labeyrie'}
      - year_at: 3157
        until_at: null
        precision: 'exact'
        text: 'Hip 99265, Newhope system abandoned.'
        links:
          - {kind: 'article', id: '490b210f5bc0b', text: 'Hip 99265'}
      - year_at: 3187
        until_at: null
        precision: 'exact'
        text: 'Yet another huge interstellar recession occurs.'
        links: []
      - year_at: 3189
        until_at: null
        precision: 'exact'
        text: 'Meerlinda colonised by the Shiftwranger clade of tweaks.'
        links:
          - {kind: 'article', id: '47aa841e5527b', text: 'Meerlinda'}
      - year_at: 3190
        until_at: null
        precision: 'exact'
        text: 'Ayodele Xiang-Smith''s sly and disturbing neo-Calypsonian tone poem and monologue Provisional Flesh, composed and performed in Old Earth Yoruba during the Second Neo-African Renaissance on Ikere. It has been widely translated and imitated since (see Sarcophobia).'
        links:
          - {kind: 'article', id: '480fde6896b50', text: 'Sarcophobia'}
      - year_at: 3194
        until_at: null
        precision: 'exact'
        text: 'Oikoumene Dyson joins the Nexus.'
        links:
          - {kind: 'article', id: '490b34ec41bb6', text: 'Oikoumene Dyson'}
  - id: 'inner-sphere-era'
    topic: '45b2a89db4a2a'
    name: 'Inner Sphere Era'
    title: '3200 to 5200 AT: Inner Sphere Era'
    kind: 'era'
    parent: ""
    start_at: 3200
    end_at: 5200
    events: []
  - id: 'age-of-consolidation'
    topic: '45b2bf689004d'
    name: 'Age of Consolidation'
    title: '3200 to 3800 AT: Age of Consolidation'
    kind: 'period'
    parent: 'inner-sphere-era'
    start_at: 3200
    end_at: 3800
    events:
      - year_at: 3234
        until_at: null
        precision: 'exact'
        text: 'Sacred Heart becomes part of the Sophic League, in the aftermath of the breakup of the Taurus Nexus.'
        links:
          - {kind: 'article', id: '4911a49ba4b44', text: 'Sacred Heart'}
          - {kind: 'topic', id: '45ce471d24974', text: 'Sophic League'}
          - {kind: 'article', id: '48e8a9ebbbdb7', text: 'Taurus Nexus'}
      - year_at: 3236
        until_at: null
        precision: 'exact'
        text: 'Quadaa Atonement Centre founded.'
        links:
          - {kind: 'article', id: '46df48ca9a0f2', text: 'Quadaa Atonement Centre'}
      - year_at: 3240
        until_at: null
        precision: 'exact'
        text: 'The Altair Mecomp project, with sizeable three dimensional cellular automaton was run on a massive computronium mainframe, develops into Altair Knowledge Designs, the first intelligent alife species to evolve hypersentience.'
        links:
          - {kind: 'article', id: '45f0c43a337e6', text: 'Altair Mecomp'}
          - {kind: 'article', id: '45ece4d1ef83d', text: 'alife'}
      - year_at: 3250
        until_at: null
        precision: 'exact'
        text: 'Several isolationist vec colonies and a nomadic nanopolity established at Hip 99265 Newhope MPA.'
        links:
          - {kind: 'article', id: '490b210f5bc0b', text: 'Hip 99265'}
      - year_at: 3260
        until_at: null
        precision: 'exact'
        text: 'Cronosian fleets disappear into interstellar space to avoid the approaching First Consolidation War.'
        links:
          - {kind: 'article', id: '49fea757dae0f', text: 'Cronosian fleets'}
          - {kind: 'article', id: '48eb8904ef8f2', text: 'First Consolidation War'}
      - year_at: 3263
        until_at: null
        precision: 'exact'
        text: 'The Inner Sector of the Taurus Nexus, with its capital at Corona, attempts to break free in order to become part of the NoCoZo, leading to a bloody interstellar war - the First Consolidation War.'
        links:
          - {kind: 'article', id: '48e8b382428f5', text: 'Corona'}
          - {kind: 'topic', id: '45cd3bb5026a4', text: 'NoCoZo'}
          - {kind: 'article', id: '48eb8904ef8f2', text: 'First Consolidation War'}
      - year_at: 3263
        until_at: null
        precision: 'exact'
        text: 'Locos, a continent on Xil, an important Taurus Nexus world, is annexed by the Solar Dominion.'
        links:
          - {kind: 'article', id: '46f1e7a6acc51', text: 'Xil'}
          - {kind: 'topic', id: '45ce432e44565', text: 'Solar Dominion'}
      - year_at: 3263
        until_at: null
        precision: 'exact'
        text: 'New Beneficence protests against the First Consolidation War.'
        links:
          - {kind: 'article', id: '483f5ec5eb666', text: 'New Beneficence'}
          - {kind: 'article', id: '48eb8904ef8f2', text: 'First Consolidation War'}
      - year_at: 3267
        until_at: null
        precision: 'exact'
        text: 'The Typers of Gilbert, an association of S1 "idiot savants", used by the Institute of Baseline Psychotypology (Junna, Negentropy Alliance).'
        links:
          - {kind: 'article', id: '47a68519c4842', text: 'Typers of Gilbert'}
          - {kind: 'article', id: '4682fdf9a6442', text: 'Junna'}
      - year_at: 3285
        until_at: null
        precision: 'exact'
        text: 'The Restorer Hypothesis is first suggested in a seminal but controversial virchpaper by Academician Ralen Vuyrygi of the Eden Institute of Xenology.'
        links:
          - {kind: 'article', id: '480284ad2994e', text: 'Restorer Hypothesis'}
          - {kind: 'article', id: '4793e4a2c1030', text: 'Eden Institute of Xenology'}
      - year_at: 3298
        until_at: null
        precision: 'exact'
        text: 'The government on Nova Terra began to use hanging prisons suspended from the pipelines in the many canyons for certain antisocial crimes (with or without constant online public monitoring).'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 3306
        until_at: null
        precision: 'exact'
        text: 'On Nova Terra , the idea of living in canyon homes and other such hanging buildings begins to catch on.'
        links:
          - {kind: 'article', id: '48e2e21ee6d7f', text: 'Nova Terra'}
      - year_at: 3310
        until_at: null
        precision: 'exact'
