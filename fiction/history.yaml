      - year_at: 1580
        until_at: null
        precision: 'exact'
        text: 'a number of megacorps excluded from the Mutual Co-Development Treaty of 1450 AT, sign their own treaty, the Transtellar Cooperative Pact (TCP), which was eventually to give rise to the Conver Ambi.'
        links:
