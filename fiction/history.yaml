        text: 'Straight Arrow, the capital of the Sagittarius Sphere, is attacked and destroyed by the Negentropist Fifth Relativistic Fleet, which however suffers serious losses at the hands of the defending Sparta IX Series replicants at the battle of Straight Arrow. MPA Sentinel Class autowars, although arriving too late to save Straight Arrow, finish off what is left of the Negentropist Fifth fleet.'
