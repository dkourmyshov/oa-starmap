      - year_at: 4525
        until_at: null
        precision: 'exact'
        text: 'It is the height of the Version War, and two isolated groups of combatants enter the 61 Virginis system. Various NoCoZo mining habitats on the outer moons are destroyed by Solar Dominion forces, which then travel inward in pursuit of remaining survivors. However, intervention by an angry Eostre reduces the Dominion attacker''s vessels to dust through nano-breakdown methods. NoCoZo survivors are allowed to land on Eostremonath, followed by Dominion survivors. The NoCoZo company eliminates the Dominion forces, and then decides to enter into Eostri society. Only one person does not wish this, and Eostre delivers him to NoCoZo territory.'
