        links:
          - {kind: 'article', id: '49119e365a395', text: 'Rudolph'}
      - year_at: 6992
        until_at: null
        precision: 'exact'
        text: 'A rogue Museum Ship identifying itself as the Hume neutralises the planetary defenses at Muna Kipasi orbitals (Goldfishnebula Sector, Negentropy Alliance space) and abducts more than five thousand sapient and subsapient bioids. By the time the Negentropist 24th Quick Response Task Force arrived in the system, it was long gone.'
        links:
          - {kind: 'article', id: '480ea0a51dd0b', text: 'Museum Ship'}
          - {kind: 'article', id: '47bb8439173c7', text: 'neutralises the planetary defenses'}
      - year_at: 6996
