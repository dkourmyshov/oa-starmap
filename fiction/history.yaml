          - {kind: 'article', id: '49fe9e73e718a', text: 'Alexandria Dyson swarm'}
      - year_at: 4582
        until_at: null
        precision: 'exact'
        text: 'The Alexandrian dyson is destroyed in a NoCoZo/Negentropy Alliance clash when the task force is finally confronted by a NoCoZo Homefleet. The NoCoZo commander takes no chance and uses an experimental strange matter weapon. This is just a small example of the atrocities committed during the Version War by all parties involved. This event results in the Clusters became more and more reclusive and adopting several memes from hider cultures.'
