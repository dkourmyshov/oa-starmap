        links:
          - {kind: 'article', id: '4871520aab6c2', text: 'Ao Lai'}
      - year_at: 7041
        until_at: null
        precision: 'exact'
        text: 'The Greater Superchimps develop their own S>2 Power, "Pan Demonium", but their invasion of Bolobo is subverted and channelled into other directions by the systems ruling AI "GoodAll".'
        links:
          - {kind: 'article', id: '46f96d09d2cf9', text: 'Greater Superchimps'}
      - year_at: 7045
