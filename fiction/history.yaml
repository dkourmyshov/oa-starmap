        links:
          - {kind: 'article', id: '4637c7672ea27', text: 'Daveth'}
      - year_at: 4210
        until_at: null
        precision: 'exact'
        text: 'The archanarchists of the Western habitable zone of Dante are at loggerheads with the Etodist faithful of the soggy east; over and again the hemispheres fight against each other in the hot dry desert of Sunward and the icy black wastes of Nightward.'
        links:
          - {kind: 'article', id: '45f7690b9524f', text: 'archanarchists'}
          - {kind: 'article', id: '48fa66f687117', text: 'Dante'}
          - {kind: 'article', id: '4799624d5b42d', text: 'Etodist'}
      - year_at: 4212
        until_at: null
        precision: 'exact'
        text: 'The balance of power in the Pleiades Volume shifts radically when the heterosophist cyborg clade Electra Entity in the outer Merope Oort cloud, achieves posthuman nanocyborg status, and begins feeding subversion templates to any and all other Pleiades haloers who want them.'
        links:
          - {kind: 'article', id: '4793ea3f5e751', text: 'Electra Entity'}
          - {kind: 'article', id: '46fc485fa46f5', text: 'Pleiades'}
      - year_at: 4213
        until_at: null
        precision: 'exact'
        text: 'Hamilton Institute of Exopaleontology at Upali reconnected to galactic civilisation.'
        links:
          - {kind: 'article', id: '49afd86e67383', text: 'Hamilton Institute of Exopaleontology'}
      - year_at: 4222
        until_at: null
        precision: 'exact'
        text: 'A Nimbus colony was set up on Xi Bootis B I.'
        links:
          - {kind: 'article', id: '46f1e74d34205', text: 'Xi Bootis B I'}
      - year_at: 4226
        until_at: null
        precision: 'exact'
        text: 'First Banks Orbital completed in Gordelpus system (MPA).'
        links:
          - {kind: 'article', id: '4845ef5c4ca7c', text: 'Banks Orbital'}
          - {kind: 'article', id: '46f96acd05bb3', text: 'Gordelpus'}
      - year_at: 4228
        until_at: null
        precision: 'exact'
        text: 'The To''ul''h homeworlders, with help from sympathetic Terragen factions, stage a bloody revolution and oust the spacers. The spacers'' final assault is stymied when in 6245 AT, the Caretaker God known as Smoking Mirror declares To''ul''h its domain.'
        links:
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''h'}
          - {kind: 'topic', id: '45cbca2e75287', text: 'Caretaker God'}
      - year_at: 4251
        until_at: null
        precision: 'exact'
        text: 'Start of Edible music fad on several habitats in the NoCoZo.'
        links:
          - {kind: 'article', id: '4bad5991ea0d2', text: 'Edible music'}
      - year_at: 4267
        until_at: null
        precision: 'exact'
        text: 'The NoCoZo Edible music fad ends.'
        links:
          - {kind: 'article', id: '4bad5991ea0d2', text: 'Edible music'}
      - year_at: 4274
        until_at: null
        precision: 'exact'
        text: 'Lucas Jordan and 35 of his clonechildren and clonegrandchildren form the Friends of Dimimimon4.'
        links:
          - {kind: 'article', id: '464b9fab3867b', text: 'Dimimimon4'}
      - year_at: 4280
        until_at: null
        precision: 'exact'
        text: 'Ambi Limis declines into literalism and neo-scholasticism.'
        links: []
      - year_at: 4285
        until_at: null
        precision: 'exact'
        text: 'Calyx colonised.'
        links:
          - {kind: 'article', id: '4f438057ece53', text: 'Calyx'}
      - year_at: 4291
        until_at: null
        precision: 'exact'
        text: 'Battle of Hejne, a rare case of a transapient beaten by modosophonts.'
        links:
          - {kind: 'article', id: '4bad60f156761', text: 'Battle of Hejne'}
      - year_at: 4296
        until_at: null
        precision: 'exact'
        text: 'As a result of a political campaign by Lucas Jordan''s Friends of Dimimimon4, in which e had become a minor but trendy popular cause in the Solar Dominion, the Metasoft Version Tree agrees to release Dimimimon4 to the Solar Dominion.'
        links:
          - {kind: 'article', id: '464b9fab3867b', text: 'Dimimimon4'}
          - {kind: 'article', id: '464b9fab3867b', text: 'Dimimimon4'}
      - year_at: 4300
        until_at: null
        precision: 'circa'
        text: 'The Bealmoch affiliation becomes increasingly important as a vec cultural movement across the wormhole nexus.'
        links:
          - {kind: 'article', id: '460c36267f2e1', text: 'Bealmoch affiliation'}
          - {kind: 'article', id: '48fba16bdae54', text: 'wormhole nexus'}
      - year_at: 4300
        until_at: null
        precision: 'circa'
        text: 'Dimimimon4 and eir copy/avs spent eir time in lecture tours, exciting shocked Solarians with eir colourful tales of the primitive status of the Metasoft baselines.'
        links:
          - {kind: 'article', id: '464b9fab3867b', text: 'Dimimimon4'}
      - year_at: 4300
        until_at: null
        precision: 'exact'
        text: 'A major economic recession strikes the 82 Eridani system and much of the local economy moves elsewhere.'
        links:
          - {kind: 'article', id: '49126e35d4891', text: '82 Eridani'}
      - year_at: 4300
        until_at: null
        precision: 'exact'
        text: 'To''ul''h contact is continuing and certain elements of Terragen Technology are being carefully introduced.'
        links:
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''h'}
          - {kind: 'topic', id: '45b175dbc0d73', text: 'Terragen Technology'}
      - year_at: 4307
        until_at: null
        precision: 'exact'
        text: 'Pereira colonised.'
        links:
          - {kind: 'article', id: '47bf772c4ab92', text: 'Pereira'}
      - year_at: 4311
        until_at: null
        precision: 'exact'
        text: 'Arkab Prior A + B colonised; Arkab Prior A is allocated to the Negentropy Alliance, Arkab Prior B to the MPA.'
        links:
          - {kind: 'article', id: '48f4b90a814b0', text: 'Arkab Prior A'}
          - {kind: 'article', id: '48f4bc90174b8', text: 'Arkab Prior B'}
      - year_at: 4318
        until_at: null
        precision: 'exact'
        text: 'The first humans to be killed by living aliens face-to-face when a riot breaks out on the orbital installation orbiting To''ul''h Home. A rumor spread among the To''ul''hs that a recently arrived team of Miramar tweaks were planning to attempt to eat a dead To''ul''h (a religious practice on the To''ul''h homeworld, but blasphemous when done by outsiders). In the ensuing chaos two humans and three To''ul''hs are killed.'
        links:
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''h'}
      - year_at: 4321
        until_at: null
        precision: 'exact'
        text: 'Foundation of the Deep University.'
        links:
          - {kind: 'article', id: '49a6c8bc6f3af', text: 'Deep University'}
      - year_at: 4325
        until_at: null
        precision: 'exact'
        text: 'The Mycosmid Gestalt ascended to the S3 toposophic. Many of eir oldest surviving nodes ascended to the S2 toposophic around this time as well.'
        links:
          - {kind: 'article', id: '4c3b97f33810a', text: 'Mycosmid Gestalt'}
      - year_at: 4328
        until_at: null
        precision: 'exact'
        text: 'Terranova bought by Riddersdan Ikki. The hyperturing paid everyone to leave and has since then owned the planet as a private resort, inhabited only by a small minority of traditionalist empaths and specially invited friends, worshippers and lovers of the AI.'
        links:
          - {kind: 'article', id: '49126e35d4891', text: 'Terranova'}
      - year_at: 4331
        until_at: null
        precision: 'exact'
        text: 'War on Venus between Venus-tweaks and Skydwellers.'
        links:
          - {kind: 'article', id: '48e7ce77477af', text: 'Venus'}
      - year_at: 4345
        until_at: null
        precision: 'exact'
        text: 'The Solar Dominion, considering the Concord Ontology a threat to its empire, begins to feed the discontent among the myriad cultures that wanted their own version. During the next century a number of "version sabotages" occurred as breakaway groups interfered with the main galactic culture, mainly by political manoeuvering or suggesting constant revisions of the Ontology.'
        links:
          - {kind: 'article', id: '478434a56eb65', text: 'Concord Ontology'}
      - year_at: 4374
        until_at: 4380
        precision: 'exact'
        text: 'A series of complex legal disputes caught the interest of much of NoCoZo and the Inner Sphere, EMERT, Planom Synerg and the League of Aioid Rights struggled over the question of self-ownership, deliberately limited mental design and body investments. New Beneficence files amicus briefs on behalf of Planom Synerg in the legal disputes over the question of self-ownership, deliberately limited mental design, and body investments. At least one of the Synerg forge clan weylforges, descendants of Planom Synerg, will later become a New Beneficence adherent member.'
        links:
          - {kind: 'article', id: '4a038f9acdf80', text: 'Planom Synerg'}
          - {kind: 'article', id: '4a5dd245a6820', text: 'weylforges'}
      - year_at: 4384
        until_at: null
        precision: 'exact'
        text: 'Nirio colonised in by an AI consortium setting up a baseline reservation and a local To''ul''h utopia. Becomes part of the Utopia Sphere.'
        links:
          - {kind: 'article', id: '46d62d210a07e', text: 'Nirio'}
          - {kind: 'topic', id: '4802a95fb92f2', text: 'To''ul''h'}
          - {kind: 'topic', id: '45ce5133c0d94', text: 'Utopia Sphere'}
  - id: 'version-war-period'
