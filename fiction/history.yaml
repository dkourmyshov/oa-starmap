      - year_at: 280
        until_at: 310
        precision: 'exact'
        text: 'Several species of animal (pigs, dogs, African grey parrot) are genetically modified for language ability and improved intelligence. Concerns over provolve exploitation and slavery lead some countries to legislate Universal Rights for Non-Human Intelligence, adoption worldwide is poor as the level of sophonce in some provolves is questionable, exacerbated by significant differences in provolve and human cultures.'
        links: []
      - year_at: 280
        until_at: null
