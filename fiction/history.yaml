          - {kind: 'article', id: '47f6ce3a74e30', text: 'Space People'}
      - year_at: 330
        until_at: null
        precision: 'circa'
        text: 'Titan has become the Australia of the Solar System; a world which has agreed to accept convicted criminals from Earth or the Earth/Luna system as colonists. These colonists are unaware of the continued existence of the secretive Cishp on Titan.'
