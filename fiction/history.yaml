        text: 'The NoCoZo vessel Illium arrives in the 61 Virginis system. It is almost immediately met by vessels controlled by Eostre and her attendant AI''s, and She forbids any landing on Eostremonath. Eventually, a compromise is met with the NoCoZo, allowing them to mine the Kuiper and Oort regions as much as they wish. In return, Eostre and Her wards will be allowed to remain in isolation, and no NoCoZo vessel will travel within 35 AU.'
