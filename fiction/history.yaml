          - {kind: 'article', id: '4681a30835f6a', text: 'Jacks'}
          - {kind: 'article', id: '4f181b2caeccf', text: 'bubblehabs'}
      - year_at: 7134
        until_at: null
        precision: 'exact'
        text: 'Homicideophiles are allowed to adopt neomorph rianth or animal bodies in the Sadalmelik system, but they reportedly find predation a wildly different experience from murder.'
        links:
          - {kind: 'article', id: '4911ce8f43ea3', text: 'Sadalmelik'}
      - year_at: 7143
        until_at: null
        precision: 'exact'
        text: 'The Hyperutilization Supremacy conquers the Panvirt Dyson civilization Dream of Many Things, which had previously been considered unassailable.'
        links:
          - {kind: 'article', id: '468061aa4e686', text: 'Hyperutilization Supremacy'}
      - year_at: 7150
        until_at: null
        precision: 'exact'
        text: 'The Hyperutilization Supremacy is not only the largest power in its region, but perhaps the most powerful in the entire Terragen bubble.'
        links:
          - {kind: 'article', id: '468061aa4e686', text: 'Hyperutilization Supremacy'}
      - year_at: 7159
        until_at: null
        precision: 'exact'
        text: 'Start of Schism War - Refugium Federation.'
        links:
          - {kind: 'topic', id: '476ec04039002', text: 'Refugium Federation'}
      - year_at: 7164
        until_at: null
        precision: 'exact'
        text: 'Emple-dokcetic modularist vec culture developed.'
        links:
          - {kind: 'article', id: '486028564241d', text: 'Emple-dokcetic'}
      - year_at: 7165
        until_at: null
        precision: 'exact'
        text: 'The Hyperutilization Supremacy assimilates and converted to computronium the Keterist system of Reidany, with the loss of two hundred and fifty million lives.'
        links:
          - {kind: 'article', id: '468061aa4e686', text: 'Hyperutilization Supremacy'}
  - id: 'central-alliance'
    topic: '45b2c49d0e9e6'
