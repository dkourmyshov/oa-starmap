      - year_at: 1541
        until_at: null
        precision: 'exact'
        text: 'New America "equatorial" clades capture Liberty, declare independence. NA orbital counterattack leads to the so-called "Pacifica War"; the Nuyork "Mainstream" finally defeated by technorat ai intrusion programs and goo attacks. New America renamed Pacifica. Mainstream administration exiled to some small orbitals around the outer planets [Beta Virginis].'
