        text: 'New Solar Dominion Guardian appointed on Silenus, and outlaws the local territorial disputes.'
        links:
          - {kind: 'article', id: '4ac1fabd2c3c0', text: 'Silenus'}
      - year_at: 6048
        until_at: null
        precision: 'exact'
        text: 'Derlek the 58th (the 58th body of the mind Derlek) begins the first step to the actual practice of eir Doctrine of augmentation. The old system of reproduction by simple cloning followed by crude gradual external augmentation is abandoned and instead a system of more complex artificial reproduction by gene splicing followed by introduction of self-replicating and adaptive nano-implants. These cyborgs are the first generation of "Children". [see Derlekians]'
        links:
          - {kind: 'article', id: '45eac4d93ad11', text: 'augmentation'}
          - {kind: 'article', id: '47f6d76e727ca', text: 'Derlekians'}
      - year_at: 6061
        until_at: null
        precision: 'exact'
        text: 'Concerning the Magnesium Issue of five centuries earlier, the local review AI (above the third toposophical boundary) arrives at the Raganthra Archipelago and upon examination of the evidence concludes that the central processing AI had been in the wrong.'
        links:
          - {kind: 'article', id: '46ae84abe0db9', text: 'Magnesium Issue'}
      - year_at: 6065
        until_at: null
