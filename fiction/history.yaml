        links:
          - {kind: 'article', id: '46e9deab470c9', text: 'Yoson Confederacy'}
      - year_at: 3943
        until_at: null
        precision: 'exact'
        text: 'In the peace accords that ended the Conver Wars, the Conver Ambi is divided into three parts. The core part is annexed by the Solar Dominion, the Periphery by Metasoft, and the Geminga Orthodoxy isolates itself and is eventually dissolved, leaving only the Ambi Limis.'
        links: []
      - year_at: 3945
        until_at: null
        precision: 'exact'
