        links:
          - {kind: 'article', id: '47f6c8411e3c4', text: 'siberoo'}
      - year_at: 283
        until_at: null
        precision: 'exact'
        text: 'Von Neumann probes arrive at the Centauri system.'
        links:
          - {kind: 'article', id: '487146f744c8e', text: 'Centauri system'}
      - year_at: 284
        until_at: null
        precision: 'exact'
        text: 'A group of merpeople petition the UN suggesting that the oceans should no longer be regarded as the property of the world community, but rather as the nation of the merpeople. This further adds to prejudice of baselines against tweaks.'
        links:
          - {kind: 'topic', id: '45beb1fcc5ba6', text: 'tweaks'}
      - year_at: 285
        until_at: null
        precision: 'exact'
        text: 'Launch of the Museum Ship Pliny, 12 years behind schedule.'
        links: []
      - year_at: 285
        until_at: null
        precision: 'exact'
        text: 'Golgi Mosaic bio-replicator outbreak in the Gulf of Carpenteria. Fortunately it (and similar outbreaks of around this time) are contained with little environmental impact and no loss of life, but concerns are heightened regarding the risks were an efficient malicious assembler to get out.'
        links: []
      - year_at: 286
        until_at: null
        precision: 'exact'
        text: 'The first of a series of comets is diverted to impact on Mars.'
        links: []
      - year_at: 288
        until_at: null
        precision: 'exact'
        text: 'A series of three probes, Virgo, Spica, and Porrima, are launched to 61 Virginis. Powered by amat-fusion engines, they will reach the system in 569 a.t. The probes are encased within a single hull for the trip, and have enough fuel for a one-way trip, including braking thrust that will place them within orbits about the target star at varying distances. The probe is controlled by the low-level non-sapient AI named simply Virgin.'
        links:
          - {kind: 'article', id: '48ecbe842ac6d', text: '61 Virginis'}
      - year_at: 289
        until_at: null
        precision: 'exact'
        text: 'Exopower (Mars) in successfully demonstrated their new Lagrange Magshield concept.'
        links:
          - {kind: 'article', id: '4851d85e0791b', text: 'Lagrange Magshield'}
      - year_at: 289
        until_at: null
        precision: 'exact'
        text: 'Contact lost with Centauri system.'
        links:
          - {kind: 'article', id: '487146f744c8e', text: 'Centauri system'}
      - year_at: 290
        until_at: null
        precision: 'exact'
