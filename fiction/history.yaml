        text: 'Lucidia-like woman of the Miranda Clade genotype began teaching the Path of Compassion in Camiroi Orbital Habitat 5, Camiroi. After developing a small following she and her two assistants departed on a relativist vessel for Ukinsracke. However, on arrival none of the three were found to be listed in the passenger list.'
