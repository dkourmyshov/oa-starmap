        text: 'Marvarun Pact, an alliance between neighbouring empires and several powerful AI fractions for the purpose of halting the Efficiency Maximization Paradigm advance. The New Beneficence, after several failed efforts to negotiate with the Efficiency Maximization Paradigm for a peaceful end to its plans, also endorses the Marvarun Pact.'
