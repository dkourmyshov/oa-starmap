      - year_at: 3344
        until_at: null
        precision: 'exact'
        text: 'The two AIs Botryophoros and Polygethes emigrate from the Dionysian Erotocracy during its breakup. They arrive at Frei, and began seeding the rings of the planet with their "starseeds".'
        links:
          - {kind: 'article', id: '464ba395e5bde', text: 'Dionysian Erotocracy'}
