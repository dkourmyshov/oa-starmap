      - year_at: 4576
        until_at: null
        precision: 'exact'
        text: 'A large Negentropy Alliance relativistic force enters NoCoZo territory to retaliate against Cyberian/NoCoZo attacks committed earlier in this decade. The task force of the Negentropy Alliance suffers heavy casualties through the stiff resistance offered by NoCoZo forces and have to retreat to a nearby Alexandria Dyson swarm. The NoCoZo strategists feared that the task force could ally themselves with the Alexandria Cluster and use the dyson as a port. This fear is fuelled by similarities in the prevalent memes governing both the Alexandrian Cluster and the Negentropy Alliance.'
