      - year_at: 4679
        until_at: null
        precision: 'exact'
        text: 'TakiCorb-Wallstro vecs in the Corambytia system are attacked by a previously unknown AI-god and forced to flee.'
        links:
          - {kind: 'article', id: '46412ddb422d6', text: 'Corambytia system'}
      - year_at: 4700
        until_at: null
        precision: 'circa'
        text: 'The NanoAdhesives Board is created. A rubber-stamp organization used by GooGlue, NBB&P as a memetic ploy against the corporation''s rivals.'
        links:
          - {kind: 'article', id: '46cb9758904a8', text: 'NanoAdhesives Board'}
      - year_at: 4701
        until_at: null
        precision: 'exact'
        text: 'A clade of heterodox dolphin colonists from Hwii arrive at the Black Acropolis swarm, fleeing the rigidity and conservatism of Okeanism.'
