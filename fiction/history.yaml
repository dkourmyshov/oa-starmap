        links:
          - {kind: 'article', id: '48000cb526540', text: 'Beacon Project'}
      - year_at: 6766
        until_at: null
        precision: 'exact'
        text: 'The Sunna Urbex''s interpretation of the Second Axiom of Negentropism (information) leads it to embark on a massive surveillance/import/scanning program, allying with the Cyberian Network. This scheme is frowned upon by the rest of the Negentropy Alliance, but otherwise no official action is taken.'
        links:
          - {kind: 'article', id: '46cf7ca0904a7', text: 'Negentropism'}
          - {kind: 'topic', id: '45cbce679007a', text: 'Cyberian Network'}
      - year_at: 6766
        until_at: null
        precision: 'exact'
        text: 'The widely spread Orkady clade is wiped out by what seems to have been a nanowar attack that turned every individual more or less simultaneously into stone (see Fair Folk).'
        links:
          - {kind: 'article', id: '480d3f4e6a76f', text: 'Fair Folk'}
      - year_at: 6778
        until_at: null
        precision: 'exact'
        text: 'Development of the New Siberian sector (MPA) more.'
        links:
