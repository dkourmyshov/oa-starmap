# Orion's Arm polity assignments for the Inner Sphere colonies.
#
# Hand-authored. `colony` is matched against the `colony` column of
# `inner_sphere.yaml`, and through it to a real star. That column often carries
# several names for one system — "Atlantis/Prometheus/Daedalus" is one system
# holding three named entities belonging to three different polities — so
# matching splits on "/" and "&" and ignores parentheticals, and a star may end
# up with more than one affiliation. That is a real shared presence, not a
# mistake, and is preserved rather than collapsed.
#
# Where the table's spelling differs from the name used here, `colony` gives the
# name as the source article uses it and the note records the discrepancy.
#
# `status` marks what is not a polity affiliation at all:
#   special    - a minor polity, an independent, several polities at once, or
#                otherwise a case that does not reduce to one owner
#   abandoned  - abandoned or destroyed
#   blight     - lost to a blight

