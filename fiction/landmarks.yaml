# What Orion's Arm calls real objects it has renamed.
#
# A cluster or nebula is on the map under its catalogue designation, because
# that is what the astronomical data calls it and that is how a binding is
# matched. Where the setting gives the same object a name of its own, this file
# records it — otherwise "Blenke Cluster" appears nowhere and the article about
# it has nothing to hang on.
#
# `catalogue` is resolved exactly as a polity landmark is, through the same
# alias table, so it can be written the way a person would write it.
#
# This is the fictional half of a pair of names, never a replacement: the map's
# name switch shows either, or both. A real object keeps its real designation.

landmarks:
  - catalogue: Blanco 1
    name: Blenke Cluster
    article: https://www.orionsarm.com/eg-article/460e7b5d61e04
    note: >-
      Held by the Communion of Worlds in its own article and by the Non-Coercive
      Zone on the political maps. Both are recorded; see questions.md.

  - catalogue: Collinder 359
    name: Aleph Absolute
    article: https://www.orionsarm.com/eg-article/45e78575a15a5
    events:
      - year_at: 3000
        kind: settled
        precision: circa
    note: >-
      Carried in the cluster catalogue as Melotte 186, with Collinder 359 among
      its aliases; the alias table finds it either way.

  - catalogue: NGC 6755
    name: Enigma Cluster
    article: https://www.orionsarm.com/eg-article/491aecf1478f9
    events:
      - year_at: 7222
        kind: settled
    note: >-
      The Enigma Cluster is NGC 6755 — which settles half of a long-running
      question, since the Celestia add-on carries a star called Enigma nowhere
      near it. At 7,446 ly it lies past the frontier, so it is bound and named
      but not polity-coloured.

  - catalogue: NGC 2244
    name: Rosette Cluster
    article: https://www.orionsarm.com/eg-article/47768de1cded2
    note: >-
      Held jointly by the Non-Coercive Zone and the TechnoRapture HyperNation,
      so the cluster ring is drawn halved between them.

  - catalogue: Melotte 25
    name: Hyades
    article: https://www.orionsarm.com/eg-article/4675eb1f8688f
    events:
      - year_at: 700
        kind: visited
        precision: circa
        note: First reached by ahumans.
    note: >-
      The Hyades sector, and one of the earliest places anyone went — at 154 ly
      it was within reach long before most of this map.

  # Hubble's Variable Nebula belongs here too — Metasoft's on the political
  # maps, and the site of an important battle of the Second Vec War in 7009,
  # https://www.orionsarm.com/eg-article/4675e45fe5bf6. It is not an entry yet
  # because a landmark must resolve to a catalogued object and the nebula
  # catalogue is one of the ones this build has not loaded; it is among the 41
  # the build reports as pending. Add it when that lands.
