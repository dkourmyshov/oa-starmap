<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OA Starmap</title>
    <style>
      :root {
        --bg: #03040a;
        --panel: rgba(10, 14, 26, 0.82);
        --border: rgba(120, 150, 210, 0.22);
        --text: #d6dcec;
        --muted: #7b87a6;
        --accent: #8fb4ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /*
       * Four corners, stated explicitly. The previous arrangement was a wrapping
       * flex row steered by `order` and auto margins, which left the polity
       * legend floating well short of the right edge as soon as the panel widths
       * changed. A grid pins each panel to a corner regardless of its size.
       */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: 14px;
        z-index: 2;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
      }

      .panel {
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        min-width: 268px;
        max-width: 320px;
        backdrop-filter: blur(9px);
      }

      .panel-error {
        margin: auto;
        max-width: 460px;
      }

      .title {
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 9px;
        color: #fff;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 2px 0;
      }

      .label {
        color: var(--muted);
      }

      .value {
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .group {
        display: inline-flex;
        gap: 4px;
      }

      .toggle,
      .jump {
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 3px 9px;
        font: inherit;
        cursor: pointer;
      }

      .toggle:hover,
      .jump:hover {
        background: rgba(143, 180, 255, 0.16);
      }

      .toggle.active {
        background: rgba(143, 180, 255, 0.26);
        border-color: var(--accent);
        color: #fff;
      }

      .slider-row {
        margin-top: 8px;
      }

      .slider {
        width: 100%;
        accent-color: var(--accent);
      }

      .note {
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid var(--border);
      }

      .note-line {
        color: var(--muted);
        font-size: 11.5px;
        margin-bottom: 3px;
      }

      .note-warn {
        color: #c9a978;
      }

      .jump-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .panel-stats {
        grid-column: 1;
        grid-row: 1 / span 2;
        align-self: start;
        /* Leaves the jump panel its corner even when every control is present. */
        max-height: calc(100vh - 140px);
        overflow-y: auto;
      }

      .panel-polity {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        max-height: calc(100vh - 28px);
        overflow-y: auto;
      }

      .panel-jump {
        grid-column: 1;
        grid-row: 3;
        align-self: end;
      }

      .panel-detail {
        grid-column: 3;
        grid-row: 2 / span 2;
        align-self: end;
        justify-self: end;
        max-height: calc(100vh - 28px);
        overflow-y: auto;
      }

      .panel-detail .title {
        margin-bottom: 0;
      }

      .legend {
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin-top: 4px;
      }

      .legend-row {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        background: none;
        border: 0;
        border-radius: 5px;
        padding: 3px 5px;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .legend-row:hover {
        background: rgba(143, 180, 255, 0.14);
      }

      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 auto;
      }

      .legend-name {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .legend-count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      /*
       * Map labels sit in their own layer beneath the panels but above the
       * canvas. The class is `map-label`, deliberately not `label`: the HUD uses
       * `.label` for every row caption, and sharing the name absolutely
       * positioned all of them into the top-left corner.
       */
      .map-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .map-label {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: auto;
        white-space: nowrap;
        background: none;
        border: 0;
        padding: 0;
        font: 11.5px/1 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
        cursor: pointer;
        /* An outline rather than a box: a filled chip per label would hide the
           very star field the label is pointing at. */
        text-shadow:
          0 0 3px #03040a,
          0 0 6px #03040a;
        will-change: transform;
      }

      .map-label:hover {
        text-decoration: underline;
      }

      .map-label-star {
        color: #e8edfb;
      }

      .map-label-cluster {
        color: #9fe4ec;
      }

      .map-label-hii {
        color: #ff9aa6;
      }

      /* Orion's Arm stars: italic, so a fictional name reads as one even where
         the diamond marker is too small to tell apart from a star. */
      .map-label-oastar {
        color: #c9b6ff;
        font-style: italic;
      }

      .value-warn {
        color: #c9a978;
      }

      .note-polity {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">
      <div id="loading">Loading star catalog…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
