<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OA Starmap</title>
    <style>
      :root {
        --bg: #03040a;
        --panel: rgba(10, 14, 26, 0.82);
        --border: rgba(120, 150, 210, 0.22);
        --text: #d6dcec;
        --muted: #7b87a6;
        --accent: #8fb4ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        /*
         * Every touch on the map is the map's. Without this a two-finger pinch
         * is handed to the browser as page zoom before the controls ever see
         * it, and the reader gets a magnified interface instead of a closer
         * star. The wheel and trackpad equivalent is handled in
         * scene/gestures.ts; this is the same refusal for touch.
         */
        touch-action: none;
      }

      /*
       * Four corners, stated explicitly. The previous arrangement was a wrapping
       * flex row steered by `order` and auto margins, which left the polity
       * legend floating well short of the right edge as soon as the panel widths
       * changed. A grid pins each panel to a corner regardless of its size.
       */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        padding: 14px;
        z-index: 2;
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
      }

      .panel {
        pointer-events: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        min-width: 268px;
        max-width: 320px;
        backdrop-filter: blur(9px);
      }

      .panel-error {
        margin: auto;
        max-width: 460px;
      }

      .title {
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 9px;
        color: #fff;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 2px 0;
      }

      .label {
        color: var(--muted);
      }

      .value {
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }

      .group {
        display: inline-flex;
        gap: 4px;
      }

      .toggle,
      .jump {
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 3px 9px;
        font: inherit;
        cursor: pointer;
      }

      .toggle:hover,
      .jump:hover {
        background: rgba(143, 180, 255, 0.16);
      }

      .toggle.active {
        background: rgba(143, 180, 255, 0.26);
        border-color: var(--accent);
        color: #fff;
      }

      .slider-row {
        margin-top: 8px;
      }

      .slider {
        width: 100%;
        accent-color: var(--accent);
      }

      /*
       * A control that is about a layer nobody is drawing: the grid's opacity
       * with the grid off, the guidelines' with the guidelines off. Dimmed and
       * deaf rather than removed, because the row is where the reader will look
       * for it once they switch the layer back on, and a panel whose rows move
       * about is harder to use than one with a greyed row in it. The grid has
       * been applying this class since it landed with nothing in the sheet to
       * match it, so that switch has been quietly doing nothing.
       */
      .disabled {
        opacity: 0.38;
        pointer-events: none;
      }

      .note {
        margin-top: 11px;
        padding-top: 9px;
        border-top: 1px solid var(--border);
      }

      .note-line {
        color: var(--muted);
        font-size: 11.5px;
        margin-bottom: 3px;
      }

      .note-warn {
        color: #c9a978;
      }

      /*
       * The Encyclopaedia article, at the head of a selection rather than in
       * the block below the measurements. Boxed and a shade brighter than the
       * notes around it because it is the one line on the panel that leads
       * somewhere else, and the panel is capped at 46vh — anything further down
       * than this needs scrolling to for.
       */
      .note-article {
        margin: 7px 0 2px;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: rgba(143, 180, 255, 0.08);
        color: var(--text);
      }

      /*
       * Links sit inside note lines, which are already dim, so they are picked
       * out by the accent rather than by being brighter — a link should not
       * outweigh the note it belongs to. Wrapping is on the address so a long
       * one cannot widen the panel.
       */
      .link {
        color: var(--accent, #7f9cff);
        text-decoration: none;
        border-bottom: 1px solid rgba(127, 156, 255, 0.35);
        overflow-wrap: anywhere;
      }

      .link:hover {
        border-bottom-color: var(--accent, #7f9cff);
      }

      /* The sky-map chooser: one dropdown, because the posters are nested views
         of one volume and only one is meaningful at a time. */
      .select {
        pointer-events: auto;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 2px 6px;
        font: inherit;
        cursor: pointer;
      }

      .select option {
        background: #12161f;
        color: var(--text);
      }

      .jump-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .toggle-group {
        display: flex;
        gap: 3px;
      }

      .jump-grid-wide {
        grid-template-columns: repeat(4, 1fr);
        margin-bottom: 10px;
      }

      .jump.active {
        border-color: var(--accent, #7f9cff);
        color: #fff;
      }

      /*
       * Switched off rather than hidden. The plan view answers neither "look
       * from where" nor "turn about what", and leaving the buttons in place
       * greyed says so — where removing them would read as the controls having
       * been lost.
       */
      .toggle:disabled,
      .jump:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .toggle:disabled:hover,
      .jump:disabled:hover {
        border-color: var(--border);
        background: rgba(255, 255, 255, 0.05);
      }

      /*
       * Heights are capped so that the two panels sharing a column always fit
       * beside each other. A grid row sized `auto` grows to whatever is in it,
       * so a panel allowed up to the full viewport height took the whole grid
       * and the panel below it overflowed its own track — which on a laptop
       * screen is two panels drawn on top of one another. The caps in each
       * column sum to well under 100vh; each panel scrolls within its share.
       */
      .panel-stats {
        grid-column: 1;
        grid-row: 1 / span 2;
        align-self: start;
        max-height: calc(78vh - 28px);
        overflow-y: auto;
      }

      .panel-polity {
        grid-column: 3;
        grid-row: 1;
        justify-self: end;
        max-height: calc(52vh - 28px);
        overflow-y: auto;
      }

      .panel-jump {
        grid-column: 1;
        grid-row: 3;
        align-self: end;
        max-height: 22vh;
        overflow-y: auto;
      }

      .panel-detail {
        grid-column: 3;
        grid-row: 2 / span 2;
        align-self: end;
        justify-self: end;
        max-height: calc(46vh - 28px);
        overflow-y: auto;
      }

      /*
       * Whichever panel was last touched draws over the others. The caps above
       * should keep them apart, but a long enough label or a large font can
       * still push one past its share, and a panel that cannot be raised is
       * unusable rather than merely untidy.
       */
      .panel-front {
        z-index: 1;
      }

      .panel-detail .title {
        margin-bottom: 0;
      }

      .legend {
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin-top: 4px;
      }

      .legend-row {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        background: none;
        border: 0;
        border-radius: 5px;
        padding: 3px 5px;
        color: var(--text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .legend-row:hover {
        background: rgba(143, 180, 255, 0.14);
      }

      /*
       * The polity whose holdings are ringed on the map. Marked so that the
       * second click, which takes the rings off again, is something the reader
       * can see coming.
       */
      .legend-row.legend-active {
        background: rgba(143, 180, 255, 0.2);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 auto;
      }

      .legend-name {
        flex: 1 1 auto;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .legend-count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      /*
       * The history panel sits in the free middle column, along the bottom,
       * where a timeline belongs and where it is out of the way of the two
       * columns of controls. Wider than the others because its timeline is
       * prose: the Encyclopaedia's own sentences, quoted, not a table of
       * numbers that would fit in 268 pixels.
       */
      .panel-history {
        grid-column: 2;
        grid-row: 3;
        align-self: end;
        justify-self: center;
        min-width: 380px;
        max-width: 560px;
        /*
         * Deliberately modest. This panel folds to its scrubber and can be
         * dragged anywhere, so its open height is a starting position rather
         * than a claim on the screen — and the height that suits a desktop is
         * half of a laptop.
         */
        max-height: calc(44vh - 28px);
        overflow-y: auto;
      }

      /* The title bar doubles as the grip; see ui/drag.ts. */
      .panel-grip,
      .panel > .row:first-child {
        user-select: none;
      }

      /*
       * The fold control. Sits at the right-hand end of every panel's heading,
       * in the same place on all of them — a caret that means one thing here
       * and something subtly different there is worse than no caret at all.
       *
       * Deliberately quieter than the switches beside it: it is about the
       * furniture rather than about the map, and it should not compete with a
       * control that changes what is drawn.
       */
      .toggle-fold {
        margin-left: 6px;
        min-width: 20px;
        padding: 2px 5px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
      }

      .toggle-fold:hover {
        color: var(--text);
      }

      /*
       * A folded panel shrinks to its heading. The min-width goes with it, or
       * every folded panel would still be reserving 268 pixels of the screen it
       * was folded to give back.
       */
      .panel-folded {
        min-width: 0;
        padding-bottom: 8px;
      }

      .history-details {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .history-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .history-year {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        margin-top: 6px;
      }

      .history-polities,
      .history-places {
        max-height: 15vh;
        overflow-y: auto;
      }

      /* Named by the period but nowhere on the map: listed, and not offered. */
      .legend-row-weak {
        color: var(--muted);
        cursor: default;
      }

      .history-events {
        max-height: 18vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 4px;
      }

      .history-event {
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--text);
      }

      /*
       * Later than the year on the slider. Still shown — the reader is reading
       * a century, not standing in one of its days — but visibly the part of
       * the period that has not happened on the map yet.
       */
      .history-event-ahead {
        opacity: 0.45;
      }

      .history-event-year {
        display: inline-block;
        min-width: 52px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .history-place {
        display: inline-block;
        margin-left: 5px;
        padding: 0 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 10.5px;
        cursor: pointer;
      }

      .history-place:hover:not(:disabled) {
        background: rgba(143, 180, 255, 0.16);
      }

      .history-place:disabled {
        color: var(--muted);
        cursor: default;
      }

      /*
       * The graticule's writing. Beneath the map labels and above the canvas,
       * in the grid's own colour and at its own weight, so a distance ring
       * never reads as the name of something out there.
       */
      /*
       * Between the canvas and the map labels. The canvas has no z-index and
       * so sits at the bottom of the stack; the object labels are at 1 and the
       * panels at 2. Stating it as its own layer rather than relying on both
       * label overlays being at 1 and the grid happening to be appended first:
       * a ring number drawn over a star's name is the wrong way round, and
       * "whichever was created first" is not a rule anyone will remember.
       */
      .grid-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      .grid-label {
        position: absolute;
        top: 0;
        left: 0;
        white-space: nowrap;
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
        color: rgba(150, 180, 225, 0.85);
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
      }

      .grid-label-direction {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(170, 198, 240, 0.95);
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      /*
       * Map labels sit in their own layer beneath the panels but above the
       * canvas. The class is `map-label`, deliberately not `label`: the HUD uses
       * `.label` for every row caption, and sharing the name absolutely
       * positioned all of them into the top-left corner.
       */
      .map-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .map-label {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: auto;
        white-space: nowrap;
        background: none;
        border: 0;
        padding: 0;
        font: 11.5px/1 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
        cursor: pointer;
        /* An outline rather than a box: a filled chip per label would hide the
           very star field the label is pointing at. */
        text-shadow:
          0 0 3px #03040a,
          0 0 6px #03040a;
        will-change: transform;
      }

      .map-label:hover {
        text-decoration: underline;
      }

      /* Name and altitude stack, and the shorter line centres under the longer. */
      .map-label > span {
        display: block;
        text-align: center;
      }

      /*
       * The altitude, written only in the plan view. Looking down the pole is
       * the projection that throws z away, so it is the one that has to print
       * the number — smaller and dimmer than the name, because it annotates the
       * name rather than competing with it. The 12px line height is duplicated
       * in labels.ts, where the declutter pass has to reserve the space before
       * any of this exists.
       */
      .map-label-z {
        font-size: 9.5px;
        line-height: 12px;
        opacity: 0.72;
        letter-spacing: 0.02em;
      }

      .map-label-star {
        color: #e8edfb;
      }

      .map-label-cluster {
        color: #9fe4ec;
      }

      .map-label-hii {
        color: #ff9aa6;
      }

      /* Orion's Arm stars: italic, so a fictional name reads as one even where
         the diamond marker is too small to tell apart from a star. */
      .map-label-oastar,
      .map-label-world {
        color: #c9b6ff;
      }

      /* The position came from the fiction rather than from a measurement. */
      .map-label-asserted {
        font-style: italic;
      }

      /* The selected object, kept on screen whatever the declutter pass decides. */
      .map-label-selected {
        background: rgba(18, 22, 34, 0.82);
        border-radius: 3px;
        outline: 1px solid rgba(190, 205, 240, 0.45);
        padding: 0 4px;
      }

      .value-warn {
        color: #c9a978;
      }

      .note-polity {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="overlay">
      <div id="loading">Loading star catalogue…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
