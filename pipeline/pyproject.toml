[project]
name = "oastarmap"
version = "0.1.0"
description = "Data pipeline for the OA Starmap: real astronomical catalogs -> galactic Cartesian binaries"
requires-python = ">=3.13,<3.14"
dependencies = [
    "astropy>=7.0",
    "numpy>=2.1",
    "pydantic>=2.9",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.scripts]
oastarmap = "oastarmap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oastarmap"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
